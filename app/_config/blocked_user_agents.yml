# Substrings to block (case-insensitive). These identify scripted HTTP clients
# and headless browsers that have no tracking value.
substrings:
  - headless
  - selenium
  - phantom
  - python-requests
  - go-http-client
  - okhttp
  - "axios/"
  - node-fetch
  - "got/"
  - "dart:"
  - libwww
  - yisouspider
  - bugbounty-xss-browser-verifier
  - checkly
  - brightedge
  - "hubspot crawler"
  - abevalbot
  - hanaleibot
  - "newsai/"
  - amazon-kendra
