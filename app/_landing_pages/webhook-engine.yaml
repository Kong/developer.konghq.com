metadata:
  title: "{{site.webhook_engine}}"
  content_type: landing_page
  description: This page is an introduction to {{site.webhook_engine}}.
  products:
    - webhook-engine
  works_on:
    - konnect
  tags:
    - webhook

rows:
  - header:
      type: h1
      text: "{{ site.webhook_engine }}"
      sub_text: "Ingest HTTP events, store them, and deliver matching events to your subscribers."

  - columns:
      - blocks:
          - type: structured_text
            config:
              header:
                text: "Introducing {{ site.webhook_engine }}"
              blocks:
                - type: text
                  text: |
                   {{ site.webhook_engine }} is a webhook delivery engine for HTTP events.
                   It sits between your services that publish events and the subscriber endpoints that consume them.
                   Publishers send events to channels over HTTP, the engine stores accepted events in Postgres, and subscriptions deliver each event to the matching subscriber endpoints.

                   With its extensible policy engine, you can adapt ingest and delivery to your requirements, validating and governing events where they enter and leave the engine.

  - columns:
      - blocks:
          - type: mermaid
            config:
              diagram: |
                flowchart LR

                  Client["HTTP client<br/>(publisher)"]

                  subgraph WHE ["Webhook Engine"]
                    direction LR
                    Listener["Listener<br/>addresses + port"]
                    Channel["Channel<br/>HTTP source (paths, auth)<br/>ingest policies"]
                    Store[("Postgres<br/>event store")]
                    SubA["Subscription A<br/>condition<br/>delivery policies"]
                    SubB["Subscription B<br/>condition<br/>delivery policies"]
                    SubN["Subscription N<br/>condition<br/>delivery policies"]
                  end

                  Client--"POST event"-->Listener-->Channel
                  Channel--"accepted events"-->Store
                  Store--"matching events"-->SubA--"HTTP(S) delivery"-->EndpointA["Subscriber A<br/>endpoint"]
                  Store--"matching events"-->SubB--"HTTP(S) delivery"-->EndpointB["Subscriber B<br/>endpoint"]
                  Store--"..."-->SubN--"HTTP(S) delivery"-->EndpointN["Subscriber N<br/>endpoint"]
  - header:
      type: h2
      text: "Install {{ site.webhook_engine }}"
    columns:
      - blocks:
        - type: text
          config: |
            Installation instructions for {{site.webhook_engine}}:
        - type: tabs
          tab_group: run-webhook-engine
          config:
            - title: "Konnect"
              content: |
                [to do]
            - title: "Terraform or Operator"
              content: |
                [to do]

  - header:
      type: h2
      text: Key references
    column_count: 1
    columns:
      - blocks:
          - type: card
            config:
              title: Understand core concepts
              description: |
                Learn about how {{site.webhook_engine}} works, including its architecture and key entities
              icon: /assets/icons/linked-services.svg
              cta:
                text: Learn about {{site.webhook_engine}}
                url: /webhook-engine/architecture/
                align: end

  - header:
      type: h2
      text: How-to Guides
    columns:
      - blocks:
          - type: how_to_list
            config:
              products:
                  - webhook-engine
              quantity: 5
              allow_empty: true
