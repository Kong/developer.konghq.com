metadata:
  title: "{{site.context_mesh}}"
  content_type: landing_page
  description: "Turn enterprise APIs into Code Mode MCP servers that AI agents can call directly, and combine them with existing MCP servers to customize the overall enterprise context under a single source of truth."
  products:
    - context-mesh
    - ai-gateway
  breadcrumbs:
    - /ai-gateway/
    - /konnect/
  tags:
    - ai
    - mcp
  search_aliases:
    - agent context
    - code mode mcp

rows:
  - header:
      type: h1
      text: "Kong {{site.context_mesh}}"
      sub_text: "Turn enterprise APIs into Code Mode MCP servers that AI agents can call directly, and combine them with existing MCP servers to customize the overall enterprise context under a single source of truth."

  - columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    AI agents are only as good as the context they can reach. {{site.context_mesh}} exposes REST APIs and existing MCP servers to AI agents as a single Code Mode MCP server. It is the mediation layer between agents and your APIs. Agent traffic to those APIs passes through the same path as the rest of your API traffic, so the policies and observability you already apply continue to apply.

                    Agents cannot call most APIs directly. Each one requires either a custom SDK or prior training on that specific API, and neither approach scales when an organization runs dozens of internal APIs that change over time. {{site.context_mesh}} closes that gap. Given an OpenAPI specification, it produces an MCP server that agents call without per-agent integration code.

                    Adding existing MCP servers as sources allows AI agents to access a broader range of enterprise context without requiring direct integration with each individual server. You can then centralize and customize the management and exposure of these sources through {{site.context_mesh}}.

                    {{site.context_mesh}} complements [{% site.ai_gateway %}](/ai-gateway/) by covering the other half of an agent's traffic. {% site.ai_gateway %} is the control layer between agents and LLMs. {{site.context_mesh}} is the mediation layer between agents and APIs.

                    {:.success}
                    > {{site.context_mesh}} is in active development. The current release supports APIs and MCP servers as source types. Additional source types are planned for future releases.
      - blocks:
          - type: image
            config:
              url: /assets/images/context-mesh/context-mesh.svg
              alt_text: "{{site.context_mesh}} architecture diagram. AI agents connect through {% site.ai_gateway %} as the control layer for LLMs, and through {{site.context_mesh}} as the mediation layer for enterprise sources including APIs, data, docs, and code."

  - columns:
      - blocks:
        - type: structured_text
          config:
            header:
              text: "Why {{site.context_mesh}}?"
            blocks:
              - type: text
                text: |
                  {{site.context_mesh}} is designed to make enterprise APIs and MCP servers usable by AI agents without adding integration complexity to your teams.

                  * **No per-agent integration code**: Generate the MCP server from an existing OpenAPI spec. The agent uses your API without anyone writing an SDK or per-agent glue.
                  * **One place to manage agent context**: Every MCP server you create is registered in {{site.konnect_product_name}} alongside the rest of your API infrastructure, not scattered across developer laptops.
                  * **Traffic stays on Kong**: Because each MCP server runs on a {{site.konnect_short_name}} control plane, agent calls to your APIs pass through Kong and can be governed with the policies you already use.
                  * **One agent, many APIs**: Connect an agent to several {{site.context_mesh}} MCP servers at once and let it decide which to call to complete a task.

  - columns:
      - blocks:
        - type: structured_text
          config:
            header:
              text: "Code Mode MCP servers"
            blocks:
              - type: text
                text: |
                  {{site.context_mesh}} generates MCP servers in [Code Mode](https://blog.cloudflare.com/code-mode/), a configuration that exposes an API as a single SDK-like interface rather than one tool per operation.

                  A standard MCP server registers each API operation as a separate tool. For an API with dozens or hundreds of endpoints, the agent's tool list grows past what the model can reason about, and tool selection degrades.

                  A Code Mode server exposes the API as a programmatic interface that the agent calls by writing short code snippets against it. The agent works at the SDK level instead of picking between many similar tools. This scales to large API surfaces without flooding the model's context, and lets an agent use your API without prior training on it.

                  Code Mode eliminates intermediate tool invocations by allowing agents to write and execute API calls as code. Instead of streaming every operation through the model, Code Mode returns only the final result to the context window. This reduces token consumption by **~99%** (from ~120,000 tokens to ~1,200 tokens) while maintaining full observability of the workflow.
      - blocks:
        - type: image
          config:
            url: /assets/images/context-mesh/context-mesh-terminal.svg
            alt_text: "{{site.context_mesh}} terminal workflow example showing MCP server setup and usage."

  - header:
      text: "Get started"
      type: h2
      description: |
        Walk through creating a Code Mode MCP server from an OpenAPI specification, deploying it, and calling it from an MCP client.
    column_count: 2
    columns:
      - blocks:
        - type: card
          config:
            title: Create your first {{site.context_mesh}} MCP server
            description: |
              Step-by-step setup from OpenAPI spec to a working agent call.
            cta:
              text: "Get started"
              url: "/context-mesh/get-started-with-context-mesh/"

  - header:
      text: "Common usage patterns"
      type: h2
      description: |
        What an agent can do depends on the sources you add to {{site.context_mesh}}. Every pattern uses the same setup flow, covered in [Get started with {{site.context_mesh}}](/context-mesh/get-started-with-context-mesh/).
    columns:
      - blocks:
        - type: table
          config:
            columns:
              - title: Use case
                key: use_case
              - title: Sources you add
                key: sources
              - title: How you configure the MCP server
                key: configuration
              - title: What the agent can do
                key: outcome
            rows:
              - use_case: "**Expose a single internal API**"
                sources: |
                  One OpenAPI specification that you either:
                  - Import from the {{site.konnect_short_name}} API catalog.
                  - Upload directly as an OpenAPI Specification (OAS) v3.0 file.
                outcome: "Call any operation in that API through a single Code Mode MCP server, with no per-agent integration code."
                configuration: "Add the source to the MCP server."
              - use_case: "**Compose multiple APIs**"
                sources: |
                  Several OpenAPI specifications that you either:
                  - Import from the {{site.konnect_short_name}} API catalog as a single source.
                  - Upload directly as anOpenAPI Specification (OAS) v3.0 file, each one as its own source.
                configuration: "Add a single source containing multiple API specifications as a single source, or add multiple sources to the MCP server."
                outcome: "Complete a task that spans the APIs, choosing which operations to call and in what order."
              - use_case: "**Combine APIs with existing MCP servers**"
                sources: "OpenAPI specifications alongside existing MCP servers."
                configuration: "Add the OpenAPI specifications and existing MCP servers as sources to the MCP server."
                outcome: "Reach your APIs and your existing MCP tooling through one endpoint, governed and observed in the same place."

  - header:
      text: "Frequently asked questions"
      type: h2
    columns:
      - blocks:
        - type: faqs
          config:
            - q: How is {{site.context_mesh}} different from the Kong Konnect MCP Server?
              a: |
                The [{{site.konnect_product_name}} MCP Server](/konnect-platform/konnect-mcp/) exposes {{site.konnect_product_name}} itself, so you can manage Kong infrastructure from an AI assistant or IDE. {{site.context_mesh}} exposes your own backend APIs to AI agents as Code Mode MCP servers that run on Kong.
            - q: What type of source can I use with {{site.context_mesh}}?
              a: |
                {{site.context_mesh}} supports two source types: REST APIs, added as OpenAPI specifications, and existing MCP servers. You can mix both in the same {{site.context_mesh}} MCP server.
            - q: Does {{site.context_mesh}} require {% site.ai_gateway %}?
              a: |
                Yes. {{site.context_mesh}} runs on top of {% site.ai_gateway %}, so it requires an {% site.ai_gateway %} control plane to deploy  and function.
