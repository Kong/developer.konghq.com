metadata:
  title: "{{site.mesh_product_name}}"
  content_type: landing_page
  description: Secure, connect, and observe services across Kubernetes and virtual machines with {{site.mesh_product_name}} 3.x.
  products: [mesh]
  tags: [control-plane, data-plane]

rows:
  - header:
      type: h1
      text: "{{site.mesh_product_name}}"
      sub_text: Secure, connect, and observe services across Kubernetes and virtual machines
  - columns:
      - blocks:
          - type: structured_text
            config:
              header:
                text: Introducing {{site.mesh_product_name}}
              blocks:
                - type: text
                  text: |
                    Applications increasingly span Kubernetes clusters, virtual machines, clouds, and data centers. As they grow, teams need a consistent way to secure service-to-service traffic, control access, and understand what happens between services.

                    {{site.mesh_product_name}} adds a proxy alongside each application. These proxies discover destinations and enforce identity, access, routing, reliability, and observability policies where application traffic flows.

                    A central control plane distributes configuration while application traffic remains on your network. In a multi-zone deployment, mesh-scoped zone proxies connect services across environments and provide a controlled path to external services.
      - blocks:
          - type: image
            config:
              url: /assets/images/mesh/mesh-v3-overview.svg
              alt_text: "{{site.mesh_product_name}} distributes configuration through zone control planes while application proxies enforce traffic policies across Kubernetes and VMs. Separate paths show cross-zone ingress, application ingress, and external-service egress."

  - columns:
      - blocks:
          - type: icon_card
            config:
              title: Get started
              icon: /assets/icons/rocket.svg
              cta:
                url: "#get-started-with-kong-mesh"
      - blocks:
          - type: icon_card
            config:
              title: Migrate from 2.x 
              icon: /assets/icons/migrate.svg
              cta:
                url: /mesh/upgrade/#upgrade-from-2-x-to-3-x
      - blocks:
          - type: icon_card
            config:
              title: Browse all policies
              icon: /assets/icons/mesh_policies/policy.svg
              cta:
                url: /mesh/policies/

  - header:
      type: h2
      text: Get started with {{site.mesh_product_name}}
    columns:
      - blocks:
          - type: tabs
            tab_group: run-mesh
            config:
              - title: Konnect
                content: |
                  Use {{site.konnect_short_name}} to host and operate the global control plane. You run the zone control planes and application proxies in your own infrastructure.

                  Choose whether to run your first zone on Kubernetes (recommended) or Universal, then follow the [{{site.konnect_short_name}} installation instructions](/mesh/konnect/#where-will-your-zone-run).
              - title: Self-hosted
                content: |
                  Run and operate the control plane and application proxies in your own infrastructure:

                  - **Try {{site.mesh_product_name}} 3.x locally:** Follow the [Universal quickstart](/mesh/get-started/universal/install/) to run a control plane and two application proxies in containers.
                  - **Plan a production deployment:** Use the [Universal control plane reference](/mesh/universal-control-plane/) to choose the mode, persistent store, and zone configuration.
                  - **Connect applications:** Follow the [Universal data plane reference](/mesh/universal-data-plane/) to register and authenticate application proxies.

  - header:
    columns:
      - header:
          type: h2
          text: One mesh, every environment
        blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    Apply a consistent traffic model to services across Kubernetes, virtual machines, zones, and external destinations:

                    - Discover [services within a zone](/mesh/meshservice/)
                    - Connect [services across zones](/mesh/meshmultizoneservice/)
                    - Bring [application traffic into the mesh](/mesh/application-ingress/)
                    - Reach [services outside the mesh](/mesh/meshexternalservice/)
      - header:
          type: h2
          text: Tools to manage {{site.mesh_product_name}}
        blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    Manage {{site.mesh_product_name}} resources through the interface that fits your workflow:

                    - [Service Mesh](https://cloud.konghq.com/mesh-manager): Create and manage {{site.mesh_product_name}} control planes in {{site.konnect_short_name}}.
                    - [Mesh Control Plane API](/api/konnect/mesh-control-planes/): Automate control plane management through the {{site.konnect_short_name}} API.
                    - [kongctl](/mesh/cli/): Inspect and configure {{site.mesh_product_name}} 3.x resources from the command line.

  - header:
      type: h2
      text: Configure your mesh
      description: Start with the traffic behavior you need, then use the reference pages for configuration, examples, and validation.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Route traffic and handle failures
              description: Choose destinations for requests and connections. Set timeouts, retry selected failures, and limit the impact of unhealthy destinations.
              ctas:
                - {text: HTTP routing, url: /mesh/policies/meshhttproute/}
                - {text: TCP routing, url: /mesh/policies/meshtcproute/}
                - {text: Timeouts, url: /mesh/policies/meshtimeout/}
                - {text: Retries, url: /mesh/policies/meshretry/}
                - {text: Circuit breaking, url: /mesh/policies/meshcircuitbreaker/}
      - blocks:
          - type: card
            config:
              title: Observe service traffic
              description: Collect metrics, access logs, and traces. Choose which proxies report telemetry and where they export it.
              ctas:
                - {text: Metrics, url: /mesh/policies/meshmetric/}
                - {text: Access logs, url: /mesh/policies/meshaccesslog/}
                - {text: Traces, url: /mesh/policies/meshtrace/}
                - {text: OpenTelemetry backends, url: /mesh/meshopentelemetrybackend/}
      - blocks:
          - type: card
            config:
              title: Secure service communication
              description: Issue workload identities, establish trust, and allow specific callers. Configure how destinations accept encrypted connections.
              ctas:
                - {text: Allow specific callers, url: /mesh/policies/meshtrafficpermission/}
                - {text: Configure TLS, url: /mesh/policies/meshtls/}
      - blocks:
          - type: card
            config:
              title: Connect services across zones
              description: Make a service available across zones and understand the proxies carrying its traffic. Apply policies at the right point in the connection.
              ctas:
                - {text: Configure a multi-zone service, url: /mesh/meshmultizoneservice/}
      - blocks:
          - type: card
            config:
              title: Bring external traffic into the mesh
              description: Connect an API gateway to mesh services and control what its workload identity can access.
              ctas: 
                - {text: Configure application ingress, url: /mesh/application-ingress/}
      - blocks:
          - type: card
            config:
              title: Reach services outside the mesh
              description: Define external destinations and configure their path through mesh-scoped zone egress, including access permissions and destination TLS.
              ctas:
                - {text: Configure an external service, url: /mesh/meshexternalservice/}

  - header:
      type: h2
      text: Understand how {{site.mesh_product_name}} works
      description: Control planes distribute configuration. Proxies handle application traffic and enforce the policies that apply to their part of the connection.
    column_count: 2
    columns:
      - blocks:
          - type: card
            config:
              title: Workload identity and trust
              description: An identity tells a proxy who is calling. Trust determines which issuers it accepts.
              ctas:
                - {text: Issue identities with MeshIdentity, url: /mesh/policies/meshidentity/}
                - {text: Establish trust with MeshTrust, url: /mesh/policies/meshtrust/}
      - blocks:
          - type: card
            config:
              title: Services and destinations
              description: Give applications destinations they can reach within a zone, across zones, or outside the mesh. Choose the service resource that describes where the destination runs.
              ctas: 
                - {text: Understand service discovery, url: /mesh/meshservice/}
      - blocks:
          - type: card
            config:
              title: Policies and traffic decisions
              description: Select the proxies that enforce a policy, then the traffic it governs. Understand which decisions happen at the client or destination and how overlapping policies combine.
              ctas: 
                - {text: Understand policy targeting, url: /mesh/policy-targeting/}
      - blocks:
          - type: card
            config:
              title: Proxies and zones
              description: Application proxies handle workload traffic. Mesh-scoped zone ingress carries connections between zones; mesh-scoped zone egress handles the path to external services.
              ctas: 
                - {text: Understand mesh-scoped zone proxies, url: /mesh/mesh-scoped-zone-proxies/}

  - header:
      type: h2
      text: Operate and troubleshoot
    column_count: 2
    columns:
      - blocks:
          - type: card
            config:
              title: Plan upgrades
              description: Check upgrade order, version-specific requirements, and tested platform versions before changing a deployment.
              ctas:
                - {text: Upgrade guidance, url: /mesh/upgrade/}
                - {text: Version-specific upgrade notes, url: /mesh/version-specific-upgrade-notes/}
                - {text: Validated versions, url: /mesh/validated-versions/}
      - blocks:
          - type: card
            config:
              title: Verify traffic behavior
              description: Use the verification and troubleshooting sections in each reference to check identities, destinations, permissions, and proxy readiness.
              ctas:
                - {text: Check traffic permissions, url: /mesh/policies/meshtrafficpermission/#validating-authorization}
                - {text: Check zone proxies, url: /mesh/mesh-scoped-zone-proxies/#verify-the-traffic-path-and-policy-effect}
                - {text: Check application ingress, url: /mesh/application-ingress/#verify-the-gateway-and-mesh-separately}

  - header:
      type: h2
      text: Releases and support
    columns:
      - blocks:
          - type: text
            config: |
              [Changelog](/mesh/changelog/) · [Version support policy](/mesh/support-policy/) · [Vulnerability patching](/mesh/vulnerability-patching-process/) · [Software bill of materials](/mesh/sbom/)
