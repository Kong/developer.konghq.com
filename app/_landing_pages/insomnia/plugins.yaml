metadata:
  title: Insomnia plugins
  content_type: landing_page
  description: This page is an introduction to Insomnia plugins.
  products:
    - insomnia
  tags:
    - insomnia-plugins
  breadcrumbs:
    - /insomnia/
rows:
  - header:
      type: h1
      text: "Insomnia plugins"
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: | 
                    Insomnia plugins can be used to extend the functionality of Insomnia. 
                    They are commonly used for advanced features, such as custom authentication mechanisms and complex workflows. They can also be used to customize the Insomnia theme.

  - columns:
      - blocks:
        - type: card
          config:
            title: Insomnia Plugin Hub
            description: Browse plugins created by the community
            icon: /assets/icons/plug.svg
            cta:
              text: Learn more
              url: https://insomnia.rest/plugins
              align: end
      - blocks:
        - type: card
          config:
            title: Create plugins
            description: Create your own Insomnia plugin, and publish it to the Plugin Hub
            icon: /assets/icons/insomnia/design.svg
            cta:
              text: Learn more
              url: /how-to/create-an-insomnia-plugin/
  
  - header:
      type: h2
      text: "Reference and guides"
    columns:
      - blocks:
        - type: card
          config:
            title: Plugin reference
            description: The context APIs available to your plugin.
            icon: /assets/icons/document.svg
            cta:
              text: Learn more
              url: /insomnia/plugins/plugin-reference/
      - blocks:
        - type: card
          config:
            title: Sandbox and trust model
            description: How plugin code runs, pluginSandboxEnabled, and Full host access.
            icon: /assets/icons/lock.svg
            cta:
              text: Learn more
              url: /insomnia/plugins/sandbox-and-trust/
      - blocks:
        - type: card
          config:
            title: Plugin permissions
            description: Declare the modules and capabilities a sandboxed plugin needs.
            icon: /assets/icons/key.svg
            cta:
              text: Learn more
              url: /insomnia/plugins/permissions/
      - blocks:
        - type: card
          config:
            title: Troubleshooting
            description: Fix a plugin that failed to load, plus known limitations.
            icon: /assets/icons/warning.svg
            cta:
              text: Learn more
              url: /insomnia/plugins/troubleshooting/

  - header:
      text: "How to use plugins"
      type: h2
    columns:
      - blocks:
        - type: x_with_y
          config:
              border: true
              type: h2
              items:
                - text: |
                    Access the plugins preferences
                  action:
                    type: text
                    config: |
                      Go to **Preferences** > **Plugins**.
                - text: |
                    Add a plugin
                  action:
                    type: text
                    config: |
                      1. Enter the name of the plugin.
                      1. Click **Install Plugin**.
                - text: |
                    Disable a plugin
                  action:
                    type: text
                    config: Click the checkbox under **Enable?** for the plugin you want to disable.
                - text: |
                    Remove a plugin permanently
                  action:
                    type: text
                    config: |
                      1. Click **Reveal Plugins Folder** to open the Insomnia plugins directory.
                      1. Delete the plugin's folder.
                - text: |
                    Generate starter files for new a plugin
                  action:
                    type: text
                    config: |
                      1. Click **Generate New Plugin**.
                      1. Enter a name for the new plugin and click **Generate**.
                - text: |
                    Add a custom npm plugin registry mirror to Insomnia (default set as `https://registry.npmjs.org/`)
                  action:
                    type: text
                    config: |
                      1. Open **Preferences**.
                      1. Go to the **Plugins** tab.
                      1. In the **npm Registry** field, add your custom mirror URL (for example: `https://artifactory.example.com/api/npm/npm-remote/`). 
                      1. Insomnia automatically saves the setting.