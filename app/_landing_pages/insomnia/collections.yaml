metadata:
  title: API Collections in Insomnia
  content_type: landing_page
  description: This page is an introduction to API Collections in Insomnia, which hold your requests, environments, and OpenAPI spec.
  breadcrumbs:
    - /insomnia/
  products:
    - insomnia
  tags:
    - design-apis
  search_aliases:
    - design document
    - documents
    - collections
rows:
  - header:
      type: h1
      text: "API Collections"
    columns:
      - blocks:
          - type: structured_text
            config:
              header:
                text: "API Collections in Insomnia"
              blocks:
                - type: text
                  text: |
                    An API Collection is the workspace where you do most of your work in Insomnia. It holds your requests, folders, environments, and an optional OpenAPI spec, so you can design an API and call it in the same place. You can use an API Collection to:
                - type: unordered_list
                  items:
                    - "[Create and send requests](#send-requests)"
                    - "[Run multiple requests](#get-started-with-requests) with the Collection Runner"
                    - "[Write and preview an OpenAPI spec](#design-apis-with-an-openapi-spec)"
                    - "[Write scripts](#write-scripts) to modify requests or check responses"
                - type: text
                  text: |
                    {:.info}
                    > {% new_in 13.3 %} Documents and collections are now a single workspace type called an API Collection. Your existing documents and collections keep working and open as API Collections. For more details, see [What happened to documents?](#what-happened-to-documents)
      - blocks:
          - type: image
            config:
              url: /assets/images/insomnia/collection.png
              alt_text: Image of an API Collection

  - header:
      type: h2
      text: "Send requests"
    columns:
