  - header:
      type: h2
      text: "Design APIs with an OpenAPI spec"
    columns:
      - blocks:
          - type: image
            config:
              url: /assets/images/insomnia/design-document.png
              alt_text: Image of an API spec in the Spec tab of an API Collection.
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    Every API Collection can hold one OpenAPI spec. Click the **Spec** tab on the API Collection screen to write or import a spec, then generate a request for each endpoint in it. The interactive spec renderer lets you develop and refine your spec in the same place where you test it.
                - type: unordered_list
                  items:
                    - Built for spec-first development
                    - View a generated preview of your spec
                    - Automatic linting, with the ability to write custom linting rules
                    - View the errors console
                    - Automatically parse and categorize data from your spec, such as servers, request bodies, and schemas
                    - Generate a request for each endpoint in the spec
          - type: button
            config:
              align: left
              text: Learn more about designing APIs
              url: /insomnia/design/
