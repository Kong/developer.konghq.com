  - header:
      text: "Frequently asked questions"
      type: h2
    columns:
      - blocks:
        - type: faqs
          config:
            - q: What happened to documents?
              a: |
                {% new_in 13.3 %} Documents and collections are merged into a single workspace type called an API Collection, so you no longer have to choose between them when you start work. **Create** > **Design document** is no longer in the UI.

                Nothing was removed. Every API Collection can hold requests, folders, environments, and one OpenAPI spec. Your existing documents and collections open as API Collections, and the spec that used to have its own workspace is now the **Spec** tab of the API Collection screen.
            - q: Can collaborators on Insomnia 13.2 still open my API Collections?
              a: |
                Yes. Insomnia stores an API Collection that contains a spec in the same format as a 13.2 document, and an API Collection without a spec in the same format as a 13.2 collection, so both versions can work in the same Git repository or cloud project.

                The difference is what collaborators see in the sidebar. In 13.3, the requests in an API Collection display in the sidebar under the API Collection. In 13.2, the requests in an API Collection that contains a spec don't display in the sidebar. To keep the experience consistent, upgrade everyone in your organization to 13.3.
            - q: Does Insomnia support GraphQL?
              a: Yes, Insomnia supports GraphQL.
            - q: Can I import requests from another tool?
              a: |
                Yes, you can create requests in API Collections by importing:
                - Postman collections
                - Swagger/OpenAPI specifications
                - cURL commands
                - Insomnia files
                - HAR files
                - WSDL files
            - q: Can I run API Collections in CI/CD environments?
              a: Yes, you can use the [`inso run collection`](/inso-cli/reference/run_collection/) command in Inso CLI to run a collection automatically.
            - q: Can I set authentication headers at the collection level so I do not repeat them on every request?
              a: |
                No. As a workaround, group the relevant requests in a **folder** and then set authentication at the folder level for that group to avoid duplicating headers on each request.
            - q: Can I hide other projects and API Collections to focus only on one?
              a: |
                Yes. Go to **Preferences** > **General** > **Application** and enable **Sidebar focus for collections**. The sidebar then displays only the contents of the API Collection you select. This is enabled by default since Insomnia 13.2, and since 13.3 it also applies to API Collections that contain a spec.
