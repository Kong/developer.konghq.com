metadata:
  title: kong-harnesses
  content_type: landing_page
  description: This page is an introduction to kong-harnesses, Kong's OIDC credential helper that obtains short-lived access tokens for coding agents.
  tools:
    - kong-harnesses
  breadcrumbs:
    - /tools/
rows:
  - header:
      type: h1
      text: "kong-harnesses"
      sub_text: |
        Kong's OIDC credential helper for coding agents

  - header:
      type: h2
      text: What is kong-harnesses?
    columns:
      - blocks:
        - type: text
          config: |
            kong-harnesses obtains short-lived OIDC access tokens for coding agents such as Claude Code, Codex, OpenCode, and omp.
            It manages connection profiles, signs in to an OIDC identity provider, and configures the agent CLI to route its traffic through the gateway.

  - header:
      type: h2
      text: Commands
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: unordered_list
                  items:
                    - "**[kong-harnesses budget](/kong-harnesses/budget/)**: Refresh the budget numbers that the status bar shows"
                    - "**[kong-harnesses credential](/kong-harnesses/credential/)**: Print an access token, signing in first if needed"
                    - "**[kong-harnesses doctor](/kong-harnesses/doctor/)**: Find problems with a profile and show how to fix them"
                    - "**[kong-harnesses login](/kong-harnesses/login/)**: Sign in to a profile, or check its sign-in"
                    - "**[kong-harnesses logout](/kong-harnesses/logout/)**: Sign out of a profile and delete its saved sign-in"
                    - "**[kong-harnesses profile](/kong-harnesses/profile/)**: Manage connection profiles and the agent CLIs that use them"
                    - "**[kong-harnesses setup](/kong-harnesses/setup/)**: Install or create a profile, sign in, and set up the agent CLIs"
                    - "**[kong-harnesses status](/kong-harnesses/status/)**: Show the sign-in and agent CLI setup, without using the network"
                    - "**[kong-harnesses statusline](/kong-harnesses/statusline/)**: Print the status bar line for Claude Code"
                    - "**[kong-harnesses token](/kong-harnesses/token/)**: Print an access token, without signing in"
                - type: text
                  text: |
                    **Budget subcommands:**
                - type: unordered_list
                  items:
                    - "**[budget refresh](/kong-harnesses/budget/refresh/)**: Refresh the budget numbers of one profile"
                - type: text
                  text: |
                    **Profile subcommands:**
                - type: unordered_list
                  items:
                    - "**[profile create](/kong-harnesses/profile/create/)**: Create a profile from your identity provider's details"
                    - "**[profile import](/kong-harnesses/profile/import/)**: Install a profile from a file or HTTPS URL"
                    - "**[profile list](/kong-harnesses/profile/list/)**: List installed profiles"
                    - "**[profile get](/kong-harnesses/profile/get/)**: Show the settings of an installed profile"
                    - "**[profile default](/kong-harnesses/profile/default/)**: Choose the profile that commands use when you do not give --profile"
                    - "**[profile activate](/kong-harnesses/profile/activate/)**: Set up the installed agent CLIs to use a profile"
                    - "**[profile cleanup](/kong-harnesses/profile/cleanup/)**: Remove the settings that kong-harnesses added"
                    - "**[profile delete](/kong-harnesses/profile/delete/)**: Delete an installed profile from this computer"
