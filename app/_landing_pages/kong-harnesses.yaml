  - header:
      type: h2
      text: "Manage {{site.claude_code}} on many computers"
    columns:
      - blocks:
        - type: text
          config: |
            If your organization manages its computers with an MDM tool, a _fleet build_ packages the kong-harnesses settings once and deploys them to every managed computer, so developers don't configure anything.
            After the first rollout, use these guides to change which {{site.claude_code}} versions or which model the fleet uses.

  - columns:
    - blocks:
      - type: card
        config:
          title: Install for every user
          description: Install kong-harnesses for every user of a computer, or deploy it with an MDM tool.
          cta:
            text: Read the install guide
            url: /kong-harnesses/install/
            align: end
    - blocks:
      - type: card
        config:
          title: Pin a version range
          description: Limit managed computers to the {{site.claude_code}} versions that you tested through {{site.ai_gateway}}.
          cta:
            text: Pin a version range
            url: /kong-harnesses/pin-a-claude-code-fleet/
            align: end
    - blocks:
      - type: card
        config:
          title: Move to a new model
          description: Move managed computers to a new Claude model without interrupting active sessions.
          cta:
            text: Move to a new model
            url: /kong-harnesses/move-a-claude-code-fleet-to-a-new-model/
            align: end

