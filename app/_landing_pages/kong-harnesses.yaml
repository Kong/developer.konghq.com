metadata:
  title: kong-harnesses
  content_type: landing_page
  description: This page is an introduction to kong-harnesses, Kong's OIDC credential helper that obtains short-lived access tokens for coding agents.
  tools:
    - kong-harnesses
  breadcrumbs:
    - /tools/
rows:
  - header:
      type: h1
      text: "kong-harnesses"
      sub_text: |
        Kong's OIDC credential helper for coding agents

  - header:
      type: h2
      text: What is kong-harnesses?
    columns:
      - blocks:
        - type: text
          # config: |
          #   kong-harnesses obtains short-lived OIDC access tokens for coding agents such as {{site.claude_code}}, Codex, OpenCode, Hermes Agent, omp, and pi.
          #   It manages connection profiles, signs in to an OIDC identity provider, and configures the agent CLI to route its traffic through the gateway.
          config: |
            kong-harnesses obtains short-lived OIDC access tokens for {{site.claude_code}}.
            It manages connection profiles, signs in to an OIDC identity provider, and configures {{site.claude_code}} to route its traffic through the gateway.

  - header:
      type: h2
      text: "Install kong-harnesses"
    columns:
      - blocks:
        - type: tabs
          tab_group: install-on-os
          config:
            - title: macOS
              include_content: tools/kong-harnesses/install/osx
            - title: Linux
              include_content: tools/kong-harnesses/install/linux
            - title: Windows
              include_content: tools/kong-harnesses/install/windows

  - columns:
    - blocks:
      - type: card
        config:
          title: Install for every user
          description: Install kong-harnesses for every user of a computer, or deploy it with an MDM tool.
          cta:
            text: Read the install guide
            url: /kong-harnesses/install/
    - blocks:
      - type: card
        config:
          title: Changelog
          description: See what changed in each kong-harnesses release.
          cta:
            text: Read the changelog
            url: /kong-harnesses/changelog/
            align: end

  - header:
      type: h2
      text: "Sign in to your agent CLI"
    columns:
      - blocks:
        - type: card
          config:
            title: "Sign in with kong-harnesses"
            # description: "Learn how kong-harnesses signs you in to {{site.ai_gateway}}, validates the result, and signs you out, for every supported agent CLI."
            description: "Learn how kong-harnesses signs you in to {{site.ai_gateway}}, validates the result, and signs you out."
            cta:
              text: Read the overview
              url: /kong-harnesses/sign-in/
              align: end

  - columns:
    - blocks:
      - type: card
        config:
          title: "{{site.claude_code}}"
          icon: /assets/icons/third-party/claude.svg
          description: "Sign in to {{site.ai_gateway}} for {{site.claude_code}} and start a session."
          cta:
            text: "Sign in to {{site.claude_code}}"
            url: /kong-harnesses/sign-in/claude-code/
            align: end
