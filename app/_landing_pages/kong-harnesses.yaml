metadata:
  title: kong-harnesses
  content_type: landing_page
  description: This page is an introduction to kong-harnesses, Kong's OIDC credential helper that obtains short-lived access tokens for coding agents.
  tools:
    - kong-harnesses
  breadcrumbs:
    - /tools/
rows:
  - header:
      type: h1
      text: "kong-harnesses"
      sub_text: |
        Kong's OIDC credential helper for coding agents

  - header:
    columns:
      - header:
          type: h2
          text: What is kong-harnesses?
        blocks:
        - type: text
          config: |
            kong-harnesses obtains short-lived OIDC access tokens for coding agents.
            It signs developers in to your identity provider in the browser, manages connection profiles, and configures the agent CLI to route its traffic through {{site.ai_gateway}}.
            It keeps the sign-in in the secret store of the computer, and doesn't write a long-lived key to the agent CLI settings.

      - header:
          type: h2
          text: When should I use kong-harnesses?
        blocks:
        - type: text
          config: |
            You should use kong-harnesses if one or more of the following is true:
            - You want your coding agent to send every model request through {{site.ai_gateway}} with your company sign-in
            - You're an administrator who sets up the sign-in once for all developers
            - You manage many computers and want them to use a tested agent version and model
            - You want checks that show why a sign-in or a setup fails

  - header:
      type: h2
      text: "Install kong-harnesses"
    columns:
      - blocks:
        - type: tabs
          tab_group: install-on-os
          config:
            - title: macOS
              include_content: tools/kong-harnesses/install/osx
            - title: Linux
              include_content: tools/kong-harnesses/install/linux
            - title: Windows
              include_content: tools/kong-harnesses/install/windows

  - header:
    columns:
      - header:
          type: h2
          text: "What can kong-harnesses do?"
        blocks:
        - type: text
          config: |
            **Browser sign-in**: Sign developers in to your OIDC identity provider, and renew their short-lived access tokens with a refresh token.

            **Profiles**: A profile names the gateway, the identity provider, and the model. An administrator creates it once, and developers install it.

            **Agent configuration**: Configure the agent CLI to send its requests through {{site.ai_gateway}}.

            **Diagnostics**: Check the sign-in, the gateway, and the settings, with a fix for each problem.

            **Fleet management**: Limit managed computers to a tested version range, and move them to a new model. This is available for {{site.claude_code}}.

      - header:
          type: h2
          text: Related guides
        blocks:
          - type: structured_text
            config:
              blocks:
              - type: unordered_list
                items:
                    - "**[Set up {{site.claude_code}} with kong-harnesses](/ai-gateway/set-up-claude-code-with-kong-harnesses/)**: Protect an AI Model with Okta and start a session"
                    - "**[Proxy AI CLI tools through {{site.ai_gateway}}](/ai-gateway/ai-clis/)**: Route AI CLI traffic through the gateway"

