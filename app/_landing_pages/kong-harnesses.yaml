metadata:
  title: agent-auth-cli
  content_type: landing_page
  description: This page is an introduction to agent-auth-cli, Kong's OIDC credential helper that obtains short-lived access tokens for coding agents.
  tools:
    - agent-auth-cli
  breadcrumbs:
    - /tools/
rows:
  - header:
      type: h1
      text: "agent-auth-cli"
      sub_text: |
        Kong's OIDC credential helper for coding agents

  - header:
      type: h2
      text: What is agent-auth-cli?
    columns:
      - blocks:
        - type: text
          config: |
            agent-auth-cli obtains short-lived OIDC access tokens for coding agents such as Claude Code, Codex, OpenCode, and omp.
            It manages connection profiles, signs in to an OIDC identity provider, and configures the agent CLI to route its traffic through the gateway.

  - header:
      type: h2
      text: Commands
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: unordered_list
                  items:
                    - "**[agent-auth-cli credential](/agent-auth-cli/credential/)**: Return one access token, creating the first login when absent"
                    - "**[agent-auth-cli doctor](/agent-auth-cli/doctor/)**: Check one profile end to end and report each fix beside each finding"
                    - "**[agent-auth-cli login](/agent-auth-cli/login/)**: Sign in to, repair, or diagnose one profile"
                    - "**[agent-auth-cli logout](/agent-auth-cli/logout/)**: Sign out of one profile and remove its saved sign-in"
                    - "**[agent-auth-cli profile](/agent-auth-cli/profile/)**: Manage public connection profiles and Claude integration"
                    - "**[agent-auth-cli setup](/agent-auth-cli/setup/)**: Import one profile, sign in, and configure the client, in one run"
                    - "**[agent-auth-cli status](/agent-auth-cli/status/)**: Inspect one profile's local login and client activation state"
                    - "**[agent-auth-cli statusline](/agent-auth-cli/statusline/)**: Render one status-bar line from a client's session document"
                    - "**[agent-auth-cli token](/agent-auth-cli/token/)**: Print one access token for an explicit connection profile"
                - type: text
                  text: |
                    **Profile subcommands:**
                - type: unordered_list
                  items:
                    - "**[profile create](/agent-auth-cli/profile/create/)**: Build and install a profile using OIDC discovery"
                    - "**[profile import](/agent-auth-cli/profile/import/)**: Install a complete profile from a file or HTTPS URL"
                    - "**[profile list](/agent-auth-cli/profile/list/)**: List installed profiles"
                    - "**[profile show](/agent-auth-cli/profile/show/)**: Show one installed profile's public configuration"
                    - "**[profile activate](/agent-auth-cli/profile/activate/)**: Configure one or every detected agent CLI to use one profile"
                    - "**[profile cleanup](/agent-auth-cli/profile/cleanup/)**: Remove settings still owned by agent-auth-cli"
                    - "**[profile delete](/agent-auth-cli/profile/delete/)**: Remove one installed profile from this computer"
