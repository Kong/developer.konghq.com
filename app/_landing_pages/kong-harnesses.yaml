  - header:
      type: h2
      text: "Keep a Claude Code fleet current"
    columns:
      - blocks:
        - type: card
          config:
            title: Pin a version range
            description: Limit managed computers to the Claude Code versions that you tested through AI Gateway.
            cta:
              text: Pin a version range
              url: /kong-harnesses/pin-a-claude-code-fleet/
              align: end
      - blocks:
