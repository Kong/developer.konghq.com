              icon: /assets/icons/llm-quickstart.svg
              cta:
                text: LLM quickstart
                url: /ai-gateway/get-started/
                align: end
      - blocks:
          - type: card
            config:
              title: Control access
              description: Add users and groups, connect an identity provider, and issue virtual keys.
              icon: /assets/icons/team.svg
              cta:
                text: Access management concepts
                url: /ai-access-management/concepts/
                align: end
      - blocks:
          - type: card
            config:
              title: Set a budget
              description: Attribute spend to users and teams, then get alerts before spend reaches a limit.
              icon: /assets/icons/money.svg
              cta:
                text: Get started with {{site.ai_cost_management}}
                url: /ai-cost-management/getting-started/
                align: end
      - blocks:
          - type: card
            config:
              title: Monitor traffic
              description: Watch traffic, latency, errors, and cost for every AI Model, AI MCP Server, and AI Agent.
              icon: /assets/icons/monitor.svg
              cta:
                text: Observability in AI Management
                url: /ai-management/observability/
                align: end

  - header:
      type: h2
      text: "AI Management use cases"
    columns:
      - blocks:
          - type: use_case_table
            config:
              usecase_title: |
                **Use case**

                *(You're trying to...)*
              columns:
                - title: |
                    **Outcome**

                    *(...so that you can...)*
                  key: outcome
                - title: |
                    **Feature**

                    *(...using these solutions...)*
                  key: feature
              rows:
                - usecase: |
                    **Give every team governed access to AI**, without each team managing its own vendor relationship
                  outcomes:
                    - outcome: |
                        Centralize LLM provider credentials in one place and rotate them without touching every team's configuration
                      feature: |
                        [AI Model Provider](/ai-gateway/entities/ai-model-provider/)
                    - outcome: |
                        Scope model access and token budgets by team or department instead of managing permissions per person
                      feature: |
                        [AI Consumer Group](/ai-gateway/entities/ai-consumer-group/)
                    - outcome: |
                        Standardize prompts and default instructions across every team instead of each team writing their own
                      feature: |
                        [AI Prompt Template](/ai-gateway/policies/ai-prompt-template/)
                - usecase: |
                    **See and control AI spend** across users, groups, models, and teams
                  outcomes:
                    - outcome: |
                        Record who made each request, so that you can break spend down by user, application, or custom tag
                      feature: |
                        [Attribution](/ai-cost-management/attribution/)
                    - outcome: |
                        Track spend against a limit and get alerts as spend approaches it
                      feature: |
                        [Budgets](/ai-cost-management/budgets/)
                - usecase: |
                    **Package and bill AI access like a product**, for customers paying for usage
                  outcomes:
                    - outcome: |
                        Create pricing tiers (like Free, Pro, and Enterprise) with different token quotas and cost budgets
                      feature: |
                        [AI Consumer Group](/ai-gateway/entities/ai-consumer-group/)
                    - outcome: |
                        Track token usage and automate invoicing based on prompt and response volume
                      feature: |
                        [Metering and billing](/metering-and-billing/)
                    - outcome: |
                        Enforce per-tier spend caps driven by identity claims instead of managing group membership manually
                      feature: |
                        [Set up a {{site.identity}} auth server for tiered AI budgets](/ai-gateway/set-up-kong-identity-for-tiered-ai-budgets/) and [Enforce tiered AI budgets with {{site.identity}}](/ai-gateway/enforce-tiered-ai-budgets-with-kong-identity/)

