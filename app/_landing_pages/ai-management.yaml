metadata:
  title: "AI Management"
  content_type: landing_page
  description: "AI Management is the {{site.konnect_short_name}} area where you run {{site.ai_gateway}}, control who can use your AI resources, track AI spend, and monitor AI traffic."
  products:
    - ai-gateway
    - ai-cost-management
  works_on:
    - konnect
  tags:
    - ai

rows:
  - header:
      type: h1
      text: "AI Management"
      sub_text: "Govern the AI resources that your organization uses"

  - columns:
      - blocks:
          - type: text
            config: |
              AI Management is the {{site.konnect_short_name}} area for managing AI in your organization.
              Org Admins set up AI Models, AI Model Providers, AI MCP Servers, and AI Agents.
              Everyone else requests access to them.

              AI Management brings these parts together:
              * [{{site.ai_gateway}}](/ai-gateway/) runs the traffic to your models, MCP servers, and agents.
              * [Access Management](/ai-access-management/) controls who can use each resource.
              * [{{site.ai_cost_management}}](/ai-cost-management/) tracks spend and alerts you before it reaches a budget.
              * [{{site.observability}}](/ai-management/observability/) shows traffic, latency, errors, and cost.

              The resources are [{{site.ai_gateway}} entities](/ai-gateway/entities/).
              The people and agents that call them are [{{site.identity}} principals](/identity/principals/).
      - blocks:
          - type: image
            config:
              url: /assets/images/ai-management/ai-management-home.png
              alt_text: "The AI Management home page in {{site.konnect_short_name}}, with AI Models, AI MCP Servers, AI Agents, AI Gateways, Access Management, Cost Management, and Observability in the navigation, and cards to add a model, MCP server, or agent"
              expandable: true

  - header:
      type: h2
      text: "Get started with AI Management"
      description: "Everything in AI Management runs through an {{site.ai_gateway}}. Start by creating one."
    columns:
      - blocks:
        - type: tabs
          tab_group: run-ai-management
          config:
            - title: AI Agent
              content: |
                Connect your AI agent to the {{site.konnect_product_name}} MCP Server, then ask the agent to deploy an {{site.ai_gateway}} for you.

                1. Add the {{site.konnect_product_name}} MCP Server to your agent.
                   For example, in {{site.claude}} Code:

                   ```sh
                   claude mcp add --transport http kong-konnect https://us.mcp.konghq.com/
                   ```

                   Your agent opens a browser window where you sign in to {{site.konnect_short_name}}.
                   If your organization is in another region, or you use a different client, see [Install the {{site.konnect_product_name}} MCP Server](/konnect-platform/konnect-mcp/installation/).
                1. Ask your agent:

                   ```text
                   Deploy a Kong AI Gateway in Konnect and run a local data plane for it in Docker.
                   ```

                The agent creates the {{site.ai_gateway}} in {{site.konnect_short_name}} through the MCP server.
                To start the data plane, the agent must be able to run Docker commands on your machine.
            - title: Quickstart
              content: |
                Run the [quickstart script](https://get.konghq.com/ai) to create an {{site.ai_gateway}} in {{site.konnect_short_name}} and a local data plane in Docker.

                This command requires a [{{site.konnect_short_name}} access token](https://cloud.konghq.com/global/account/tokens).

                ```sh
                curl -Ls https://get.konghq.com/ai | bash -s -- -k $KONNECT_TOKEN
                ```

                When the script finishes, the new gateway appears in AI Management under **Gateways**.
            - title: Konnect UI
              content: |
                1. Sign in to [{{site.konnect_short_name}}](https://cloud.konghq.com/).
                1. In the {{site.konnect_short_name}} sidebar, click **AI**.
                1. In the AI sidebar, click **Gateways**.
                1. Click **New AI gateway**.
                1. Select **Self-managed** or **Dedicated Cloud**.
                1. Complete the **Control plane**, **Data plane setup**, and **Deploy instances** steps.

