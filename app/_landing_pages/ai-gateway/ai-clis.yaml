  - header:
      type: h3
      text: "Claude Code provider modes"
    columns:
      - blocks:
          - type: text
            config: |
              A provider mode sets which API format Claude Code uses and which settings point it at {{site.ai_gateway}}. Kong checks the `latest` release channel of Claude Code every hour. When it finds a new Claude Code release, a new {{site.ai_gateway}} release, or a change to the decK configuration of the tests or to the version of the pi coding agent that the same job tests, it tests the newest Claude Code release with the newest {{site.ai_gateway}} release in the following modes. The tests send each inference request through {{site.ai_gateway}}, set up as in [Route Claude CLI traffic through {{site.ai_gateway}} and Anthropic](/ai-gateway/use-claude-code-with-ai-gateway-anthropic/), to a mock model provider that Kong runs for the tests. The tests through {{site.ai_gateway}} don't cover the Amazon Bedrock mode (`CLAUDE_CODE_USE_BEDROCK`) or the Google Vertex AI mode (`CLAUDE_CODE_USE_VERTEX`) of Claude Code.

              In each mode, Claude Code runs a session with a tool call and a subagent. The tests also compare the `anthropic-version` and `anthropic-beta` request headers and the `system`, `messages`, `tools`, `thinking`, `context_management` and `output_config` request body fields before and after {{site.ai_gateway}} forwards each inference request. Anthropic's [gateway compatibility guide](https://code.claude.com/docs/en/llm-gateway-protocol) asks a gateway to forward these values unchanged. In the Claude Platform on AWS mode, the tests also compare the `anthropic-workspace-id` header. The comparison checks the values, so it accepts body fields with a new key order, spacing or JSON encoding. In the Anthropic API mode, a separate test asks {{site.ai_gateway}} for a token count at `/v1/messages/count_tokens`. It checks that the model provider gets the same `messages` field and that {{site.ai_gateway}} returns the count of the model provider.

              The cloud sign-in skip switch stops Claude Code from signing in to the cloud provider itself, so that {{site.ai_gateway}} handles the authentication.

              {% include md/ai-gateway/v2/claude-code-provider-modes.md heading_level=3 %}
