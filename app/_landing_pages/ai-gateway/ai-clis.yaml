  # When a Claude Code release fails in a provider mode, replace the "No
  # Claude Code release" line with one bullet per release and mode: the
  # release, the mode, what breaks and how to avoid it. Remove the bullet when
  # a later release passes in that mode.
  - columns:
      - blocks:
          - type: structured_text
            config:
              header:
                type: h3
                text: "Known issues with Claude Code releases"
              blocks:
                - type: text
                  text: |
                    Kong tests each new Claude Code release through {{site.ai_gateway}} in every provider mode that kong-harnesses sets up. When a release fails in a mode, Kong lists it here with what breaks and how to avoid it, and removes the entry when a later release passes in that mode.

                    No Claude Code release has a known issue.

                    To keep Claude Code on a release that works:

                    - A profile that `kong-harnesses profile create` builds turns off Claude Code auto-updates, unless you turn them on with `--auto-updates on`. Claude Code then stays on the release that you installed until you run `claude update`.
                    - To go back to an earlier release, run `claude install <version>`.
                    - Without kong-harnesses, set `DISABLE_AUTOUPDATER` to `1` in the `env` of your Claude Code settings.
  - header:
      type: h3
      text: "Claude Code provider modes"
    columns:
      - blocks:
          - type: text
            config: |
              A provider mode decides which API format Claude Code uses and which settings point it at {{site.ai_gateway}}. Kong checks the `latest` release channel of Claude Code every hour and tests the newest release in the following modes. The tests send each request through the current {{site.ai_gateway}} release, set up as in [the Anthropic guide](/ai-gateway/use-claude-code-with-ai-gateway-anthropic/), to a mock model provider that Kong runs for the tests. Kong doesn't test the Amazon Bedrock and Google Vertex AI modes of Claude Code.

              In each mode, Claude Code runs a session with a tool call and a subagent. The test also checks that {{site.ai_gateway}} forwards the `anthropic-version` and `anthropic-beta` request headers and the `system`, `messages`, `tools`, `thinking`, `context_management` and `output_config` request body fields unchanged, as the [Claude Code gateway guide](https://code.claude.com/docs/en/llm-gateway-protocol) asks. In the Claude Platform on AWS mode, it also checks the `anthropic-workspace-id` header.

              {% include md/ai-gateway/v2/claude-code-provider-modes.md heading_level=3 %}
