  - header:
      type: h3
      text: "Claude Code provider modes"
    columns:
      - blocks:
          - type: text
            config: |
              A provider mode sets which provider API Claude Code calls and which settings point it at {{site.ai_gateway}}. Kong checks the `latest` release channel of Claude Code every hour. Kong runs the tests again for a new Claude Code release, a change to the {{site.ai_gateway}} image, a change to the decK configuration of the tests, or a new version of the pi coding agent that the same job tests. Each run tests the newest Claude Code release with the `latest` {{site.ai_gateway}} image in the following modes. The tests send each inference request through {{site.ai_gateway}}, set up as in [Route Claude CLI traffic through {{site.ai_gateway}} and Anthropic](/ai-gateway/use-claude-code-with-ai-gateway-anthropic/), to a mock model provider that Kong runs for the tests. The tests through {{site.ai_gateway}} don't cover the Amazon Bedrock mode (`CLAUDE_CODE_USE_BEDROCK`) or the Google Vertex AI mode (`CLAUDE_CODE_USE_VERTEX`) of Claude Code.

              In each mode, Claude Code runs a session with a tool call and a subagent. The tests also compare the `anthropic-version` and `anthropic-beta` request headers and the `system`, `messages`, `tools`, `thinking`, `context_management` and `output_config` request body fields before and after {{site.ai_gateway}} forwards each inference request. Anthropic's [gateway compatibility guide](https://code.claude.com/docs/en/llm-gateway-protocol) asks a gateway to forward these values unchanged. In the Claude Platform on AWS mode, the tests also compare the `anthropic-workspace-id` header. The comparison checks the values, so it accepts body fields with a new key order, spacing or JSON encoding. In the Anthropic API mode, a separate test asks {{site.ai_gateway}} for a token count at `/v1/messages/count_tokens`. It checks that the model provider gets the same `messages` field and that {{site.ai_gateway}} returns the model provider's count unchanged.

              The cloud sign-in skip switch stops Claude Code from signing in to the cloud provider itself, so that {{site.ai_gateway}} handles the authentication.

              {% include md/ai-gateway/v2/claude-code-provider-modes.md heading_level=3 %}
  # When a tested Claude Code release fails in a provider mode, replace the
  # paragraph that starts with "Kong has no confirmed issue" with one bullet per
  # release and mode: the release, the mode, what breaks, how to avoid it and,
  # once it ships, the release with the fix. Keep the bullet after the fix
  # ships, so developers who still run the failing release see it. Remove it
  # when Kong no longer supports the failing release.
  - header:
      type: h3
      text: "Known issues with Claude Code releases"
    columns:
      - blocks:
          - type: text
            config: |
              When the tests in [Claude Code provider modes](#claude-code-provider-modes) find a Claude Code release that fails in one of those modes, Kong lists it here with what breaks and how to avoid it.

              Kong has no confirmed issue with a tested Claude Code release in these modes.

              A release that this section doesn't list might not have a test result yet.

              To keep Claude Code on a release that works:

              - Keep auto-updates off:
                - [kong-harnesses](/kong-harnesses/) turns them off, unless your profile turns them on or leaves the setting out. In those cases, ask your administrator for a profile with auto-updates off, which [`kong-harnesses profile create`](/kong-harnesses/profile/create/) makes with `--auto-updates off`.
                - Until then, or without kong-harnesses, add `"DISABLE_AUTOUPDATER": "1"` to the `env` block of your [Claude Code settings](https://code.claude.com/docs/en/setup#disable-auto-updates), such as `~/.claude/settings.json`. With a profile that keeps auto-updates on or leaves the setting out, kong-harnesses leaves that value in place. On a native or npm install, run `claude doctor` to check it: the `Auto-updates` line starts with `disabled`.
                - A Homebrew or WinGet install doesn't auto-update, unless `CLAUDE_CODE_PACKAGE_MANAGER_AUTO_UPDATE` is set to `1`, so leave it unset. After you run `claude install`, you also have a native build, which updates itself unless `DISABLE_AUTOUPDATER` is set.
              - To get a newer release:
                - Find the release that you would get, and skip the update if this section lists an issue for that release in your provider mode. To see the release, open Anthropic's [latest release file](https://downloads.claude.ai/claude-code-releases/latest), or the [stable release file](https://downloads.claude.ai/claude-code-releases/stable) if you follow the stable [channel](https://code.claude.com/docs/en/setup#configure-release-channel). On a native install with the stable channel and [`minimumVersion`](https://code.claude.com/docs/en/setup#pin-a-minimum-version) set, the release that you get can be the one that you already have, because auto-updates and `claude update` don't install a release below it. On a package manager install, check the release that the package manager offers, such as with `brew info --cask claude-code` or `brew info --cask claude-code@latest`, `npm view @anthropic-ai/claude-code version`, or `winget show Anthropic.ClaudeCode`.
                - Run the update command for your install. On a native install, run `claude update`. On an npm install, run `npm --version` first. With npm 12, follow [Fix an npm 12 install](https://code.claude.com/docs/en/troubleshoot-install#fix-an-npm-12-install) instead. Otherwise run `npm install -g @anthropic-ai/claude-code@latest`. On a Homebrew install, run `brew upgrade claude-code` or `brew upgrade claude-code@latest`, for the cask that you installed. On a WinGet install, run `winget upgrade Anthropic.ClaudeCode`. For other package managers, see [Update Claude Code](https://code.claude.com/docs/en/setup#update-claude-code). Claude Code can tell you about an update before your package manager has it, so if the package manager doesn't offer the new release yet, wait and try again later. On WinGet, close Claude Code before you upgrade, because Windows locks the running executable and the upgrade can fail.
                - Run `claude --version`. If the command reports that it installed a release but `claude --version` shows another one, check which `claude` your shell runs, as the step to go back to an earlier release describes. A launcher that you made yourself at `~/.local/bin/claude` also decides which release runs, as [Auto-updates](https://code.claude.com/docs/en/setup#auto-updates) describes.
              - To go back to an earlier release:
                - Turn auto-updates off first, as the first step describes, also on a Homebrew or WinGet install. `claude install` puts a native build in place, and the native build updates itself unless `DISABLE_AUTOUPDATER` is set, so an auto-update can replace the release that you install.
                - Run `claude install <version>` with a release that worked in your mode. This installs the native build, also when you installed Claude Code another way. If the command reports an error, fix it with [Troubleshoot installation](https://code.claude.com/docs/en/troubleshoot-install) before you go on.
                - Run `claude --version`. If it doesn't show the release that you installed, run the native build by its full path: `~/.local/bin/claude --version` on macOS and Linux, `"%USERPROFILE%\.local\bin\claude.exe" --version` in the Windows Command Prompt, or `& "$env:USERPROFILE\.local\bin\claude.exe" --version` in PowerShell. On macOS and Linux, if you replaced the `~/.local/bin/claude` launcher with your own, point it at the release that you installed, as [Auto-updates](https://code.claude.com/docs/en/setup#auto-updates) describes.
                - If the native build shows your release, check your `PATH`. `which -a claude` on macOS and Linux, or `where.exe claude` on Windows, lists each `claude` on your `PATH`. If the native build's folder isn't on your `PATH`, or your shell can't find `claude`, add the folder, as [Verify your PATH](https://code.claude.com/docs/en/troubleshoot-install#verify-your-path) shows. If another `claude` still comes before the native build, remove that install, as [Check for conflicting installations](https://code.claude.com/docs/en/troubleshoot-install#check-for-conflicting-installations) shows. Run `claude --version` again, and go on only when it shows the release that you installed.
              - To get new releases after a delay, follow the stable channel. It gets releases later than the latest channel and skips releases with major regressions. Before you switch, check that this section lists no known issue for the stable release in your provider mode. To see which release that is, open [Anthropic's stable release file](https://downloads.claude.ai/claude-code-releases/stable) or, on Homebrew, run `brew info --cask claude-code`. After each update, run `claude --version` and check that this section lists no known issue for that release in your mode. To switch:
                - On an npm or WinGet install, first run `claude install <version>` with the release that you have, to move to the native build at that release, because the Anthropic docs describe the stable switch and `minimumVersion` for native installs only. Keep `DISABLE_AUTOUPDATER` set, because the native build updates itself. Both installs now show the same release, so `claude --version` can't tell you which one runs. Run the `PATH` checks of the step to go back to an earlier release, and remove the npm or WinGet install if it still comes before the native build. Then follow the native steps.
                - On a native install, or after that move, add `"autoUpdatesChannel": "stable"` to your Claude Code settings. `claude update`, and auto-updates if you turn them on, then follow the stable channel, also when the stable release is older than yours. With auto-updates off, run `claude update` when you want the current stable release.
                - On a native install, to stay on your release until the stable channel catches up, also set [`minimumVersion`](https://code.claude.com/docs/en/setup#pin-a-minimum-version) to your release, and don't run `claude install stable`, which installs the stable release at once. If you switch back to latest in `/config`, Claude Code clears `minimumVersion` from your settings.
                - On a native install, to switch and install the stable release now, run `claude install stable` in place of the setting, which also saves the channel.
                - On Homebrew, the `claude-code` cask already follows the stable channel. If you have the `claude-code@latest` cask, run `brew uninstall --cask claude-code@latest`, then `brew install --cask claude-code`, because the two casks can't be installed together. This can install an older release than yours. If you ran `claude install` and the native build runs first, follow the native steps instead.
                - For Linux package managers, see [Configure release channel](https://code.claude.com/docs/en/setup#configure-release-channel).
