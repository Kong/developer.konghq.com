metadata:
  title: "A2A Traffic Gateway"
  content_type: landing_page
  description: Observe Agent-to-Agent (A2A) protocol traffic through {{site.ai_gateway}}.
  products:
    - ai-gateway
  works_on:
    - konnect
  min_version:
    ai-gateway: '2.0'
  tags:
    - ai
    - a2a

rows:
  - header:
      type: h1
      text: "Observability and control layer for Agent-to-Agent protocol traffic"
      sub_text: Route A2A traffic through {{site.ai_gateway}} with protocol-aware metrics, tracing, and agent card rewriting

  - header:
      type: h2
      text: Route A2A traffic through {{site.ai_gateway}}
    columns:
      - blocks:
          - type: text
            config: |
              The [Agent-to-Agent (A2A)](https://a2aproject.github.io/A2A/) protocol defines how AI agents communicate with each other over HTTP using JSON-RPC and REST bindings. As agent-to-agent communication moves into production, teams need visibility into A2A traffic and control over how it flows.

              {{site.ai_gateway}} acts as a control and observability layer for A2A traffic, enabling you to route agent-to-agent requests, extract task metadata, and rewrite agent card URLs so clients route through the Gateway.
              This gives you a single point of control over how agents discover and call each other, with structured metrics fed into the {{site.konnect_short_name}} analytics pipeline.
              Configure A2A traffic using [AI Agents](/ai-gateway/entities/ai-agent/) and attach [AI Policies](/ai-gateway/entities/ai-policy/) for authentication, access control, and observability.

      - blocks:
          - type: image
            config:
              url: /assets/images/ai-gateway/a2a.svg
              alt_text: Overview of A2A traffic flowing through AI Gateway

  - columns:
      - blocks:
          - type: structured_text
            config:
              header:
                type: h2
                text: "Proxy and observe A2A traffic"
              blocks:
                - type: text
                  text: |
                    Create an [AI Agent](/ai-gateway/entities/ai-agent/) entity to proxy A2A traffic, then attach an OpenTelemetry [AI Policy](/ai-gateway/entities/ai-policy/) to export traces and metrics for that traffic.
      - blocks:
          - type: structured_text
            config:
              header:
                type: h4
                text: "Secure A2A endpoints"
              blocks:
                - type: text
                  text: |
                    Attach AI Policies to your AI Agent entities to authenticate A2A clients and limit request size before traffic reaches your agents.

  - columns:
      - blocks:
          - type: card
            config:
              icon: /assets/icons/ai.svg
              title: Create and monitor an AI Agent
              description: |
                Set up an AI Agent to proxy A2A traffic and observe it with OpenTelemetry.
              ctas:
                - text: AI Agent entity
                  url: "/ai-gateway/entities/ai-agent/"
                - text: Get started with AI Agent
                  url: "/ai-gateway/get-started-with-ai-agent/"
                - text: Monitor AI Agent traffic with OpenTelemetry
                  url: "/ai-gateway/monitor-ai-agent-with-opentelemetry/"
      - blocks:
          - type: card
            config:
              icon: /assets/icons/lock.svg
              title: Secure A2A endpoints
              description: Apply AI Policies to authenticate clients and limit request size for A2A traffic.
              ctas:
                - text: Key Auth policy
                  url: "/ai-gateway/policies/key-auth/"
                - text: OpenID Connect policy
                  url: "/ai-gateway/policies/openid-connect/"
                - text: Request Size Limiting policy
                  url: "/ai-gateway/policies/request-size-limiting/"

  - header:
      type: h2
      text: "Observe A2A traffic"
      description: |
        {{site.ai_gateway}} records A2A protocol traffic data so you can analyze how agent-to-agent requests are processed and resolved.
        - Audit logs capture task IDs, JSON-RPC method calls, payloads, latencies, and errors.
        - OpenTelemetry spans record task state, context IDs, TTFB, SSE event counts, and response sizes.
        - Metrics track A2A-specific signals and performance indicators over time.
    column_count: 4
    columns:
      - blocks:
        - type: card
          config:
            title: A2A audit logs
            icon: /assets/icons/monitor.svg
            description: Review AI A2A Proxy log output fields, task states, and payload capture.
            cta:
              url: /ai-gateway/ai-audit-log-reference/#ai-a2a-proxy-logs
              align: end
      - blocks:
        - type: card
          config:
            title: A2A OpenTelemetry spans
            description: Inspect A2A-specific span attributes in distributed traces.
            icon: /assets/icons/opentelemetry.svg
            cta:
              url: /ai-gateway/llm-open-telemetry/#a2a-agent-traffic
              align: end
      - blocks:
        - type: card
          config:
            title: A2A OpenTelemetry metrics
            description: Monitor A2A-specific OTLP metrics and telemetry signals.
            icon: /assets/icons/opentelemetry.svg
            cta:
              url: /ai-gateway/ai-otel-metrics/#a2a-metrics
              align: end
      - blocks:
        - type: card
          config:
            title: Agentic usage analytics in {{site.konnect_short_name}}
            description: View A2A-specific metrics and analytics in {{site.konnect_short_name}}.
            icon: /assets/icons/KogoBlue.svg
            cta:
              url: /observability/explorer/?tab=agentic-usage#metrics
              align: end
  - header:
      type: h2
      text: "Manage A2A traffic"
      description: |
        {{site.ai_gateway}} records A2A protocol traffic data so you can apply rate limits, authenticate users, and restrict request types.
    column_count: 3
    columns:
      - blocks:
        - type: card
          config:
            title: Rate limit A2A traffic
            icon: /assets/icons/monitor.svg
            description: Apply rate limits to A2A routes proxied through {{site.ai_gateway}}
            cta:
              url: /ai-gateway/rate-limit-a2a-traffic/
              align: end
