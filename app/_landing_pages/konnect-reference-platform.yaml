  breadcrumbs:
    - /konnect/

rows:
  - header:
      type: h1
      text: "{{site.konnect_short_name}} Reference Platform"
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    ## Learn federated API platform management by example

                    The {{site.konnect_short_name}} Reference Platform is a
                    resource project with public example repositories that
                    demonstrate an opinionated approach to federated API
                    platform management with {{site.konnect_product_name}}.
                    Read the docs, follow the
                    workflows, and adapt the patterns to your own organization.

                    The example follows [KongAirlines](https://github.com/KongAirlines), a fictional airline
                    whose service teams deliver APIs independently while a
                    platform team manages shared infrastructure and production
                    governance. It connects API design, automated delivery,
                    developer discovery, and application access in one
                    implementation you can explore.
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    <a href="/assets/images/reference-platform/kongairlines-overview.png" aria-label="View the KongAirlines overview screenshot">
                      <img src="/assets/images/reference-platform/kongairlines-overview.png" alt="KongAirlines README explaining platform and service team ownership" style="width: 100%; height: auto; border-radius: 8px;" />
                    </a>
          - type: button
            config:
              text: Explore the KongAirlines repositories
              url: https://github.com/KongAirlines

  - header:
      type: h2
      text: Self-service API delivery with governance
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    **Self-service for service teams**

                    Give service teams the access and automation to manage
                    their API contracts, catalog entries, documentation, and
                    development Gateway configuration. Teams can build, test,
                    and publish independently without making the platform team
                    a dependency for every change.

                    **Governance where it matters**

                    The platform team defines access boundaries and manages
                    shared infrastructure. Changes to critical production
                    systems, such as the shared API Gateway, pass through
                    platform review and approval. Service teams retain ownership
                    of their APIs while production traffic remains governed.
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    **Supported tools, readable examples**

                    The project uses [kongctl](/kongctl/) for {{site.konnect_short_name}}
                    configuration, decK for Gateway configuration, and GitHub
                    Actions for automation. Explore how these tools support
                    team ownership without introducing another platform tool.

                    **Patterns you can adapt**

                    This is one solution, not the only way to build an API
                    platform. Explore its approach to development and production,
                    API releases, and shared governance. Understand the decisions
                    behind the example, then take the concepts that fit your
                    organization and adapt them to your own needs.

  - header:
      type: h2
      text: Put API design first, with reviewable delivery
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    Follow an API-first workflow: start with an OpenAPI contract
                    in a service repository, then let automation turn the design
                    into deployable configuration. It validates the contract, generates Gateway
                    configuration, and commits the result to the same pull
                    request. Reviewers can inspect both the API change and
                    the configuration that will be deployed.

                    Automated review comments summarize the changed inputs and
                    show the generated Gateway differences. Production candidates
                    then move to a platform pull request, making the handoff
                    between service ownership and platform governance visible.

                    [Follow an API change](/konnect-reference-platform/apiops/) through the example.
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    <a href="/assets/images/reference-platform/production-gateway-diff.png" aria-label="View the production Gateway diff screenshot">
                      <img src="/assets/images/reference-platform/production-gateway-diff.png" alt="GitHub pull request showing a reviewable production Gateway configuration diff" style="width: 100%; height: auto; border-radius: 8px;" />
                    </a>

  - header:
      type: h2
      text: Follow delivery from development to production
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    Service workflows update development environments, prepare
                    releases, and propose production changes. Platform workflows
                    manage shared foundations and the reviewed production
                    Gateway configuration. After Gateway delivery succeeds,
                    automation triggers the owning service's production catalog
                    workflow, with approval before deployment.

                    Read the workflow definitions and run history to see where
                    validation, review, and deployment approvals fit together.
                    The example keeps these steps in the repositories so you
                    can learn from them and adapt them to your delivery process.
      - blocks:
          - type: image
            config:
              url: /assets/images/reference-platform/development-delivery.png
              alt_text: kongctl execution summary showing a successful development Gateway synchronization through decK

  - header:
      type: h2
      text: Connect API delivery to the developer experience
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    KongAirlines also demonstrates the consumer side of an API
                    platform: branded Developer Portals, API discovery,
                    onboarding guides, and application access requests.

                    Flights and Destinations illustrate public API access.
                    Bookings and Customer Information illustrate protected
                    access through approved Dev Portal applications and API
                    keys. This gives you an example to study from both the
                    API producer's and API consumer's perspective.

                    Explore the [KongAirlines example](/konnect-reference-platform/kong-air/)
                    for the implementation and its ownership model.
      - blocks:
          - type: image
            config:
              url: /assets/images/reference-platform/portal-api-catalog.png
              alt_text: KongAir Developer Portal catalog showing Bookings, Customer Information, Destinations, and Flights with published API versions

  - header:
      type: h2
      text: Explore the example
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: KongAirlines
              description: Meet the example teams and explore their public repositories.
              icon: /assets/icons/organization.svg
              cta:
                text: Explore the example
                url: /konnect-reference-platform/kong-air/
      - blocks:
          - type: card
            config:
              title: Follow an API change
              description: Follow an API change through review, development, and production.
              icon: /assets/icons/load-balance.svg
              cta:
                text: Follow the delivery flow
                url: /konnect-reference-platform/apiops/
      - blocks:
          - type: card
            config:
              title: Adapt patterns from KongAirlines
              description: Choose a practice, inspect its implementation, and adapt it to your platform.
              icon: /assets/icons/graduation.svg
              cta:
                text: Find a useful pattern
                url: /konnect-reference-platform/patterns/

  - header:
      type: h2
      text: Explore with an AI assistant
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    The [konnect-reference-platform skill in the Kong AI Marketplace](https://github.com/Kong/ai-marketplace/tree/main/plugins/kong-konnect/skills/konnect-reference-platform)
                    gives an AI assistant guidance for understanding and adapting
                    this federated ownership and delivery model. Use it alongside
                    the documentation and repositories when exploring how these
                    patterns fit your platform.

                    The skill is optional. You can learn from and use the example
                    without an AI assistant.

                    Have more questions? Read the [FAQ](/konnect-reference-platform/faq/).
