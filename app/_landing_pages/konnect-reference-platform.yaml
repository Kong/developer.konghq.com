metadata:
  title: "{{site.konnect_short_name}} Reference Platform"
  content_type: landing_page
  products:
    - konnect-reference-platform
  description: |
    A maintained reference architecture and working example for federated
    API delivery with kongctl and decK.
  tags:
    - kongair
    - automation
    - apiops
  breadcrumbs:
    - /konnect/

rows:
  - header:
      type: h1
      text: "{{site.konnect_short_name}} Reference Platform"
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    The {{site.konnect_short_name}} Reference Platform is an
                    opinionated architecture for federated APIOps. Platform
                    teams manage shared foundations and production Gateway
                    governance. Service teams manage their API contracts,
                    Catalog resources, and development Gateway configuration
                    directly with supported `kongctl` and decK workflows.

                    It is guidance and a readable, copyable implementation—not
                    a product installer, repository generator, or additional
                    declarative format. See the public
                    [KongAirlines implementation](https://github.com/KongAirlines)
                    to inspect each concept in working repositories.
      - blocks:
          - type: mermaid
            config:
              diagram: |
                flowchart LR
                  subgraph Services[Service repositories]
                    OAS[OpenAPI contracts]
                    Catalog[kongctl Catalog state]
                    Dev[decK development state]
                    Candidate[Production candidate]
                  end
                  subgraph Platform[Platform repository]
                    Shared[Teams, RBAC, portals, control planes]
                    Prod[Reviewed production aggregate]
                  end
                  OAS --> Catalog
                  OAS --> Dev
                  OAS --> Candidate
                  Shared --> Catalog
                  Shared --> Dev
                  Candidate -->|promotion PR| Prod

  - header:
      type: h2
      text: Ownership model
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    **Platform Team**

                    The Platform Team declares organization teams, repository
                    identity access, Developer Portals, application auth
                    strategies, and all control planes. It reviews exact
                    service-generated production Gateway artifacts and applies
                    them together to one production control plane.

                    **Service Teams**

                    Each service repository declares separate development and
                    production Catalog APIs, versions, specifications,
                    publications, and control-plane implementations. It also
                    owns its development Gateway state and generates the
                    production candidate. All state lives on `main`; stages are
                    separate resources and files, not branches.
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    **Federation and authorization**

                    Service manifests resolve shared resources with
                    `_external`, `!lookup`, and `!ref`. kongctl namespaces mark
                    declarative ownership; Konnect RBAC controls authorization.
                    Each service repository uses its own Konnect system account
                    token.

                    **Gateway and Portal authorization**

                    Protected APIs use a platform-owned Key Auth strategy and a
                    service-scoped Access Control Enforcement plugin with
                    `match_policy: required`. Public APIs remain anonymous.
                    Catalog APIs link to control planes so ACE can enforce
                    OpenAPI operation-level registrations independently from
                    Gateway routing.

  - header:
      type: h2
      text: APIOps flow
    columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    `deck file openapi2kong` generates Gateway Services and
                    Routes. Protected services add ACE with
                    `deck file add-plugins`. Committed artifacts carry
                    environment, team, owner, and service-stage tags; CI
                    regenerates them and rejects drift. The root OpenAPI
                    document is the next beta; a release workflow opens a PR
                    that retains a stable contract, selects it for production,
                    and advances development to the next beta.

                    Merges to a service repository apply that service's
                    development Catalog and Gateway state. Production Gateway
                    candidates cross the ownership boundary through a PR to the
                    platform repository. After platform review and the aggregate
                    Gateway apply, the service team manually applies production
                    Catalog state from the exact promoted commit.

                    The initial model is apply-only. Omitted resources are not
                    deleted; removal and pruning are intentionally deferred.
      - blocks:
          - type: mermaid
            config:
              diagram: |
                flowchart TD
                  PR[Service or release pull request] --> Validate[Generate and validate]
                  Validate --> Main[Merge to main]
                  Main --> DevApply[Service-owned development apply]
                  Main --> Promote[Open platform promotion PR]
                  Promote --> Review[Platform review]
                  Review --> Gateway[Aggregate production Gateway apply]
                  Gateway --> Catalog[Approved production Catalog apply]

