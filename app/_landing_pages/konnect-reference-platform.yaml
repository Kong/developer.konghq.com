  - header:
      type: h2
      text: Frequently asked questions
    columns:
      - blocks:
          - type: faqs
            config:
              - q: Is this a bootstrapping tool?
                a: No. It is maintained architecture guidance and a public implementation to read, copy, and adapt.
              - q: What is the source of truth?
                a: Human-authored kongctl manifests, OpenAPI documents, and generated decK files in the owning repository. There is no registry.
              - q: How are development and production separated?
                a: Both live on main as distinct Konnect resources and files. Development is service-applied; production Gateway state is platform-reviewed.
              - q: Is an AI assistant skill available?
                a: The optional `konnect-reference-platform` skill is published in the Kong AI Marketplace. The documentation and example remain usable without it.
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    See the complete [FAQ](/konnect-reference-platform/faq/).
