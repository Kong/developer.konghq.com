metadata:
  title: "Disaster recovery for {{site.base_gateway}} on Kubernetes"
  content_type: landing_page
  description: "Prepare, recover, and test Kong Gateway deployments on Kubernetes with KIC, Kong Operator, or a Konnect control plane."
