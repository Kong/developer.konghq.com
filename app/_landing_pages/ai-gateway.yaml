  - header:
      type: h2
      text: "Use cases for {{site.ai_gateway}}"
    columns:
      - blocks:
          - type: use_case_table
            config:
              usecase_title: |
                **Use case**

                *(You're trying to...)*
              columns:
                - title: |
                    **Outcome**

                    *(...so that you can...)*
                  key: outcome
                - title: |
                    **Feature**

                    *(...using these solutions...)*
                  key: feature
              rows:
                - usecase: |
                    **Give every team governed access to AI**, without each team managing its own vendor relationship
                  outcomes:
                    - outcome: |
                        Centralize LLM provider credentials in one place and rotate them without touching every team's configuration
                      feature: |
                        [AI Model Provider](/ai-gateway/entities/ai-model-provider/)
                    - outcome: |
                        Scope model access and token budgets by team or department instead of managing permissions per person
                      feature: |
                        [AI Consumer Group](/ai-gateway/entities/ai-consumer-group/)
                    - outcome: |
                        Standardize prompts and default instructions across every team instead of each team writing its own
                      feature: |
                        [AI Prompt Template](/ai-gateway/policies/ai-prompt-template/)
                - usecase: |
                    **Package and bill AI access like a product**, for customers paying for usage
                  outcomes:
                    - outcome: |
                        Create pricing tiers (like Free, Pro, and Enterprise) with different token quotas and cost budgets
                      feature: |
                        [AI Consumer Group](/ai-gateway/entities/ai-consumer-group/)
                    - outcome: |
                        Track token usage and automate invoicing based on prompt and response volume
                      feature: |
                        [Metering and billing](/metering-and-billing/)
                    - outcome: |
                        Enforce per-tier spend caps driven by identity claims instead of managing group membership by hand
                      feature: |
                        [Set up a {{site.identity}} auth server for tiered AI budgets](/ai-gateway/set-up-kong-identity-for-tiered-ai-budgets/) and [Enforce tiered AI budgets with {{site.identity}}](/ai-gateway/enforce-tiered-ai-budgets-with-kong-identity/)
                - usecase: |
                    **Cut LLM spend at scale** on high-volume or repetitive traffic
                  outcomes:
                    - outcome: |
                        Serve repeated or near-duplicate prompts from cache instead of calling the upstream LLM again
                      feature: |
                        [AI Semantic Cache](/ai-gateway/policies/ai-semantic-cache/)
                    - outcome: |
                        Shrink prompts before they reach the upstream provider to reduce token costs
                      feature: |
                        [AI Prompt Compressor](/ai-gateway/policies/ai-prompt-compressor/)
                    - outcome: |
                        Calculate the true cost of each request, including cache, context-window, and service-tier pricing, and enforce spend limits against it
                      feature: |
                        [Model cost management](/ai-gateway/model-cost-management/) and [AI Rate Limiting Advanced](/ai-gateway/policies/ai-rate-limiting-advanced/)
                - usecase: |
                    **Expose your APIs as tools an AI agent can call**, governed like any other API product
                  outcomes:
                    - outcome: |
                        Turn existing APIs into tools an AI agent can discover and call over Model Context Protocol
                      feature: |
                        [AI MCP Server](/ai-gateway/entities/ai-mcp-server/)
                    - outcome: |
                        Scope agent tool calls with OAuth2, so write actions can require tighter access than read actions
                      feature: |
                        [AI MCP OAuth2](/ai-gateway/policies/ai-mcp-oauth2/)
                - usecase: |
                    **Enforce governance on outgoing AI prompts** by protecting against unsafe prompts and data leaks
                  outcomes:
                    - outcome: |
                        Block requests that match disallowed topics or keywords
                      feature: |
                        [AI Prompt Guard](/ai-gateway/policies/ai-prompt-guard/)
                    - outcome: |
                        Catch jailbreak and prompt-injection attempts phrased in natural language, not just blocked keywords
                      feature: |
                        [AI Semantic Prompt Guard](/ai-gateway/policies/ai-semantic-prompt-guard/)
                    - outcome: |
                        Redact PII before it reaches the upstream LLM provider
                      feature: |
                        [AI Sanitizer](/ai-gateway/policies/ai-sanitizer/)
                    - outcome: |
                        Catch unsafe or noncompliant content in the LLM's response before it reaches the user
                      feature: |
                        [AI Semantic Response Guard](/ai-gateway/policies/ai-semantic-response-guard/)
                    - outcome: |
                        Enforce guardrails through a cloud vendor's own trust and safety service if you're already using one
                      feature: |
                        [AI AWS Guardrails](/ai-gateway/policies/ai-aws-guardrails/), [AI Azure Content Safety](/ai-gateway/policies/ai-azure-content-safety/), or [AI GCP Model Armor](/ai-gateway/policies/ai-gcp-model-armor/)
                - usecase: |
                    **Keep AI traffic online when a provider fails**
                  outcomes:
                    - outcome: |
                        Automatically fail over to a different provider or model when one is slow or unavailable
                      feature: |
                        [Load balancing](/ai-gateway/load-balancing/)
