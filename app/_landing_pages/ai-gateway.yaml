  - header:
      text: "Frequently Asked Questions"
      type: h2
    columns:
      - blocks:
        - type: faqs
          config:
            - q: How do I deploy {{site.ai_gateway}}?
              a: |
                {{site.ai_gateway}} is managed through {{site.konnect_short_name}}. Data plane nodes run in your environment (self-hosted, [cloud](/dedicated-cloud-gateways/), or Kubernetes) and connect to {{site.konnect_short_name}} for configuration and observability.

            - q: Why should I use {{site.ai_gateway}} instead of adding the LLM's API behind {{site.base_gateway}}?
              a: |
                If you just add an LLM's API behind {{site.base_gateway}}, you can only interact at the API level with internal traffic.
                With {{site.ai_gateway}} AI Policies and runtime components, {{site.base_gateway}} can understand the prompts that are being sent through the gateway.
                AI Policies can inspect the body and provide more specific AI capabilities to your traffic.

            - q: I'm migrating from {{site.ai_gateway}} running on {{site.base_gateway}}. Where do I start?
              a: |
                {{site.ai_gateway}} 2.x replaces {{site.base_gateway}}'s plugin-centric model (V1) with an entity model (V2).
                Instead of configuring the AI Proxy/AI Proxy Advanced plugin directly, you now create AI Model Provider and AI Model entities to manage upstream connectivity and routing.
                See [{{site.ai_gateway}} 2.x concepts](/ai-gateway/ai-gateway-v2-concepts/) for a mapping of V1 concepts to V2 entities, and [Migrate to {{site.ai_gateway}} 2.x](/ai-gateway/v2-migration-guide/) for step-by-step instructions.
            - q: I was using AI Proxy or AI Proxy Advanced. Where did those plugins go?
              a: |
                In {{site.ai_gateway}} 2.x, the proxy is configured through the [AI Model entity](/ai-gateway/entities/ai-model/) rather than the AI Proxy plugin.
                An AI Model defines the upstream provider, model name, and routing behavior that the old AI Proxy plugin handled.
                You can attach AI Policies for things like guardrails, transformations, and rate limiting as before.

            - q: Can I run {{site.ai_gateway}} on-prem?
              a: |
                Yes. {{site.ai_gateway}} supports both {{site.konnect_short_name}} and self-hosted deployments.
                See [Configure {{site.ai_gateway_name}} on-prem](/ai-gateway/configure-on-prem/) for setup instructions.

            - q: How do I manage {{site.ai_gateway}} resources?
              a: |
                For {{site.konnect_short_name}}-managed deployments, use [kongctl](/ai-gateway/kongctl/) to create and manage resources declaratively or with imperative commands.
                For on-prem deployments, use [decK](https://docs.konghq.com/deck/) to manage gateway configuration.
