rows:
  - header:
      type: h1
      text: "{{site.ai_gateway}}"
      sub_text: Connectivity and governance layer for modern AI-native applications
  - columns:
      - blocks:
          - type: structured_text
            config:
              header:
                text: "Introducing {{site.ai_gateway}}"
              blocks:
                - type: text
                  text: |
                    As AI adoption accelerates, applications are evolving beyond basic LLM calls into complex, multi-actor systems-including user apps, agents, orchestration layers, and context servers that interact with foundation models in real time.

                    To support this shift, developers are adopting protocols like Model Context Protocol (MCP) and Agent2Agent (A2A) to standardize how components exchange tools, data, and decisions.

                    But infrastructure often falls behind, with challenges around authentication, rate limiting, data security, observability, and constant provider changes.

                    {{site.ai_gateway}} addresses these challenges with a high-performance control plane that secures, governs, and observes AI-native systems end to end.
                    Whether serving LLM traffic, exposing structured context via MCP, or coordinating agents through A2A, {{site.ai_gateway}} ensures scalable, secure, and reliable AI infrastructure.
          - type: text
            config: |
              [Sign up for {{site.konnect_short_name}}](https://konghq.com/products/kong-konnect/register?utm_medium=referral&utm_source=docs&utm_content=ai-gateway) to configure {{site.ai_gateway}} using {{site.konnect_short_name}}.

      - blocks:
          - type: image
            config:
              url: /assets/images/gateway/ai-gateway-overview.svg
              alt_text: Overview of AI gateway

  - header:
      type: h2
      text: "Get started with {{ site.ai_gateway }}"
    columns:
      - blocks:
        - type: tabs
          tab_group: run-ai-gateway
          config:
            - title: Quickstart
              content: |
                You can use the [quickstart script](https://get.konghq.com/ai) to get a demo instance of {{site.ai_gateway}} running almost instantly.

                This command requires a [Konnect Access Token](https://cloud.konghq.com/global/account/tokens).

                ```sh
                curl -Ls https://get.konghq.com/ai | bash -s -- -k $KONNECT_TOKEN
                ```

                The script creates an {{site.ai_gateway}} control plane in {{site.konnect_short_name}} and deploys a local data plane using Docker.

                All licensing is handled automatically by {{site.konnect_short_name}}.
            - title: Konnect UI
              content: |
                To set up {{site.ai_gateway}} using the {{site.konnect_short_name}} UI, sign in to your Konnect account at [cloud.konghq.com](https://cloud.konghq.com/),
                then navigate to **{{site.ai_gateway}}** and click **New {{site.ai_gateway}}**.
