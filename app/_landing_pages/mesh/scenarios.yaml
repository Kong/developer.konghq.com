metadata:
  title: "{{site.mesh_product_name}} scenarios"
  content_type: landing_page
  description: A curriculum-style set of scenarios for mastering {{site.mesh_product_name}}, from basic concepts to advanced multi-zone operations.
  products:
    - mesh
  works_on:
    - on-prem
    - konnect
  tags:
    - get-started
    - service-mesh
    - quickstart

rows:
  - header:
      type: h1
      text: "{{site.mesh_product_name}} scenarios"
      sub_text: Explore {{site.mesh_product_name}} capabilities by following the Kong Air modernization journey, from securing a first check-in API to operating a global, multi-cloud mesh with zero-trust security.

  - columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    Work through the scenarios in order, or jump to the phase that matches your goal. If you prefer a role-based view, see [Explore by role](#explore-by-role).

  - header:
      type: h2
      text: "Phase 1: Fundamentals"
      sub_text: "Build the foundation: understand the architecture, secure your first services, and master policy targeting."
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Introduction
              description: |
                High-level overview, and how these scenarios are organized.
              cta:
                text: Read
                url: /mesh/scenarios/introduction/
      - blocks:
          - type: card
            config:
              title: Architecture overview
              description: |
                The control plane and data plane, the Envoy proxy, and how they fit together.
              cta:
                text: Read
                url: /mesh/scenarios/architecture-overview/
      - blocks:
          - type: card
            config:
              title: Get started with your first policy
              description: |
                Workload identity with `MeshIdentity`, strict mTLS, and your first default-deny authorization.
              cta:
                text: Read
                url: /mesh/scenarios/get-started-with-your-first-policy/
      - blocks:
          - type: card
            config:
              title: Policy targeting and precedence
              description: |
                The `targetRef` system, `to`, `rules`, `default`, and policy precedence.
              cta:
                text: Read
                url: /mesh/scenarios/policy-targeting-and-precedence/
      - blocks:
          - type: card
            config:
              title: Resource scoping
              description: |
                Global CP and Zone CP ownership, and the Kubernetes system-namespace rule.
              cta:
                text: Read
                url: /mesh/scenarios/resource-scoping/
      - blocks:
          - type: card
            config:
              title: Split traffic with MeshService resources
              description: |
                Weighted v1/v2 rollouts using explicit `MeshService` resources.
              cta:
                text: Read
                url: /mesh/scenarios/split-traffic-with-meshservice-resources/
      - blocks:
          - type: card
            config:
              title: Target workloads and services
              description: |
                `Dataplane` label selectors and explicit `MeshService` targeting.
              cta:
                text: Read
                url: /mesh/scenarios/target-workloads-and-services/

  - header:
      type: h2
      text: "Phase 2: Observability and security"
      sub_text: See how Kong Air gains visibility into every flight-critical request and protects passenger data.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Observe mesh traffic in practice
              description: |
                Metrics, traces, logs, and the Grafana dashboards.
              cta:
                text: Read
                url: /mesh/scenarios/observe-mesh-traffic-in-practice/
      - blocks:
          - type: card
            config:
              title: Manage workload identity and mTLS
              description: |
                SPIFFE-based identity with `MeshIdentity` and `MeshTrust`.
              cta:
                text: Read
                url: /mesh/scenarios/manage-workload-identity-and-mtls/
      - blocks:
          - type: card
            config:
              title: Integrate an external CA
              description: |
                Root trust in Vault, cert-manager, or ACM Private CA.
              cta:
                text: Read
                url: /mesh/scenarios/integrate-an-external-ca/

  - header:
      type: h2
      text: "Phase 3: Global mesh operations"
      sub_text: Connect Kong Air's cloud regions and legacy data centers into a single mesh.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Multi-zone architecture
              description: |
                ZoneIngress, ZoneEgress, service federation, and Global/Zone CP sync.
              cta:
                text: Read
                url: /mesh/scenarios/multi-zone-architecture/
      - blocks:
          - type: card
            config:
              title: Configure mesh-scoped zone proxies
              description: |
                Per-mesh zone proxies via the Helm `meshes:` list (new in 2.14).
              cta:
                text: Read
                url: /mesh/scenarios/configure-mesh-scoped-zone-proxies/
      - blocks:
          - type: card
            config:
              title: Route across zones with canary rollouts and color rings
              description: |
                Weighted canary rollouts and permanent color rings across zones with `MeshMultiZoneService`.
              cta:
                text: Read
                url: /mesh/scenarios/route-across-zones-with-canary-rollouts-and-color-rings/

  - header:
      type: h2
      text: "Phase 4: Expert operations"
      sub_text: Advanced patterns for controlling the perimeter and integrating external dependencies.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Secure the perimeter with MeshPassthrough
              description: |
                Move to a default-deny posture for outbound traffic.
              cta:
                text: Read
                url: /mesh/scenarios/secure-the-perimeter-with-meshpassthrough/
      - blocks:
          - type: card
            config:
              title: Manage external services with MeshExternalService
              description: |
                Manage external APIs and databases as mesh citizens.
              cta:
                text: Read
                url: /mesh/scenarios/manage-external-services-with-meshexternalservice/
      - blocks:
          - type: card
            config:
              title: Validate resilience with fault injection
              description: |
                Proactively test mesh resilience with `MeshFaultInjection`.
              cta:
                text: Read
                url: /mesh/scenarios/validate-resilience-with-fault-injection/

  - header:
      type: h2
      text: Explore by role
      sub_text: Each persona guide maps the scenarios to what that team owns.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Developer
              description: |
                Routing, resilience, and observability for application teams.
              cta:
                text: View guide
                url: /mesh/scenarios/persona/developer/
      - blocks:
          - type: card
            config:
              title: Operator
              description: |
                Control plane, zone proxies, gateways, and observability-as-a-service.
              cta:
                text: View guide
                url: /mesh/scenarios/persona/operator/
      - blocks:
          - type: card
            config:
              title: Security architect
              description: |
                Zero-trust, workload identity, and egress control.
              cta:
                text: View guide
                url: /mesh/scenarios/persona/security/
