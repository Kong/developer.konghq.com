metadata:
  title: "{{site.mesh_product_name}} scenarios"
  content_type: landing_page
  description: Scenarios that teach {{site.mesh_product_name}} through the Kong Air story, from basic concepts to multi-zone operations and production readiness.
  products:
    - mesh
  works_on:
    - on-prem
    - konnect
  tags:
    - get-started
    - service-mesh
    - quickstart

rows:
  - header:
      type: h1
      text: "{{site.mesh_product_name}} scenarios"
      sub_text: Follow Kong Air as it adopts {{site.mesh_product_name}}. The scenarios start with securing a first check-in API and end with a zero-trust, multi-zone mesh ready for production.

  - columns:
      - blocks:
          - type: structured_text
            config:
              blocks:
                - type: text
                  text: |
                    Work through the scenarios in order, or start at the phase that matches your goal.
                    For a view by role, see [Explore by role](#explore-by-role).

  - header:
      type: h2
      text: "Phase 1: Fundamentals"
      sub_text: "Build the foundation: learn the architecture, secure your first services, and learn how policies select their targets."
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Introduction to Kong Air
              description: |
                Meet Kong Air, and see how the scenarios are organized.
              cta:
                text: Read
                url: /mesh/introduction-kong-air/
      - blocks:
          - type: card
            config:
              title: Architecture overview
              description: |
                Learn how the control plane, the data plane, and the Envoy proxy fit together.
              cta:
                text: Read
                url: /mesh/architecture-overview/
      - blocks:
          - type: card
            config:
              title: Install {{site.mesh_product_name}} and deploy Kong Air
              description: |
                Create the mesh, connect a Kubernetes zone, and deploy the Kong Air demo apps.
              cta:
                text: Read
                url: /mesh/install-kong-mesh-and-deploy-kong-air/
      - blocks:
          - type: card
            config:
              title: Create a security policy
              description: |
                Issue workload identities with `MeshIdentity` to turn on mTLS and default-deny, then allow the first call with `MeshTrafficPermission`.
              cta:
                text: Read
                url: /mesh/create-a-security-policy/
      - blocks:
          - type: card
            config:
              title: Policy targeting and precedence
              description: |
                Learn how Kong Air policies use `targetRef`, `to`, and `rules`, and which policy wins when several apply.
              cta:
                text: Read
                url: /mesh/policy-targeting-and-precedence/
      - blocks:
          - type: card
            config:
              title: Resource scoping
              description: |
                Learn which control plane owns each resource, and which Kubernetes namespace each resource lives in.
              cta:
                text: Read
                url: /mesh/resource-scoping/
      - blocks:
          - type: card
            config:
              title: Split traffic with MeshService resources
              description: |
                Shift traffic between v1 and v2 by weight with explicit `MeshService` resources.
              cta:
                text: Read
                url: /mesh/split-traffic-with-meshservice-resources/
      - blocks:
          - type: card
            config:
              title: Target workloads and services
              description: |
                Select proxies with `Dataplane` labels, and select destinations with explicit `MeshService` references.
              cta:
                text: Read
                url: /mesh/target-workloads-and-services/

  - header:
      type: h2
      text: "Phase 2: Observability and security"
      sub_text: Give Kong Air visibility into every flight-critical request, and protect passenger data.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Deploy an OpenTelemetry collector
              description: |
                Run the collector and the backends that receive metrics, traces, and logs.
              cta:
                text: Read
                url: /mesh/deploy-an-opentelemetry-collector/
      - blocks:
          - type: card
            config:
              title: Observe mesh traffic in practice
              description: |
                Collect metrics, traces, and logs, and read them in the Grafana dashboards.
              cta:
                text: Read
                url: /mesh/observe-mesh-traffic-in-practice/
      - blocks:
          - type: card
            config:
              title: Connect a second zone
              description: |
                Start a second Kubernetes cluster and connect it to the Kong Air global control plane as `zone2`.
              cta:
                text: Read
                url: /mesh/connect-a-second-zone/
      - blocks:
          - type: card
            config:
              title: Manage workload identity and mTLS
              description: |
                Issue SPIFFE workload identities with `MeshIdentity`, and publish trust with `MeshTrust`.
              cta:
                text: Read
                url: /mesh/manage-workload-identity-and-mtls/
      - blocks:
          - type: card
            config:
              title: Integrate an external CA
              description: |
                Root workload identities in your own CA, cert-manager, HashiCorp Vault, or AWS Private CA.
              cta:
                text: Read
                url: /mesh/integrate-an-external-ca/

  - header:
      type: h2
      text: "Phase 3: Global mesh operations"
      sub_text: Connect Kong Air's cloud regions and legacy data centers into one mesh.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Multi-zone architecture
              description: |
                Learn which control planes, zone proxies, and service resources carry traffic between zones.
              cta:
                text: Read
                url: /mesh/multi-zone-architecture/
      - blocks:
          - type: card
            config:
              title: Send traffic between zones
              description: |
                Call a service in another zone through its zone ingress, and allow the caller across zones.
              cta:
                text: Read
                url: /mesh/send-traffic-between-zones/

  - header:
      type: h2
      text: "Phase 4: Expert operations"
      sub_text: Control the mesh perimeter, and manage the dependencies that live outside the mesh.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Secure the perimeter with MeshPassthrough
              description: |
                Block outbound traffic to unknown destinations, then allow only the destinations you list.
              cta:
                text: Read
                url: /mesh/secure-the-perimeter-with-meshpassthrough/
      - blocks:
          - type: card
            config:
              title: Manage external services with MeshExternalService
              description: |
                Give external APIs and databases mesh hostnames, access control, and retries.
              cta:
                text: Read
                url: /mesh/manage-external-services-with-meshexternalservice/
      - blocks:
          - type: card
            config:
              title: Validate resilience with fault injection
              description: |
                Inject failures with `MeshFaultInjection` to test how Kong Air handles them.
              cta:
                text: Read
                url: /mesh/validate-resilience-with-fault-injection/

  - header:
      type: h2
      text: "Phase 5: Production readiness"
      sub_text: Harden the mesh, and limit the configuration each proxy receives before the mesh carries production traffic.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Prepare the mesh for production
              description: |
                Declare what each workload calls with `reachableBackends`, then turn on restricted outbound.
              cta:
                text: Read
                url: /mesh/prepare-the-mesh-for-production/
      - blocks:
          - type: card
            config:
              title: Production readiness checklist
              description: |
                Review the 3.0 defaults, and the control plane settings that shape configuration at scale.
              cta:
                text: Read
                url: /mesh/production-readiness-checklist/

  - header:
      type: h2
      text: Explore by role
      sub_text: Each role guide maps the scenarios to the work that team owns.
    column_count: 3
    columns:
      - blocks:
          - type: card
            config:
              title: Developer
              description: |
                Routing, resilience, and observability for application teams.
              cta:
                text: View guide
                url: /mesh/persona/developer/
      - blocks:
          - type: card
            config:
              title: Operator
              description: |
                Control plane, zone proxies, gateways, and shared observability for platform teams.
              cta:
                text: View guide
                url: /mesh/persona/operator/
      - blocks:
          - type: card
            config:
              title: Security architect
              description: |
                Zero-trust, workload identity, and egress control for security teams.
              cta:
                text: View guide
                url: /mesh/persona/security/
