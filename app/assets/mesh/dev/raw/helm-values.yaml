kuma:
  nameOverride: kong-mesh
  # The default registry and tag to use for all Kuma images
  global:
    image:
      registry: "docker.io/kong"
      tag:

  controlPlane:
    secrets: # {Env: "KMESH_LICENSE_INLINE", Secret: "kong-mesh-license", Key: "license"}
    image:
      repository: "kuma-cp"
    webhooks:
      validator:
        additionalRules: |
          - apiGroups:
              - kuma.io
            apiVersions:
              - v1alpha1
            operations:
              - CREATE
              - UPDATE
              - DELETE
            resources:
              - accessaudits
              - accessroles
              - accessrolebindings
      ownerReference:
        additionalRules: ""
    konnect:
      # -- Control Plane Id of the control-plane in Mesh Konnect
      cpId: ""
    defaults:
      adminRoleGroups:
      - mesh-system:authenticated
      - mesh-system:unauthenticated
      - system:authenticated
      - system:unauthenticated
  plugins:
    policies:
      meshopas: true
