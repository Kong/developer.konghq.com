kuma:
  nameOverride: kong-mesh
  # The default registry and tag to use for all Kuma images
  global:
    image:
      registry: "docker.io/kong"
      tag:

  controlPlane:
    secrets: # {Env: "KMESH_LICENSE_INLINE", Secret: "kong-mesh-license", Key: "license"}
    image:
      repository: "kuma-cp"
    webhooks:
      validator:
        additionalRules: |
          - apiGroups:
              - kuma.io
            apiVersions:
              - v1alpha1
            operations:
              - CREATE
              - UPDATE
              - DELETE
            resources:
              - accessaudits
              - accessroles
              - accessrolebindings
      ownerReference:
        additionalRules: ""
    konnect:
      # -- Control Plane Id of the control-plane in Mesh Konnect
      cpId: ""
    defaults:
      # -- Groups bound to the admin role. The two Kubernetes groups cover a
      # cluster administrator on either kubeadm generation and grant nothing
      # when `controlPlane.environment` is `universal`, where they can be
      # dropped. Distributions that put administrators in neither, such as GKE
      # and AKS with Entra ID, have to be named here
      adminRoleGroups:
      - mesh-system:authenticated
      - system:masters
      - kubeadm:cluster-admins
      # -- Identities bound to the admin role by name, for ServiceAccounts and
      # other subjects that no group usefully describes
      adminRoleUsers: []
  plugins:
    policies:
      meshopas: true
