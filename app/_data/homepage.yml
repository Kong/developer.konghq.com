title: Kong Developer
description: "Tools, APIs, and recipes to build, secure, and observe everything from a single API to fleets of AI agents. Ask, browse, or drop straight into the CLI."

hero:
  eyebrow: "Kong Developer · Documentation"
  title_italic: "accomplish?"
  chips:
    - "Publish an API to Dev Portal"
    - "Configure OIDC auth"
    - "Deploy with Kubernetes"
    - "Connect an AI model"
    - "Trace API requests"

agents_section:
  eyebrow: "01 · For agents & the CLI"
  title: "First-class tools for builders and agents."
  title_italic: "tools"
  cli_cards:
    - tool: decK
      icon: /assets/icons/terminal.svg
      description: "Manage Kong Gateway configuration as code. Diff, sync, dump, validate."
      install: "brew install kong/deck/deck"
      command: "deck gateway diff kong.yaml"
      docs_url: /deck/
    - tool: kongctl
      icon: /assets/icons/terminal.svg
      description: "Control Konnect from the terminal. Manage orgs, control planes, and plugins."
      install: "brew install --cask kong/kongctl/kongctl"
      command: "kongctl get control-planes"
      docs_url: /kongctl/
    - tool: Inso CLI
      icon: /assets/icons/terminal.svg
      description: "Run API tests, lint OpenAPI specs, and generate config — straight from CI."
      install: "npm install -g insomnia-inso"
      command: "inso lint spec petstore.yaml"
      docs_url: /inso-cli/
  featured_cards:
    - id: mcp
      title: "Konnect MCP server"
      description: "Give Claude, Cursor, and ChatGPT live, scoped access to your Konnect APIs, control planes, and analytics."
      endpoint: "https://mcp.konghq.com/sse"
      cta_text: "Connect Konnect MCP"
      cta_url: /konnect-platform/konnect-mcp/
      icon: /assets/icons/mcp.svg
      featured: true
    - id: skills
      title: "Skills Hub"
      snippet_label: "RUN IN CLAUDE"
      snippet_lines:
        - "/plugin marketplace add kong/ai-marketplace"
        - "/plugin install kong-konnect@ai-marketplace"
        - "/reload-plugins"
      description: "Copy-pasteable workflows for Konnect, AI Gateway, and decK — built on the Model Context Protocol. The fastest path is the three commands above, run inside Claude."
      cta_url: /skills/
      cta_text: "Browse all skills"
      icon: /assets/icons/brain.svg
    - id: cookbooks
      title: "AI Cookbooks"
      snippet_lines:
        - "model-based-routing/"
        - "claude-code-sso/"
        - "llm-cost-optimization/"
        - "secure-external-mcp-gateway/"
        - "..."
      description: "End-to-end recipes for agents on top of Kong AI Gateway and Konnect."
      cta_url: /cookbooks/
      cta_text: "Open cookbooks"
      icon: /assets/icons/book.svg

