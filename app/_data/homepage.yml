title: Kong Developer
description: "Tools, APIs, and guides to build, secure, and observe everything from a single API to an AI fleet."

hero:
  chips:
    - "Publish an API to Dev Portal"
    - "Configure OIDC auth"
    - "Deploy with Kubernetes"
    - "Connect an AI model"
    - "Trace API requests"

agents_section:
  cli_cards:
    - tool: decK
      icon: /assets/icons/terminal.svg
      description: "Manage Kong Gateway configuration as code. Diff, sync, validate, and more."
      install: "brew install kong/deck/deck"
      command: "deck gateway diff kong.yaml"
      docs_url: /deck/
    - tool: kongctl
      icon: /assets/icons/terminal.svg
      description: "Control Konnect resources from the terminal, declaratively or imperatively."
      install: "brew install --cask kong/kongctl/kongctl"
      command: "kongctl get control-planes"
      docs_url: /kongctl/
    - tool: Inso CLI
      icon: /assets/icons/terminal.svg
      description: "Run API tests, lint OpenAPI specs, and generate config, all straight from CI."
      install: "npm install -g insomnia-inso"
      command: "inso lint spec petstore.yaml"
      docs_url: /inso-cli/
  featured_cards:
    - id: mcp
      title: "Konnect MCP server"
      description: "Give Claude, Cursor, and ChatGPT scoped access to manage Konnect."
      endpoint: "https://mcp.konghq.com/sse"
      cta_text: "Build with Konnect MCP"
      cta_url: /konnect-platform/konnect-mcp/
      icon: /assets/icons/mcp.svg
      featured: true
    - id: skills
      title: "Skills Hub"
      snippet_label: "RUN IN CLAUDE"
      snippet_label_link:
        text: "View other providers &rarr;"
        url: /cookbooks/
      snippet_lines:
        - "/plugin marketplace add kong/ai-marketplace"
        - "/plugin install kong-konnect@ai-marketplace"
        - "/reload-plugins"
      description: "Everything in Konnect MCP, plus the context: debugging, Terraform/kongctl/decK authoring, and setup workflows."
      cta_url: /skills/
      cta_text: "Browse all skills"
      icon: /assets/icons/brain.svg
    - id: cookbooks
      title: "AI Cookbooks"
      ctas:
        - text: "Model-based routing"
          url: /cookbooks/model-based-routing/
        - text: "Claude Code SSO"
          url: /cookbooks/claude-code-sso/
        - text: "LLM cost optimization"
          url: /cookbooks/llm-cost-optimization/
        - text: "View all cookbooks"
          url: /cookbooks/
      description: "End-to-end recipes for agents on top of Kong AI Gateway."
      icon: /assets/icons/book.svg

