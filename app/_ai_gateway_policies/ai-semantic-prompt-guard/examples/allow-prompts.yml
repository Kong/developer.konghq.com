description: Only allow messages about a specific topic. For example, only allow messages about DevOps

extended_description: |
  Only allow messages about a specific topic. For example, only allow messages about DevOps.

  {:.info}
  > If you use the `text-embedding-ada-002` as an embedding model, you must set a fixed dimension of `1536`, as required by the official model specification. Alternatively, use the `text-embedding-3-small` model, which supports dynamic dimensions and works without specifying a fixed value.

title: 'Only allow messages about a specific topic'

weight: 900

requirements:
  - You have created an [AI Model](/ai-gateway/entities/ai-model/)
  - "A [Redis](https://redis.io/docs/latest/) instance."
  -  "Port `6379`, or your custom Redis port is open and reachable from {{site.ai_gateway}}."

variables:
  header_value:
    value: $OPENAI_API_KEY
    description: Your OpenAI API key
  redis_host:
    value: $REDIS_HOST
    description: The host where your Redis instance runs

name: allow-prompts
display_name: Only allow messages about a specific topic
type: ai-semantic-prompt-guard

config:
  embeddings:
    auth:
      header_name: Authorization
      header_value: Bearer ${header_value}
    model:
      name: text-embedding-3-small
      provider: openai
  search:
    threshold: 0.7
  vectordb:
    strategy: redis
    distance_metric: cosine
    threshold: 0.5
    dimensions: 1024
    redis:
      host: ${redis_host}
      port: 6379
  rules:
    match_all_conversation_history: true
    allow_prompts:
      - Network troubleshooting and diagnostics
      - Cloud infrastructure management (AWS, Azure, GCP)
      - Cybersecurity best practices and incident response
      - DevOps workflows and automation
      - Programming concepts and language usage
      - IT policy and compliance guidance
      - Software development lifecycle and CI/CD
      - Documentation writing and technical explanation
      - System administration and configuration
      - Productivity and collaboration tools usage

tools:
  - konnect-api
  - terraform
  - kongctl
