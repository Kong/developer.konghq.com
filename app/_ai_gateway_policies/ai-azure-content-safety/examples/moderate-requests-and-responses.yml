description: |
  Configure the AI Azure Content Safety policy to check requests and responses, and block content matching harm categories defined by Azure.

extended_description: |
  Configure the policy to block request and response content matching the `Hate` and `Violence` categories [defined by Azure](https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories?tabs=warning).

title: Block request and response content in predefined categories

weight: 900

requirements:
  - You have an Azure subscription and access to Azure AI Content Safety.
  - You have created an [AI Model](/ai-gateway/entities/ai-model/)

variables:
  content_safety_url:
    value: $CONTENT_SAFETY_URL
    description: The full URL of the Azure AI Content Safety instance.
  content_safety_key:
    value: $CONTENT_SAFETY_KEY
    description: The API key to access the Azure AI Content Safety instance.
  

name: moderate-requests-and-responses
display_name: Block request and response content in predefined categories
type: ai-azure-content-safety

config: 
  content_safety_url: ${content_safety_url}
  content_safety_key: ${content_safety_key}
  categories:
  - name: Hate
    rejection_level: 2
  - name: Violence
    rejection_level: 2
  guarding_mode: BOTH

tools:
  - konnect-api
  - terraform
  - kongctl
