description: |
  Configure the AI Azure Content Safety policy to authenticate to Azure with a managed identity instead of an API key.

title: Authenticate with an Azure managed identity

weight: 860

requirements:
  - You have an Azure subscription and access to Azure AI Content Safety.
  - You have created an [AI Model](/ai-gateway/entities/ai-model/)
  - The data plane runs with an Azure managed identity that has access to Azure AI Content Safety.

# variables:
#   content_safety_url:
#     value: $CONTENT_SAFETY_URL
#     description: The full URL of the Azure AI Content Safety instance.
#   azure_client_id:
#     value: $AZURE_CLIENT_ID
#     description: (Optional) The client ID of the user-assigned managed identity.

name: authenticate-with-a-managed-identity
display_name: Authenticate with an Azure managed identity
type: ai-azure-content-safety

config:
  content_safety_url: ${content_safety_url}
  azure_use_managed_identity: true
  azure_client_id: ${azure_client_id}
  categories:
    - name: Hate
      rejection_level: 2

tools:
  - konnect-api
  - terraform
  - kongctl
