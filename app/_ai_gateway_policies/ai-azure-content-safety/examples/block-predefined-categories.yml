description: |
  Configure the AI Azure Content Safety policy to check requests and block content matching harm categories defined by Azure.

extended_description: |
  Configure the policy to block request content matching the `Hate` and `Violence` categories [defined by Azure](https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories?tabs=warning).
  
  The policy only reviews content in requests by default. To change this, adjust the [`guarding_mode`](/ai-gateway/policies/ai-azure-content-safety/reference/#schema--config-guarding-mode) parameter.

title: Block request content in predefined categories

weight: 900

requirements:
  - You have an Azure subscription and access to Azure AI Content Safety.
  - You have created an [AI Model](/ai-gateway/entities/ai-model/)

variables:
  content_safety_url:
    value: $CONTENT_SAFETY_URL
    description: The full URL of the Azure AI Content Safety instance.
  content_safety_key:
    value: $CONTENT_SAFETY_KEY
    description: The API key to access the Azure AI Content Safety instance.
  

name: block-predefined-categories
display_name: Block request content in predefined categories
type: ai-azure-content-safety

config: 
  content_safety_url: ${content_safety_url}
  content_safety_key: ${content_safety_key}
  categories:
  - name: Hate
    rejection_level: 2
  - name: Violence
    rejection_level: 2

tools:
  - konnect-api
  - terraform
  - kongctl
