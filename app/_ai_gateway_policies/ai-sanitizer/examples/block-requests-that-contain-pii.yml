description: |
  Configure the AI Sanitizer policy to block requests that contain the PII categories you list, instead of anonymizing them.

title: Block requests that contain PII

weight: 890

requirements:
  - An existing [AI Model](/ai-gateway/entities/ai-model/).
  - An [AI PII Anonymizer service image](/ai-gateway/policies/ai-sanitizer/#ai-pii-anonymizer-service), pulled and running.

variables:
  host:
    description: The sanitizer service's host
    value: $SANITIZER_SERVICE_HOST

name: block-requests-that-contain-pii
display_name: Block requests that contain PII
type: ai-sanitizer

config:
  anonymize:
      - phone
  port: 8080
  host: ${host}
  redact_type: synthetic
  stop_on_error: true
  recover_redacted: false
  block_if_detected: true

tools:
  - konnect-api
  - terraform
  - kongctl
