description: Configure the policy to anonymize all standard PII types and a custom pattern for AWS API keys in requests.

title: Apply full PII coverage with custom API key detection

weight: 930

requirements:
  - You have created an [AI Model](/ai-gateway/entities/ai-model/)
  - You have pulled and run an [AI PII Anonymizer service image](/ai-gateway/policies/ai-sanitizer/#ai-pii-anonymizer-service)

variables:
  host:
    description: The sanitizer service's host
    value: $SANITIZER_SERVICE_HOST

name: custom-pattern-all-pii
display_name: Apply full PII coverage with custom API key detection
type: ai-sanitizer

config:
  anonymize:
      - all
      - custom
  custom_patterns:
      - name: api_key
        regex: "AKIA[0-9A-Z]{16}"
        score: 0.95
  port: 8080
  host: ${host}
  redact_type: synthetic
  stop_on_error: true
  recover_redacted: false

tools:
  - konnect-api
  - terraform
  - kongctl
