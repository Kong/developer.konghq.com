description: Configure the policy to anonymize requests using a custom regex pattern for GitHub personal access tokens.

title: Anonymize requests with a GitHub token pattern

weight: 920

requirements:
  - You have created an [AI Model](/ai-gateway/entities/ai-model/)
  - You have pulled and run an [AI PII Anonymizer service image](/ai-gateway/policies/ai-sanitizer/#ai-pii-anonymizer-service)

# variables:
#   host:
#     description: The sanitizer service's host
#     value: $SANITIZER_SERVICE_HOST

name: custom-regex-sanitizer
display_name: Anonymize requests with a GitHub token pattern
type: ai-sanitizer

config:
  anonymize:
      - custom
  custom_patterns:
      - name: github_token
        regex: "ghp_[A-Za-z0-9]{36}"
        score: 0.9
  port: 8080
  host: ${host}
  redact_type: synthetic
  stop_on_error: true
  recover_redacted: false

tools:
  - konnect-api
  - terraform
  - kongctl
