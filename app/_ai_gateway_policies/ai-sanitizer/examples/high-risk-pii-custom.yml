description: Configure the policy to anonymize high-risk PII categories (email, phone, SSN, and credit cards) along with custom patterns for sensitive tokens.

title: Anonymize high-risk PII categories with custom patterns

weight: 940

requirements:
  - An existing [AI Model](/ai-gateway/entities/ai-model/).
  - You have pulled and run an [AI PII Anonymizer service image](/ai-gateway/policies/ai-sanitizer/#ai-pii-anonymizer-service).

variables:
  host:
    description: The sanitizer service's host
    value: $SANITIZER_SERVICE_HOST

name: high-risk-pii-custom
display_name: Anonymize high-risk PII categories with custom patterns
type: ai-sanitizer

config:
  anonymize:
      - email
      - phone
      - ssn
      - creditcard
      - custom
  custom_patterns:
      - name: aws_api_key
        regex: "AKIA[0-9A-Z]{16}"
        score: 0.95
      - name: github_token
        regex: "ghp_[A-Za-z0-9]{36}"
        score: 0.9
      - name: jwt_token
        regex: 'eyJ[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+'
        score: 0.85
  port: 8080
  host: ${host}
  redact_type: placeholder
  stop_on_error: true
  recover_redacted: false

tools:
  - konnect-api
  - terraform
  - kongctl
