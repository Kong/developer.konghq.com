title: Sanitize PII
description: Sanitize PII from model responses.
weight: 100
name: pii-sanitizer
display_name: PII Sanitizer
type: ai-sanitizer
condition: 'model.name == "gpt-4o"'
config:
  anonymize:
    - email
    - phone
  rejection_mode: verbose
  block_if_detected: true
  stop_on_error: true
  port: 8080
  timeout: 10000
tools:
  - konnect-api
  - terraform
  - kongctl
