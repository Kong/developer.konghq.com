description: Reject requests from Kong Identity principals that no access rule allows.
extended_description: |
  Reject requests from Kong Identity principals that no access rule allows.
  The Policy rejects a request when no allow rule matches the principal's group, the principal itself, or the whole organization.
  Create the allow rules before you add the Policy, because a principal with no rules is rejected.

title: 'Enforce model access for Kong Identity principals'

weight: 900

name: enforce-model-access
display_name: Enforce model access for Kong Identity principals
type: access-policy-engine

requirements:
  - "[AI Auth Strategy](/ai-gateway/entities/ai-auth-strategy/#principal-mapping) with principal mapping enabled"
  - At least one allow access rule

config: {}

tools:
  - konnect-api
  - terraform
  - kongctl
