description: Return a message to clients when an access rule blocks a model.
extended_description: |
  Return a message to clients when an access rule blocks a model.
  The Policy sends this response whenever it rejects a request, instead of the default 403 response with the body {"message":"Forbidden"}.

title: 'Show clients a message when a model is blocked'

weight: 800

name: custom-denial-message
display_name: Show clients a message when a model is blocked
type: access-policy-engine

requirements:
  - "[AI Auth Strategy](/ai-gateway/entities/ai-auth-strategy/#principal-mapping) with principal mapping enabled"

config:
  status_code: 403
  content_type: application/json
  body: '{"message":"Your group does not have access to this model. Contact your administrator to request access."}'

tools:
  - konnect-api
  - terraform
  - kongctl
