description: Enforce access rules on MCP tool calls from Kong Identity principals.
extended_description: |
  Enforce access rules on MCP tool calls from Kong Identity principals.
  MCP enforcement is off by default, so MCP requests pass without being checked against access rules.
  When MCP enforcement is enabled, a principal needs an allow rule for each tool that it calls.

title: 'Control which MCP tools principals can call'

weight: 700

name: control-mcp-tools
display_name: Control which MCP tools principals can call
type: access-policy-engine

requirements:
  - "[AI MCP Server](/ai-gateway/entities/ai-mcp-server/)"
  - "[AI Auth Strategy](/ai-gateway/entities/ai-auth-strategy/#principal-mapping) with principal mapping enabled"

config:
  enforce_mcp: true

tools:
  - konnect-api
  - terraform
  - kongctl
