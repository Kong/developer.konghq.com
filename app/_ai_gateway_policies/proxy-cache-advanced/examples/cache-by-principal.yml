name: cache-by-principal
display_name: Cache by principal
type: proxy-cache-advanced
title: 'Cache by principal'
description: 'Cache responses to GET requests using the authenticated principal to compose the cache key.'
extended_description: 'Cache responses to GET requests using the authenticated [principal](/identity/principals/) to compose the cache key.'
weight: 900

config:
  response_code:
    - 200
  request_method:
    - GET
  content_type:
    - text/plain
    - application/json
  cache_ttl: 300
  cache_by_principal: true
  strategy: memory

tools:
  - konnect-api
  - terraform
  - kongctl
