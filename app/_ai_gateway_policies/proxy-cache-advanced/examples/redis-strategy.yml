name: cache-get-responses-redis
display_name: Cache GET responses in Redis
type: proxy-cache-advanced
title: 'Cache responses with Redis'
description: 'Cache responses to GET requests with a 200 response code in Redis.'
extended_description: |
  Cache responses to GET requests with a 200 response code in Redis.
  The `keepalive_pool_size` setting keeps a maximum of 50 concurrent connections open.
weight: 900

config:
  response_code:
    - 200
  request_method:
    - GET
  content_type:
    - text/plain
    - application/json
  cache_ttl: 300
  strategy: redis
  redis:
    host: redis.example.com
    port: 6379
    keepalive_pool_size: 50

tools:
  - konnect-api
  - terraform
  - kongctl
