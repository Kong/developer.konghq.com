description: 'Configure the AI Prompt Compressor policy'

title: 'Configure the AI Prompt Compressor policy'

weight: 900

name: prompt-compressor
display_name: Configure the AI Prompt Compressor policy
type: ai-prompt-compressor

config:
  compressor_type: rate
  compressor_url: http://compress-service:8080
  keepalive_timeout: 60000
  log_text_data: false
  stop_on_error: true
  timeout: 10000
  compression_ranges:
    - min_tokens: 20
      max_tokens: 100
      value: 0.8
    - min_tokens: 100
      max_tokens: 1000000
      value: 0.3

tools:
  - konnect-api
  - terraform
  - kongctl
