title: 'SQL injection'

description: 'Detects injection of a SQL query that uses input data from the client to the application.'

weight: 900

name: sql
display_name: 'SQL injection'
type: injection-protection

config:
  injection_types:
    - sql
  locations:
    - path_and_query
  enforcement_mode: block
  error_status_code: 400
  error_message: Bad Request

scopes:
  - global
  - ai-model
  - ai-agent
  - ai-mcp-server

tools:
  - konnect-api
  - terraform
  - kongctl
