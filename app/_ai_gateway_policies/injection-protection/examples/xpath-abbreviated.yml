title: 'XPath abbreviated injection'

description: 'Detects intentionally malformed input that is sent to construct an XPath query for XML data, specifically in abbreviated syntax.'
extended_description: |
  Detects intentionally malformed input that is sent to construct an XPath query for XML data, specifically in abbreviated syntax.
  Uses the following regular expression for matching: `(/(@?[\w_?\w:\*]+(\[[^]]+\])*)?)+`

weight: 900

name: xpath-abbreviated
display_name: 'XPath abbreviated injection'
type: injection-protection

config:
  injection_types:
    - xpath_abbreviated
  locations:
    - path_and_query
  enforcement_mode: block
  error_status_code: 400
  error_message: Bad Request

scopes:
  - global
  - ai-model
  - ai-agent
  - ai-mcp-server

tools:
  - konnect-api
  - terraform
  - kongctl
