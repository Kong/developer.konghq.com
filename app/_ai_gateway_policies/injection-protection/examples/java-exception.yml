title: 'Java exception injection'

description: 'Detects denial-of-service (DoS) attacks that match Java exception messages.'
extended_description: |
  Detects denial-of-service (DoS) attacks that match Java exception messages.
  Uses the following regular expression for matching: `.*?Exception in thread.*`

weight: 900

name: java-exception
display_name: 'Java exception injection'
type: injection-protection

config:
  injection_types:
    - java_exception
  locations:
    - path_and_query
  enforcement_mode: block
  error_status_code: 400
  error_message: Bad Request

scopes:
  - global
  - ai-model
  - ai-agent
  - ai-mcp-server

tools:
  - konnect-api
  - terraform
  - kongctl
