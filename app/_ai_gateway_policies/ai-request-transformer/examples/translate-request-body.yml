description: |
  Configure the AI Request Transformer policy to use OpenAI GPT-4 to translate the client request to a different language. 
  In this example, we'll translate the client's question to French.

title: Translate a request body

weight: 900

requirements:
  - You have an OpenAI subscription.

# variables:
#   openai_key:
#     value: $OPENAI_API_KEY
#     description: An API key to connect to the OpenAI API.

name: translate-request-body
display_name: Translate a request body
type: ai-request-transformer

config:
  prompt: You are a translator. Translate the question to French.
  llm:
    route_type: llm/v1/chat
    auth:
      header_name: Authorization
      header_value: Bearer ${openai_key}
    model:
      provider: openai
      name: gpt-4

tools:
  - konnect-api
  - terraform
  - kongctl
