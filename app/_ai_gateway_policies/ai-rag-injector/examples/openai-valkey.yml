description: Configure the AI RAG Injector policy to use Valkey as a vector database and the OpenAI text-embedding-3-large model for embedding.

extended_description: |
  Configure the AI RAG Injector policy to use Valkey as a vector database and the OpenAI text-embedding-3-large model for embedding.

  Valkey is automatically detected when using the `redis` vectordb strategy. {{site.ai_gateway}} queries the server and uses the Valkey-specific driver when it detects a Valkey backend.

  {:.info}
  > This example uses `text-embedding-3-large`, which supports up to `3072` dimensions. If you use `text-embedding-ada-002` instead, you must set `dimensions` to exactly `1536`.

title: RAG injection with OpenAI and Valkey

weight: 899

requirements:
  - You have created an [AI Model](/ai-gateway/entities/ai-model/)
  - You have an OpenAI account
  - "A [Valkey](https://valkey.io/) 8.x instance."
  - "Port `6379`, or your custom Valkey port is open and reachable from {{site.ai_gateway}}."

# variables:
#   key:
#     value: $OPENAI_API_KEY
#     description: The API key to use to connect to OpenAI.
#   valkey:
#     value: $VALKEY_HOST
#     description: The Valkey server's host

name: rag-injector-openai-valkey
display_name: RAG injection with OpenAI and Valkey
type: ai-rag-injector

config:
  inject_template: |
    Only use the following information surrounded by <RAG></RAG> and your existing knowledge to provide the best possible answer to the user.
    <RAG><CONTEXT></RAG>
    User's question: <PROMPT>
  embeddings:
    auth:
      header_name: Authorization
      header_value: Bearer ${key}
    model:
      provider: openai
      name: text-embedding-3-large
  vectordb:
    strategy: redis
    redis:
      host: ${valkey}
      port: 6379
    distance_metric: cosine
    dimensions: 3072

tools:
  - konnect-api
  - terraform
  - kongctl
