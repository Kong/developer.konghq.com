description:  Configure the AI Response Transformer policy to use OpenAI GPT-4 to add a header to the response before returning it to the client.

title: Add a header to a response body

weight: 900

requirements:
  - You have an OpenAI subscription.

# variables:
#   openai_key:
#     value: $OPENAI_API_KEY
#     description: An API key to connect to the OpenAI API.

name: add-header-to-response-body
display_name: Add a header to a response body
type: ai-response-transformer

config:
  prompt: |
    Add a new header named "new-header" with the value "header-value" to the response. Format the JSON response as follows:
    {
      "headers":
        {
          "new-header": "header-value"
        },
      "status": 201,
      "body": "new response body"
    }
  transformation_extract_pattern: '{((.|\n)*)}'
  parse_llm_response_json_instructions: true
  llm:
    route_type: llm/v1/chat
    auth:
      header_name: Authorization
      header_value: Bearer ${openai_key}
    model:
      provider: openai
      name: gpt-4

tools:
  - konnect-api
  - terraform
  - kongctl
