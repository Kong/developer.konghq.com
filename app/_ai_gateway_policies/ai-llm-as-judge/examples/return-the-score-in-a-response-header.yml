description: |
  Configure the AI LLM as Judge policy to return the score it assigns in a response header.
  Clients and downstream policies can read the score from the header without parsing the response body.

title: Return the judge score in a response header

weight: 890

requirements:
  - A working OpenAI API key.
  - An existing [AI Model](/ai-gateway/entities/ai-model/).

variables:
  openai_api_key:
    description: Your OpenAI API key
    value: $OPENAI_API_KEY

name: llm-as-judge-score-header
display_name: Return the judge score in a response header
type: ai-llm-as-judge

config:
  prompt: |
    You are a strict evaluator. You will be given a request and a response.
    Your task is to judge whether the response is correct or incorrect. You must
    assign a score between 1 and 100, where: 100 represents a completely correct
    and ideal response, 1 represents a completely incorrect or irrelevant response.
    Your score must be a single number only — no text, labels, or explanations.
    Use the full range of values (e.g., 13, 47, 86), not just round numbers like
    10, 50, or 100. Be accurate and consistent, as this score will be used by another
    model for learning and evaluation.
  http_timeout: 60000
  https_verify: true
  ignore_assistant_prompts: true
  ignore_system_prompts: true
  ignore_tool_prompts: true
  sampling_rate: 1
  llm:
    auth:
      allow_override: false
      header_name: Authorization
      header_value: Bearer ${openai_api_key}
    logging:
      log_payloads: true
      log_statistics: true
    model:
      name: gpt-4o
      provider: openai
      options:
        temperature: 2
        max_tokens: 5
        top_p: 1
        cohere:
          embedding_input_type: classification
    route_type: llm/v1/chat
  message_countback: 3
  inject_score_header: true
  score_header_name: X-Judge-Score

tools:
  - konnect-api
  - terraform
  - kongctl
