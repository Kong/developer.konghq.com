description: |
  Configure the AI AWS Guardrails policy to log the raw content of blocked requests and responses.
  When a request or response is blocked, the original prompt or response body is captured in the
  log entry under `ai.proxy.aws-guardrails.input_faulty_prompt` and
  `ai.proxy.aws-guardrails.output_faulty_response`.

title: Log blocked request and response content

weight: 800

requirements:
  - An AWS Bedrock Guardrails policy and access to the AWS Bedrock Guardrails service.
  - An existing [AI Model](/ai-gateway/entities/ai-model/).
  - An existing logging policy such as [HTTP Log](/ai-gateway/policies/http-log/) or [File Log](/ai-gateway/policies/file-log/).

variables:
  guardrails_id:
    description: The guardrail identifier to apply.
    value: $GUARDRAILS_ID
  guardrails_version:
    description: The guardrail version to apply.
    value: $GUARDRAILS_VERSION
  aws_region:
    description: The AWS region where the guardrail is deployed.
    value: $AWS_REGION
  aws_access_key_id:
    description: The AWS access key ID used to authenticate the request.
    value: $AWS_ACCESS_KEY_ID
  aws_secret_access_key:
    description: The AWS secret access key used to authenticate the request.
    value: $AWS_SECRET_ACCESS_KEY

name: aws-guardrails-log-blocked-content
display_name: Log blocked request and response content
type: ai-aws-guardrails

config:
  guardrails_id: ${guardrails_id}
  guardrails_version: ${guardrails_version}
  aws_region: ${aws_region}
  aws_access_key_id: ${aws_access_key_id}
  aws_secret_access_key: ${aws_secret_access_key}
  log_blocked_content: true

tools:
  - konnect-api
  - terraform
  - kongctl
