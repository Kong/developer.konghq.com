name: schema-registry
display_name: Confluent Schema Registry
type: confluent-consume

title: 'Confluent Schema Registry'

description: 'Use the Confluent Schema Registry for message deserialization.'

weight: 900

scopes:
  - ai-model
  - ai-agent
  - ai-mcp-server
  - ai-consumer

requirements:
  - A [Kafka cluster](https://docs.confluent.io/cloud/current/get-started/index.html#step-1-create-a-ak-cluster-in-ccloud) in Confluent Cloud.
  - A [Kafka topic](https://docs.confluent.io/cloud/current/get-started/index.html#step-2-create-a-ak-topic) in the cluster.
  - An API key and secret for the cluster.
  - A [Schema Registry](https://docs.confluent.io/platform/current/schema-registry/index.html).

variables:
  host:
    value: $BOOTSTRAP_SERVER_HOST
    description: The bootstrap server host.
  key:
    value: $API_KEY
    description: The API key to use for authentication.
  secret:
    value: $API_SECRET
    description: The API secret to use for authentication.
  topic:
    value: $KAFKA_TOPIC
    description: The name of the Kafka topic to consume from.
  registry_url:
    value: $REGISTRY_URL
    description: The URL of your Confluent Schema Registry instance. For example, `http://schema-registry:8081`.

config:
  bootstrap_servers:
    - host: ${host}
      port: 9092
  topics:
    - name: ${topic}
  mode: http-get
  cluster_api_key: ${key}
  cluster_api_secret: ${secret}
  schema_registry:
    confluent:
      url: ${registry_url}
      authentication:
        mode: basic
        basic:
          username: user
          password: password

tools:
  - konnect-api
  - terraform
  - kongctl
