name: choose-message-fields
display_name: Publish the request method and path
type: confluent

title: 'Publish the request method and path'

description: 'Publish the HTTP method and path of each request instead of its body.'

extended_description: |
  Publish the HTTP method and path of each request without the request body.
  Use this to record that a request happened without copying prompts to the topic.

  At least one of `forward_body`, `forward_headers`, `forward_method`, and `forward_uri` must be `true`.

weight: 800

scopes:
  - ai-model
  - ai-agent
  - ai-mcp-server
  - ai-consumer

requirements:
  - A [Kafka cluster](https://docs.confluent.io/cloud/current/get-started/index.html#step-1-create-a-ak-cluster-in-ccloud) in Confluent Cloud.
  - A [Kafka topic](https://docs.confluent.io/cloud/current/get-started/index.html#step-2-create-a-ak-topic) in the cluster.

variables:
  host:
    value: $BOOTSTRAP_SERVER_HOST
    description: The bootstrap server host.
  key:
    value: $API_KEY
    description: The API key to use for authentication.
  secret:
    value: $API_SECRET
    description: The API secret to use for authentication.
  topic:
    value: $KAFKA_TOPIC
    description: The name of the Kafka topic to publish to.

config:
  bootstrap_servers:
    - host: ${host}
      port: 9092
  topic: ${topic}
  cluster_api_key: ${key}
  cluster_api_secret: ${secret}
  forward_body: false
  forward_method: true
  forward_uri: true

tools:
  - konnect-api
  - terraform
  - kongctl
