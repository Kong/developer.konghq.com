name: publish-requests
display_name: Publish requests to Confluent Cloud
type: confluent

title: 'Publish requests to a Confluent Cloud topic'

description: 'Publish the body of each request to a Confluent Cloud topic.'

extended_description: |
  Publish each request that reaches an AI Model, AI Agent, or AI MCP Server to a Confluent Cloud topic.
  The Policy sends the raw request body in `body` and the parsed body in `body_args`, then answers the caller with `message sent` without calling the upstream.

weight: 900

scopes:
  - ai-model
  - ai-agent
  - ai-mcp-server
  - ai-consumer

requirements:
  - A [Kafka cluster](https://docs.confluent.io/cloud/current/get-started/index.html#step-1-create-a-ak-cluster-in-ccloud) in Confluent Cloud.
  - A [Kafka topic](https://docs.confluent.io/cloud/current/get-started/index.html#step-2-create-a-ak-topic) in the cluster.

variables:
  host:
    value: $BOOTSTRAP_SERVER_HOST
    description: The bootstrap server host.
  key:
    value: $API_KEY
    description: The API key to use for authentication.
  secret:
    value: $API_SECRET
    description: The API secret to use for authentication.
  topic:
    value: $KAFKA_TOPIC
    description: The name of the Kafka topic to publish to.

config:
  bootstrap_servers:
    - host: ${host}
      port: 9092
  topic: ${topic}
  cluster_api_key: ${key}
  cluster_api_secret: ${secret}

tools:
  - konnect-api
  - terraform
  - kongctl
