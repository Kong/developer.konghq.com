name: key-and-topic-from-query
display_name: Set the key and topic from query parameters
type: confluent

title: 'Set the message key and topic from query parameters'

description: 'Let callers choose the message key and the topic with query parameters, limited to an allowed list of topics.'

extended_description: |
  Let callers choose the message key with the `k` query parameter and the topic with the `t` query parameter.
  For example, the path `/chat/completions?k=order-42&t=orders` publishes a message with the key `order-42` to the `orders` topic.

  A request for a topic that isn't in `allowed_topics` receives a `403` response, and the Policy doesn't publish the message.

weight: 700

scopes:
  - ai-model
  - ai-agent
  - ai-mcp-server
  - ai-consumer

requirements:
  - A [Kafka cluster](https://docs.confluent.io/cloud/current/get-started/index.html#step-1-create-a-ak-cluster-in-ccloud) in Confluent Cloud.
  - A [Kafka topic](https://docs.confluent.io/cloud/current/get-started/index.html#step-2-create-a-ak-topic) in the cluster.
  - A Kafka topic named `orders` in the cluster.

variables:
  host:
    value: $BOOTSTRAP_SERVER_HOST
    description: The bootstrap server host.
  key:
    value: $API_KEY
    description: The API key to use for authentication.
  secret:
    value: $API_SECRET
    description: The API secret to use for authentication.
  topic:
    value: $KAFKA_TOPIC
    description: The name of the Kafka topic to publish to.

config:
  bootstrap_servers:
    - host: ${host}
      port: 9092
  topic: ${topic}
  cluster_api_key: ${key}
  cluster_api_secret: ${secret}
  key_query_arg: k
  topics_query_arg: t
  allowed_topics:
    - ${topic}
    - orders

tools:
  - konnect-api
  - terraform
  - kongctl
