description: 'Validate that incoming requests are Standard Webhooks signed with a shared secret.'

extended_description: |
  Validate that incoming requests are Standard Webhooks signed with a shared secret.
  The policy rejects requests that have a missing or invalid signature, or a timestamp older than `tolerance_second`, which defaults to 300 seconds.

title: 'Validate webhook'

weight: 900

requirements:
  - A secret that you also configure on the webhook sender.

variables:
  secret_v1:
    value: $WEBHOOK_SECRET_KEY
    description: The secret shared with the webhook sender.

scopes:
  - ai-agent
  - ai-mcp-server
  - ai-consumer-group
  - global

name: validate-webhook
display_name: Validate webhook
type: standard-webhooks

config:
  secret_v1: ${secret_v1}

tools:
  - konnect-api
  - terraform
  - kongctl
