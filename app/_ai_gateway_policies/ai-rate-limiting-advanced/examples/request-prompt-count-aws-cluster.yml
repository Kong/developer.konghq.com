title: Request prompt function with AWS ElastiCache cluster auth
description: Rate limit requests based on a custom token with AWS ElastiCache cluster auth
extended_description: |
  Protect your LLM services with rate limiting and AWS ElastiCache cluster auth.
  The AI Rate Limiting Advanced Policy analyzes query costs and token responses to provide an enterprise-grade rate limiting strategy.

  The following example uses request prompt rate limiting, which lets you rate limit requests based on a custom token.
weight: 900
name: request-prompt-count-aws-cluster
display_name: Request prompt function with AWS ElastiCache cluster auth
type: ai-rate-limiting-advanced
requirements:
- An existing [AI Model](/ai-gateway/entities/ai-model/).
- A running Redis instance on an [AWS ElastiCache cluster](https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/auth-iam.html) for Valkey 7.2 or later or ElastiCache for Redis OSS version 7.0 or later.
- Port `6379`, or your custom Redis port, is open and reachable from {{site.ai_gateway}}.
- The [ElastiCache user needs to set "Authentication mode" to "IAM"](https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/auth-iam.html#auth-iam-setup).
- |
  The following policy assigned to the IAM user/IAM role that is used to connect to the ElastiCache:
  ```json
  {
      "Version": "2012-10-17",
      "Statement": [
          {
              "Effect": "Allow",
              "Action": [
                  "elasticache:Connect"
              ],
              "Resource": [
                  "arn:aws:elasticache:ARN_OF_THE_ELASTICACHE",
                  "arn:aws:elasticache:ARN_OF_THE_ELASTICACHE_USER"
              ]
          }
      ]
  }
  ```
variables:
  cluster_address:
    value: $CLUSTER_ADDRESS
    description: The ElastiCache cluster address.
  cluster_username:
    value: $CLUSTER_USERNAME
    description: The ElastiCache username with [IAM Auth mode configured](https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/auth-iam.html#auth-iam-setup).
  aws_cache:
    value: $AWS_CACHE_NAME
    description: Name of your AWS ElastiCache instance.
  aws_region:
    value: $AWS_REGION
    description: Your AWS ElastiCache instance region.
  aws_key_id:
    value: $AWS_ACCESS_KEY_ID
    description: (Optional) Your AWS access key ID.
  aws_secret_key:
    value: $AWS_ACCESS_SECRET_KEY
    description: (Optional) Your AWS secret access key.
config:
  strategy: redis
  redis:
    cluster_nodes:
    - ip: ${cluster_address}
      port: 6379
    username: ${cluster_username}
    port: 6379
    cloud_authentication:
      auth_provider: aws
      aws_cache_name: ${aws_cache}
      aws_is_serverless: false
      aws_region: ${aws_region}
      aws_access_key_id: ${aws_key_id}
      aws_secret_access_key: ${aws_secret_key}
  sync_rate: 0
  policies:
  - match:
    - type: provider
      partition_by: true
      values:
      - cohere
    limits:
    - limit: 100
      window_size: 60
    - limit: 1000
      window_size: 3600
  request_prompt_count_function: |
    local header_count = tonumber(kong.request.get_header("x-prompt-count"))
    if header_count then
      return header_count
    end
    return 0
tools:
- konnect-api
- terraform
- kongctl
