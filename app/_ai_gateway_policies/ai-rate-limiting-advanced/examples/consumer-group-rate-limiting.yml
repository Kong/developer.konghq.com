title: Enable AI Consumer Group rate limiting
description: Protect your LLM services with AI Consumer Group rate limiting.
extended_description: |
  Protect your LLM services with AI Consumer Group rate limiting.
  The AI Rate Limiting Advanced Policy analyzes query costs and token responses to provide an enterprise-grade rate limiting strategy.

  In this example, we're rate limiting a specific AI Consumer Group using its name. You can also target an AI Consumer Group using its ID by changing the [`config.policies.match.key`](/ai-gateway/policies/ai-rate-limiting-advanced/reference/#schema--config-policies-match-key) value.
weight: 900
min_version:
  ai-gateway: '2.0'
name: consumer-group-rate-limiting
display_name: AI Consumer Group rate limiting
type: ai-rate-limiting-advanced
scopes:
- ai-model
- global
requirements:
- An existing [AI Model](/ai-gateway/entities/ai-model/).
- An existing [AI Consumer Group](/ai-gateway/entities/ai-consumer-group/).
variables:
  consumer_group_name:
    value: $CONSUMER_GROUP_NAME
    description: The name of the AI Consumer Group to rate limit.
config:
  policies:
  - match:
    - type: consumer_group
      key: name
      values:
      - ${consumer_group_name}
    limits:
    - limit: 100
      window_size: 60
    - limit: 1000
      window_size: 3600
tools:
- konnect-api
- terraform
- kongctl
