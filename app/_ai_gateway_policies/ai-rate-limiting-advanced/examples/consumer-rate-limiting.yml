title: Enable AI Consumer rate limiting
description: Protect your LLM services with AI Consumer rate limiting.
extended_description: |
  Protect your LLM services with AI Consumer rate limiting.
  The AI Rate Limiting Advanced Policy analyzes query costs and token responses to provide an enterprise-grade rate limiting strategy.

  In this example, we're rate limiting a specific AI Consumer using its ID. You can also target an AI Consumer using its username or custom ID by changing the [`config.policies.match.key`](/ai-gateway/policies/ai-rate-limiting-advanced/reference/#schema--config-policies-match-key) value.
weight: 900
min_version:
  ai-gateway: '2.0'
name: consumer-rate-limiting
display_name: AI Consumer rate limiting
type: ai-rate-limiting-advanced
scopes:
- ai-model
- global
requirements:
- An existing [AI Model](/ai-gateway/entities/ai-model/).
- An existing [AI Consumer](/ai-gateway/entities/ai-consumer/).
variables:
  consumer_id:
    value: $CONSUMER_ID
    description: The ID of the AI Consumer to rate limit.
config:
  policies:
  - match:
    - type: consumer
      key: id
      values:
      - ${consumer_id}
    limits:
    - limit: 100
      window_size: 60
    - limit: 1000
      window_size: 3600
tools:
- konnect-api
- terraform
- kongctl
