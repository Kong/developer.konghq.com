title: Request prompt function Google Cloud Memorystore instance auth
description: Rate limit requests based on a custom token with Google Cloud Memorystore instance auth
extended_description: |
  Protect your LLM services with rate limiting and Google Cloud Memorystore instance auth.
  The AI Rate Limiting Advanced Policy analyzes query costs and token responses to provide an enterprise-grade rate limiting strategy.

  The following example uses request prompt rate limiting, which lets you rate limit requests based on a custom token.
weight: 900
name: request-prompt-count-gcp-instance
display_name: Request prompt function Google Cloud Memorystore instance auth
type: ai-rate-limiting-advanced
requirements:
- An existing [AI Model](/ai-gateway/entities/ai-model/).
- A running Redis instance on a [Google Cloud Memorystore instance](https://cloud.google.com/memorystore/docs/cluster/about-iam-auth).
.- Port `6379`, or your custom Redis port, is open and reachable from {{site.ai_gateway}}.
- "Assign the principal to the corresponding role: \n* [Cloud Memorystore Redis DB Connection User(`roles/redis.dbConnectionUser`)](https://docs.cloud.google.com/memorystore/docs/cluster/about-iam-auth) for Memorystore for Redis Cluster\n* [Memorystore DB Connector User (`roles/memorystore.dbConnectionUser`)](https://docs.cloud.google.com/memorystore/docs/valkey/about-iam-auth) for Memorystore for Valkey\n"
variables:
  instance_address:
    value: $INSTANCE_ADDRESS
    description: The Memorystore instance address.
  service_account:
    value: $GCP_SERVICE_ACCOUNT
    description: The GCP service account JSON.
config:
  strategy: redis
  redis:
    host: ${instance_address}
    port: 6379
    cloud_authentication:
      auth_provider: gcp
      gcp_service_account_json: ${service_account}
  sync_rate: 0
  policies:
  - match:
    - type: provider
      partition_by: true
      values:
      - cohere
    limits:
    - limit: 100
      window_size: 60
    - limit: 1000
      window_size: 3600
  request_prompt_count_function: |
    local header_count = tonumber(kong.request.get_header("x-prompt-count"))
    if header_count then
      return header_count
    end
    return 0
tools:
- konnect-api
- terraform
- kongctl
