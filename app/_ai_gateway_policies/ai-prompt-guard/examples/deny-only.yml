description: Configure the AI Prompt Guard policy to deny messages following a specific pattern. 
extended_description: |
  Configure the policy to deny messages following a specific pattern. 
  For requests to pass through in this example, 
  the user messages in the prompt must not be a card number field that starts with 5.

title: 'Deny only'

weight: 900

name: deny-only
display_name: Deny only
type: ai-prompt-guard

config: 
  deny_patterns:
  - '\"card\".*\"5[0-9]{12}(?:[0-9]{3})?\"'

tools:
  - konnect-api
  - terraform
  - kongctl
