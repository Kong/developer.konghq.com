description: |
  Configure the AI Routing Provider policy for a Switchyard route that calls a model to decide, such as `llm_classifier`.
  The decision includes a model call, so the default `timeout_ms` of `300` would send most requests to `default_target`.
  Set `timeout_ms` to cover the judge call, and keep it at or below `60000`.

title: Allow more time for a judged Switchyard route

weight: 870

scopes:
  - ai-model

requirements:
  - You have a running [NVIDIA Switchyard](https://github.com/NVIDIA-NeMo/Switchyard) decision service that the data plane can reach.
  - You have registered the AI Routing Provider [custom policy](/ai-gateway/custom-policies/) and run the data plane with `KONG_UNTRUSTED_LUA=on`.
  - You have created an [AI Model](/ai-gateway/entities/ai-model/) for each target, with no policies attached, and an AI Model that clients call.

name: use-a-judged-switchyard-route
display_name: Allow more time for a judged Switchyard route
type: ai-routing-provider

config:
  decision_api_url: http://switchyard:4000/v1/decision
  decision_route: kong-router
  dispatch: konnect_model
  default_target: weak
  mode: enforce
  timeout_ms: 30000
  targets:
    weak:
      model: z-ai/glm-5.3
      provider: openai
      protocol: openai_chat
      base_url: https://openrouter.ai/api/v1
    strong:
      model: google/gemini-3.8-flash
      provider: openai
      protocol: openai_chat
      base_url: https://openrouter.ai/api/v1

tools:
  - konnect-api
  - terraform
  - kongctl
