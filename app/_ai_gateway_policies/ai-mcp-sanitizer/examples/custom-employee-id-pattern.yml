description: |
  Configure the AI MCP Sanitizer Policy to redact a custom identifier, such as an employee ID in the format `EMP-123456`, in tool call arguments.

title: Redact employee IDs with a custom pattern

weight: 860

scopes:
  - ai-mcp-server
  - global

requirements:
  - An existing [AI MCP Server](/ai-gateway/entities/ai-mcp-server/).
  - An [AI PII Anonymizer service image](/ai-gateway/policies/ai-mcp-sanitizer/#ai-pii-anonymizer-service), pulled and running.

variables:
  host:
    description: The sanitizer service's host
    value: $SANITIZER_SERVICE_HOST

name: custom-employee-id-pattern
display_name: Redact employee IDs with a custom pattern
type: ai-mcp-sanitizer

config:
  anonymize:
    - custom
  custom_patterns:
    - name: employee_id
      regex: "EMP-[0-9]{6}"
      score: 0.9
  sanitize_targets:
    - tool_arguments
  port: 8080
  host: ${host}
  recover_redacted: false
  stop_on_error: true

tools:
  - konnect-api
  - terraform
  - kongctl
