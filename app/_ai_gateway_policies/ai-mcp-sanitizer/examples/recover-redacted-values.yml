description: |
  Configure the AI MCP Sanitizer Policy to send placeholders to the tool server and restore the original values when the tool returns them in its result. Recovery applies only to values redacted in tool call arguments.

title: Restore redacted values in tool results

weight: 850

scopes:
  - ai-mcp-server
  - global

requirements:
  - An existing [AI MCP Server](/ai-gateway/entities/ai-mcp-server/).
  - An [AI PII Anonymizer service image](/ai-gateway/policies/ai-mcp-sanitizer/#ai-pii-anonymizer-service), pulled and running.

variables:
  host:
    description: The sanitizer service's host
    value: $SANITIZER_SERVICE_HOST

name: recover-redacted-values
display_name: Restore redacted values in tool results
type: ai-mcp-sanitizer

config:
  anonymize:
    - ssn
    - email
  sanitize_targets:
    - tool_arguments
  port: 8080
  host: ${host}
  recover_redacted: true
  stop_on_error: true

tools:
  - konnect-api
  - terraform
  - kongctl
