description: |
  Configure the AI MCP Sanitizer Policy to redact PII in the results that a tool returns, so the agent and the LLM context never receive the original values. The Policy forwards the arguments to the tool server unchanged.

title: Sanitize tool call results

weight: 890

scopes:
  - ai-mcp-server
  - global

requirements:
  - An existing [AI MCP Server](/ai-gateway/entities/ai-mcp-server/).
  - An [AI PII Anonymizer service image](/ai-gateway/policies/ai-mcp-sanitizer/#ai-pii-anonymizer-service), pulled and running.

variables:
  host:
    description: The sanitizer service's host
    value: $SANITIZER_SERVICE_HOST

name: sanitize-tool-results
display_name: Sanitize tool call results
type: ai-mcp-sanitizer

config:
  anonymize:
    - ssn
    - email
    - phone
  sanitize_targets:
    - tool_results
  port: 8080
  host: ${host}
  recover_redacted: false
  stop_on_error: true

tools:
  - konnect-api
  - terraform
  - kongctl
