description: |
  Configure the AI MCP Sanitizer Policy to redact Social Security numbers, email addresses, and phone numbers in the arguments an agent sends to a tool. The tool server receives placeholders instead of the original values.

title: Sanitize tool call arguments

weight: 900

scopes:
  - ai-mcp-server
  - global

requirements:
  - An existing [AI MCP Server](/ai-gateway/entities/ai-mcp-server/).
  - An [AI PII Anonymizer service image](/ai-gateway/policies/ai-mcp-sanitizer/#ai-pii-anonymizer-service), pulled and running.

variables:
  host:
    description: The sanitizer service's host
    value: $SANITIZER_SERVICE_HOST

name: sanitize-tool-arguments
display_name: Sanitize tool call arguments
type: ai-mcp-sanitizer

config:
  anonymize:
    - ssn
    - email
    - phone
  sanitize_targets:
    - tool_arguments
  port: 8080
  host: ${host}
  recover_redacted: false
  stop_on_error: true

tools:
  - konnect-api
  - terraform
  - kongctl
