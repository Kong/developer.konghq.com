title: "{{site.surfaces_cli}} Documentation"
description: Index containing all documentation for {{site.surfaces_cli}}.
groups:
  - title: "About {{site.surfaces_cli}}"
    sections:
      - items:
        - path: /surfaces-cli/
        - path: /surfaces-cli/get-started/

  - title: How-to guides
    sections:
      # Lists every how-to with tools: [surfaces-cli]. No edit needed for new how-tos.
      - title: "{{site.surfaces_cli}} how-to guides"
        items:
        - type: how-to
          tools:
            - surfaces-cli

  - title: CLI References
    sections:
      # One section per top-level command. Copy this block for each new command.
      # The /*/** glob picks up every subcommand page in the command's folder.
      - title: Example Command
        items:
          - path: /surfaces-cli/example-command/
          - path: /surfaces-cli/example-command/*/**
