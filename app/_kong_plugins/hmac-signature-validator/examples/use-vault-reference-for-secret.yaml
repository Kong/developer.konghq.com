description: 'Verify an HMAC-SHA256 signature with a shared secret that the plugin reads from a vault reference.'

extended_description: |
  Verify an HMAC-SHA256 signature with a shared secret that the plugin reads from a vault reference, so the secret isn't stored in the plugin configuration.

  This example uses the `env` vault, which reads the secret from the `WEBHOOK_SHARED_SECRET` environment variable on each {{site.base_gateway}} node.
  When the reference doesn't resolve, or resolves to an empty value, the plugin returns a `500` response.

title: 'Store the shared secret in a vault'

weight: 700

requirements:
  - "The `WEBHOOK_SHARED_SECRET` environment variable set on every {{site.base_gateway}} node, or another [vault](/gateway/entities/vault/) that stores the shared secret"

config:
  signature_header: X-Signature-SHA256
  signature_format: hex
  algorithm: hmac-sha256
  shared_secret: "{vault://env/WEBHOOK_SHARED_SECRET}"

min_version:
  gateway: '3.17'

tools:
  - deck
  - admin-api
  - konnect-api
  - kic
  - terraform
