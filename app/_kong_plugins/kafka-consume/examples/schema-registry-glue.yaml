description: 'Configure the Kafka Consume plugin to use AWS Glue Schema Registry for message deserialization.'

title: 'AWS Glue Schema Registry'

weight: 905

min_version:
  gateway: '3.17'

requirements:
 - "[Kafka installed](https://kafka.apache.org/quickstart#quickstart_download) and running"
 - "[Create a Kafka topic](https://kafka.apache.org/quickstart#quickstart_createtopic)"
 - "[AWS Glue Schema Registry configured](https://docs.aws.amazon.com/glue/latest/dg/schema-registry.html) with the schema that serialized the messages"
 - "AWS credentials available to the gateway, for example through an IAM role or the `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY` environment variables"

variables:
  host:
    description: The bootstrap server host.
    value: $BOOTSTRAP_SERVER_HOST
  topic:
    description: The name of the Kafka topic to consume from.
    value: $KAFKA_TOPIC
  region:
    description: 'The AWS region of the Glue Schema Registry. For example, `us-east-1`.'
    value: $AWS_REGION

config:
  bootstrap_servers:
  - host: ${host}
    port: 9092
  topics:
  - name: ${topic}
  mode: http-get
  schema_registry:
    glue:
      region: ${region}
      registry_name: default-registry
tools:
  - deck
  - admin-api
  - konnect-api
  - kic
  - terraform
