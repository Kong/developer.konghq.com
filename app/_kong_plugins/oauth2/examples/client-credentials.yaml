title: Enable the plugin for the Client Credentials flow

description: Configure the plugin to enable the Client Credentials OAuth 2.0 flow

extended_description: |
  Configure the plugin to enable the Client Credentials OAuth 2.0 flow.
  Enabling this plugin will let you generate tokens for client applications.

  For a full how-to guide, see:
  * [Enable OAuth2 authentication with {{site.base_gateway}}](/how-to/enable-oauth2-authentication-with-kong-gateway/)
  * [Enable OAuth2 authentication for WebSocket requests](/how-to/enable-oauth2-authentication-for-websocket-requests/)

weight: 900

requirements:
- A [Consumer](/gateway/entities/consumer/) with a username and password.
- An [OAuth 2.0 application](/plugins/oauth2/api/#/paths/consumers-consumer--oauth2/post) for the Consumer.

variables:
  provision:
    value: $PROVISION_KEY
    description: The provision key to use.

config: 
  scopes:
    - email
  provision_key: ${provision}
  enable_client_credentials: true

tools:
  - deck
  - admin-api
  - kic
  - terraform
