description: 'Enable the Straiker coding agent buffered plugin on an Anthropic Messages route.'

extended_description: |
  Enable the Straiker coding agent buffered plugin on a Route that proxies Anthropic Messages traffic, for example from Claude Code.

  This configuration fails open if Straiker Defend is unreachable, covering both the request and response phase, so a Straiker outage doesn't return a 503 for a response the model already generated.
  Because the response is held until it's scored, this is the only Straiker plugin that can stop a `tool_use` before the client runs it, at the cost of added time to first token.
  Don't attach [AI Proxy](/plugins/ai-proxy/) to the same Route. See [How it works](/plugins/straiker-coding-agent-buffered/#how-it-works).

  This plugin requires `nginx_http_client_body_buffer_size` raised to at least `32m`. See [Body buffer](/plugins/straiker-coding-agent-buffered/#body-buffer).

title: 'Enable Straiker coding agent buffered'

weight: 900

requirements:
  - "The Straiker coding agent buffered plugin is [installed](/plugins/straiker-coding-agent-buffered/#install-the-straiker-coding-agent-buffered-plugin), with `nginx_http_client_body_buffer_size` raised."
  - "A Straiker Defend API key. Contact your Straiker team for enterprise API keys and sandbox access."
  - "A Service pointing at the Anthropic Messages API, for example `https://api.anthropic.com`, without AI Proxy attached. Set a generous `read_timeout`, for example `600000`. It's an inter-read timeout, not a total one, but a buffered response is only delivered once generation finishes."

variables:
  api-key:
    value: $STRAIKER_API_KEY
    description: Your Straiker Defend API key.

config:
  api_key: ${api-key}
  fail_open: true

tools:
  - deck
  - admin-api
  - konnect-api
  - kic
  - terraform

min_version:
  gateway: '3.14'
