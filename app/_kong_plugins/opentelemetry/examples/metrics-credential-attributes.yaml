description: Add the authenticated credential ID to the OpenTelemetry plugin's request count and bandwidth metrics.
extended_description: |
  Add the ID of the authenticated credential to the OpenTelemetry plugin's request count and bandwidth metrics by enabling `enable_credential_attribute`.

  In the example:
  * `enable_request_metrics` adds request count metrics.
  * `enable_bandwidth_metrics` adds request and response size metrics.
  * `enable_credential_attribute` adds the `kong.auth.credential.id` attribute to the enabled metrics.

  When an authentication plugin authenticates a request with a credential, the plugin exports `http.server.request.count`, `http.server.request.size`, and `http.server.response.size` with the `kong.auth.credential.id` attribute.

  Each Nginx worker records a limited number of distinct credential IDs to cap memory use. For the attribute values, AI metrics, and the limit, see [Credential attribute and limit](/plugins/opentelemetry/#credential-attribute-and-limit).

title: 'Add the credential attribute to metrics'

requirements:
  - "An OpenTelemetry backend"
  - "An authentication plugin that sets a credential, such as [Key Auth](/plugins/key-auth/) or [OpenID Connect](/plugins/openid-connect/) with `credential_claim`"

weight: 870

min_version:
  gateway: '3.17'

config:
  metrics:
    endpoint: http://localhost:4318/v1/metrics
    push_interval: 10
    enable_request_metrics: true
    enable_bandwidth_metrics: true
    enable_credential_attribute: true

tools:
  - deck
  - admin-api
  - konnect-api
  - kic
  - terraform
