description: Add the authenticated credential ID to the OTEL plugin's request count and bandwidth metrics.
extended_description: |
  Add the ID of the authenticated credential to the OTEL plugin's request count and bandwidth metrics by enabling `enable_credential_attribute`.

  In the example:
  * `enable_request_metrics` adds request count metrics.
  * `enable_bandwidth_metrics` adds request and response size metrics.
  * `enable_credential_attribute` adds the `kong.auth.credential.id` attribute to the enabled metrics.

  When an authentication plugin authenticates a request with a credential,
  the plugin exports `http.server.request.count`, `http.server.request.size`, and `http.server.response.size` with the `kong.auth.credential.id` attribute.
  The value is the ID that the authentication plugin sets for the credential. For example:
  * [OpenID Connect](/plugins/openid-connect/) with `credential_claim` sets the value of that claim, for example `sub` or `email`.
  * [Key Auth](/plugins/key-auth/) sets the ID of the Key Auth credential.

  If you also set `enable_ai_metrics` to `true`, the plugin adds the attribute to the `gen_ai.client.token.usage` and `kong.gen_ai.llm.cost` metrics.
  If a request has no authenticated credential, the plugin omits the attribute.

  Each new credential ID creates new metric series, and {{site.base_gateway}} keeps these series in memory.
  To limit the memory use, each Nginx worker records at most [`opentelemetry_metrics_credential_attr_limit`](/gateway/configuration/#opentelemetry-metrics-credential-attr-limit) distinct credential IDs. The default value is `200`.
  When a worker reaches the limit, it logs a warning once. After that, it omits the attribute for new credential IDs but still counts their requests. Credential IDs that the worker recorded before stay in the metrics.
  All OpenTelemetry plugin instances in a worker share this limit. Requests are spread across all Nginx workers, so each worker usually sees the same credentials. Set the limit to the number of distinct credentials that you expect one node to handle.

title: 'Add the credential attribute to metrics'

requirements:
  - "An OpenTelemetry backend"
  - "An authentication plugin that sets a credential, such as [Key Auth](/plugins/key-auth/) or [OpenID Connect](/plugins/openid-connect/) with `credential_claim`"

weight: 870

min_version:
  gateway: '3.17'

config:
  metrics:
    endpoint: http://localhost:4318/v1/metrics
    push_interval: 10
    enable_request_metrics: true
    enable_bandwidth_metrics: true
    enable_credential_attribute: true

tools:
  - deck
  - admin-api
  - konnect-api
  - kic
  - terraform
