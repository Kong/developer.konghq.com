description: 'Route between model tiers with the NVIDIA Switchyard AI Routing plugin, and adopt it safely.'

extended_description: |
  Enable the same weak/strong tier routing as the basic example, and adopt it safely by moving from
  `observe_only` to `enforce`.

  The two halves of this configuration must agree:

  1. Each `model_alias` configured under `targets` exists as a target in AI Proxy Advanced.
  1. Each `model` matches what the decision service reports for that target.
  1. Each target name matches a `[targets.*]` entry in the Switchyard server configuration.

  Start in `observe_only`.
  Decisions are fetched, validated, and reported on response headers (`X-AI-Routing-Outcome: observed`),
  but client traffic routing isn't altered.
  Send live requests and monitor `X-AI-Routing-Backend` to see what Switchyard would select.
  When telemetry confirms the desired traffic split, change `mode` to `enforce`.

title: 'Route between model tiers'

weight: 901

requirements:
  - "The NVIDIA Switchyard AI Routing plugin is [installed](/plugins/ai-routing-provider/#install-the-nvidia-switchyard-ai-routing-plugin) on your data planes."
  - "On {{site.konnect_short_name}}, the plugin schema is uploaded to the control plane."
  - "A reachable NVIDIA Switchyard Decision API is serving `POST /v1/decision`."
  - "A Route is configured with the [AI Proxy Advanced](/plugins/ai-proxy-advanced/) plugin enabled, with `model_alias` targets named `weak` and `strong`."

config:
  decision_api_url: http://switchyard:4000/v1/decision
  decision_route: kong-router
  mode: observe_only
  dispatch: model_alias
  default_target: weak
  prompt_disclosure: none
  timeout_ms: 2000
  targets:
    weak:
      model_alias: weak
      model: z-ai/glm-5.3
      provider: openai
      protocol: openai_chat
      base_url: https://openrouter.ai/api/v1
    strong:
      model_alias: strong
      model: google/gemini-3.8-flash
      provider: openai
      protocol: openai_chat
      base_url: https://openrouter.ai/api/v1

tools:
  - deck
  - admin-api
  - konnect-api
  - kic
  - terraform
