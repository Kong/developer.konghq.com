description: 'Enable the Straiker plugin on an LLM route.'

extended_description: |
  Enable the Straiker plugin on a Route that carries LLM traffic, such as Anthropic Messages or OpenAI chat requests.

  This configuration scores prompts and responses, and injects the upstream model credential at the gateway so clients never carry a platform key.
  Traffic passes uninspected, stamped `degraded`, if Straiker can't be reached. Set `fail_closed` to `true` to reject it instead.

  The delivery mode is controlled by the `STRAIKER_KONG_MODE` environment variable on the {{site.base_gateway}} node.
  See [Delivery mode](/plugins/straiker/#delivery-mode) in the plugin documentation.

title: 'Enable Straiker'

weight: 900

requirements:
  - "The Straiker plugin is [installed](/plugins/straiker/#install-the-straiker-plugin), with `nginx_http_client_body_buffer_size` raised to `32m`."
  - "A Straiker account and integration key."
  - "A Service pointing at the model provider, for example `https://api.anthropic.com`. Set a generous `read_timeout`, for example `600000`."
  - "A Route with `protocols` set explicitly, for example `http` and `https`."

variables:
  api-key:
    value: $STRAIKER_API_KEY
    description: Your Straiker integration key.
  upstream-api-key:
    value: $UPSTREAM_API_KEY
    description: The model provider credential the gateway injects.

config:
  detect_url: https://api.prod.straiker.ai/api/v3/detect
  api_key: ${api-key}
  upstream_api_key: ${upstream-api-key}

tools:
  - deck
  - admin-api
  - konnect-api
  - kic
  - terraform

min_version:
  gateway: '3.14'
