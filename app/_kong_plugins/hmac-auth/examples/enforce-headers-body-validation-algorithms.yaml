description: |
  Enforces headers that the client should use during HTTP signature creation, as well as body validation. 
  Specifies that the `hmac-sha256` algorithm should be used to hash the digest.

title: 'Enforce headers, body validation, and HMAC digest algorithms'

weight: 900

config:
  enforce_headers:
  - date 
  - '@request-target'
  algorithms:
  - hmac-sha256
  validate_request_body: true


tools:
  - deck
  - admin-api
  - konnect-api
  - kic
  - terraform