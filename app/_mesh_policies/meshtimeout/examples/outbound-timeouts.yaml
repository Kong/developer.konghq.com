title: 'Set timeouts for requests to a destination'

description: 'Use MeshTimeout to set connection and request timeouts for the traffic a proxy sends to one destination.'

weight: 900

namespace: kong-mesh-demo

config:
  type: MeshTimeout
  name: web-to-backend
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: web
    to:
      - targetRef:
          kind: MeshService
          labels:
            kuma.io/display-name: backend
        default:
          connectionTimeout: 5s
          idleTimeout: 1h
          http:
            requestTimeout: 15s
            streamIdleTimeout: 30m
