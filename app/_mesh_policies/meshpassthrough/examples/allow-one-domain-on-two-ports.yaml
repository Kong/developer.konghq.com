title: 'Allow one domain on two ports'

description: 'Allow the same domain name on two explicit ports. Domain matches check SNI or HTTP authority and forward to the address the application dialed; they do not pin that address through DNS resolution.'

weight: 600

config:
  type: MeshPassthrough
  name: allow-api-both-ports
  mesh: default
  spec:
    targetRef:
      kind: Mesh
    default:
      appendMatch:
        - type: Domain
          value: api.example.com
          protocol: tls
          port: 443
        - type: Domain
          value: api.example.com
          protocol: http
          port: 80
