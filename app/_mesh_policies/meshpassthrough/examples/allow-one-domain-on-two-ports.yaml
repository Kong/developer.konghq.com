title: 'Allow one domain on two ports'

description: 'Allow the same domain name on two explicit ports. The sidecar resolves the domain itself and connects on each listed port.'

weight: 600

config:
  type: MeshPassthrough
  name: allow-api-both-ports
  mesh: default
  spec:
    targetRef:
      kind: Mesh
    default:
      appendMatch:
        - type: Domain
          value: api.example.com
          protocol: tls
          port: 443
        - type: Domain
          value: api.example.com
          protocol: http
          port: 80
