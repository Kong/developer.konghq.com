title: 'Log all outgoing traffic'

description: 'Log all outgoing traffic with MeshAccessLog.'

weight: 890

namespace: kong-mesh-demo

config:
  type: MeshAccessLog
  name: all-outgoing-traffic
  mesh: default
  spec:
    to:
      - targetRef:
          kind: Mesh
        default:
          backends:
            - type: File
              file:
                path: /dev/stdout
