title: 'Pin the TLS version and ciphers'

description: 'Restrict mesh connections to TLS 1.2 and one ECDSA cipher suite. Both peers need compatible certificates. The cipher list does not control TLS 1.3 suites.'

weight: 700

namespace: kong-mesh-demo

config:
  type: MeshTLS
  name: set-version-and-ciphers
  mesh: default
  spec:
    targetRef:
      kind: Mesh
    rules:
      - default:
          tlsVersion:
            min: TLS12
            max: TLS12
          tlsCiphers:
            - ECDHE-ECDSA-AES256-GCM-SHA384
