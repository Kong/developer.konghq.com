title: 'Probe a destination over HTTP'

description: 'Use MeshHealthCheck to probe an HTTP path on a destination and treat only the given response statuses as healthy.'

weight: 900

namespace: kong-mesh-demo

config:
  type: MeshHealthCheck
  name: web-to-backend
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: web
    to:
      - targetRef:
          kind: MeshService
          labels:
            kuma.io/display-name: backend
        default:
          interval: 10s
          timeout: 2s
          unhealthyThreshold: 3
          healthyThreshold: 1
          http:
            path: /health
            expectedStatuses:
              - 200
