title: 'Limit requests and customise the rejection'

description: 'Allow a burst of five requests per inbound route and proxy, replenished at five requests per ten seconds. Customize rejected responses with a status and header; check whether returning 503 triggers client retries.'

weight: 900

namespace: kong-mesh-demo

config:
  type: MeshRateLimit
  name: backend-rate-limit
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: backend
    rules:
      - default:
          local:
            http:
              requestRate:
                num: 5
                interval: 10s
              onRateLimit:
                status: 503
                headers:
                  set:
                    - name: x-kuma-rate-limited
                      value: "true"
