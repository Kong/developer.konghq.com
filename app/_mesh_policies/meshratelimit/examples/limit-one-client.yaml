title: 'Give one client a tighter limit'

description: 'Match a caller SPIFFE ID to hold a batch job to ten requests per second, while every other client keeps a thousand.'

weight: 700

namespace: kong-mesh-demo

config:
  type: MeshRateLimit
  name: backend-limit-batch-client
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: backend
    rules:
      - matches:
          - spiffeID:
              type: Prefix
              value: spiffe://default.default.mesh.local/ns/kong-mesh-demo/sa/batch
        default:
          local:
            http:
              requestRate:
                num: 10
                interval: 1s
      - default:
          local:
            http:
              requestRate:
                num: 1000
                interval: 1s
