title: 'Give one workload identity a separate limit'

description: 'Give requests from the batch identity a separate ten-per-second bucket on each destination proxy. Other callers share a thousand-per-second bucket. Replace the example SPIFFE ID with the complete URI from the batch workload certificate.'

weight: 700

namespace: kong-mesh-demo

config:
  type: MeshRateLimit
  name: backend-limit-batch-client
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: backend
    rules:
      - matches:
          - spiffeID:
              type: Exact
              value: spiffe://default.default.mesh.local/ns/kong-mesh-demo/sa/batch
        default:
          local:
            http:
              requestRate:
                num: 10
                interval: 1s
      - default:
          local:
            http:
              requestRate:
                num: 1000
                interval: 1s
