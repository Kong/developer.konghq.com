title: 'Issue from a CA you supply'

description: 'Point the bundled provider at an intermediate CA certificate and key held as secrets, and cap the lifetime of issued leaf certificates. A self-signed root CA also needs insecureAllowSelfSigned: true.'

weight: 800

config:
  type: MeshIdentity
  name: corporate-ca
  mesh: default
  spec:
    selector:
      dataplane: {}
    provider:
      type: Bundled
      bundled:
        ca:
          certificate:
            type: Secret
            secretRef:
              kind: Secret
              name: mesh-ca-cert
          privateKey:
            type: Secret
            secretRef:
              kind: Secret
              name: mesh-ca-key
        certificateParameters:
          expiry: 24h
