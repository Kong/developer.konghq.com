title: 'Serve the metrics endpoint over TLS'

description: 'Set ProvidedTLS and supply the certificate and key to the sidecar through KUMA_DATAPLANE_RUNTIME_METRICS_CERT_PATH and KUMA_DATAPLANE_RUNTIME_METRICS_KEY_PATH.'

weight: 600

namespace: kong-mesh-demo

config:
  type: MeshMetric
  name: backend-metrics-tls
  mesh: default
  spec:
    targetRef:
      kind: Mesh
    default:
      backends:
        - type: Prometheus
          prometheus:
            port: 5670
            path: /metrics
            tls:
              mode: ProvidedTLS
