title: 'Split connections between two destinations'

description: 'Weight two backendRefs 90 to 10 so a tenth of a client connections reach a second destination.'

weight: 900

namespace: kong-mesh-demo

config:
  type: MeshTCPRoute
  name: frontend-to-backend
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: frontend
    to:
      - targetRef:
          kind: MeshService
          labels:
            kuma.io/display-name: backend
        rules:
          - default:
              backendRefs:
                - kind: MeshService
                  labels:
                    kuma.io/display-name: backend
                  port: 8080
                  weight: 90
                - kind: MeshService
                  labels:
                    kuma.io/display-name: backend-next
                  port: 8080
                  weight: 10
