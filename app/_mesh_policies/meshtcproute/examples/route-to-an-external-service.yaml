title: 'Route connections to an external service'

description: 'Send a destination TCP connections to a MeshExternalService, so a dependency can be moved outside the mesh without changing the client.'

weight: 600

namespace: kong-mesh-demo

config:
  type: MeshTCPRoute
  name: frontend-to-external
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: frontend
    to:
      - targetRef:
          kind: MeshService
          labels:
            kuma.io/display-name: backend
        rules:
          - default:
              backendRefs:
                - kind: MeshExternalService
                  labels:
                    kuma.io/display-name: external-backend
