title: 'Add a Lua filter to outbound requests'

description: 'Insert a Lua HTTP filter before the router filter, to set a header on every outbound request.'

weight: 900

namespace: kong-mesh-demo

config:
  type: MeshProxyPatch
  name: backend-lua-filter
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: backend
    default:
      appendModifications:
        - httpFilter:
            operation: AddBefore
            match:
              name: envoy.filters.http.router
              origin: outbound
            value: |
              name: envoy.filters.http.lua
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                inlineCode: |
                  function envoy_on_request(request_handle)
                    request_handle:headers():add("x-header", "test")
                  end
