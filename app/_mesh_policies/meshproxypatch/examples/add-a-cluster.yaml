title: 'Add a cluster and route to it'

description: 'Add a static cluster, then add a virtual host that sends traffic to it on the route configuration of an existing HTTP outbound. Outbound route configurations are named by the KRI of the destination port, so copy the exact name from the proxy config dump.'

weight: 600

namespace: kong-mesh-demo

config:
  type: MeshProxyPatch
  name: backend-extra-cluster
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: backend
    default:
      appendModifications:
        - cluster:
            operation: Add
            value: |
              name: extra-cluster
              connectTimeout: 5s
              type: STATIC
              loadAssignment:
                clusterName: extra-cluster
                endpoints:
                  - lbEndpoints:
                      - endpoint:
                          address:
                            socketAddress:
                              address: 127.0.0.1
                              portValue: 8080
        - virtualHost:
            operation: Add
            match:
              routeConfigurationName: kri_msvc_default_zone-1_kong-mesh-demo_orders_http
            value: |
              name: extra
              domains:
                - extra.local
              routes:
                - match:
                    prefix: /
                  route:
                    cluster: extra-cluster
