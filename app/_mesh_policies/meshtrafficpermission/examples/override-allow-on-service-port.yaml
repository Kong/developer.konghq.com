title: 'Override a mesh-wide allow rule on one inbound port'

description: 'Use MeshTrafficPermission to deny traffic from a namespace on one inbound port, even when a mesh-wide allow rule exists.'

weight: 700

namespace: kong-mesh-demo

config:
  type: MeshTrafficPermission
  name: deny-observability-ns
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: backend
      sectionName: admin
    rules:
      - default:
          deny:
            - spiffeID:
                type: Prefix
                value: spiffe://default.zone-1.mesh.local/ns/observability/sa
