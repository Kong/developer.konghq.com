title: 'Allow traffic from a namespace'

description: 'Allow every workload in one namespace to reach all identified destinations in the mesh by matching a SPIFFE ID prefix.'

weight: 900

namespace: kong-mesh-demo

config:
  type: MeshTrafficPermission
  name: allow-observability-ns
  mesh: default
  spec:
    targetRef:
      kind: Mesh
    rules:
      - default:
          allow:
            - spiffeID:
                type: Prefix
                value: spiffe://default.default.mesh.local/ns/observability/
