title: 'Delay requests to test caller timeouts'

description: 'Wait five seconds before forwarding 50.5% of requests to the application, to test whether the caller times out as expected.'

weight: 800

namespace: kong-mesh-demo

config:
  type: MeshFaultInjection
  name: backend-delay
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: backend
    rules:
      - default:
          http:
            - delay:
                value: 5s
                percentage: "50.5"
