title: 'Keep a rego policy in a secret'

description: 'Reference a policy stored as a secret instead of writing it into the resource. The control plane does not read it, so it is not compiled at write time.'

weight: 800

namespace: kong-mesh-demo

config:
  type: MeshOPA
  name: backend-authz
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: backend
    default:
      appendPolicies:
        - rego:
            type: Secret
            secretRef:
              kind: Secret
              name: backend-authz-policy
