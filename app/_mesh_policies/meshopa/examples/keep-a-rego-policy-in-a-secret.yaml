title: 'Keep a rego policy in a secret'

description: 'Reference a Rego module stored in backend-authz-policy in the policy mesh. The control plane resolves and compiles it when generating agent configuration, not during resource-write validation. Verify source-loading and compilation errors after applying.'

weight: 800

namespace: kong-mesh-demo

config:
  type: MeshOPA
  name: backend-authz
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: backend
    default:
      appendPolicies:
        - rego:
            type: Secret
            secretRef:
              kind: Secret
              name: backend-authz-policy
