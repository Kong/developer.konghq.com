title: 'Configure the OPA agent'

description: 'Enable console decision logs for a diagnostic workload. Retain your real authorization modules in production, and mask sensitive request data before sending decision logs to shared storage.'

weight: 500

namespace: kong-mesh-demo

config:
  type: MeshOPA
  name: opa-decision-logs
  mesh: default
  spec:
    targetRef:
      kind: Mesh
    default:
      agentConfig:
        type: InsecureInline
        insecureInline:
          value: |
            decision_logs:
              console: true
      appendPolicies:
        - rego:
            type: InsecureInline
            insecureInline:
              value: |
                package envoy.authz
                default allow = true
