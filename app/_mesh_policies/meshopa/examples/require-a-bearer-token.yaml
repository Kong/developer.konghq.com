title: 'Require a bearer token'

description: 'Reject any request without an Authorization bearer header, with an inline rego policy compiled when the resource is applied.'

weight: 900

namespace: kong-mesh-demo

config:
  type: MeshOPA
  name: require-token
  mesh: default
  spec:
    targetRef:
      kind: Mesh
    default:
      appendPolicies:
        - rego:
            type: InsecureInline
            insecureInline:
              value: |
                package envoy.authz

                import input.attributes.request.http as http_request

                default allow = false

                allow {
                  startswith(http_request.headers.authorization, "Bearer ")
                }
