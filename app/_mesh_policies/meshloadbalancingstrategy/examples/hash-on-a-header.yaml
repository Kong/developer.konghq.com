title: 'Pin requests to an endpoint by header'

description: 'Use the x-user header for endpoint affinity with RingHash. Requests with the same value stay on the same endpoint while the eligible endpoint set and configuration remain stable; scaling or health changes can move them.'

weight: 900

namespace: kong-mesh-demo

config:
  type: MeshLoadBalancingStrategy
  name: backend-hash-on-user
  mesh: default
  spec:
    targetRef:
      kind: Dataplane
      labels:
        app: frontend
    to:
      - targetRef:
          kind: MeshService
          labels:
            kuma.io/display-name: backend
        default:
          loadBalancer:
            type: RingHash
          hashPolicies:
            - type: Header
              header:
                name: x-user
