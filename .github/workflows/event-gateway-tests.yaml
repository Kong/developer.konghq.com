name: Event Gateway Automated Tests
on:
  workflow_dispatch:
    inputs:
      event_gateway_image:
        description: 'Docker Image for Tests'
        required: true
        default: 'kong-event-gateway:latest'
      konnect_domain:
        description: "Set to konghq.tech to run against .tech"
        required: false
      konnect_event_gateway_min_version:
        description: 'Minimum Konnect Event Gateway version for the get.konghq.com/event-gateway quickstart (e.g. 1.3)'
        required: false
  schedule:
  - cron: '0 0 * * WED'

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

permissions:
  actions: read
  contents: read
  checks: write
  statuses: write

env:
  VITE_PORTAL_API_URL: ${{ vars.VITE_PORTAL_API_URL }}

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      KONNECT_DOMAIN: ${{ inputs.konnect_domain || 'konghq.com' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: 'recursive'

      - name: Install deps
        uses: './.github/reusable-steps/install-deps'

      - name: Run site
        uses: './.github/reusable-steps/run-site'
        with:
          konnect-domain: ${{ env.KONNECT_DOMAIN }}

      - name: Generate instruction files
        uses: './.github/reusable-steps/generate-instruction-files'
        with:
          product: event-gateway

      - name: Download Kong License
        uses: Kong/kong-license@master
        id: getLicense
        with:
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Set Event Gateway Image and Tag
        run: |
          INPUT_IMAGE="${{ inputs.event_gateway_image }}"
          echo "KONG_IMAGE_NAME=${INPUT_IMAGE%:*}" >> $GITHUB_ENV
          echo "KONG_IMAGE_TAG=${INPUT_IMAGE##*:}" >> $GITHUB_ENV

      - name: Set Event Gateway min version
        if: ${{ inputs.konnect_event_gateway_min_version != '' }}
        env:
          MIN_VERSION: ${{ inputs.konnect_event_gateway_min_version }}
        run: echo "KONNECT_EVENT_GATEWAY_MIN_VERSION=$MIN_VERSION" >> $GITHUB_ENV

      - name: Run tests
        working-directory: tools/automated-tests
        shell: bash
        env:
          KONG_LICENSE_DATA: ${{ steps.getLicense.outputs.license }}
          DEPLOYMENT_MODEL: konnect
          PRODUCTS: event-gateway
          KONG_IMAGE_TAG: ${{ env.KONG_IMAGE_TAG }}
          KONG_IMAGE_NAME: ${{ env.KONG_IMAGE_NAME }}
          KONNECT_DOMAIN: ${{ env.KONNECT_DOMAIN }}
          TESTS_KONNECT_TOKEN: ${{ inputs.konnect_domain != '' && secrets.KONNECT_TOKEN_TECH || secrets.KONNECT_TOKEN }}
        run: |
          DEBUG=tests:*,debug npm run run-tests

      - name: Publish Test Report
        uses: './.github/reusable-steps/publish-test-report'
        if: always()

      - name: Notify Slack
        if: ${{ !cancelled() }}
        uses: './.github/reusable-steps/notify-slack'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
