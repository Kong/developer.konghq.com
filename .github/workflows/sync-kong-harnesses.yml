name: Sync kong-harnesses
on:
  workflow_dispatch:
    inputs:
      dev_site_base_branch:
        description: "Dev site base branch to sync, release/kong-harnesses when empty. The branch needs the scripts in tools/kong-harnesses-versions."
        required: false
        type: string
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read

# GitHub runs a plain run step without pipefail, so a failed command at the
# start of a pipeline would go unnoticed.
defaults:
  run:
    shell: bash

jobs:
  kong-harnesses-versions:
    name: Fetch kong-harnesses Versions
    # Runs for one base branch queue, so an older run can't replace the data
    # that a newer run wrote to the same pull request.
    concurrency:
      group: sync-kong-harnesses-${{ inputs.dev_site_base_branch || 'release/kong-harnesses' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Create GitHub App Token for the releases
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: releases-token
        with:
          app-id: ${{ vars.GH_APP_KONG_DOCS_ID }}
          private-key: ${{ secrets.GH_APP_KONG_DOCS_SECRET }}
          owner: Kong
          repositories: kong-harnesses
          permission-contents: read

      - name: Create GitHub App Token for the pull request
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: pr-token
        with:
          app-id: ${{ vars.GH_APP_KONG_DOCS_ID }}
          private-key: ${{ secrets.GH_APP_KONG_DOCS_SECRET }}
          owner: Kong
          repositories: developer.konghq.com
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.dev_site_base_branch || 'release/kong-harnesses' }}
          persist-credentials: false

      - name: Check that the branch has the sync scripts
        env:
          BRANCH: ${{ inputs.dev_site_base_branch || 'release/kong-harnesses' }}
        run: |
          if [ ! -f tools/kong-harnesses-versions/package-lock.json ]; then
            echo "::error::Branch $BRANCH has no tools/kong-harnesses-versions, so it can't be synced yet"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tools/kong-harnesses-versions/package-lock.json

      # The help and the release data must name the same release, so the
      # install step gets the release that fetch-versions.js takes as the
      # latest one.
      - name: Fetch versions
        id: versions
        env:
          GH_TOKEN: ${{ steps.releases-token.outputs.token }}
        run: |
          cd tools/kong-harnesses-versions
          npm ci
          node fetch-versions.js
          latest=$(awk '/version:/ { gsub(/"/, "", $2); version = $2 } /latest: true/ { print version }' ../../app/_data/tools/kong-harnesses.yml)
          if [ -z "$latest" ]; then
            echo "::error::The release data names no latest release"
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - uses: Kong/setup-kong-harnesses@7eaf0b48d0bf57c589dc8aad5d105b904868c3f6 # v1.0.0
        with:
          kong-harnesses-version: ${{ steps.versions.outputs.version }}
          token: ${{ steps.releases-token.outputs.token }}

      - name: Verify kong-harnesses install
        run: kong-harnesses version --full

      - name: Extract help
        run: |
          cd tools/kong-harnesses-versions
          node extract-help.js

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          title: Sync kong-harnesses Releases
          commit-message: Sync kong-harnesses Releases
          branch: sync-kong-harnesses/releases/${{ inputs.dev_site_base_branch || 'release/kong-harnesses' }}
          base: ${{ inputs.dev_site_base_branch || 'release/kong-harnesses' }}
          labels: skip-changelog,review:general
          token: ${{ steps.pr-token.outputs.token }}
          add-paths: |
            app/_includes/kong-harnesses/help/**
            app/kong-harnesses/**
            app/_data/tools/kong-harnesses.yml
