name: AI Gateway Automated Tests
on:
  workflow_dispatch:
    inputs:
      gateway_image:
        description: 'Docker Image for Tests'
        required: true
        default: 'kong/kong-ai-gateway:latest'
  schedule:
    - cron: '0 0 * * MON'

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

permissions:
  actions: read
  contents: read
  checks: write
  statuses: write

env:
  VITE_PORTAL_API_URL: ${{ vars.VITE_PORTAL_API_URL }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: 'recursive'

      - name: Install deps
        uses: './.github/reusable-steps/install-deps'

      - name: Run site
        uses: './.github/reusable-steps/run-site'

      - name: Generate instruction files
        uses: './.github/reusable-steps/generate-instruction-files'
        with:
          product: ai-gateway

      - name: Download Kong License
        uses: Kong/kong-license@master
        id: getLicense
        with:
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Set AI Gateway Image and Tag
        run: |
          INPUT_IMAGE="${{ inputs.gateway_image }}"
          echo "KONG_IMAGE_NAME=${INPUT_IMAGE%:*}" >> $GITHUB_ENV
          echo "KONG_IMAGE_TAG=${INPUT_IMAGE##*:}" >> $GITHUB_ENV

      - name: Pre-pull AI Gateway quickstart dependencies
        run: docker pull ghcr.io/jqlang/jq:latest

      - name: Run tests
        working-directory: tools/automated-tests
        shell: bash
        env:
          DEPLOYMENT_MODEL: konnect
          PRODUCTS: ai-gateway
          KONG_IMAGE_TAG: ${{ env.KONG_IMAGE_TAG }}
          KONG_IMAGE_NAME: ${{ env.KONG_IMAGE_NAME }}
          TESTS_KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
          TESTS_OPENAI_AUTH_HEADER: ${{ secrets.OPENAI_AUTH_HEADER }}
          TESTS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TESTS_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          TESTS_OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          TESTS_DASHSCOPE_AUTH_HEADER: ${{ secrets.DASHSCOPE_AUTH_HEADER }}
          TESTS_DASHSCOPE_KEY: ${{ secrets.DASHSCOPE_KEY }}
          TESTS_AZURE_AI_FOUNDRY_TOKEN: ${{ secrets.AZURE_AI_FOUNDRY_TOKEN }}
          TESTS_AZURE_AI_FOUNDRY_UPSTREAM_URL: ${{ secrets.AZURE_AI_FOUNDRY_UPSTREAM_URL }}
          TESTS_HUGGINGFACE_AUTH_HEADER: ${{ secrets.HUGGINGFACE_AUTH_HEADER }}
          TESTS_GUARDRAILS_VERSION: ${{ secrets.GUARDRAILS_VERSION }}
          TESTS_WEATHERAPI_API_KEY: ${{ secrets.WEATHERAPI_API_KEY }}
          TESTS_AWS_REGION: ${{ secrets.AWS_REGION }}
          TESTS_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TESTS_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TESTS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TESTS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TESTS_GCP_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON_BASE64 }}
          TESTS_VERTEX_UPSTREAM_URL: ${{ secrets.VERTEX_UPSTREAM_URL }}
        run: |
          npm run run-tests

      - name: Publish Test Report
        uses: './.github/reusable-steps/publish-test-report'
        if: always()

      - name: Notify Slack
        if: ${{ !cancelled() }}
        uses: './.github/reusable-steps/notify-slack'
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
