name: Operator Automated Tests
on:
  workflow_dispatch:
    inputs:
      konnect_domain:
        description: "Set to konghq.tech to run against .tech"
        required: false
  schedule:
  - cron: '0 0 * * FRI'

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

permissions:
  actions: read
  contents: read
  checks: write
  statuses: write

env:
  VITE_PORTAL_API_URL: ${{ vars.VITE_PORTAL_API_URL }}
