name: Mesh Policies Validator
on:
  pull_request:
    types: [synchronize, ready_for_review, opened, reopened]
    paths:
      - app/_mesh_policies/**
      - app/mesh/**
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_PORTAL_API_URL: ${{ vars.VITE_PORTAL_API_URL }}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  validate:
    name: Validate mesh policy example pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install deps
        uses: './.github/reusable-steps/install-deps'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: v1.17.2
      - name: Build mesh pages
        run: KONG_PRODUCTS=mesh exe/build
      - name: Install validator dependencies
        working-directory: tools/mesh-policy-examples-validator
        run: npm ci
      - name: Run validator
        working-directory: tools/mesh-policy-examples-validator
        run: node index.js --skip external-services@v2
