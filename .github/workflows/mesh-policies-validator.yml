name: Mesh Policies Validator
on:
  pull_request:
    types: [synchronize, ready_for_review, opened]
    paths:
      - app/_mesh_policies/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  validate:
    name: Validate mesh policy example pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Install deps
        uses: './.github/reusable-steps/install-deps'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
      - name: Build mesh pages
        run: KONG_PRODUCTS=mesh exe/build
      - name: Run validator
        working-directory: tools/mesh-policy-examples-validator
        run: |
          npm ci
          # external-services@v2: the konnect-beta provider has no resource
          # for the legacy ExternalService policy. See BASELINE.md.
          node index.js --skip external-services@v2
