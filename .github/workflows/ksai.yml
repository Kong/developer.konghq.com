---
name: KSAI

permissions: {}

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

jobs:
  ksai:
    name: run
    uses: Kong/ksai-public/.github/workflows/ksai.yml@f2dd288940d39803f5f5f4ca28209787b408eb33  # v5.0.0-rc.100
    permissions:
      contents: read   # checked out by every command; a push uses the token CP mints
      id-token: write  # mint the GitHub OIDC token for the Kong gateway
