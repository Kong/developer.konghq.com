---
name: KSAI

permissions: {}

on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

jobs:
  ksai:
    name: run
    uses: Kong/ksai-public/.github/workflows/ksai.yml@bf91b310416bb421e0bdb073e1ea8d7c656b10da  # v5.0.0
    permissions:
      contents: read   # checked out by every command; a push uses the token CP mints
      id-token: write  # mint the GitHub OIDC token for the Kong gateway
