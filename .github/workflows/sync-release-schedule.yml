name: Sync Release Schedule
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  milestone:
    types: [created, edited, opened, closed, deleted]

permissions:
  contents: read

concurrency:
  group: sync-release-schedule
  cancel-in-progress: false

jobs:
  sync-release-schedule:
    name: Sync Release Schedule view
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Create GitHub App Token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_KONG_DOCS_ID }}
          private-key: ${{ secrets.GH_APP_KONG_DOCS_SECRET }}
          owner: Kong

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Sync Release Schedule view
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cd tools/release-schedule-sync
          node index.js
