on-prem:
  gateway:
    env:
      WEBHOOK_URL: http://httpbin.konghq.com/anything
      SLACK_WEBHOOK_URL: http://httpbin.konghq.com/anything
      ANTHROPIC_API_KEY: anthropic-api-key

    versions: &gateway-versions
      - version: "3.15"
        env:
          KONG_IMAGE_NAME: kong/kong-gateway
          KONG_IMAGE_TAG: "3.15"
      - version: "3.14"
        env:
          KONG_IMAGE_NAME: kong/kong-gateway
          KONG_IMAGE_TAG: "3.14"
      - version: "3.13"
        env:
          KONG_IMAGE_NAME: kong/kong-gateway
          KONG_IMAGE_TAG: "3.13"
      - version: "3.12"
        env:
          KONG_IMAGE_NAME: kong/kong-gateway
          KONG_IMAGE_TAG: "3.12"
      - version: "3.11"
        env:
          KONG_IMAGE_NAME: kong/kong-gateway
          KONG_IMAGE_TAG: "3.11"
      - version: "3.10"
        env:
          KONG_IMAGE_NAME: kong/kong-gateway
          KONG_IMAGE_TAG: "3.10"
      - version: "3.9"
        env:
          KONG_IMAGE_NAME: kong/kong-gateway
          KONG_IMAGE_TAG: "3.9"
      - version: "3.8"
        env:
          KONG_IMAGE_NAME: kong/kong-gateway
          KONG_IMAGE_TAG: "3.8"
      - version: "3.4"
        env:
          KONG_IMAGE_NAME: kong/kong-gateway
          KONG_IMAGE_TAG: "3.4"

    setup:
      commands:
        - curl -Ls https://get.konghq.com/quickstart | bash -s -- -r "" -i $KONG_IMAGE_NAME -t $KONG_IMAGE_TAG -e KONG_LICENSE_DATA

      env_variables:
        command: curl -Ls https://get.konghq.com/quickstart | bash -s -- -r "" -i $KONG_IMAGE_NAME -t $KONG_IMAGE_TAG -e KONG_LICENSE_DATA

      rbac:
        commands:
          - |
            curl -Ls https://get.konghq.com/quickstart | bash -s --  -r ""  -i $KONG_IMAGE_NAME -t $KONG_IMAGE_TAG -e "KONG_LICENSE_DATA" -e "KONG_ENFORCE_RBAC=on" -e "KONG_ADMIN_GUI_AUTH=basic-auth" -e "KONG_PASSWORD=kong" -e 'KONG_ADMIN_GUI_SESSION_CONF={"secret":"kong", "cookie_lifetime":300000, "cookie_renew":200000, "cookie_name":"kong_cookie", "cookie_secure":false, "cookie_samesite": "off"}'

      wasm:
        commands:
          - |
            curl -Ls https://get.konghq.com/quickstart | bash -s --  -r ""  -i $KONG_IMAGE_NAME -t $KONG_IMAGE_TAG -e "KONG_LICENSE_DATA" -e KONG_WASM=on

    cleanup:
      commands:
        - curl -Ls https://get.konghq.com/quickstart | bash -s -- -d -a kong-quickstart

    reset:
      commands:
        # The shared kong-quickstart Postgres defaults to max_connections: 100.
        # Kong accumulates idle DB connections over a long sequential test batch
        # without releasing them, eventually exhausting that limit and turning
        # into intermittent Admin API 500s. Killing idle (not active) backends
        # before each reset keeps the pool small; verified this doesn't disrupt
        # Kong itself (it reopens connections on demand).
        - docker exec kong-quickstart-database psql -U kong -d kong -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state = 'idle' AND pid <> pg_backend_pid();"
        - deck gateway reset -f

  ai-gateway:
    env:
      WEBHOOK_URL: http://httpbin.konghq.com/anything
      SLACK_WEBHOOK_URL: http://httpbin.konghq.com/anything
      ANTHROPIC_API_KEY: anthropic-api-key
      KONNECT_DOMAIN: konghq.tech
      KONGCTL_DEFAULT_KONNECT_ENVIRONMENT: tech
    setup:
      commands:
        - export KONGCTL_DEFAULT_KONNECT_PAT=$KONNECT_TOKEN
        - curl -Ls https://get.konghq.com/ai | bash -s -- -r "" -i $KONG_IMAGE_NAME -t $KONG_IMAGE_TAG -e KONG_LICENSE_DATA

    cleanup:
      commands:
        - curl -Ls https://get.konghq.com/ai | bash -s -- -d

    reset:
      commands:
        # The shared kong-quickstart Postgres defaults to max_connections: 100.
        # Kong accumulates idle DB connections over a long sequential test batch
        # without releasing them, eventually exhausting that limit and turning
        # into intermittent Admin API 500s. Killing idle (not active) backends
        # before each reset keeps the pool small; verified this doesn't disrupt
        # Kong itself (it reopens connections on demand).
        - docker exec kong-quickstart-database psql -U kong -d kong -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state = 'idle' AND pid <> pg_backend_pid();"
        - deck gateway reset -f

  operator:
    setup:
      commands:
        - helm repo add kong https://charts.konghq.com
        - helm repo update
    cleanup:
      commands:
        - k3d cluster delete operator-test
    reset:
      commands:
        - k3d cluster delete operator-test
        - k3d cluster create --k3s-arg "--disable=traefik@server:*" operator-test --wait
        - kubectl config use-context k3d-operator-test

  kic:
    setup:
      commands:
        - helm repo add kong https://charts.konghq.com
        - helm repo update
    cleanup:
      commands:
        - k3d cluster delete kic-test
    reset:
      commands:
        - k3d cluster delete kic-test
        - k3d cluster create --k3s-arg "--disable=traefik@server:*" kic-test --wait
        - kubectl config use-context k3d-kic-test

konnect:
  gateway:
    setup:
      commands: []

    cleanup:
      commands: []

    reset:
      commands: []

  ai-gateway:
    env:
      WEBHOOK_URL: http://httpbin.konghq.com/anything
      SLACK_WEBHOOK_URL: http://httpbin.konghq.com/anything
      KONNECT_DOMAIN: konghq.tech
      KONGCTL_DEFAULT_KONNECT_ENVIRONMENT: tech
    setup:
      commands:
        - curl -Ls https://get.konghq.com/ai | bash -s -- -r "" -k $KONNECT_TOKEN -i $KONG_IMAGE_NAME -t $KONG_IMAGE_TAG -e KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE=2m | grep '^export AI_GATEWAY_ID' >> /env-vars.sh
        - sleep 5

    cleanup:
      commands:
        - curl -Ls https://get.konghq.com/ai | bash -s -- -k $KONNECT_TOKEN -d

    reset:
      commands:
        - curl -Ls https://get.konghq.com/ai | bash -s -- -r "" -k $KONNECT_TOKEN -i $KONG_IMAGE_NAME -t $KONG_IMAGE_TAG -e KONG_NGINX_HTTP_CLIENT_BODY_BUFFER_SIZE=2m | grep '^export AI_GATEWAY_ID' >> /env-vars.sh
        - sleep 5
  event-gateway:
    setup:
      commands: []

    cleanup:
      commands:
        - curl -Ls https://get.konghq.com/event-gateway | bash -s -- -k $KONNECT_TOKEN -n automated-tests-event-gateway-quickstart -d
        - docker compose -f /files/event-gateway/docker-compose.yaml down
        - |
          AUTH_SERVER_ID=$(curl -s -X GET "https://us.api.konghq.com/v1/auth-servers?filter%5Bname%5D%5Beq%5D=Appointments%20Dev" -H "Authorization: Bearer $KONNECT_TOKEN" | jq -r '.data[0].id') &&
            curl -s -X DELETE "https://us.api.konghq.com/v1/auth-servers/$AUTH_SERVER_ID?force=true" -H "Authorization: Bearer $KONNECT_TOKEN"

    reset:
      commands:
        - curl -Ls https://get.konghq.com/event-gateway | bash -s -- -k $KONNECT_TOKEN -n automated-tests-event-gateway-quickstart -d
        - docker compose -f /files/event-gateway/docker-compose.yaml down
        - docker compose -f /files/event-gateway/docker-compose.yaml up -d
        - sleep 5
        - curl -Ls https://get.konghq.com/event-gateway | bash -s -- -k $KONNECT_TOKEN -N kafka_event_gateway -n automated-tests-event-gateway-quickstart | tail -1 >> /env-vars.sh
        - sleep 5
