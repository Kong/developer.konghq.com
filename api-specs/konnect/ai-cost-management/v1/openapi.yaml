  /ai-cost-management/budget-balances:
    get:
      operationId: list-budget-balances
      summary: List budget balances
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Returns a page of the balances of the organization's limit budgets, the highest consumed share first unless the request sets `sort`. A limit budget without `each` has one balance for its whole scope, with `value` `null`. A limit budget with `each` has one balance for every value of the `each` field with usage in the budget window, and for every value that an `eq` or `in` predicate on that field selects, even without usage. Exemptions have no balance. `filter[budget.id]` narrows the list to some budgets.

        `evaluated_at` fixes every budget window for every page, but not the usage: usage that arrives while a client reads the pages can change the amounts. A zero limit has no consumed share, and its balances sort as the highest share.
      parameters:
        - name: filter
          in: query
          description: |-
            Narrows the list. Each filter has the form `filter[field][operator]=value`, or `filter[field]=value` for `eq`. An operator that takes no value, such as `exists`, leaves out `=value`.

            A request can combine several filters, and every filter must match.
          schema:
            $ref: '#/components/schemas/AICostBudgetBalanceFilterParameters'
          explode: true
          style: deepObject
        - name: sort
          in: query
          description: |-
            The order of the results, as a comma-separated list of fields in priority order. Each field can be followed by a space and `asc` or `desc`, and sorts in ascending order without one. The service breaks ties so that the order is unique.

            Sortable fields: `consumed_share`, `consumed`, `value`. Defaults to `consumed_share desc`.
          schema:
            type: string
        - name: 'page[size]'
          in: query
          description: |-
            The number of results on each page.

            1 to 100. A larger value is reduced to 100. Defaults to `20`.
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
        - name: 'page[after]'
          in: query
          description: |-
            A cursor for the page after an earlier response's page. Clients take it from that response's `meta.page.next` link, which also carries the request's other parameters, and don't build or change it.

            A request can't send both `page[after]` and `page[before]`.
          schema:
            type: string
        - name: 'page[before]'
          in: query
          description: |-
            A cursor for the page before an earlier response's page. Clients take it from that response's `meta.page.previous` link, which also carries the request's other parameters, and don't build or change it.

            A request can't send both `page[after]` and `page[before]`.
          schema:
            type: string
        - name: evaluated_at
          in: query
          description: |-
            The time to calculate the balances for, as an RFC 3339 timestamp in UTC. It selects the budget window, not the usage: the amounts include all usage stored when the request runs. To see the same budget window as an earlier read, pass that read's `evaluated_at`.

            Must not be in the future. Defaults to the time of the request.
          schema:
            type: string
            format: date-time
            pattern: '^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$'
      responses:
        '200':
          description: A page of balances.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: 'The balances on this page, in `sort` order: one for each limit budget without `each`, and one for each derived budget of a limit budget with `each`. A value that an `eq` or `in` predicate on the `each` field selects appears even without usage, with zero spend.'
                    type: array
                    items:
                      type: object
                      properties:
                        budget:
                          description: 'The full limit budget the balance belongs to, so a list can show its name and scope without reading it.'
                          allOf:
                            - $ref: '#/components/schemas/AICostLimitBudget'
                        value:
                          description: 'The value of the budget''s `each` field that defines this derived budget, or `null` for the whole scope of a budget without `each`.'
                          type: string
                          nullable: true
                        window:
                          description: The budget window that contains `evaluated_at`.
                          allOf:
                            - $ref: '#/components/schemas/AICostTimeWindow'
                        consumed:
                          description: 'The spend in the budget window, in US dollars, as a decimal string. For a derived budget, the spend of usage with its `value`.'
                          type: string
                        remaining:
                          description: 'The budget''s limit minus `consumed`, in US dollars, as a decimal string. Negative once spend exceeds the limit.'
                          type: string
                        projected:
                          description: 'Where `consumed` ends the budget window at the current pace, in US dollars, as a decimal string rounded to the cent.'
                          type: string
                        consumed_share:
                          description: '`consumed` divided by the budget''s limit, as a decimal string with at most nine fractional digits, such as `1.334843` when spend is about 133% of the limit. `null` when the limit is zero.'
                          type: string
                          nullable: true
                        latest_record_at:
                          description: |-
                            When the newest usage counted in the balance reached the service, as an RFC 3339 timestamp in UTC. It doesn't show that all earlier usage has arrived.

                            `null` when no usage matches.
                          type: string
                          format: date-time
                          nullable: true
                      required:
                        - budget
                        - value
                        - window
                        - consumed
                        - remaining
                        - projected
                        - consumed_share
                        - latest_record_at
                  meta:
                    description: 'What every balance on the page shares: the time of the calculation, with the page links.'
                    type: object
                    properties:
                      evaluated_at:
                        description: 'The time the balances are calculated for, as an RFC 3339 timestamp in UTC. It selects each budget''s window. Page links carry it, so every page uses the same windows.'
                        type: string
                        format: date-time
                      page:
                        $ref: '#/components/schemas/CursorMetaPage'
                    required:
                      - evaluated_at
                      - page
                required:
                  - data
                  - meta
        '400':
          description: A query parameter is invalid. `invalid_parameters` names each invalid parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: 'The request has no valid access token. The token is missing, malformed, or expired, or it fails another check, and the response doesn''t say which.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 'The access token is valid, but its principal lacks the permission this operation requires. For an operation on one resource, the response doesn''t reveal whether that resource exists.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      tags:
        - budgets
