components:
  parameters: {}
  schemas:
    AICostUsageQuantity:
      description: |-
        A count of usage in a kind's unit, such as tokens or milliseconds, as a decimal string such as `1834`.

        The string holds only ASCII digits, with no sign, no decimal point, no exponent, and no extra leading zeros (`0` is valid, `01` isn't). Its value is at most `2^64 - 1` (`18446744073709551615`). The count is a string so that it stays exact in JSON parsers that read numbers as floating point.
      type: string
      pattern: '^(0|[1-9]\d*)$'
    AICostUsageRequestMode:
      description: 'How the invocation was served: `stream`, `oneshot`, or `realtime`.'
      type: string
      enum:
        - stream
        - oneshot
        - realtime
    AICostDecimalAmount:
      description: |-
        A nonnegative number written as a decimal string, such as `1234` or `12.5`, so that JSON parsers can't change its value.

        The string uses ASCII digits and at most 1 decimal point. It has no sign, no exponent, no unnecessary leading zeros, and no trailing zeros after the decimal point. Counts and usage quantities are whole numbers, and amounts in US dollars have at most 9 fractional digits.
      type: string
      pattern: '^\d+(?:\.\d+)?$'
    AICostBudget:
      description: |-
        A budget sets a spending limit, or declares an exemption from limits, for part of the organization's AI usage. `scope` selects the usage it covers.

        `effect` tells the two kinds apart. A limit budget carries its settings in `limit`, `window`, and `posture`, and an exemption carries the period it covers in `validity`. The fields of the other kind are `null`.
      discriminator:
        propertyName: effect
        mapping:
          limit: '#/components/schemas/AICostLimitBudget'
          exempt: '#/components/schemas/AICostExemptBudget'
      oneOf:
        - $ref: '#/components/schemas/AICostLimitBudget'
        - $ref: '#/components/schemas/AICostExemptBudget'
    AICostLimitBudget:
      description: 'A limit budget sets a spending limit on the usage in its scope for each budget window. It has a balance, and it can have a notification rule that alerts as spend reaches shares of the limit.'
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          description: 'A human-readable name for the budget, unique within the organization.'
          type: string
        labels:
          description: Key-value metadata on the budget. The budget list and reports can filter by label. Balances and notification rules ignore labels.
          type: object
          additionalProperties:
            type: string
        scope:
          description: The usage the budget covers.
          type: object
          properties:
            filters:
              description: The filters that usage must match to count toward the budget. Usage must match all of them. An empty list covers all of the organization's usage.
              type: array
              items:
                $ref: '#/components/schemas/AICostBudgetScopeFilter'
              x-max-depth: 5
            each:
              description: |-
                The field that splits the budget. With `each`, the limit applies separately to every value of that field, such as each subject. Each value gets its own derived budget, and usage without a value for the field belongs to none of them.

                A fixed usage field or `tags.<key>`. `null` for a pooled budget, whose limit applies to all its usage together, and always `null` on an exemption.
              anyOf:
                - $ref: '#/components/schemas/AICostBudgetScopeField'
                - type: string
                  pattern: ^tags\..+$
                - type: string
                  nullable: true
                  enum:
                    - null
          required:
            - filters
            - each
        priority:
          description: 'The budget''s priority, from 1, the highest, to 100, the lowest. The budget list can filter and sort by it, but balances and notification rules don''t use it.'
          type: integer
          maximum: 100
          minimum: 1
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        effect:
          description: 'Always `limit` for a limit budget, which carries its settings in `limit`, `window`, and `posture`.'
          type: string
          enum:
            - limit
        limit:
          description: 'The spending limit for each budget window. With `each`, every derived budget gets this limit.'
          allOf:
            - $ref: '#/components/schemas/AICostBudgetLimit'
        window:
          description: 'The budget window: the period the limit applies to, such as a calendar month. When one window ends, the next starts.'
          type: object
          additionalProperties: false
          properties:
            type:
              description: 'The kind of budget window. Always `fixed`: windows of length `interval` follow each other, aligned to `anchor`.'
              type: string
              enum:
                - fixed
            interval:
              description: 'The length of each budget window, as an ISO 8601 duration such as `P1M` for a month or `P1D` for a day.'
              type: string
            anchor:
              description: |-
                A time when a budget window starts. Windows start a whole number of intervals before or after it, in the local time of its time zone, so calendar units such as months stay aligned to the calendar. A window that would start on a day its month doesn't have, such as the 31st, starts on the month's last day.

                A date-time with a UTC offset and an IANA time zone in brackets, such as `2026-01-01T00:00:00+01:00[Europe/Budapest]`.
              type: string
          required:
            - type
            - interval
            - anchor
        posture:
          description: What the budget declares should happen when spend reaches the limit. Nothing enforces it.
          allOf:
            - $ref: '#/components/schemas/AICostBudgetPosture'
        validity:
          description: 'Always `null`, because only an exemption has `validity`.'
          type: string
          enum:
            - null
          nullable: true
      required:
        - id
        - name
        - labels
        - scope
        - priority
        - created_at
        - updated_at
        - effect
        - limit
        - window
        - posture
        - validity
    AICostBudgetScopeFilter:
      description: 'One filter in a budget scope: a predicate on one usage field, or a group that combines filters with `and` or `or`.'
      discriminator:
        propertyName: op
        mapping:
          eq: '#/components/schemas/AICostBudgetScopePredicate'
          neq: '#/components/schemas/AICostBudgetScopePredicate'
          contains: '#/components/schemas/AICostBudgetScopePredicate'
          in: '#/components/schemas/AICostBudgetScopePredicate'
          nin: '#/components/schemas/AICostBudgetScopePredicate'
          ocontains: '#/components/schemas/AICostBudgetScopePredicate'
          exists: '#/components/schemas/AICostBudgetScopePredicate'
          nexists: '#/components/schemas/AICostBudgetScopePredicate'
          and: '#/components/schemas/AICostBudgetScopeFilterGroup'
          or: '#/components/schemas/AICostBudgetScopeFilterGroup'
      oneOf:
        - $ref: '#/components/schemas/AICostBudgetScopePredicate'
        - $ref: '#/components/schemas/AICostBudgetScopeFilterGroup'
    AICostBudgetScopePredicate:
      description: |-
        A condition on one usage field. `op` selects the comparison and the shape of `value`: one value, a list of values, or `null` for `exists` and `nexists`.

        Usage without a value for the field matches only `nexists`.
      discriminator:
        propertyName: op
        mapping:
          eq: '#/components/schemas/AICostBudgetScopeValuePredicate'
          neq: '#/components/schemas/AICostBudgetScopeValuePredicate'
          contains: '#/components/schemas/AICostBudgetScopeValuePredicate'
          in: '#/components/schemas/AICostBudgetScopeValueListPredicate'
          nin: '#/components/schemas/AICostBudgetScopeValueListPredicate'
          ocontains: '#/components/schemas/AICostBudgetScopeValueListPredicate'
          exists: '#/components/schemas/AICostBudgetScopeExistsPredicate'
          nexists: '#/components/schemas/AICostBudgetScopeNExistsPredicate'
      oneOf:
        - $ref: '#/components/schemas/AICostBudgetScopeValuePredicate'
        - $ref: '#/components/schemas/AICostBudgetScopeValueListPredicate'
        - $ref: '#/components/schemas/AICostBudgetScopeExistsPredicate'
        - $ref: '#/components/schemas/AICostBudgetScopeNExistsPredicate'
    AICostBudgetScopeValuePredicate:
      description: 'A predicate that compares a usage field with one value, using `eq`, `neq`, or `contains`.'
      type: object
      properties:
        field:
          description: 'The usage field to compare: one of the fixed usage fields, or `tags.<key>` for the value of the tag `<key>`, such as `tags.project`.'
          anyOf:
            - $ref: '#/components/schemas/AICostBudgetScopeField'
            - type: string
              pattern: ^tags\..+$
        op:
          description: How the field is compared with `value`.
          allOf:
            - $ref: '#/components/schemas/AICostBudgetScopeValueOperator'
        value:
          description: |-
            The value to compare the field with. For `subject` or `group`, a complete subject or group reference, such as `principal/{uuid}`.

            Must not be empty.
          type: string
          minLength: 1
      additionalProperties: false
      required:
        - field
        - op
        - value
    AICostBudgetScopeField:
      description: |-
        A usage field that a budget scope can filter on, and that `each` can split a budget by:

        - `subject`: the subject reference, such as `principal/{uuid}`. Equal identifiers from different identity systems stay distinct.
        - `subject_id`: the subject's identifier without its type, which pools equal identifiers across identity systems.
        - `subject_type`: the subject's identity system: `principal`, `consumer`, or `oidc`.
        - `group`: the usage's group references. Usage can carry several groups. `eq` and `in` match when any of them matches. `neq` and `nin` match only usage with at least one group, and exclude it when any of its groups matches.
        - `model`: the model that the provider reports as served.
        - `provider`: the provider that served the invocation.
        - `request_mode`: how the invocation was served: `stream`, `oneshot`, or `realtime`.

        A scope can also use `tags.<key>` for the value of one tag.
      type: string
      enum:
        - subject_type
        - subject
        - subject_id
        - group
        - model
        - provider
        - request_mode
    AICostBudgetScopeValueOperator:
      description: |-
        How a predicate compares a field with one value:

        - `eq`: the field has exactly this value.
        - `neq`: the field has a value, and it isn't this one.
        - `contains`: the field's value contains this text, ignoring case.

        `subject` and `group` don't take `contains`.
      type: string
      enum:
        - eq
        - neq
        - contains
    AICostBudgetScopeValueListPredicate:
      description: 'A predicate that compares a usage field with a list of values, using `in`, `nin`, or `ocontains`.'
      type: object
      properties:
        field:
          description: 'The usage field to compare: one of the fixed usage fields, or `tags.<key>` for the value of the tag `<key>`, such as `tags.project`.'
          anyOf:
            - $ref: '#/components/schemas/AICostBudgetScopeField'
            - type: string
              pattern: ^tags\..+$
        op:
          description: How the field is compared with the values in `value`.
          allOf:
            - $ref: '#/components/schemas/AICostBudgetScopeListOperator'
        value:
          description: |-
            The values to compare the field with. For `subject` or `group`, complete subject or group references, such as `principal/{uuid}`.

            1 to 100 values, none of them empty.
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 100
          minItems: 1
      additionalProperties: false
      required:
        - field
        - op
        - value
    AICostBudgetScopeListOperator:
      description: |-
        How a predicate compares a field with a list of values:

        - `in`: the field has any of these exact values.
        - `nin`: the field has a value, and it's none of these.
        - `ocontains`: the field's value contains any of these texts, ignoring case.

        `subject` and `group` don't take `ocontains`.
      type: string
      enum:
        - in
        - nin
        - ocontains
    AICostBudgetScopeExistsPredicate:
      description: A predicate that matches usage with any value for a field.
      type: object
      properties:
        field:
          description: 'The usage field to compare: one of the fixed usage fields, or `tags.<key>` for the value of the tag `<key>`, such as `tags.project`.'
          anyOf:
            - $ref: '#/components/schemas/AICostBudgetScopeField'
            - type: string
              pattern: ^tags\..+$
        op:
          description: 'Always `exists`: the predicate matches usage that has any value for the field.'
          type: string
          enum:
            - exists
        value:
          description: 'Always `null`, because the operator takes no value.'
          type: string
          enum:
            - null
          nullable: true
      additionalProperties: false
      required:
        - field
        - op
        - value
    AICostBudgetScopeNExistsPredicate:
      description: A predicate that matches usage without a value for a field.
      type: object
      properties:
        field:
          description: 'The usage field to compare: one of the fixed usage fields, or `tags.<key>` for the value of the tag `<key>`, such as `tags.project`.'
          anyOf:
            - $ref: '#/components/schemas/AICostBudgetScopeField'
            - type: string
              pattern: ^tags\..+$
        op:
          description: 'Always `nexists`: the predicate matches usage that has no value for the field.'
          type: string
          enum:
            - nexists
        value:
          description: 'Always `null`, because the operator takes no value.'
          type: string
          enum:
            - null
          nullable: true
      additionalProperties: false
      required:
        - field
        - op
        - value
    AICostBudgetScopeFilterGroup:
      description: A group of filters combined with `and` or `or`. A group's filters can include further groups.
      type: object
      properties:
        op:
          description: 'How the group combines its filters: `and` requires every filter to match, and `or` requires at least one. Usage that matches several filters of an `or` counts once.'
          type: string
          enum:
            - and
            - or
        filters:
          description: 'The filters to combine, each a predicate or a nested group.'
          type: array
          items:
            $ref: '#/components/schemas/AICostBudgetScopeFilter'
          minItems: 1
      additionalProperties: false
      required:
        - op
        - filters
    AICostBudgetLimit:
      description: 'A spending limit: an amount of money and its currency.'
      type: object
      properties:
        unit:
          description: The currency of `value`.
          allOf:
            - $ref: '#/components/schemas/AICostCurrency'
        value:
          description: 'The amount of the limit in US dollars, as a decimal string such as `5000` or `0.2`.'
          type: string
      required:
        - unit
        - value
    AICostCurrency:
      description: An ISO 4217 currency code. `USD` is the only supported currency.
      type: string
      enum:
        - USD
    AICostBudgetPosture:
      description: |-
        What a limit budget declares should happen when spend reaches its limit: `advisory` declares that spend can continue past the limit, and `enforce` declares that requests should stop at the limit.

        Nothing enforces posture. No posture blocks a request, and balances and notification rules ignore it. The service validates, stores, filters by, and returns it.
      type: string
      enum:
        - advisory
        - enforce
    AICostExemptBudget:
      description: 'An exemption declares that the usage in its scope is exempt from limits for a limited time. It sets no limit. The service stores and lists exemptions, but they change no balance or notification.'
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          description: 'A human-readable name for the budget, unique within the organization.'
          type: string
        labels:
          description: Key-value metadata on the budget. The budget list and reports can filter by label. Balances and notification rules ignore labels.
          type: object
          additionalProperties:
            type: string
        scope:
          description: The usage the budget covers.
          type: object
          properties:
            filters:
              description: The filters that usage must match to count toward the budget. Usage must match all of them. An empty list covers all of the organization's usage.
              type: array
              items:
                $ref: '#/components/schemas/AICostBudgetScopeFilter'
              x-max-depth: 5
            each:
              description: |-
                The field that splits the budget. With `each`, the limit applies separately to every value of that field, such as each subject. Each value gets its own derived budget, and usage without a value for the field belongs to none of them.

                A fixed usage field or `tags.<key>`. `null` for a pooled budget, whose limit applies to all its usage together, and always `null` on an exemption.
              anyOf:
                - $ref: '#/components/schemas/AICostBudgetScopeField'
                - type: string
                  pattern: ^tags\..+$
                - type: string
                  nullable: true
                  enum:
                    - null
          required:
            - filters
            - each
        priority:
          description: 'The budget''s priority, from 1, the highest, to 100, the lowest. The budget list can filter and sort by it, but balances and notification rules don''t use it.'
          type: integer
          maximum: 100
          minimum: 1
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        effect:
          description: 'Always `exempt` for an exemption, which carries the period it covers in `validity`.'
          type: string
          enum:
            - exempt
        limit:
          description: 'Always `null`, because an exemption sets no limit.'
          type: string
          enum:
            - null
          nullable: true
        window:
          description: 'Always `null`, because an exemption has no budget window.'
          type: string
          enum:
            - null
          nullable: true
        posture:
          description: 'Always `null`, because an exemption has no posture.'
          type: string
          enum:
            - null
          nullable: true
        validity:
          description: 'The period the exemption covers, from `from` until `until`.'
          type: object
          properties:
            from:
              description: |-
                When the exemption starts, as an RFC 3339 timestamp in UTC or as a date-time with a UTC offset and an IANA time zone in brackets, such as `2026-08-16T00:00:00+02:00[Europe/Budapest]`.

                If the request omitted it, the budget's `created_at`.
              type: string
            until:
              description: 'When the exemption ends, in the same formats as `from`.'
              type: string
          required:
            - from
            - until
      required:
        - id
        - name
        - labels
        - scope
        - priority
        - created_at
        - updated_at
        - effect
        - limit
        - window
        - posture
        - validity
    AICostBudgetReference:
      description: A reference to one of the organization's budgets by its `id`.
      type: object
      properties:
        id:
          description: 'The `id` of the budget, which the budget operations take as `budgetId`.'
          type: string
          format: uuid
      required:
        - id
    AICostTimeWindow:
      description: The start and end of one budget window.
      type: object
      properties:
        start:
          description: 'When the budget window starts, as an RFC 3339 timestamp in UTC.'
          type: string
          format: date-time
        end:
          description: 'When the budget window ends and the next one starts, as an RFC 3339 timestamp in UTC.'
          type: string
          format: date-time
      required:
        - start
        - end
    AICostNotificationThreshold:
      description: A share of a budget's limit at which its notification rule fires. Spend reaches the threshold when it equals or exceeds that share of the limit.
      type: object
      properties:
        percent:
          description: |-
            The share of the limit, as a whole percent. A value above 100 fires on spend beyond the limit.

            1 to 1000.
          type: integer
          maximum: 1000
          minimum: 1
      additionalProperties: false
      required:
        - percent
    AICostNotificationDeliveryPending:
      description: 'A delivery of one firing''s message to one channel, still in progress.'
      type: object
      properties:
        channel:
          description: The channel the message goes to.
          allOf:
            - $ref: '#/components/schemas/AICostNotificationChannelSummary'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        status:
          description: 'The message is queued, being sent, or waiting for a retry.'
          type: string
          enum:
            - pending
        error:
          description: '`null`, because the delivery hasn''t failed.'
          type: string
          enum:
            - null
          nullable: true
      additionalProperties: false
      required:
        - channel
        - updated_at
        - status
        - error
    AICostNotificationChannelSummary:
      description: 'A short form of the notification channel a message goes to, with its `id`, `name`, and `type`.'
      type: object
      properties:
        id:
          description: 'The `id` of the channel, which the notification channel operations take as `channelId`.'
          type: string
          format: uuid
        name:
          description: The channel's human-readable name.
          type: string
        type:
          description: Whether the channel sends email or posts to Slack.
          allOf:
            - $ref: '#/components/schemas/AICostNotificationChannelType'
      additionalProperties: false
      required:
        - id
        - name
        - type
    AICostNotificationChannelType:
      description: 'How a notification channel delivers its messages: `email` sends them to a list of email addresses, and `slack` posts them to a Slack incoming webhook.'
      type: string
      enum:
        - email
        - slack
    AICostNotificationDeliveryDelivered:
      description: A delivery of one firing's message to one channel that Slack or Konnect's email service accepted.
      type: object
      properties:
        channel:
          description: The channel the message goes to.
          allOf:
            - $ref: '#/components/schemas/AICostNotificationChannelSummary'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        status:
          description: Slack or Konnect's email service accepted the message. A later email bounce doesn't change this status.
          type: string
          enum:
            - delivered
        error:
          description: '`null`, because the delivery hasn''t failed.'
          type: string
          enum:
            - null
          nullable: true
      additionalProperties: false
      required:
        - channel
        - updated_at
        - status
        - error
    AICostNotificationDeliveryFailed:
      description: A delivery of one firing's message to one channel that failed.
      type: object
      properties:
        channel:
          description: The channel the message goes to.
          allOf:
            - $ref: '#/components/schemas/AICostNotificationChannelSummary'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        status:
          description: The message couldn't be delivered. `error` says why.
          type: string
          enum:
            - failed
        error:
          description: Why the delivery failed.
          allOf:
            - $ref: '#/components/schemas/AICostNotificationDeliveryErrorReason'
      additionalProperties: false
      required:
        - channel
        - updated_at
        - status
        - error
    AICostNotificationDeliveryErrorReason:
      description: |-
        Why a message couldn't be delivered to a channel. The value is one of a fixed set of reasons, never free text:

        - `slack_no_service`, `slack_channel_not_found`, `slack_channel_is_archived`, `slack_action_prohibited`, `slack_invalid_payload`, `slack_user_not_found`, `slack_team_disabled`, `slack_invalid_token`: Slack answered with an error status, and its response began with the error that follows the `slack_` prefix, such as `channel_is_archived`.
        - `slack_http_<status>`: Slack answered with the HTTP status `<status>`, a 3-digit code. A `429` or `5xx` status always gives this reason. Any other error status gives it only when the response doesn't begin with one of the errors above.
        - `slack_redirected`: Slack answered with a redirect, which the service never follows.
        - `slack_invalid_target`: the stored webhook URL can no longer be decrypted or validated.
        - `email_invalid_target`: the stored recipient list is no longer valid.
        - `email_render_failed`: the service couldn't render the email.
        - `mailbox_publish_failed`: handing the email to Konnect's email service, the mailbox, failed for a reason other than running out of time.
        - `transport_error`: the attempt ended without an answer. The request to Slack failed at the network level, a Slack or email attempt ran out of time, or sending failed unexpectedly.
        - `attempts_exhausted`: every attempt ended in a temporary error, so the service stopped retrying.
        - `window_ended`: the delivery was still waiting to be sent when its budget window ended. Only deliveries from before a one-time data migration carry this reason.

        A delivery fails at once on a permanent error. A temporary error (`transport_error`, `mailbox_publish_failed`, `slack_http_429`, or `slack_http_<status>` with a `5xx` status) makes the service retry, so a delivery never ends with one of those reasons. It ends with `attempts_exhausted` instead. A channel test isn't retried, so its `error` is the reason its single attempt failed, temporary or not.
      anyOf:
        - type: string
          enum:
            - slack_no_service
            - slack_channel_not_found
            - slack_channel_is_archived
            - slack_action_prohibited
            - slack_invalid_payload
            - slack_user_not_found
            - slack_team_disabled
            - slack_invalid_token
            - slack_redirected
            - slack_invalid_target
            - email_invalid_target
            - mailbox_publish_failed
            - email_render_failed
            - transport_error
            - attempts_exhausted
            - window_ended
        - type: string
          pattern: '^slack_http_[1-5]\d\d$'
    AICostNotificationChannel:
      description: |-
        A notification channel is a destination for budget alerts: a list of email addresses or a Slack incoming webhook. A budget's notification rule sends its alerts to the channels it lists, and one channel can serve many rules.

        `type` tells the two kinds apart. An email channel carries its settings in `email`, and a Slack channel carries them in `slack`.
      discriminator:
        propertyName: type
        mapping:
          email: '#/components/schemas/AICostEmailNotificationChannel'
          slack: '#/components/schemas/AICostSlackNotificationChannel'
      oneOf:
        - $ref: '#/components/schemas/AICostEmailNotificationChannel'
        - $ref: '#/components/schemas/AICostSlackNotificationChannel'
    AICostEmailNotificationChannel:
      description: A notification channel that emails each message to its recipients through Konnect's email service.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          description: A human-readable name for the channel. Several channels can share a name.
          type: string
        labels:
          description: Key-value metadata on the channel. The channel list can filter by label.
          type: object
          additionalProperties:
            type: string
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        type:
          description: 'Always `email` for an email channel, which carries its settings in `email`.'
          type: string
          enum:
            - email
        email:
          description: Who receives the channel's messages by email.
          type: object
          additionalProperties: false
          properties:
            recipients:
              description: |-
                The email addresses that receive the channel's messages.

                1 to 10 addresses, each an RFC 5322 address of at most 254 characters. Each address can appear only once, ignoring case.
              type: array
              items:
                type: string
                maxLength: 254
                format: email
              maxItems: 10
              minItems: 1
              uniqueItems: true
          required:
            - recipients
      additionalProperties: false
      required:
        - id
        - name
        - labels
        - created_at
        - updated_at
        - type
        - email
    AICostSlackNotificationChannel:
      description: A notification channel that posts each message to a Slack incoming webhook the organization created in its own workspace.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          description: A human-readable name for the channel. Several channels can share a name.
          type: string
        labels:
          description: Key-value metadata on the channel. The channel list can filter by label.
          type: object
          additionalProperties:
            type: string
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        type:
          description: 'Always `slack` for a Slack channel, which carries its settings in `slack`.'
          type: string
          enum:
            - slack
        slack:
          description: The Slack incoming webhook that the channel posts its messages to.
          type: object
          additionalProperties: false
          properties:
            webhook_url:
              description: |-
                The channel's Slack incoming webhook URL with its secret token replaced by `…`, such as `https://hooks.slack.com/services/T0123ABC/B0456DEF/…`. The workspace and webhook IDs it keeps identify where messages go without granting access.

                If the stored URL can no longer be decrypted or validated, the value is `https://hooks.slack.com/services/…`, and the channel's deliveries fail with `slack_invalid_target`.
              type: string
              pattern: '^https://hooks\.slack\.com/services/(?:[A-Za-z0-9_-]+/[A-Za-z0-9_-]+/)?…$'
          required:
            - webhook_url
      additionalProperties: false
      required:
        - id
        - name
        - labels
        - created_at
        - updated_at
        - type
        - slack
    AICostNotificationTestEvent:
      description: |-
        A channel test is a test message sent through a channel's real delivery path, with test wording and example figures, so what arrives shows what an alert will look like.

        `status` shows where the test stands:

        - `pending`: the test message is queued or being sent.
        - `delivered`: Slack or Konnect's email service accepted the test message. A later email bounce doesn't change this status.
        - `failed`: the test message couldn't be delivered, and `error` says why. A test isn't retried, so its first failed attempt fails it.
      discriminator:
        propertyName: status
        mapping:
          pending: '#/components/schemas/AICostNotificationTestEventPending'
          delivered: '#/components/schemas/AICostNotificationTestEventDelivered'
          failed: '#/components/schemas/AICostNotificationTestEventFailed'
      oneOf:
        - $ref: '#/components/schemas/AICostNotificationTestEventPending'
        - $ref: '#/components/schemas/AICostNotificationTestEventDelivered'
        - $ref: '#/components/schemas/AICostNotificationTestEventFailed'
    AICostNotificationTestEventPending:
      description: 'A test message to one channel, still in progress.'
      type: object
      properties:
        kind:
          description: Always `test` for a channel test.
          type: string
          enum:
            - test
        id:
          $ref: '#/components/schemas/UUID'
        channel:
          description: The channel the test message goes to.
          allOf:
            - $ref: '#/components/schemas/AICostNotificationChannelSummary'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        status:
          description: The test message is queued or being sent.
          type: string
          enum:
            - pending
        error:
          description: '`null`, because the test hasn''t failed.'
          type: string
          enum:
            - null
          nullable: true
      additionalProperties: false
      required:
        - kind
        - id
        - channel
        - created_at
        - updated_at
        - status
        - error
    AICostNotificationTestEventDelivered:
      description: A test message to one channel that Slack or Konnect's email service accepted.
      type: object
      properties:
        kind:
          description: Always `test` for a channel test.
          type: string
          enum:
            - test
        id:
          $ref: '#/components/schemas/UUID'
        channel:
          description: The channel the test message goes to.
          allOf:
            - $ref: '#/components/schemas/AICostNotificationChannelSummary'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        status:
          description: Slack or Konnect's email service accepted the test message. A later email bounce doesn't change this status.
          type: string
          enum:
            - delivered
        error:
          description: '`null`, because the test hasn''t failed.'
          type: string
          enum:
            - null
          nullable: true
      additionalProperties: false
      required:
        - kind
        - id
        - channel
        - created_at
        - updated_at
        - status
        - error
    AICostNotificationTestEventFailed:
      description: A test message to one channel that failed.
      type: object
      properties:
        kind:
          description: Always `test` for a channel test.
          type: string
          enum:
            - test
        id:
          $ref: '#/components/schemas/UUID'
        channel:
          description: The channel the test message goes to.
          allOf:
            - $ref: '#/components/schemas/AICostNotificationChannelSummary'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        status:
          description: 'The test message couldn''t be delivered. A test isn''t retried, so its first failed attempt fails it. `error` says why.'
          type: string
          enum:
            - failed
        error:
          description: 'Why the test failed: the same reason a real delivery would carry.'
          allOf:
            - $ref: '#/components/schemas/AICostNotificationDeliveryErrorReason'
      additionalProperties: false
      required:
        - kind
        - id
        - channel
        - created_at
        - updated_at
        - status
        - error
    AICostNotificationThresholdEvent:
      description: |-
        A threshold event is one firing of a budget's notification rule. A firing is a recorded threshold crossing: the record that spend in a budget window reached one of the rule's thresholds.

        The event carries the full budget in `budget` instead of a reference, so a list can show each budget's name and scope without reading the budget.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        budget:
          description: The full budget whose threshold was crossed.
          allOf:
            - $ref: '#/components/schemas/AICostBudget'
        threshold:
          description: The threshold that was reached.
          allOf:
            - $ref: '#/components/schemas/AICostNotificationThreshold'
        value:
          description: 'The value of the `each` field whose derived budget crossed the threshold, or `null` for a pooled budget.'
          type: string
          nullable: true
        window:
          description: The budget window that contained the evaluation that recorded the crossing.
          allOf:
            - $ref: '#/components/schemas/AICostTimeWindow'
        limit:
          description: The budget's limit when the crossing was recorded.
          allOf:
            - $ref: '#/components/schemas/AICostBudgetLimit'
        consumed:
          description: 'The spend that the evaluation counted when it recorded the crossing, in US dollars, as a decimal string. With `each`, it''s the spend of the derived budget in `value`. It can be higher than the threshold''s share of the limit.'
          type: string
        fired_at:
          description: 'When the crossing was recorded, as an RFC 3339 timestamp in UTC.'
          type: string
          format: date-time
        deliveries:
          description: |-
            The deliveries of this firing: one message to each channel the rule listed when the firing was recorded, with its status. Channels deleted since then are left out.

            Only the highest threshold crossed so far sends alerts. The list is empty when a higher threshold fired before or together with this one for the same budget window, derived budget, and limit, or when the rule had no channels.
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/AICostNotificationDeliveryPending'
              - $ref: '#/components/schemas/AICostNotificationDeliveryDelivered'
              - $ref: '#/components/schemas/AICostNotificationDeliveryFailed'
            discriminator:
              propertyName: status
              mapping:
                pending: '#/components/schemas/AICostNotificationDeliveryPending'
                delivered: '#/components/schemas/AICostNotificationDeliveryDelivered'
                failed: '#/components/schemas/AICostNotificationDeliveryFailed'
        kind:
          description: Always `threshold` for a threshold event.
          type: string
          enum:
            - threshold
      required:
        - id
        - budget
        - threshold
        - value
        - window
        - limit
        - consumed
        - fired_at
        - deliveries
        - kind
    AICostExport:
      allOf:
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            dataset:
              description: The data the export holds.
              allOf:
                - $ref: '#/components/schemas/AICostExportDataset'
            focus:
              description: |-
                The FOCUS options of the export, with defaults applied.

                `null` unless `dataset` is `focus`.
              allOf:
                - $ref: '#/components/schemas/AICostFocusOptions'
            format:
              description: The file format of the export's data files.
              allOf:
                - $ref: '#/components/schemas/AICostExportFormat'
            compression:
              description: 'How the export''s data files are compressed. Together with `format`, it sets the files'' extension and content type.'
              allOf:
                - $ref: '#/components/schemas/AICostExportCompression'
            from:
              description: 'The start of the range, inclusive, as an RFC 3339 timestamp in UTC. The export holds the events whose `time` is at or after `from`.'
              type: string
              format: date-time
            to:
              description: 'The end of the range, exclusive, as an RFC 3339 timestamp in UTC. The export holds the events whose `time` is before `to`.'
              type: string
              format: date-time
            time_zone:
              description: 'The IANA time zone that decides where each file''s period starts: a day for a `usage_events` export, or a calendar month for a `focus` export. For a `focus` export, it also decides where the charge and billing periods start.'
              type: string
            filters:
              description: 'The filters that select the exported events. `{}` for none.'
              type: object
              additionalProperties: {}
            schedule:
              description: |-
                The schedule that created the export.

                `null` for a one-time export, and once the schedule is deleted.
              type: object
              nullable: true
              properties:
                id:
                  description: 'The identifier of the schedule that created the export, which the export schedule operations take as `scheduleId`.'
                  type: string
                  format: uuid
              required:
                - id
            status:
              description: 'Where the export is in its lifecycle. A client reads the export again with `GET /v1/ai-cost-management/exports/{exportId}` to follow its progress.'
              allOf:
                - $ref: '#/components/schemas/AICostExportStatus'
            failure_reason:
              description: |-
                Why the export failed. `query_limit_exceeded` means that reading the events took more time or memory than one export may use, so an export with a shorter range or narrower filters can succeed. `attempts_exhausted` means that every attempt failed for a reason that a later attempt could overcome, such as an outage, so the same export created later can succeed.

                The set of reasons can grow, so a client treats a reason it doesn't know as a general failure. `null` unless `status` is `failed`.
              type: string
              nullable: true
            record_count:
              description: |-
                The number of records across all data files.

                `null` until the export succeeds.
              type: integer
              minimum: 0
              nullable: true
            data_read_at:
              description: |-
                When the successful attempt began reading the stored events, as an RFC 3339 timestamp in UTC. An event stored after this time can be missing from the files. Comparing the `data_read_at` and `record_count` of 2 exports of the same range and filters shows whether they differ.

                `null` until the export succeeds.
              type: string
              format: date-time
              nullable: true
            files:
              description: |-
                The data files, in date order. A `usage_events` export has one file for each day of the range in `time_zone`, and a `focus` export has one for each calendar month. The first and last files can cover part of their period, and a period without matching events still has a file, with no records. The list doesn't include `manifest.json`.

                `[]` until the export succeeds.
              type: array
              items:
                type: object
                properties:
                  name:
                    description: 'The file''s name, which the download operation takes as `file`. A `usage_events` file is named by its day as `YYYY-MM-DD`, and a `focus` file by its month as `YYYY-MM`, both in the export''s `time_zone`. The extension that `format` and `compression` set follows, as in `2026-09-01.parquet` or `2026-09.csv.gz`.'
                    type: string
                  record_count:
                    description: The number of records in the file.
                    type: integer
                    minimum: 0
                  size_bytes:
                    description: 'The size of the file as downloaded, in bytes.'
                    type: integer
                    minimum: 0
                  sha256:
                    description: |-
                      The SHA-256 digest of the file as downloaded. A client checks a download by comparing its size and digest with `size_bytes` and `sha256`.

                      64 lowercase hexadecimal digits.
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                required:
                  - name
                  - record_count
                  - size_bytes
                  - sha256
            created_at:
              $ref: '#/components/schemas/CreatedAt'
            updated_at:
              $ref: '#/components/schemas/UpdatedAt'
            started_at:
              description: |-
                When the first attempt started, as an RFC 3339 timestamp in UTC.

                `null` while the export is `pending`.
              type: string
              format: date-time
              nullable: true
            finished_at:
              description: |-
                When the export succeeded or failed, as an RFC 3339 timestamp in UTC.

                `null` until then.
              type: string
              format: date-time
              nullable: true
            expires_at:
              $ref: '#/components/schemas/ExpiresAtNullable'
          required:
            - id
            - dataset
            - focus
            - format
            - compression
            - from
            - to
            - time_zone
            - filters
            - schedule
            - status
            - failure_reason
            - record_count
            - data_read_at
            - files
            - created_at
            - updated_at
            - started_at
            - finished_at
            - expires_at
          description: |-
            An export copies the organization's stored usage events in a time range into files to download. It runs asynchronously: `status` follows its progress, and once it succeeds, `files` lists the data files, which can be downloaded until `expires_at`.

            After creation, only an export's status and results change. A client creates a one-time export, and an export schedule creates one export of each of its periods.
        - anyOf:
            - properties:
                format:
                  enum:
                    - csv
                compression:
                  enum:
                    - none
                    - gzip
            - properties:
                format:
                  enum:
                    - parquet
                compression:
                  enum:
                    - zstd
    AICostExportDataset:
      description: |-
        The data an export holds, which also decides how its files divide the range.

        `usage_events` has one row per stored usage event, with the fields that `GET /v1/ai-cost-management/events` returns for an event, and one file for each day of the range. `focus` holds the AI usage as FinOps FOCUS cost-and-usage data, with one file for each calendar month. Each `focus` row sums the events of one charge period that share a provider, model, region, subject, application, list of groups, and values of the named tag keys.
      type: string
      enum:
        - usage_events
        - focus
    AICostFocusOptions:
      description: 'The FOCUS options of a `focus` export or schedule, with each option''s value or its default.'
      type: object
      properties:
        version:
          description: The FOCUS version that the files follow.
          allOf:
            - $ref: '#/components/schemas/AICostFocusVersion'
        charge_period:
          description: 'The length of each row''s charge period: a calendar day or an hour in `time_zone`, which `ChargePeriodStart` and `ChargePeriodEnd` bound. The range selects the events and doesn''t shorten the first or last period, so those periods can extend beyond `from` and `to`.'
          allOf:
            - $ref: '#/components/schemas/AICostFocusChargePeriod'
        tag_keys:
          description: 'The tag keys whose values split the rows, and a row''s `Tags` column holds the named keys that its events carry, with their values. `[]` when the request named none.'
          type: array
          items:
            type: string
      nullable: true
      required:
        - version
        - charge_period
        - tag_keys
    AICostFocusVersion:
      description: |-
        A version of the FinOps FOCUS standard, which decides what a file's cost columns hold. FOCUS reserves those columns for amounts that the invoice issuer bills. The service doesn't invoice model usage, and its only cost is the estimate that the gateway reports for each event.

        `1.4` sets `BilledCost`, `EffectiveCost`, `ListCost`, and `ContractedCost` to `0` and carries the estimate in `x_ReportedCost`, so a `1.4` file merges with the model provider's own FOCUS data without counting the spend twice. `1.3` carries the estimate in those cost columns as well as in `x_ReportedCost`, so a `1.3` file shows the estimate as spend.

        **A `1.3` file loaded beside the model provider's own FOCUS data counts the same spend twice.**
      type: string
      enum:
        - '1.3'
        - '1.4'
      x-enum-varnames:
        - V1_3
        - V1_4
    AICostFocusChargePeriod:
      description: 'The length of a FOCUS row''s charge period: `day` for a calendar day or `hour` for an hour, in the export''s `time_zone`. A day lasts 23 or 25 hours when the clocks change.'
      type: string
      enum:
        - day
        - hour
    AICostExportFormat:
      description: 'The file format of an export''s data files: `csv` for UTF-8 CSV text with a header row, or `parquet` for Apache Parquet with the same columns in typed form. Each format allows its own `compression` values.'
      type: string
      enum:
        - parquet
        - csv
    AICostExportCompression:
      description: |-
        How an export's data files are compressed. Each value is valid with one format only, and sets the files' extension and content type:

        - `none`: uncompressed CSV, for `csv`. The files end in `.csv` and have the content type `text/csv; charset=utf-8`.
        - `gzip`: gzip-compressed CSV, for `csv`. The files end in `.csv.gz` and have the content type `application/gzip`.
        - `zstd`: Parquet with Zstandard-compressed columns, the only value for `parquet`. The files end in `.parquet` and have the content type `application/vnd.apache.parquet`.

        A download carries no `Content-Encoding` header, so its bytes match the file's `size_bytes` and `sha256`.
      type: string
      enum:
        - none
        - gzip
        - zstd
    AICostExportStatus:
      description: |-
        Where an export is in its lifecycle. An export moves from `pending` to `running`, and then to `succeeded` or `failed`:

        - `pending`: the export waits to run. Only one export per organization runs at a time, and the others wait as `pending`.
        - `running`: an attempt has started, and the export hasn't finished. When an attempt fails and another follows, the export stays `running` in between.
        - `succeeded`: the files can be downloaded until `expires_at`, 30 days after the export finishes.
        - `failed`: the export stopped without files, and `failure_reason` says why.
        - `expired`: the export succeeded, but `expires_at` has passed, so its files can't be downloaded. The export keeps its `files` list and its other results.
      type: string
      enum:
        - pending
        - running
        - succeeded
        - failed
        - expired
    AICostExportSchedule:
      allOf:
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            name:
              description: |-
                A human-readable name for the schedule.

                1 to 100 characters after the server removes leading and trailing whitespace.
              type: string
            cadence:
              description: |-
                The length of each period, which sets the range of each export.

                A replacement can't change it.
              allOf:
                - $ref: '#/components/schemas/AICostExportScheduleCadence'
            time_zone:
              description: |-
                The IANA time zone in which the periods start. Each export that the schedule creates has this `time_zone`.

                A replacement can't change it.
              type: string
            status:
              description: Whether the schedule creates exports.
              allOf:
                - $ref: '#/components/schemas/AICostExportScheduleStatus'
            dataset:
              description: The data that each export holds.
              allOf:
                - $ref: '#/components/schemas/AICostExportDataset'
            focus:
              description: |-
                The FOCUS options of each export, with defaults applied.

                `null` unless `dataset` is `focus`.
              allOf:
                - $ref: '#/components/schemas/AICostFocusOptions'
            format:
              description: The file format of each export's data files.
              allOf:
                - $ref: '#/components/schemas/AICostExportFormat'
            compression:
              description: How each export's data files are compressed.
              allOf:
                - $ref: '#/components/schemas/AICostExportCompression'
            filters:
              description: 'The filters of each export. `{}` for none.'
              type: object
              additionalProperties: {}
            next_run_at:
              description: |-
                When the period in progress ends and the schedule creates its export, as an RFC 3339 timestamp in UTC. That export starts 6 hours later, so that events that arrive late can be stored first.

                `null` while the schedule is `paused`. It's in the past while a run is late.
              type: string
              format: date-time
              nullable: true
            created_at:
              $ref: '#/components/schemas/CreatedAt'
            updated_at:
              $ref: '#/components/schemas/UpdatedAt'
          required:
            - id
            - name
            - cadence
            - time_zone
            - status
            - dataset
            - focus
            - format
            - compression
            - filters
            - next_run_at
            - created_at
            - updated_at
          description: |-
            An export schedule exports the organization's usage period by period, such as month by month. An `active` schedule creates one export of each period as the period ends. Each export is an ordinary export whose `schedule` names the schedule: it's listed, downloaded, and expires like a one-time export. Its files follow the dataset's rule, one for each day for `usage_events` and one for each calendar month for `focus`, so each export of a `daily` `usage_events` schedule or a `monthly` `focus` schedule has one file.

            - The export of a period has the period's start as `from` and its end as `to`, and the schedule's other settings as they are when the export is created.
            - When a schedule becomes `active`, by creation or by resuming, its first period is the one in progress. That period's export covers the whole period, including the time before the schedule became `active`.
            - A schedule exports each period once and never refreshes it, even when events of the period arrive later. To include them, a client creates a one-time export of the same range.
            - When runs are late, for example after an outage, the schedule catches up on at most the 31 most recent periods that ended while it was `active`, and skips older ones.
        - anyOf:
            - properties:
                format:
                  enum:
                    - csv
                compression:
                  enum:
                    - none
                    - gzip
            - properties:
                format:
                  enum:
                    - parquet
                compression:
                  enum:
                    - zstd
    AICostExportScheduleCadence:
      description: |-
        The length of a schedule's periods, in the schedule's `time_zone`:

        - `daily`: a day, from the start of one day to the start of the next.
        - `weekly`: a week, from the start of a Monday to the start of the next Monday.
        - `monthly`: a calendar month, from the start of its first day to the start of the next month's first day.

        Each period ends where the next one starts, so the periods follow each other without a gap or an overlap. A day lasts 23 or 25 hours when the clocks change.
      type: string
      enum:
        - daily
        - weekly
        - monthly
    AICostExportScheduleStatus:
      description: 'Whether a schedule creates exports. An `active` schedule creates an export of each period as the period ends. A `paused` schedule skips every period that ends while it is paused, and resuming the schedule doesn''t export those periods.'
      type: string
      enum:
        - active
        - paused
