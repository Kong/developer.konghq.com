    put:
      operationId: replace-notification-rule
      summary: Create or replace a notification rule
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Creates a limit budget's notification rule, or replaces its `thresholds`, `channels`, and `message`, and returns the rule. The response status is `201` when the request creates the rule and `200` when it replaces one.

        - The service evaluates the rule at once, so a threshold that spend in the current budget window has already reached fires right away. A threshold already recorded for this budget window and limit doesn't fire again.
        - Omitting `message` or sending `null` restores the built-in wording.
        - Removing a threshold or channel keeps the firings and deliveries already recorded.
        - If a listed channel doesn't exist in the organization, the request fails with `400`, and `invalid_parameters` names `channels[i].id` with the rule `missing_reference`.
        - If `message` uses an unknown placeholder, or uses `{{entity.field}}` or `{{entity.value}}` on a budget without `each`, the request fails with `400`.
