        - An omitted `labels`, `priority`, or `posture` resets to its default.
        - `effect`, `scope`, and `window` can't change. If the request changes one, it fails with `400` naming the field. Redefining them takes a delete and a create.
        - Every replacement evaluates the budget's notification rule against the stored limit. A threshold that spend in the current budget window has reached fires at once, unless it already fired for that limit, so a changed limit lets the thresholds fire again. The evaluation runs after the budget is stored, so if it fails, retrying the same request completes it.
