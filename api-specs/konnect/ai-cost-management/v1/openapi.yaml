  securitySchemes:
    systemAccountAccessToken:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: |
        The system account access token is meant for automations and integrations that are not directly associated with a human identity.
        You can generate a system account Access Token by creating a system account and then obtaining a system account access token for that account.
        The access token must be passed in the header of a request, for example:
        `curl -X GET 'https://global.api.konghq.com/v2/users/' --header 'Authorization: Bearer spat_i2Ej...'`
    personalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: |
        The personal access token is meant to be used as an alternative to basic-auth when accessing Konnect via APIs.
        You can generate a Personal Access Token (PAT) from the [personal access token page](https://cloud.konghq.com/global/account/tokens/) in the Konnect dashboard.
        The PAT token must be passed in the header of a request, for example:
        `curl -X GET 'https://global.api.konghq.com/v2/users/' --header 'Authorization: Bearer kpat_xgfT...'`
    konnectAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The Konnect access token is meant to be used by the Konnect dashboard and the decK CLI authenticate with.
tags:
  - name: usage-events
    description: 'Usage events record each call to an AI model. These operations report and list the events, total them, forecast the month''s spend, and list the values seen in each field.'
  - name: budgets
    description: 'Budgets set spending limits, or exemptions from them, for parts of the organization''s usage. These operations manage budgets and their notification rules, and read balances, firings, and notification events.'
  - name: notification-channels
    description: Notification channels are the email recipient lists and Slack incoming webhooks that budget alerts go to. These operations manage the channels and send test messages.
  - name: exports
    description: 'Exports copy the organization''s cost and usage data into files to download. These operations manage one-time exports and export schedules, and download the files.'
security:
  - systemAccountAccessToken: []
  - personalAccessToken: []
  - konnectAccessToken: []
