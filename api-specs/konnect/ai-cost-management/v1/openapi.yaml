      parameters:
        - name: budgetId
          in: path
          description: The `id` of the budget.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                thresholds:
                  description: |-
