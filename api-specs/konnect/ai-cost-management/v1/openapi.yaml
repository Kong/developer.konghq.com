                    - `{{period}}`: the budget window, in the time zone of its anchor.
                    - `{{period.start}}`: when the budget window started.
                    - `{{period.end}}`: when the budget window ends and the budget resets.
                    - `{{period.remaining}}`: how long is left in the budget window, such as `8 days` or `3 hours`.
                    - `{{entity.field}}`: the `each` field as a noun, such as `group` or `user`.
                    - `{{entity.value}}`: the value whose derived budget crossed the threshold. A principal or consumer reference shows as its name when the name can be found.

                    `{{entity.field}}` and `{{entity.value}}` work only on a budget with `each`. Defaults to `null`.
                  type: object
                  additionalProperties: false
                  nullable: true
                  properties:
                    subject:
                      description: |-
                        The subject line of the rule's alerts, as plain text that can contain placeholders such as `{{budget.name}}`.

                        A single line of 1 to 200 characters after the server removes leading and trailing whitespace.
                      type: string
                      maxLength: 200
                      minLength: 1
                      pattern: '^[^\r\n]*$'
                      x-placeholder-syntax: '{{name}}'
                      x-placeholders:
                        - budget.name
                        - budget.url
                        - threshold
                        - allocation
                        - spend
                        - percent
                        - remaining
                        - projected
                        - period
                        - period.start
                        - period.end
                        - period.remaining
                        - entity.field
                        - entity.value
                    body:
                      description: |-
                        The text of the rule's alerts, as plain text that can contain placeholders such as `{{budget.name}}`. Blank lines separate paragraphs.

                        1 to 2000 characters after the server removes leading and trailing whitespace.
                      type: string
                      maxLength: 2000
                      minLength: 1
                      x-placeholder-syntax: '{{name}}'
                      x-placeholders:
                        - budget.name
                        - budget.url
                        - threshold
                        - allocation
                        - spend
                        - percent
                        - remaining
                        - projected
                        - period
                        - period.start
                        - period.end
                        - period.remaining
                        - entity.field
                        - entity.value
                  required:
                    - subject
                    - body
              additionalProperties: false
              required:
                - thresholds
