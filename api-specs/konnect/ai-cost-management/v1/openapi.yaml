  /ai-cost-management/events/forecast:
    get:
      operationId: forecast-usage-events
      summary: Get the monthly spend forecast
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Returns the organization's recorded and predicted spend, in US dollars, for each day of the current calendar month in `time_zone`. The prediction trains on up to 28 completed days, and the day in progress never counts. Each series covers at most one calendar month, so the response isn't paginated.

        Predictions are statistical estimates. They don't check or enforce any budget.
      parameters:
        - name: method
          in: query
          description: |-
            The prediction method:

            - `auto`: `weekly_seasonal` once 14 completed training days exist, and `exponential_smoothing` before that.
            - `weekly_seasonal`: the mean daily spend for each weekday. Needs 14 completed training days.
            - `linear_regression`: a straight-line fit of daily spend, extended to the end of the month. Needs 2 completed training days.
            - `exponential_smoothing`: a weighted average of recent daily spend, carried forward. Needs 2 completed training days.

            A method named in the request never falls back to another when the history is too short. The response's `status` is then `insufficient_history`. Defaults to `auto`.
          schema:
            type: string
            default: auto
            enum:
              - auto
              - weekly_seasonal
              - linear_regression
              - exponential_smoothing
        - name: time_zone
          in: query
          description: |-
            The IANA time zone whose calendar sets the month and its days.

            The name must be spelled as the time zone database spells it, such as `Europe/Budapest`, not `europe/budapest`. Offsets such as `+02:00` aren't accepted. Defaults to `UTC`.
          schema:
            type: string
            format: iana-time-zone
            default: UTC
      responses:
        '200':
          description: The month's recorded daily spend and the forecast for the rest of the month.
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    description: 'The calendar month the forecast covers: the current month in `time_zone`.'
                    type: object
                    properties:
                      from:
                        description: 'The start of the month, as an RFC 3339 timestamp in UTC.'
                        type: string
                        format: date-time
                      to:
                        description: 'The end of the month, as an RFC 3339 timestamp in UTC. The month ends just before this time.'
                        type: string
                        format: date-time
                      time_zone:
                        description: The IANA time zone of the month and its days. `UTC` when the request omits `time_zone`.
                        type: string
                        format: iana-time-zone
                    required:
                      - from
                      - to
                      - time_zone
                  observed_at:
                    description: 'The end of the observed history, as an RFC 3339 timestamp in UTC. It''s the start of the day in progress in `time_zone`, so `actual` and the training history cover only the completed days before it.'
                    type: string
                    format: date-time
                  generated_at:
                    description: 'When the service computed the forecast, as an RFC 3339 timestamp in UTC.'
                    type: string
                    format: date-time
                  method:
                    description: 'The method the service used. For a request with `auto`, it''s the method that `auto` chose, so it''s never `auto`.'
                    type: string
                    enum:
                      - weekly_seasonal
                      - linear_regression
                      - exponential_smoothing
                  status:
                    description: 'Whether the forecast has predictions. It''s `ready` when `predicted` holds them, and `insufficient_history` when `method` has fewer completed training days than it needs, in which case `predicted` is empty.'
                    type: string
                    enum:
                      - ready
                      - insufficient_history
                  training:
                    description: 'The completed days whose spend trains the prediction, at most the last 28. Days before the organization''s first event since the start of the previous month don''t count, and later days without events count as zero spend.'
                    type: object
                    properties:
                      from:
                        description: |-
                          The start of the training history, as an RFC 3339 timestamp in UTC.

                          `null` when no completed day since the start of the previous month has an event.
                        type: string
                        format: date-time
                        nullable: true
                      to:
                        description: 'The end of the training history, as an RFC 3339 timestamp in UTC. The history ends just before this time, which equals `observed_at`.'
                        type: string
                        format: date-time
                      days:
                        description: 'The number of completed days in `time_zone` that train the prediction, at most 28.'
                        type: integer
                        maximum: 28
                        minimum: 0
                    required:
                      - from
                      - to
                      - days
                  actual:
                    description: 'The recorded spend for each completed day of the month, oldest first.'
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          description: 'The calendar date in `time_zone`, such as `2026-09-01`.'
                          type: string
                          format: date
                        spend:
                          description: 'The day''s spend, in US dollars, as a decimal string with at most 9 fractional digits. In `predicted`, it''s an estimate.'
                          type: string
                          pattern: '^(?:0|[1-9]\d{0,28})(?:\.\d{0,8}[1-9])?$'
                        cumulative_spend:
                          description: 'The month''s spend up to and including this day, in US dollars, as a decimal string with at most 9 fractional digits. In `predicted`, it''s the recorded spend plus the estimates up to this day.'
                          type: string
                          pattern: '^(?:0|[1-9]\d{0,28})(?:\.\d{0,8}[1-9])?$'
                      required:
                        - date
                        - spend
                        - cumulative_spend
                    maxItems: 31
                  predicted:
                    description: 'The predicted spend for each remaining day of the month, from the day of `observed_at` through the last day, oldest first. Empty when `status` is `insufficient_history`.'
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          description: 'The calendar date in `time_zone`, such as `2026-09-01`.'
                          type: string
                          format: date
                        spend:
                          description: 'The day''s spend, in US dollars, as a decimal string with at most 9 fractional digits. In `predicted`, it''s an estimate.'
                          type: string
                          pattern: '^(?:0|[1-9]\d{0,28})(?:\.\d{0,8}[1-9])?$'
                        cumulative_spend:
                          description: 'The month''s spend up to and including this day, in US dollars, as a decimal string with at most 9 fractional digits. In `predicted`, it''s the recorded spend plus the estimates up to this day.'
                          type: string
                          pattern: '^(?:0|[1-9]\d{0,28})(?:\.\d{0,8}[1-9])?$'
                      required:
                        - date
                        - spend
                        - cumulative_spend
                    maxItems: 31
                required:
                  - period
                  - observed_at
                  - generated_at
                  - method
                  - status
                  - training
                  - actual
                  - predicted
        '400':
          description: A query parameter is invalid. `invalid_parameters` names each invalid parameter. An unknown or repeated parameter counts as invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: 'The request has no valid access token. The token is missing, malformed, or expired, or it fails another check, and the response doesn''t say which.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 'The access token is valid, but its principal lacks the permission this operation requires. For an operation on one resource, the response doesn''t reveal whether that resource exists.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      tags:
        - usage-events
  /ai-cost-management/budgets:
    get:
      operationId: list-budgets
      summary: List budgets
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Returns a page of the organization's budgets, newest first unless the request sets `sort`. Filters on `name`, `effect`, `priority`, `posture`, and `labels.<key>` narrow the list.
      parameters:
        - name: filter
          in: query
          description: |-
            Narrows the list. Each filter has the form `filter[field][operator]=value`, or `filter[field]=value` for `eq`. An operator that takes no value, such as `exists`, leaves out `=value`.

            A request can combine several filters, and every filter must match.
          schema:
            $ref: '#/components/schemas/AICostBudgetFilterParameters'
          explode: true
          style: deepObject
        - name: sort
          in: query
          description: |-
            The order of the results, as a comma-separated list of fields in priority order. Each field can be followed by a space and `asc` or `desc`, and sorts in ascending order without one. The service breaks ties so that the order is unique.

            Sortable fields: `name`, `priority`, `created_at`, `updated_at`. Defaults to `created_at desc`.
          schema:
            type: string
        - name: 'page[size]'
          in: query
          description: |-
            The number of results on each page.

            1 to 100. A larger value is reduced to 100. Defaults to `20`.
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
        - name: 'page[after]'
          in: query
          description: |-
            A cursor for the page after an earlier response's page. Clients take it from that response's `meta.page.next` link, which also carries the request's other parameters, and don't build or change it.

            A request can't send both `page[after]` and `page[before]`.
          schema:
            type: string
        - name: 'page[before]'
          in: query
          description: |-
            A cursor for the page before an earlier response's page. Clients take it from that response's `meta.page.previous` link, which also carries the request's other parameters, and don't build or change it.

            A request can't send both `page[after]` and `page[before]`.
          schema:
            type: string
      responses:
        '200':
          description: A page of budgets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: 'The budgets on this page, in `sort` order.'
                    type: array
                    items:
                      $ref: '#/components/schemas/AICostBudget'
                  meta:
                    $ref: '#/components/schemas/CursorMeta'
                required:
                  - data
                  - meta
        '400':
          description: A query parameter is invalid. `invalid_parameters` names each invalid parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: 'The request has no valid access token. The token is missing, malformed, or expired, or it fails another check, and the response doesn''t say which.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 'The access token is valid, but its principal lacks the permission this operation requires. For an operation on one resource, the response doesn''t reveal whether that resource exists.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
      tags:
