  '/ai-cost-management/budgets/{budgetId}/balance':
    get:
      operationId: get-budget-balance
      summary: Get a budget's balance
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Returns a limit budget's spend, remaining amount, and projected spend in the budget window that contains `evaluated_at`, with the balances of the derived budgets with the highest spend.

        The amounts count the usage stored when the request runs. `latest_record_at` shows when the newest counted usage reached the service. Only a limit budget has a balance, so if the budget is an exemption, the request fails with `400`. If the organization has no budget with this identifier, or the identifier isn't a valid UUID, the request fails with `404`.
      parameters:
        - name: budgetId
          in: path
          description: The `id` of the budget.
          required: true
          schema:
            type: string
            format: uuid
        - name: size
          in: query
          description: |-
            The maximum number of derived budgets in `derived`, which lists the highest spend first.

            1 to 100. A larger value is reduced to 100. Defaults to `20`.
          schema:
            type: integer
            maximum: 100
            minimum: 1
        - name: evaluated_at
          in: query
          description: |-
            The time to calculate the balances for, as an RFC 3339 timestamp in UTC. It selects the budget window, not the usage: the amounts include all usage stored when the request runs. To see the same budget window as an earlier read, pass that read's `evaluated_at`.

            Must not be in the future. Defaults to the time of the request.
          schema:
            type: string
            format: date-time
            pattern: '^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$'
      responses:
        '200':
          description: The budget's balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  budget:
                    description: The budget the balance belongs to.
                    allOf:
                      - $ref: '#/components/schemas/AICostBudgetReference'
                  window:
                    description: The budget window that contains `evaluated_at`.
                    allOf:
                      - $ref: '#/components/schemas/AICostTimeWindow'
                  limit:
                    description: The limit that `remaining` is measured against.
                    allOf:
                      - $ref: '#/components/schemas/AICostBudgetLimit'
                  consumed:
                    description: 'The spend of all usage in the budget''s scope during the budget window, in US dollars, as a decimal string. With `each`, it''s the total for the whole budget: each event counts once, including usage without a value for the `each` field.'
                    type: string
                  remaining:
                    description: 'The limit minus `consumed`, in US dollars, as a decimal string. Negative once spend exceeds the limit.'
                    type: string
                  projected:
                    description: 'Where `consumed` ends the budget window at the current pace, in US dollars, as a decimal string rounded to the cent. The pace extrapolates `consumed` over the whole window from the share of it that has elapsed at `evaluated_at`, counting at least one twentieth.'
                    type: string
                  evaluated_at:
                    description: 'The time the balance is calculated for, as an RFC 3339 timestamp in UTC. It selects the budget window.'
                    type: string
                    format: date-time
                  latest_record_at:
                    description: |-
                      When the newest usage counted in the balance reached the service, as an RFC 3339 timestamp in UTC. It doesn't show that all earlier usage has arrived.

                      `null` when no usage matches.
                    type: string
                    format: date-time
                    nullable: true
                  derived:
                    description: |-
                      The balances of the derived budgets with the highest spend, highest first, at most as many as the `size` query parameter allows.

                      Empty for a budget without `each`.
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          description: The value of the `each` field that defines this derived budget.
                          type: string
                        consumed:
                          description: 'The spend of this derived budget in the budget window, in US dollars, as a decimal string.'
                          type: string
                        remaining:
                          description: 'The limit minus this derived budget''s `consumed`, in US dollars, as a decimal string. Negative once spend exceeds the limit.'
                          type: string
                        projected:
                          description: 'Where this derived budget''s `consumed` ends the budget window at the current pace, in US dollars, as a decimal string rounded to the cent.'
                          type: string
                      required:
                        - value
                        - consumed
                        - remaining
                        - projected
                  derived_truncated:
                    description: '`true` when more derived budgets exist than `derived` lists. It isn''t a pagination cursor: `GET /v1/ai-cost-management/budget-balances` with `filter[budget.id]` lists the balance of every derived budget.'
                    type: boolean
                required:
                  - budget
                  - window
                  - limit
                  - consumed
                  - remaining
                  - projected
                  - evaluated_at
                  - latest_record_at
                  - derived
                  - derived_truncated
        '400':
          description: 'A query parameter is invalid. `invalid_parameters` names each invalid parameter. An exemption also fails with this status, with `invalid_parameters` naming `budgetId`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: 'The request has no valid access token. The token is missing, malformed, or expired, or it fails another check, and the response doesn''t say which.'
