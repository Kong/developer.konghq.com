              readOnly: true
              title: Code
            message:
              description: Human-readable description of the error.
              type: string
              readOnly: true
              title: Message
            attributes:
              description: Additional structured context.
              type: object
              additionalProperties: {}
              readOnly: true
              title: Attributes
          readOnly: true
          required:
            - code
