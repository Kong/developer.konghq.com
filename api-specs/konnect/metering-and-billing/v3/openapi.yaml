                  title: Line 2
                phone_number:
                  description: Phone number.
                  type: string
                  title: Phone Number
              title: Billing Address
            id:
              $ref: '#/components/schemas/ULID'
            key:
              description: |-
                Optional external resource key for the customer.

                Omitted when the customer was created without a key. Unlike on the customer
                resource itself, the key is optional here because the invoice snapshot may
                predate or omit it.
              type: string
              example: 019ae40f-4258-7f15-9491-842f42a7d6ac
              maxLength: 256
              minLength: 1
              title: External Resource Key
          required:
            - name
            - id
          title: Customer
        totals:
          description: Aggregated financial totals for the invoice.
          type: object
          additionalProperties: false
          properties:
            amount:
              description: 'The total value of the resource before taxes, discounts and commitments.'
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Amount
            taxes_total:
              description: The total tax amount applied to the resource.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Taxes total
            taxes_inclusive_total:
              description: The total tax amount already included in the resource amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Inclusive taxes total
            taxes_exclusive_total:
              description: The total tax amount added on top of the resource amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Exclusive taxes total
            charges_total:
              description: The total amount contributed by additional charges.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Charges total
            discounts_total:
              description: The total amount deducted through discounts.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Discounts total
            credits_total:
              description: The total amount deducted through credits before taxes are applied.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Credits total
            total:
              description: 'The final total value of the resource after taxes, discounts and commitments.'
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Total
          readOnly: true
          required:
            - amount
            - taxes_total
            - taxes_inclusive_total
            - taxes_exclusive_total
            - charges_total
            - discounts_total
            - credits_total
            - total
          title: Totals
        service_period:
          description: |-
            The service period covered by this invoice.

            For flat fee the service period can be empty which means `from` will be equals
            to `to`. In other cases those fields will be filled with the actual service
            period.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Service period
        validation_issues:
          description: |-
            Validation issues found during invoice processing.

            Present only when there are one or more validation findings. An empty list is
            omitted.
          type: array
          items:
            $ref: '#/components/schemas/BillingValidationIssue'
          readOnly: true
          title: Validation issues
        external_references:
          description: External identifiers assigned to this invoice by third-party systems.
          type: object
          additionalProperties: false
          properties:
            invoicing_id:
              description: The ID assigned by the external invoicing app (e.g. Stripe invoice ID).
              type: string
              readOnly: true
              title: Invoicing ID
            payment_id:
              description: The ID assigned by the external payment app (e.g. Stripe payment intent ID).
              type: string
              readOnly: true
              title: Payment ID
          readOnly: true
          title: External references
        type:
          description: Discriminator field identifying this as a standard invoice.
          type: string
          enum:
            - standard
          title: Type
        status:
          description: Current lifecycle status of the invoice.
          type: string
          enum:
            - draft
            - issuing
            - issued
            - payment_processing
            - overdue
            - paid
            - uncollectible
            - voided
          readOnly: true
          title: Status
        status_details:
          description: Detailed status information including available actions and workflow state.
          type: object
          additionalProperties: false
          properties:
            immutable:
              description: Whether the invoice is immutable (i.e. cannot be modified or deleted).
              type: boolean
              readOnly: true
              title: Immutable
            failed:
              description: Whether the invoice is in a failed state.
              type: boolean
              readOnly: true
              title: Failed
            extended_status:
              description: |-
                Fine-grained internal status string providing additional workflow detail beyond
                the top-level status enum.
              type: string
              readOnly: true
              title: Extended status
            available_actions:
              description: The set of state-transition actions currently available for this invoice.
              type: object
              additionalProperties: false
              properties:
                advance:
                  description: Advance the invoice to the next workflow step.
                  type: object
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Advance
                approve:
                  description: Approve the invoice for issuance.
                  type: object
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Approve
                delete:
                  description: Delete the invoice.
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Delete
                  type: object
                retry:
                  description: Retry a failed workflow step.
                  type: object
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Retry
                snapshot_quantities:
                  description: Snapshot the current usage quantities.
                  type: object
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Snapshot quantities
              readOnly: true
              title: Available actions
          readOnly: true
          required:
            - immutable
            - failed
            - extended_status
            - available_actions
          title: Status details
        issued_at:
          description: Timestamp when the invoice was issued to the customer.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Issued at
        draft_until:
          description: |-
            Timestamp until which the invoice remains in draft state.

            The invoice advances automatically once this time is reached.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Draft until
        quantity_snapshotted_at:
          description: Timestamp when usage quantities were last snapshotted for this invoice.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Quantity snapshotted at
        collection_at:
          description: Timestamp when collection was initiated for this invoice.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Collection at
        due_at:
          description: Timestamp when payment is due.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Due at
        sent_to_customer_at:
          description: Timestamp when the invoice was sent to the customer.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Sent to customer at
        workflow:
          description: Workflow configuration snapshot captured at invoice creation time.
          type: object
          additionalProperties: false
          properties:
            apps:
              description: The apps that will be used to orchestrate the invoice's workflow.
              type: object
              additionalProperties: false
              properties:
                tax:
                  description: The tax app used for this workflow
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      description: The ID of the app.
                      type: string
                      example: 01G65Z755AFWAKHE12NY0CQ9FH
                      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                      title: ULID
                  readOnly: true
                  required:
                    - id
                invoicing:
                  description: The invoicing app used for this workflow
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      description: The ID of the app.
                      type: string
                      example: 01G65Z755AFWAKHE12NY0CQ9FH
                      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                      title: ULID
                  readOnly: true
                  required:
                    - id
                payment:
                  description: The payment app used for this workflow
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      description: The ID of the app.
                      type: string
                      example: 01G65Z755AFWAKHE12NY0CQ9FH
                      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                      title: ULID
                  readOnly: true
                  required:
                    - id
              readOnly: true
              required:
                - tax
                - invoicing
                - payment
              title: Application that generated the invoice
            source_billing_profile:
              description: The billing profile that was the source of this workflow snapshot.
              type: object
              additionalProperties: false
              properties:
                id:
                  description: The ID of the billing profile.
                  type: string
                  example: 01G65Z755AFWAKHE12NY0CQ9FH
                  pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  title: ULID
              readOnly: true
              required:
                - id
              title: Source billing profile
            workflow:
              description: |-
                The workflow configuration that was active when the invoice was created.

                Only the fields that are meaningful at the per-invoice level are included:
                invoicing behaviour (auto-advance, draft period) and payment settings
                (collection method, due date). Profile-wide settings such as collection
                alignment, progressive billing, and tax policy are omitted.
              type: object
              additionalProperties: false
              properties:
                invoicing:
                  description: Invoicing settings for this invoice.
                  type: object
                  additionalProperties: false
                  properties:
                    auto_advance:
                      description: Whether to automatically issue the invoice after the draft_period has passed.
                      type: boolean
                      default: true
                    draft_period:
                      description: The period for the invoice to be kept in draft status for manual reviews.
                      type: string
                      format: ISO8601
                      example: P1D
                      default: P0D
                    due_after:
                      description: The period after which the invoice is considered overdue if not paid.
                      type: string
                      format: ISO8601
                      example: P30D
                      readOnly: true
                  title: Invoicing settings
                payment:
                  description: Payment settings for this invoice.
                  type: object
                  discriminator:
                    propertyName: collection_method
                    mapping:
                      charge_automatically: '#/components/schemas/BillingWorkflowPaymentChargeAutomaticallySettings'
                      send_invoice: '#/components/schemas/BillingWorkflowPaymentSendInvoiceSettings'
                  oneOf:
                    - $ref: '#/components/schemas/BillingWorkflowPaymentChargeAutomaticallySettings'
                    - $ref: '#/components/schemas/BillingWorkflowPaymentSendInvoiceSettings'
                  title: Payment settings
              title: Workflow config
          required:
            - source_billing_profile
            - workflow
          title: Workflow
        lines:
          description: |-
            Line items on this invoice.

            Always returned on single-resource GET; omitted on list endpoints unless
            explicitly expanded. Editable via update: existing lines are matched by `id`,
            lines without an `id` are created, and lines present on the invoice but omitted
            from the update request are deleted. Detailed (child) lines are always computed
            and cannot be edited directly.
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoiceLine'
          title: Lines
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - number
        - currency
        - supplier
        - customer
        - totals
        - service_period
        - type
        - status
        - status_details
        - workflow
    BillingInvoiceStandardLine:
      description: |-
        A top-level line item on an invoice.

        Each line represents a single charge, typically associated with a rate card from
        a subscription. Detailed (child) lines are nested under `detailed_lines` when
        present.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        id:
          description: |-
            ID of the line.

            Optional on update: omit to create a new line, or supply the ID of an existing
            line to edit it. Existing lines omitted from an update's `lines` array are
            deleted.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          title: ID
        type:
          description: The type of charge this line item represents.
          type: string
          enum:
            - standard_line
          title: Type
        lifecycle_controller:
          description: |-
            Indicates whether this line item's lifecycle is controlled by OpenMeter or
            manually overridden by the API user.
          type: string
          enum:
            - system
            - manual
          readOnly: true
          title: Lifecycle controller
        service_period:
          description: |-
            The service period covered by this invoice, spanning the earliest line start to
            the latest line end across all of its lines.

            For an invoice with no lines the period is empty, which means `from` will be
            equal to `to`.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          required:
            - from
            - to
          title: Service period
        totals:
          description: Aggregated financial totals for the line item.
          type: object
          additionalProperties: false
          properties:
            amount:
              description: 'The total value of the resource before taxes, discounts and commitments.'
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Amount
            taxes_total:
              description: The total tax amount applied to the resource.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Taxes total
            taxes_inclusive_total:
              description: The total tax amount already included in the resource amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Inclusive taxes total
            taxes_exclusive_total:
              description: The total tax amount added on top of the resource amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Exclusive taxes total
            charges_total:
              description: The total amount contributed by additional charges.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Charges total
            discounts_total:
              description: The total amount deducted through discounts.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Discounts total
            credits_total:
              description: The total amount deducted through credits before taxes are applied.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Credits total
            total:
              description: 'The final total value of the resource after taxes, discounts and commitments.'
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Total
          readOnly: true
          required:
            - amount
            - taxes_total
            - taxes_inclusive_total
            - taxes_exclusive_total
            - charges_total
            - discounts_total
            - credits_total
            - total
          title: Totals
        discounts:
          description: Discounts applied to this line item.
          type: object
          additionalProperties: false
          properties:
            amount:
              description: Monetary amount discounts (e.g. from maximum spend commitments).
              type: array
              items:
                $ref: '#/components/schemas/BillingInvoiceLineAmountDiscount'
              readOnly: true
              title: Amount discounts
            usage:
              description: Usage quantity discounts (e.g. free tier usage allowances).
              type: array
              items:
                $ref: '#/components/schemas/BillingInvoiceLineUsageDiscount'
              readOnly: true
              title: Usage discounts
          readOnly: true
          title: Discounts
        credits_applied:
          description: Credit applied to this line item.
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoiceLineCreditsApplied'
          readOnly: true
          title: Credit applied
        external_references:
          description: External identifiers for this line item assigned by third-party systems.
          type: object
          additionalProperties: false
          properties:
            invoicing_id:
              description: The ID assigned by the external invoicing app.
              type: string
              readOnly: true
              title: Invoicing ID
          readOnly: true
          title: External references
        subscription:
          description: Reference to the subscription item that generated this line.
          type: object
          additionalProperties: false
          properties:
            id:
              description: The ID of the subscription.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: Subscription ID
            name:
              description: |-
                The display name of the subscription.

                Only populated where the referencing endpoint documents a `subscription` expand
                that resolves it.
              type: string
              readOnly: true
              title: Subscription name
            phase:
              description: The phase of the subscription.
              type: object
              additionalProperties: false
              properties:
                id:
                  description: The ID of the phase.
                  type: string
                  example: 01G65Z755AFWAKHE12NY0CQ9FH
                  pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  readOnly: true
                  title: Phase ID
                item:
                  description: The item of the phase.
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      description: The ID of the item.
                      type: string
                      example: 01G65Z755AFWAKHE12NY0CQ9FH
                      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                      readOnly: true
                      title: Item ID
                  readOnly: true
                  required:
                    - id
                  title: Item ID
              readOnly: true
              required:
                - id
                - item
              title: Phase ID
          readOnly: true
          required:
            - id
            - phase
          title: Subscription reference
        rate_card:
          description: The rate card configuration snapshot used to price this line item.
          type: object
          additionalProperties: false
          properties:
            price:
              description: The price definition used to calculate charges for this line.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  free: '#/components/schemas/BillingPriceFree'
                  flat: '#/components/schemas/BillingPriceFlat'
                  unit: '#/components/schemas/BillingPriceUnit'
                  graduated: '#/components/schemas/BillingPriceGraduated'
                  volume: '#/components/schemas/BillingPriceVolume'
              oneOf:
                - $ref: '#/components/schemas/BillingPriceFree'
                - $ref: '#/components/schemas/BillingPriceFlat'
                - $ref: '#/components/schemas/BillingPriceUnit'
                - $ref: '#/components/schemas/BillingPriceGraduated'
                - $ref: '#/components/schemas/BillingPriceVolume'
              title: Price
            tax_config:
              description: Tax configuration snapshot for this line.
              type: object
              additionalProperties: false
              properties:
                behavior:
                  description: |-
                    Tax behavior.

                    This enum is used to specify whether tax is included in the price or excluded
                    from the price. If not specified, the billing profile is used to determine the
                    tax behavior. If not specified in the billing profile, the provider's default
                    behavior is used.
                  type: string
                  enum:
                    - inclusive
                    - exclusive
                  title: Tax behavior
                code:
                  description: Tax code applied to the invoice line item.
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      $ref: '#/components/schemas/ULID'
                  required:
                    - id
                  title: Tax code
              title: Tax config
            feature_key:
              description: The feature key associated with this line's rate card.
              type: string
              example: resource_key
              maxLength: 64
              minLength: 1
              pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
              title: Feature key
            discounts:
              description: Discount configuration from the rate card.
              type: object
              additionalProperties: false
              properties:
                percentage:
                  description: Percentage discount applied to the price (0–100).
                  type: number
                  maximum: 100
                  minimum: 0
                usage:
                  description: |-
                    Number of usage units granted free before billing starts. Only applies to
                    usage-based lines (not flat fees). Usage is treated as zero until this amount is
                    exhausted.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Discounts
            unit_config:
              description: |-
                Unit config snapshot applied when this line was billed, converting the raw
                metered quantity into the billed quantity. Frozen at billing time; read-only.
              type: object
              additionalProperties: false
              properties:
                operation:
                  description: The arithmetic operation to apply to the raw metered quantity.
                  type: string
                  enum:
                    - divide
                    - multiply
                  title: Conversion operation
                conversion_factor:
                  description: |-
                    The factor used in the conversion operation.

                    - For `divide`: `converted = raw / conversionFactor`.
                    - For `multiply`: `converted = raw × conversionFactor`.

                    Must be a positive non-zero value.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Conversion factor
                rounding:
                  description: |-
                    The rounding mode applied to the converted quantity for invoicing.

                    Defaults to none (no rounding). Entitlement checks always use the precise
                    (unrounded) value.
                  type: string
                  default: none
                  enum:
                    - ceiling
                    - floor
                    - half_up
                    - none
                  title: Rounding mode
                precision:
                  description: |-
                    The number of decimal places to retain after rounding.

                    Only meaningful when rounding is not "none". Defaults to 0 (round to whole
                    numbers).
                  type: integer
                  default: 0
                  title: Rounding precision (decimal places)
                display_unit:
                  description: |-
                    A human-readable label for the converted unit shown on invoices and in the
                    customer portal (e.g., "GB", "hours", "M tokens").

                    Optional. When omitted, no unit label is rendered.
                  type: string
                  title: Display unit label
              readOnly: true
              required:
                - operation
                - conversion_factor
              title: Unit config
          required:
            - price
          title: Rate card
        detailed_lines:
          description: |-
            Detailed sub-lines that this line has been broken down into.

            Present when line has individual details.
          type: array
          items:
            $ref: '#/components/schemas/BillingInvoiceDetailedLine'
          readOnly: true
          title: Detailed lines
        usage_quantity_detail:
          description: |-
            Usage quantity details for this line when UnitConfig is in effect.

            Read-only; omitted for lines without unit conversion.
          type: object
          additionalProperties: false
          properties:
            raw_quantity:
              description: The raw quantity as reported by the meter (native units).
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Raw metered quantity
            invoiced_quantity:
              description: |-
                The net billed quantity for this line in converted units, after rounding and any
                usage discounts.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Invoiced quantity
            display_unit:
              description: 'The display unit label (e.g., "GB", "hours", "M tokens").'
              type: string
              readOnly: true
              title: Display unit
          readOnly: true
          required:
            - raw_quantity
            - invoiced_quantity
          title: Usage quantity detail
        charge:
          description: Reference to the charge associated with this line item.
          type: object
          additionalProperties: false
          properties:
            id:
              description: Unique identifier for the charge.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: ID
          readOnly: true
          required:
            - id
          title: Charge
      additionalProperties: false
      required:
        - name
        - created_at
        - updated_at
        - type
        - lifecycle_controller
        - service_period
        - totals
        - rate_card
        - detailed_lines
    BillingNotificationChannel:
      description: |-
        A notification channel delivers notification events, such as entitlement balance
        threshold crossings, to an external system. Today the only supported channel
        type is a webhook delivered via Svix.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        type:
          description: The type of the channel. Immutable after creation.
          type: string
          enum:
            - webhook
        disabled:
          description: |-
            Whether the channel is disabled. Disabled channels do not receive notification
            events.
          type: boolean
          default: false
        url:
          description: The URL that webhook notification events are delivered to.
          type: string
        custom_headers:
          description: |-
            Custom HTTP headers to include on every webhook delivery request, keyed by
            header name.
          type: object
          additionalProperties:
            type: string
        signing_secret:
          description: |-
            Secret used to sign outgoing webhook payloads so recipients can verify their
            authenticity. If omitted on create, a secret is generated automatically by the
            delivery provider. This is a sensitive credential returned in responses (unlike
            most secrets) specifically so clients can retrieve a server-generated value and
            verify webhook signatures; handle it with the same care as any other credential.
          type: string
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - updated_at
        - type
        - url
    BillingPlan:
      description: Plans provide a template for subscriptions.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        key:
          description: |-
            A key is a semi-unique string that is used to identify the plan. It is used to
            reference the latest `active` version of the plan and is unique with the version
            number.
          type: string
          example: resource_key
          maxLength: 64
          minLength: 1
          pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
          title: Key
        version:
          description: |-
            Plans are versioned to allow you to make changes without affecting running
            subscriptions.
          type: integer
          default: 1
          minimum: 1
          readOnly: true
          title: Version
        currency:
          description: The currency code of the plan.
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
          title: Currency
        billing_cadence:
          description: The billing cadence for subscriptions using this plan.
          type: string
          format: ISO8601
          example: P1Y
          pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
          title: Billing cadence
        pro_rating_enabled:
          description: Whether pro-rating is enabled for this plan.
          type: boolean
          default: true
          title: Pro-rating enabled
        effective_from:
          description: |-
            The date and time when the plan becomes `active`. When not specified, the plan
            is in `draft` status.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Effective start date
        effective_to:
          description: |-
            A scheduled date and time when the plan becomes `archived`. When not specified,
            the plan is in `active` status indefinitely.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Effective end date
        status:
          description: |-
            The status of the plan. Computed based on the effective start and end dates:

            - `draft`: `effective_from` is not set.
            - `scheduled`: `now < effective_from`.
            - `active`: `effective_from <= now` and (`effective_to` is not set or
            `now < effective_to`).
            - `archived`: `effective_to <= now`.
          type: string
          enum:
            - draft
            - active
            - archived
            - scheduled
          readOnly: true
          title: Status
        phases:
          description: |-
            The plan phases define the pricing ramp for a subscription. A phase switch
            occurs only at the end of a billing period. At least one phase is required.
          type: array
          items:
            $ref: '#/components/schemas/BillingPlanPhase'
          minItems: 1
          title: Plan phases
        settlement_mode:
          description: |-
            Settlement mode for plan.

            Values:

            - `credit_then_invoice`: Credits are applied first, then any remainder is
            invoiced.
            - `credit_only`: Usage is settled exclusively against credits.
          type: string
          enum:
            - credit_then_invoice
            - credit_only
          readOnly: true
          title: Settlement Mode
        validation_errors:
          description: |-
            List of validation errors in `draft` state that prevent the plan from being
            published.
          type: array
          items:
            $ref: '#/components/schemas/ProductCatalogValidationError'
          readOnly: true
          title: Validation errors
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - updated_at
        - key
        - version
        - currency
        - billing_cadence
        - status
        - phases
        - settlement_mode
    BillingPlanPhase:
      description: |-
        The plan phase or pricing ramp allows changing a plan's rate cards over time as
        a subscription progresses.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        key:
          $ref: '#/components/schemas/ResourceKey'
        duration:
          description: |-
            The duration of the phase. When not specified, the phase runs indefinitely. Only
            the last phase may omit the duration.
          type: string
          format: ISO8601
          example: P1Y
          pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
          title: Duration
        rate_cards:
          description: The rate cards of the plan.
          type: array
          items:
            $ref: '#/components/schemas/BillingRateCard'
          title: Rate cards
      additionalProperties: false
      required:
        - name
        - key
        - rate_cards
    BillingPriceFlat:
      description: Flat price.
      type: object
      properties:
        type:
          description: The type of the price.
          type: string
          enum:
            - flat
          title: Type
        amount:
          description: The amount of the flat price.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Amount
      additionalProperties: false
      required:
        - type
        - amount
    BillingPriceFree:
      description: Free price.
      type: object
      properties:
        type:
          description: The type of the price.
          type: string
          enum:
            - free
          title: Type
      additionalProperties: false
      required:
        - type
    BillingPriceGraduated:
      description: |-
        Graduated tiered price.

        Each tier's rate applies only to the usage within that tier. Pricing can change
        as cumulative usage crosses tier boundaries.

        When UnitConfig is present on the containing resource, tier boundaries
        (up_to_amount) are expressed in converted billing units.
      type: object
      properties:
        type:
          description: The type of the price.
          type: string
          enum:
            - graduated
          title: Type
        tiers:
          description: The tiers of the graduated price. At least one tier is required.
          type: array
          items:
            $ref: '#/components/schemas/BillingPriceTier'
          minItems: 1
          title: Tiers
      additionalProperties: false
      required:
        - type
        - tiers
    BillingPriceTier:
      description: |-
        A price tier used in graduated and volume pricing.

        At least one price component (flat_price or unit_price) must be set. When
        UnitConfig is present on the containing resource, up_to_amount is expressed in
        converted billing units.
      type: object
      properties:
        up_to_amount:
          description: |-
            Up to and including this quantity will be contained in the tier. If undefined,
            the tier is open-ended (the last tier).
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Up to quantity
        flat_price:
          description: The flat price component of the tier. Charged once when the tier is entered.
          type: object
          additionalProperties: false
          properties:
            type:
              description: The type of the price.
              type: string
              enum:
                - flat
              title: Type
            amount:
              description: The amount of the flat price.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Amount
          required:
            - type
            - amount
          title: Flat price component
        unit_price:
          description: The unit price component of the tier. Charged per billing unit within the tier.
          type: object
          additionalProperties: false
          properties:
            type:
              description: The type of the price.
              type: string
              enum:
                - unit
              title: Type
            amount:
              description: The amount of the unit price.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Amount
          required:
            - type
            - amount
          title: Unit price component
      additionalProperties: false
    BillingPriceUnit:
      description: |-
        Unit price.

        Charges a fixed rate per billing unit. When UnitConfig is present on the object,
        billing units are the converted quantities (e.g. GB instead of bytes).
      type: object
      properties:
        type:
          description: The type of the price.
          type: string
          enum:
            - unit
          title: Type
        amount:
          description: The amount of the unit price.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Amount
      additionalProperties: false
      required:
        - type
        - amount
    BillingPriceVolume:
      description: |-
        Volume tiered price.

        The maximum quantity within a period determines the per-unit price for all units
        in that period.

        When UnitConfig is present on the containing resource, tier boundaries
        (up_to_amount) are expressed in converted billing units.
      type: object
      properties:
        type:
          description: The type of the price.
          type: string
          enum:
            - volume
          title: Type
        tiers:
          description: The tiers of the volume price. At least one tier is required.
          type: array
          items:
            $ref: '#/components/schemas/BillingPriceTier'
          minItems: 1
          title: Tiers
      additionalProperties: false
      required:
        - type
        - tiers
    BillingProfile:
      description: |-
        Billing profiles contain the settings for billing and controls invoice
        generation.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        supplier:
          description: |-
            The name and contact information for the supplier this billing profile
            represents
          type: object
          additionalProperties: false
          properties:
            id:
              description: Unique identifier for the party.
              type: string
              readOnly: true
            key:
              description: An optional unique key of the party.
              type: string
              example: 019ae40f-4258-7f15-9491-842f42a7d6ac
              maxLength: 256
              minLength: 1
              title: External Resource Key
            name:
              description: Legal name or representation of the party.
              type: string
            tax_id:
              description: |-
                The entity's legal identification used for tax purposes. They may have other
                numbers, but we're only interested in those valid for tax purposes.
              type: object
              additionalProperties: false
              properties:
                code:
                  description: Normalized tax identification code shown on the original identity document.
                  type: string
                  maxLength: 32
                  minLength: 1
            addresses:
              description: Address for where information should be sent if needed.
              type: object
              additionalProperties: false
              properties:
                billing_address:
                  description: Billing address.
                  type: object
                  additionalProperties: false
                  properties:
                    country:
                      description: |-
                        Country code in [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html)
                        alpha-2 format.
                      type: string
                      example: US
                      maxLength: 2
                      minLength: 2
                      pattern: '^[A-Z]{2}$'
                      title: Country
                    postal_code:
                      description: Postal code.
                      type: string
                      title: Postal Code
                    state:
                      description: State or province.
                      type: string
                      title: State
                    city:
                      description: City.
                      type: string
                      title: City
                    line1:
                      description: First line of the address.
                      type: string
                      title: Line 1
                    line2:
                      description: Second line of the address.
                      type: string
                      title: Line 2
                    phone_number:
                      description: Phone number.
                      type: string
                      title: Phone Number
              required:
                - billing_address
        workflow:
          description: The billing workflow settings for this profile
          type: object
          additionalProperties: false
          properties:
            collection:
              description: The collection settings for this workflow
              type: object
              additionalProperties: false
              properties:
                alignment:
                  description: The alignment for collecting the pending line items into an invoice.
                  type: object
                  default:
                    type: subscription
                  discriminator:
                    propertyName: type
                    mapping:
                      subscription: '#/components/schemas/BillingWorkflowCollectionAlignmentSubscription'
                      anchored: '#/components/schemas/BillingWorkflowCollectionAlignmentAnchored'
                  oneOf:
                    - $ref: '#/components/schemas/BillingWorkflowCollectionAlignmentSubscription'
                    - $ref: '#/components/schemas/BillingWorkflowCollectionAlignmentAnchored'
                interval:
                  description: |-
                    This grace period can be used to delay the collection of the pending line items
                    specified in alignment.

                    This is useful, in case of multiple subscriptions having slightly different
                    billing periods.
                  type: string
                  format: ISO8601
                  example: P1D
                  default: PT1H
              title: Workflow collection settings
            invoicing:
              description: The invoicing settings for this workflow
              type: object
              additionalProperties: false
              properties:
                auto_advance:
                  description: Whether to automatically issue the invoice after the draftPeriod has passed.
                  type: boolean
                  default: true
                draft_period:
                  description: The period for the invoice to be kept in draft status for manual reviews.
                  type: string
                  format: ISO8601
                  example: P1D
                  default: P0D
                progressive_billing:
                  description: Should progressive billing be allowed for this workflow?
                  type: boolean
                  default: true
                subscription_end_proration_mode:
                  description: Controls how subscription-ending shortened service periods are billed.
                  type: string
                  default: bill_actual_period
                  enum:
                    - bill_full_period
                    - bill_actual_period
              title: Workflow invoice settings
            payment:
              description: The payment settings for this workflow
              type: object
              discriminator:
                propertyName: collection_method
                mapping:
                  charge_automatically: '#/components/schemas/BillingWorkflowPaymentChargeAutomaticallySettings'
                  send_invoice: '#/components/schemas/BillingWorkflowPaymentSendInvoiceSettings'
              oneOf:
                - $ref: '#/components/schemas/BillingWorkflowPaymentChargeAutomaticallySettings'
                - $ref: '#/components/schemas/BillingWorkflowPaymentSendInvoiceSettings'
            tax:
              description: The tax settings for this workflow
              type: object
              additionalProperties: false
              properties:
                enabled:
                  description: |-
                    Enable automatic tax calculation when tax is supported by the app. For example,
                    with Stripe Invoicing when enabled, tax is calculated via Stripe Tax.
                  type: boolean
                  default: true
                enforced:
                  description: |-
                    Enforce tax calculation when tax is supported by the app. When enabled, the
                    billing system will not allow to create an invoice without tax calculation.
                    Enforcement is different per apps, for example, Stripe app requires customer to
                    have a tax location when starting a paid subscription.
                  type: boolean
                  default: false
                default_tax_config:
                  description: |-
                    Default tax configuration to apply to the invoices for line items.

                    Setting a tax code (`stripe.code` / `taxCodeId`) on a profile's default tax
                    config is deprecated and can no longer be added or changed: the organization
                    default tax code is used instead. Existing tax-code values may still be removed,
                    and `behavior` remains fully supported.
                  type: object
                  additionalProperties: false
                  properties:
                    behavior:
                      description: |-
                        Tax behavior.

                        If not specified the billing profile is used to determine the tax behavior. If
                        not specified in the billing profile, the provider's default behavior is used.
                      type: string
                      enum:
                        - inclusive
                        - exclusive
                      title: Tax behavior
                    stripe:
                      description: Stripe tax config.
                      type: object
                      additionalProperties: false
                      deprecated: true
                      properties:
                        code:
                          description: 'Product [tax code](https://docs.stripe.com/tax/tax-codes).'
                          type: string
                          example: txcd_10000000
                          pattern: '^txcd_\d{8}$'
                          title: Tax code
                      required:
                        - code
                      title: Stripe tax config
                    external_invoicing:
                      description: External invoicing tax config.
                      type: object
                      additionalProperties: false
                      deprecated: true
                      properties:
                        code:
                          description: The tax code should be interpreted by the external invoicing provider.
                          type: string
                          maxLength: 64
                          title: Tax code
                      required:
                        - code
                      title: External invoicing tax config
                    tax_code_id:
                      description: Tax code ID.
                      type: string
                      example: 01G65Z755AFWAKHE12NY0CQ9FH
                      deprecated: true
                      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                      title: Tax code ID
                    tax_code:
                      description: |-
                        Tax code reference.

                        When both `tax_code` and `tax_code_id` are provided, `tax_code` takes
                        precedence. When `stripe.code` is also provided, `tax_code` still wins and
                        `stripe.code` is ignored.
                      type: object
                      additionalProperties: false
                      properties:
                        id:
                          $ref: '#/components/schemas/ULID'
                      required:
                        - id
                      title: Tax code
              title: Workflow tax settings
        apps:
          description: The applications used by this billing profile.
          type: object
          additionalProperties: false
          properties:
            tax:
              description: The tax app used for this workflow.
              type: object
              additionalProperties: false
              properties:
                id:
                  description: The ID of the app.
                  type: string
                  example: 01G65Z755AFWAKHE12NY0CQ9FH
                  pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  title: ULID
              required:
                - id
            invoicing:
              description: The invoicing app used for this workflow.
              type: object
              additionalProperties: false
              properties:
                id:
                  description: The ID of the app.
                  type: string
                  example: 01G65Z755AFWAKHE12NY0CQ9FH
                  pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  title: ULID
              required:
                - id
            payment:
              description: The payment app used for this workflow.
              type: object
              additionalProperties: false
              properties:
                id:
                  description: The ID of the app.
                  type: string
                  example: 01G65Z755AFWAKHE12NY0CQ9FH
                  pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  title: ULID
              required:
                - id
          required:
            - tax
            - invoicing
            - payment
        default:
          description: Whether this is the default profile.
          type: boolean
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - updated_at
        - supplier
        - workflow
        - apps
        - default
    BillingProfilePagePaginatedResponse:
      description: Page paginated response.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingProfile'
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
      additionalProperties: false
      required:
        - data
        - meta
    BillingRateCard:
      description: A rate card defines the pricing and entitlement of a feature or service.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        key:
          $ref: '#/components/schemas/ResourceKey'
        feature:
          description: The feature associated with the rate card.
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/ULID'
          required:
            - id
          title: Feature reference
        currency:
          description: |-
            Overrides the containing plan or add-on currency for this rate card. When
            omitted, the containing resource currency applies.
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
          title: Currency override
        billing_cadence:
          description: |-
            The billing cadence of the rate card. When null, the charge is one-time
            (non-recurring). Only valid for flat prices.
          type: string
          format: ISO8601
          example: P1Y
          pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
          title: Billing cadence
        price:
          description: The price of the rate card.
          type: object
          discriminator:
            propertyName: type
            mapping:
              free: '#/components/schemas/BillingPriceFree'
              flat: '#/components/schemas/BillingPriceFlat'
              unit: '#/components/schemas/BillingPriceUnit'
              graduated: '#/components/schemas/BillingPriceGraduated'
              volume: '#/components/schemas/BillingPriceVolume'
          oneOf:
            - $ref: '#/components/schemas/BillingPriceFree'
            - $ref: '#/components/schemas/BillingPriceFlat'
            - $ref: '#/components/schemas/BillingPriceUnit'
            - $ref: '#/components/schemas/BillingPriceGraduated'
            - $ref: '#/components/schemas/BillingPriceVolume'
          title: Price
        unit_config:
          description: |-
            Unit conversion configuration for the rate card.

            Synthesized on read for plans authored with v1 dynamic or package prices:
            dynamic prices map to a unit price with a multiply unit config, and package
            prices map to a unit price with a divide unit config.

            Accepted on create and update only when the UnitConfig feature is enabled on the
            deployment; otherwise rejected.
          type: object
          additionalProperties: false
          properties:
            operation:
              description: The arithmetic operation to apply to the raw metered quantity.
              type: string
              enum:
                - divide
                - multiply
              title: Conversion operation
            conversion_factor:
              description: |-
                The factor used in the conversion operation.

                - For `divide`: `converted = raw / conversionFactor`.
                - For `multiply`: `converted = raw × conversionFactor`.

                Must be a positive non-zero value.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Conversion factor
            rounding:
              description: |-
                The rounding mode applied to the converted quantity for invoicing.

                Defaults to none (no rounding). Entitlement checks always use the precise
                (unrounded) value.
              type: string
              default: none
              enum:
                - ceiling
                - floor
                - half_up
                - none
              title: Rounding mode
            precision:
              description: |-
                The number of decimal places to retain after rounding.

                Only meaningful when rounding is not "none". Defaults to 0 (round to whole
                numbers).
              type: integer
              default: 0
              title: Rounding precision (decimal places)
            display_unit:
              description: |-
                A human-readable label for the converted unit shown on invoices and in the
                customer portal (e.g., "GB", "hours", "M tokens").

                Optional. When omitted, no unit label is rendered.
              type: string
              title: Display unit label
          required:
            - operation
            - conversion_factor
          title: Unit config
        payment_term:
          description: |-
            The payment term of the rate card. In advance payment term can only be used for
            flat prices.
          type: string
          default: in_arrears
          enum:
            - in_advance
            - in_arrears
          title: Payment term
        commitments:
          description: |-
            Spend commitments for this rate card. Only applicable to usage-based prices
            (unit, graduated, volume).
          type: object
          additionalProperties: false
          properties:
            minimum_amount:
              description: The customer is committed to spend at least the amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Minimum amount
            maximum_amount:
              description: The customer is limited to spend at most the amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Maximum amount
          title: Commitments
        discounts:
          description: The discounts of the rate card.
          type: object
          additionalProperties: false
          properties:
            percentage:
              description: Percentage discount applied to the price (0–100).
              type: number
              maximum: 100
              minimum: 0
            usage:
              description: |-
                Number of usage units granted free before billing starts. Only applies to
                usage-based lines (not flat fees). Usage is treated as zero until this amount is
                exhausted.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Discounts
        tax_config:
          description: The tax config of the rate card.
          type: object
          additionalProperties: false
          properties:
            behavior:
              description: |-
                Tax behavior.

                This enum is used to specify whether tax is included in the price or excluded
                from the price. If not specified, the billing profile is used to determine the
                tax behavior. If not specified in the billing profile, the provider's default
                behavior is used.
              type: string
              enum:
                - inclusive
                - exclusive
              title: Tax behavior
            code:
              description: Tax code applied to the invoice line item.
              type: object
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/ULID'
              required:
                - id
              title: Tax code
          title: Tax config
        entitlement:
          description: |-
            The entitlement template granted to subscribers of a plan or addon containing
            this rate card. Requires `feature` to be set.
          type: object
          discriminator:
            propertyName: type
            mapping:
              metered: '#/components/schemas/BillingRateCardMeteredEntitlement'
              static: '#/components/schemas/BillingRateCardStaticEntitlement'
              boolean: '#/components/schemas/BillingRateCardBooleanEntitlement'
          oneOf:
            - $ref: '#/components/schemas/BillingRateCardMeteredEntitlement'
            - $ref: '#/components/schemas/BillingRateCardStaticEntitlement'
            - $ref: '#/components/schemas/BillingRateCardBooleanEntitlement'
          title: Entitlement template
      additionalProperties: false
      required:
        - name
        - key
        - price
    BillingRateCardBooleanEntitlement:
      description: The entitlement template of a boolean entitlement.
      type: object
      properties:
        type:
          description: The type of the entitlement template.
          type: string
          enum:
            - boolean
          title: Type
      additionalProperties: false
      required:
        - type
    BillingRateCardMeteredEntitlement:
      description: The entitlement template of a metered entitlement.
      type: object
      properties:
        type:
          description: The type of the entitlement template.
          type: string
          enum:
            - metered
          title: Type
        is_soft_limit:
          description: |-
            If soft limit is true, the subject can use the feature even if the entitlement
            is exhausted; access remains granted.
          type: boolean
          default: false
          title: Soft limit
        limit:
          description: |-
            The amount of usage granted each usage period, in the feature's unit. Usage is
            counted against this allowance and the balance resets every usage period. When
            `is_soft_limit` is true the subject keeps access after the limit is reached;
            otherwise access is denied once the allowance is exhausted.
          type: number
          format: double
          minimum: 0
          title: Usage limit
        usage_period:
          description: |-
            The reset interval of the metered entitlement in ISO8601 format. Defaults to the
            billing cadence of the rate card.
          type: string
          format: ISO8601
          example: P1Y
          pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
          title: Usage period
      additionalProperties: false
      required:
        - type
    BillingRateCardStaticEntitlement:
      description: The entitlement template of a static entitlement.
      type: object
      properties:
        type:
          description: The type of the entitlement template.
          type: string
          enum:
            - static
          title: Type
        config:
          description: |-
            The entitlement config as a JSON object. Returned when checking entitlement
            access; useful for configuring fine-grained access settings implemented in your
            own system.
          title: Config
      additionalProperties: false
      required:
        - type
        - config
    BillingSubscription:
      description: Subscription.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        name:
          description: |-
            Display name of the subscription. Defaults to the plan name when the
            subscription is created from a plan.
          type: string
          maxLength: 256
          minLength: 1
          readOnly: true
          title: Name
        description:
          description: Optional description of the subscription.
          type: string
          maxLength: 1024
          readOnly: true
          title: Description
        active_from:
          description: |-
            An ISO-8601 timestamp representation of when the subscription became (or will
            become) active.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active from
        active_to:
          description: |-
            An ISO-8601 timestamp representation of when the subscription stops being
            active. Open-ended when not set.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active to
        customer_id:
          description: The customer ID of the subscription.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: Customer ID
        plan_id:
          description: The plan ID of the subscription. Set if subscription is created from a plan.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          deprecated: true
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: Plan ID
        plan:
          description: |-
            The plan the subscription was created from, if any. Includes the plan key and
            version so clients can resolve the exact plan revision.
          type: object
          additionalProperties: false
          properties:
            id:
              description: The plan ID (exact revision).
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: Plan ID
            key:
              description: The plan key. References the plan across versions.
              type: string
              example: resource_key
              maxLength: 64
              minLength: 1
              pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
              readOnly: true
              title: Plan key
            version:
              description: The plan version.
              type: integer
              minimum: 1
              readOnly: true
              title: Plan version
          readOnly: true
          required:
            - id
            - key
            - version
          title: Plan
        invoice_currency:
          description: The fiat currency in which the subscription is invoiced.
          type: string
          example: USD
          maxLength: 3
          minLength: 3
          pattern: '^[A-Z]{3}$'
          readOnly: true
          title: Invoice currency
        cost_basis_mode:
          description: |-
            Controls whether custom-currency cost bases are resolved dynamically or pinned
            when their currency pair is introduced to the subscription.
          type: string
          default: dynamic
          enum:
            - dynamic
            - pinned
          readOnly: true
          title: Cost basis mode
        cost_basis_pins:
          description: Cost bases pinned to custom-currency pairs for this subscription.
          type: array
          items:
            $ref: '#/components/schemas/BillingSubscriptionCostBasisPin'
          readOnly: true
          title: Pinned cost bases
        billing_cadence:
          description: |-
            The billing cadence of the subscription in ISO-8601 duration format. Defines how
            often the customer is billed. Examples: `P1M` (monthly), `P3M` (quarterly),
            `P1Y` (annually).
          type: string
          format: ISO8601
          example: P1Y
          pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
          readOnly: true
          title: Billing cadence
        pro_rating_config:
          description: The pro-rating configuration of the subscription.
          type: object
          additionalProperties: false
          properties:
            enabled:
              description: Whether pro-rating is enabled.
              type: boolean
              readOnly: true
              title: Enabled
            mode:
              description: How pro-rating is calculated when enabled.
              type: string
              enum:
                - no_proration
                - prorate_prices
              readOnly: true
              title: Mode
          readOnly: true
          required:
            - enabled
            - mode
          title: Pro-rating configuration
        billing_anchor:
          description: |-
            A billing anchor is the fixed point in time that determines the subscription's
            recurring billing cycle. It affects when charges occur and how prorations are
            calculated. Common anchors:

            - Calendar month (1st of each month): `2025-01-01T00:00:00Z`
            - Subscription anniversary (day customer signed up)
            - Custom date (customer-specified day)
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Billing anchor
        status:
          description: The status of the subscription.
          type: string
          enum:
            - active
            - inactive
            - canceled
            - scheduled
          readOnly: true
          title: Status
        settlement_mode:
          description: |-
            Settlement mode for billing.

            Values:

            - `credit_then_invoice`: Credits are applied first, then any remainder is
            invoiced.
            - `credit_only`: Usage is settled exclusively against credits.
          type: string
          enum:
            - credit_then_invoice
            - credit_only
          title: Settlement Mode
        current_period:
          description: |-
            The current aligned billing period. Present only when the subscription is active
            and aligned.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Current billing period
        phases:
          description: |-
            The phases of the subscription in chronological order. A phase groups the rate
            cards that are in effect for a segment of the subscription's lifetime.
          type: array
          items:
            $ref: '#/components/schemas/BillingSubscriptionPhase'
          readOnly: true
          title: Phases
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - name
        - active_from
        - customer_id
        - invoice_currency
        - cost_basis_mode
        - cost_basis_pins
        - billing_cadence
        - billing_anchor
        - status
        - phases
    BillingSubscriptionCancel:
      description: Request for canceling a subscription.
      type: object
      properties:
        timing:
          description: If not provided the subscription is canceled immediately.
          example: immediate
          default: immediate
          oneOf:
            - $ref: '#/components/schemas/BillingSubscriptionEditTimingEnum'
            - $ref: '#/components/schemas/DateTime'
      additionalProperties: false
    BillingSubscriptionChange:
      description: Request for changing a subscription.
      type: object
      properties:
        labels:
          $ref: '#/components/schemas/Labels'
        settlement_mode:
          description: |-
            Settlement mode for billing.

            Values:

            - `credit_then_invoice`: Credits are applied first, then any remainder is
            invoiced.
            - `credit_only`: Usage is settled exclusively against credits.
          type: string
          enum:
            - credit_then_invoice
            - credit_only
          title: Settlement Mode
        customer:
          description: The customer to create the subscription for.
          type: object
          additionalProperties: false
          properties:
            id:
              description: |-
                The ID of the customer to create the subscription for.

                Either customer ID or customer key must be provided. If both are provided, the
                ID will be used.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              title: Customer ID
            key:
              description: |-
                The key of the customer to create the subscription for.

                Either customer ID or customer key must be provided. If both are provided, the
                ID will be used.
              type: string
              example: 019ae40f-4258-7f15-9491-842f42a7d6ac
              maxLength: 256
              minLength: 1
              title: Customer Key
        plan:
          description: |-
            A reference to a published plan the subscription is created from.

            Exactly one of `plan` or `custom_plan` must be provided. Use `plan` to base the
            subscription on an existing published plan; use `custom_plan` to define the plan
            inline.
          type: object
          additionalProperties: false
          properties:
            id:
              description: |-
                The plan ID of the subscription. Set if subscription is created from a plan.

                ID or Key of the plan is required if creating a subscription from a plan. If
                both are provided, the ID will be used.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              title: Plan ID
            key:
              description: |-
                The plan Key of the subscription, if any. Set if subscription is created from a
                plan.

                ID or Key of the plan is required if creating a subscription from a plan. If
                both are provided, the ID will be used.
              type: string
              example: resource_key
              maxLength: 64
              minLength: 1
              pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
              title: Plan Key
            version:
              description: |-
                The plan version of the subscription, if any. If not provided, the latest
                version of the plan will be used.
              type: integer
              title: Plan Version
        custom_plan:
          description: |-
            An inline plan definition to create the subscription from, without referencing a
            published plan.

            Exactly one of `plan` or `custom_plan` must be provided. The subscription is not
            linked to a persisted plan, so the response omits the `plan` reference.
          type: object
          additionalProperties: false
          properties:
            name:
              description: |-
                Display name of the resource.

                Between 1 and 256 characters.
              type: string
              maxLength: 256
              minLength: 1
            description:
              description: |-
                Optional description of the resource.

                Maximum 1024 characters.
              type: string
              maxLength: 1024
            labels:
              $ref: '#/components/schemas/Labels'
            currency:
              description: The currency code of the plan.
              oneOf:
                - $ref: '#/components/schemas/CurrencyCode'
                - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
              title: Currency
            billing_cadence:
              description: The billing cadence for subscriptions using this plan.
              type: string
              format: ISO8601
              example: P1Y
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Billing cadence
            pro_rating_enabled:
              description: Whether pro-rating is enabled for this plan.
              type: boolean
              default: true
              title: Pro-rating enabled
            phases:
              description: |-
                The plan phases define the pricing ramp for a subscription. A phase switch
                occurs only at the end of a billing period. At least one phase is required.
              type: array
              items:
                $ref: '#/components/schemas/BillingPlanPhase'
              minItems: 1
              title: Plan phases
          required:
            - name
            - currency
            - billing_cadence
            - phases
          title: Custom plan
        starting_phase:
          description: |-
            The key of the phase to start the subscription in. If not provided, the
            subscription starts in the first phase of the plan.

            Only applies when creating from a published `plan`; custom plans define their
            own phases inline.
          type: string
          minLength: 1
          title: Starting phase
        billing_anchor:
          description: |-
            A billing anchor is the fixed point in time that determines the subscription's
            recurring billing cycle. It affects when charges occur and how prorations are
            calculated. Common anchors:

            - Calendar month (1st of each month): `2025-01-01T00:00:00Z`
            - Subscription anniversary (day customer signed up)
            - Custom date (customer-specified day)

            If not provided, the subscription will be created with the subscription's
            creation time as the billing anchor.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: Billing anchor
        cost_basis_mode:
          description: Controls how custom-currency cost bases are selected for the subscription.
          type: string
          default: dynamic
          enum:
            - dynamic
            - pinned
          title: Cost basis mode
        timing:
          description: |-
            Timing configuration for the change, when the change should take effect. For
            changing a subscription, the accepted values depend on the subscription
            configuration.
          example: immediate
          oneOf:
            - $ref: '#/components/schemas/BillingSubscriptionEditTimingEnum'
            - $ref: '#/components/schemas/DateTime'
      additionalProperties: false
      required:
        - customer
        - timing
    BillingSubscriptionChangeResponse:
      description: Response for changing a subscription.
      type: object
      properties:
        current:
          description: The current subscription before the change.
          type: object
          additionalProperties: false
          properties:
            id:
              description: ULID (Universally Unique Lexicographically Sortable Identifier).
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: ULID
            labels:
              $ref: '#/components/schemas/Labels'
            created_at:
              description: An ISO-8601 timestamp representation of entity creation date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            updated_at:
              description: An ISO-8601 timestamp representation of entity last update date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            deleted_at:
              description: An ISO-8601 timestamp representation of entity deletion date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            name:
              description: |-
                Display name of the subscription. Defaults to the plan name when the
                subscription is created from a plan.
              type: string
              maxLength: 256
              minLength: 1
              readOnly: true
              title: Name
            description:
              description: Optional description of the subscription.
              type: string
              maxLength: 1024
              readOnly: true
              title: Description
            active_from:
              description: |-
                An ISO-8601 timestamp representation of when the subscription became (or will
                become) active.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Active from
            active_to:
              description: |-
                An ISO-8601 timestamp representation of when the subscription stops being
                active. Open-ended when not set.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Active to
            customer_id:
              description: The customer ID of the subscription.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: Customer ID
            plan_id:
              description: The plan ID of the subscription. Set if subscription is created from a plan.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              deprecated: true
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: Plan ID
            plan:
