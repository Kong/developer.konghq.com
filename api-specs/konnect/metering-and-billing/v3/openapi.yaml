        effective_to:
          description: |-
            An ISO-8601 timestamp representation of the date until which the cost basis is
            effective. If provided, it must be later than `effective_from`. If not provided,
            it remains effective until superseded.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: RFC3339 Date-Time
      additionalProperties: false
      required:
        - fiat_code
        - rate
    CreateCreditAdjustmentRequest:
      description: CreditAdjustment create request.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        currency:
          description: The currency of the granted credits.
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
        amount:
          description: Granted credit amount.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
      additionalProperties: false
      required:
        - name
        - currency
        - amount
    CreateCreditGrantFilters:
      description: Filters for the credit grant.
      type: object
      properties:
        features:
          description: |-
            Limit the credit grant to specific features. If no features are specified, the
            credit grant can be used for any feature.
          type: array
          items:
            $ref: '#/components/schemas/ResourceKey'
          example:
            - input_tokens
            - output_tokens
        plans:
          description: |-
            Limit credits to charges from these plans. Entries are alternatives; when
            features are also specified, both dimensions must match. Omission or an empty
            list leaves plans unrestricted.
          type: array
          items:
            $ref: '#/components/schemas/CreateCreditGrantPlanFilter'
      additionalProperties: false
    CreateCreditGrantPlanFilter:
      description: A plan key and an optional version constraint for matching credit grants.
      type: object
      properties:
        key:
          description: The plan key in the customer's namespace.
          type: string
          example: resource_key
          maxLength: 64
          minLength: 1
          pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
          title: Resource Key
        version:
          description: 'Omission matches all versions, including future versions.'
          type: object
          additionalProperties: false
          properties:
            eq:
              description: Match this exact version.
              type: integer
              format: int32
              minimum: 1
            oeq:
              description: Match one of these versions.
              type: array
              items:
                type: integer
                format: int32
              maxItems: 100
              minItems: 1
            gte:
              description: Match this version and later versions.
              type: integer
              format: int32
              minimum: 1
            lte:
              description: Match this version and earlier versions.
              type: integer
              format: int32
              minimum: 1
      additionalProperties: false
      required:
        - key
    CreateCreditGrantRequest:
      description: CreditGrant create request.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        funding_method:
          description: Funding method of the grant.
          type: string
          enum:
            - none
            - invoice
            - external
          title: Credit funding method
        currency:
          description: |-
            The fiat or custom currency of the granted credits.

            Funded custom-currency grants must define `purchase.cost_basis` to settle in a
            fiat currency.
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
        amount:
          description: Granted credit amount.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
        purchase:
          description: Present when a funding workflow applies (funding_method is not `none`).
          type: object
          additionalProperties: false
          properties:
            currency:
              description: |-
                Fiat currency the purchase is settled in.

                Must equal the grant `currency` for fiat grants and `cost_basis.fiat_currency`
                for custom-currency grants.
              type: string
              example: USD
              maxLength: 3
              minLength: 3
              pattern: '^[A-Z]{3}$'
            per_unit_cost_basis:
              description: |-
                Fiat cost basis per credit unit of a fiat-currency grant.

                If `per_unit_cost_basis` is 0.50 and credit amount is
                $100.00, the total
                charge is $50.00. The value must be greater than 0. If the
                cost basis is 0, use `funding_method=none` instead.

                Only applies to fiat grants and cannot be combined with `cost_basis`. Defaults
                to 1.0 when neither is provided.
              type: string
              deprecated: true
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
            cost_basis:
              description: |-
                Defines how custom-currency credits are priced in the purchase `currency`; the
                resolved rate is exposed through `resolved_cost_basis`.

                Fiat grants accept only a `manual` cost basis without `fiat_currency`, where
                `rate` is the fiat cost per credit unit. Custom-currency grants require a cost
                basis of any type with `fiat_currency` set and equal to the purchase `currency`.
                A `dynamic` cost basis is resolved at the grant's effective time, so the
                currency cost basis must be effective by then. Cannot be combined with
                `per_unit_cost_basis`.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  dynamic: '#/components/schemas/CreateChargeCostBasisDynamic'
                  pinned: '#/components/schemas/CreateChargeCostBasisPinned'
                  manual: '#/components/schemas/CreateChargeCostBasisManual'
              oneOf:
                - $ref: '#/components/schemas/CreateChargeCostBasisDynamic'
                - $ref: '#/components/schemas/CreateChargeCostBasisPinned'
                - $ref: '#/components/schemas/CreateChargeCostBasisManual'
              title: Cost basis
            availability_policy:
              description: |-
                Controls when credits become available for consumption.

                Defaults to `on_creation`.
              type: string
              default: on_creation
              enum:
                - on_creation
              title: Credit availability policy
          required:
            - currency
        tax_config:
          description: |-
            Tax configuration for the grant.

            For `invoice` and `external` funding methods, tax configuration should be
            provided to ensure correct revenue recognition. When not provided, the default
            credit grant tax code is applied, if that's not set the global default taxcode
            is used.
          type: object
          additionalProperties: false
          properties:
            behavior:
              description: |-
                Tax behavior.

                This enum is used to specify whether tax is included in the price or excluded
                from the price. If not specified, the billing profile is used to determine the
                tax behavior. If not specified in the billing profile, the provider's default
                behavior is used.
              type: string
              enum:
                - inclusive
                - exclusive
              title: Tax behavior
            code:
              description: Tax code applied to the invoice line item.
              type: object
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/ULID'
              required:
                - id
              title: Tax code
          title: Tax code configuration
        filters:
          $ref: '#/components/schemas/CreateCreditGrantFilters'
        priority:
          description: Draw-down priority of the grant. Lower values have higher priority.
          type: integer
          format: int16
          default: 10
          maximum: 1000
          minimum: 1
        effective_at:
          description: |-
            The timestamp when the credit grant becomes effective.

            Defaults to the current date and time.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: RFC3339 Date-Time
        expires_after:
          description: |-
            The duration after which the credit grant expires.

            Defaults to never expiring.
          type: string
          format: ISO8601
          example: P1Y
          pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
          title: ISO 8601 Duration
        key:
          description: |-
            Idempotency key for the credit grant creation request.

            Unique per customer: reusing the same key for the same customer returns an HTTP
            409 Conflict instead of creating a duplicate grant, which makes create requests
            safe to retry. The same key may be reused across different customers.
          type: string
          example: 019ae40f-4258-7f15-9491-842f42a7d6ac
          maxLength: 256
          minLength: 1
          title: External Resource Key
      additionalProperties: false
      required:
        - name
        - funding_method
        - currency
        - amount
    CreateCurrencyCustomRequest:
      description: CurrencyCustom create request.
      type: object
      properties:
        name:
          description: |-
            The name of the currency. It should be a human-readable string that represents
            the name of the currency, such as "US Dollar" or "Euro".
          type: string
          maxLength: 256
          minLength: 1
        symbol:
          description: |-
            The symbol of the currency. It should be a string that represents the symbol of
            the currency, such as "$" for US Dollar or "€" for Euro.
          type: string
          minLength: 1
        precision:
          description: |-
            The precision of the currency. It should be a number that represents the number
            of decimal places used for the currency, such as 2 for US Dollar or Euro.
          type: integer
          format: uint32
        decimal_mark:
          description: |-
            The decimal mark for the currency. It should be a string that represents the
            decimal mark of the currency, such as "." for US Dollar or "," for Euro.
          type: string
          maxLength: 1
          minLength: 1
        thousand_separator:
          description: |-
            The thousand separator for the currency. It should be a string that represents
            the thousand separator of the currency, such as "," for US Dollar or "." for
            Euro.
          type: string
          maxLength: 1
          minLength: 1
        code:
          $ref: '#/components/schemas/BillingCurrencyCodeCustom'
      additionalProperties: false
      required:
        - name
        - precision
        - decimal_mark
        - thousand_separator
        - code
    CreateCustomerRequest:
      description: Customer create request.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        key:
          $ref: '#/components/schemas/ExternalResourceKey'
        usage_attribution:
          description: Mapping to attribute metered usage to the customer by the event subject.
          type: object
          additionalProperties: false
          properties:
            subject_keys:
              description: |-
                The subjects that are attributed to the customer. Can be empty when no usage
                event subjects are associated with the customer.
              type: array
              items:
                $ref: '#/components/schemas/UsageAttributionSubjectKey'
              minItems: 0
              title: Subject Keys
          required:
            - subject_keys
          title: Usage Attribution
        primary_email:
          description: The primary email address of the customer.
          type: string
          title: Primary Email
        currency:
          description: 'Currency of the customer. Used for billing, tax and invoicing.'
          type: string
          example: USD
          maxLength: 3
          minLength: 3
          pattern: '^[A-Z]{3}$'
          title: Currency
        billing_address:
          description: The billing address of the customer. Used for tax and invoicing.
          type: object
          additionalProperties: false
          properties:
            country:
              description: |-
                Country code in [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html)
                alpha-2 format.
              type: string
              example: US
              maxLength: 2
              minLength: 2
              pattern: '^[A-Z]{2}$'
              title: Country
            postal_code:
              description: Postal code.
              type: string
              title: Postal Code
            state:
              description: State or province.
              type: string
              title: State
            city:
              description: City.
              type: string
              title: City
            line1:
              description: First line of the address.
              type: string
              title: Line 1
            line2:
              description: Second line of the address.
              type: string
              title: Line 2
            phone_number:
              description: Phone number.
              type: string
              title: Phone Number
          title: Billing Address
      additionalProperties: false
      required:
        - name
        - key
    CreateEntitlementBooleanRequest:
      description: Boolean entitlement create request.
      type: object
      properties:
        type:
          description: The type of the entitlement.
          type: string
          enum:
            - boolean
          title: Type
        feature:
          description: The feature the customer is entitled to use.
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/ULID'
          required:
            - id
          title: Feature
        labels:
          description: |
            Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

            Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
          type: object
          example:
            env: test
          additionalProperties:
            type: string
            pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
            minLength: 1
            maxLength: 63
          maxProperties: 50
          title: Labels
        usage_period:
          description: |-
            The usage period of the entitlement. The anchor defaults to the entitlement
            creation time.
          type: object
          additionalProperties: false
          properties:
            interval:
              description: The interval duration in ISO 8601 format.
              type: string
              format: ISO8601
              example: P1M
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Interval in ISO 8601 duration format
            anchor:
              description: A date-time anchor to base the recurring period on.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Anchor time
          required:
            - interval
          title: Usage period
      additionalProperties: false
      required:
        - type
        - feature
    CreateEntitlementMeteredRequest:
      description: Metered entitlement create request.
      type: object
      properties:
        type:
          description: The type of the entitlement.
          type: string
          enum:
            - metered
          title: Type
        feature:
          description: The feature the customer is entitled to use.
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/ULID'
          required:
            - id
          title: Feature
        labels:
          description: |
            Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

            Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
          type: object
          example:
            env: test
          additionalProperties:
            type: string
            pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
            minLength: 1
            maxLength: 63
          maxProperties: 50
          title: Labels
        is_soft_limit:
          description: |-
            If true, the customer keeps access to the feature after the balance is
            exhausted.
          type: boolean
          default: false
          title: Soft limit
        issue:
          description: Usage granted automatically after each reset. Cannot be combined with `grants`.
          type: object
          additionalProperties: false
          properties:
            amount:
              description: 'The amount granted after each reset, in the feature''s unit.'
              type: string
              example: '100'
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Initial grant amount
            priority:
              description: |-
                The priority of the grant created after each reset. Lower values have higher
                priority.
              type: integer
              format: uint8
              default: 1
              maximum: 255
              minimum: 1
              title: Issue grant after reset priority
          required:
            - amount
          title: Issue after reset
        issue_after_reset:
          description: The amount granted automatically after each reset.
          type: string
          example: '100'
          deprecated: true
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Initial grant amount
        issue_after_reset_priority:
          description: The priority of the grant created after each reset.
          type: integer
          format: uint8
          default: 1
          deprecated: true
          maximum: 255
          minimum: 1
          title: Issue grant after reset priority
        preserve_overage_at_reset:
          description: 'If true, the overage is preserved at reset. If false, the usage is reset to 0.'
          type: boolean
          default: false
          title: Preserve overage at reset
        usage_period:
          description: |-
            The usage period of the entitlement. The balance resets at the start of every
            period. The anchor defaults to the entitlement creation time.
          type: object
          additionalProperties: false
          properties:
            interval:
              description: The interval duration in ISO 8601 format.
              type: string
              format: ISO8601
              example: P1M
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Interval in ISO 8601 duration format
            anchor:
              description: A date-time anchor to base the recurring period on.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Anchor time
          required:
            - interval
          title: Usage period
        measure_usage_from:
          description: |-
            The time from which usage is measured. Defaults to the entitlement creation
            time.
          example: current_period_start
          oneOf:
            - $ref: '#/components/schemas/BillingEntitlementMeasureUsageFromPreset'
            - $ref: '#/components/schemas/DateTime'
          title: Measure usage from
        grants:
          description: Grants created together with the entitlement. Cannot be combined with `issue`.
          type: array
          items:
            $ref: '#/components/schemas/BillingEntitlementGrantCreateRequest'
          title: Grants
      additionalProperties: false
      required:
        - type
        - feature
        - usage_period
    CreateEntitlementRequest:
