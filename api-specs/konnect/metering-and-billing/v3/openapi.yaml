          enum:
            - static
          title: Type
        feature:
          description: The feature the customer is entitled to use.
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/ULID'
          required:
            - id
          title: Feature
        labels:
