    BillingSubscriptionCostBasisPin:
      description: A cost basis pinned to a custom-currency pair for the subscription.
      type: object
      properties:
        custom_currency_id:
          description: The managed custom currency ID.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        invoice_currency:
          description: The fiat currency in which the subscription is invoiced.
          type: string
          example: USD
          maxLength: 3
          minLength: 3
          pattern: '^[A-Z]{3}$'
          readOnly: true
        cost_basis_id:
          description: The pinned cost basis resource ID.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
      additionalProperties: false
      required:
        - custom_currency_id
        - invoice_currency
        - cost_basis_id
    BillingSubscriptionCreate:
      type: object
      properties:
        labels:
          $ref: '#/components/schemas/Labels'
        settlement_mode:
          description: |-
            Settlement mode for billing.

            Values:

            - `credit_then_invoice`: Credits are applied first, then any remainder is
            invoiced.
            - `credit_only`: Usage is settled exclusively against credits.
          type: string
          enum:
            - credit_then_invoice
            - credit_only
          title: Settlement Mode
        customer:
          description: The customer to create the subscription for.
          type: object
          additionalProperties: false
          properties:
            id:
              description: |-
                The ID of the customer to create the subscription for.

                Either customer ID or customer key must be provided. If both are provided, the
                ID will be used.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              title: Customer ID
            key:
              description: |-
                The key of the customer to create the subscription for.

                Either customer ID or customer key must be provided. If both are provided, the
                ID will be used.
              type: string
              example: 019ae40f-4258-7f15-9491-842f42a7d6ac
              maxLength: 256
              minLength: 1
              title: Customer Key
        plan:
          description: |-
            A reference to a published plan the subscription is created from.

            Exactly one of `plan` or `custom_plan` must be provided. Use `plan` to base the
            subscription on an existing published plan; use `custom_plan` to define the plan
            inline.
          type: object
          additionalProperties: false
          properties:
            id:
              description: |-
                The plan ID of the subscription. Set if subscription is created from a plan.

                ID or Key of the plan is required if creating a subscription from a plan. If
                both are provided, the ID will be used.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              title: Plan ID
            key:
              description: |-
                The plan Key of the subscription, if any. Set if subscription is created from a
                plan.

                ID or Key of the plan is required if creating a subscription from a plan. If
                both are provided, the ID will be used.
              type: string
              example: resource_key
              maxLength: 64
              minLength: 1
              pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
              title: Plan Key
            version:
              description: |-
                The plan version of the subscription, if any. If not provided, the latest
                version of the plan will be used.
              type: integer
              title: Plan Version
        custom_plan:
          description: |-
            An inline plan definition to create the subscription from, without referencing a
            published plan.

            Exactly one of `plan` or `custom_plan` must be provided. The subscription is not
            linked to a persisted plan, so the response omits the `plan` reference.
          type: object
          additionalProperties: false
          properties:
            name:
              description: |-
                Display name of the resource.

                Between 1 and 256 characters.
              type: string
              maxLength: 256
              minLength: 1
            description:
              description: |-
                Optional description of the resource.

                Maximum 1024 characters.
              type: string
              maxLength: 1024
            labels:
              $ref: '#/components/schemas/Labels'
            currency:
              description: The currency code of the plan.
              oneOf:
                - $ref: '#/components/schemas/CurrencyCode'
                - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
              title: Currency
            billing_cadence:
              description: The billing cadence for subscriptions using this plan.
              type: string
              format: ISO8601
              example: P1Y
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Billing cadence
            pro_rating_enabled:
              description: Whether pro-rating is enabled for this plan.
              type: boolean
              default: true
              title: Pro-rating enabled
            phases:
              description: |-
                The plan phases define the pricing ramp for a subscription. A phase switch
                occurs only at the end of a billing period. At least one phase is required.
              type: array
              items:
                $ref: '#/components/schemas/BillingPlanPhase'
              minItems: 1
              title: Plan phases
          required:
            - name
            - currency
            - billing_cadence
            - phases
          title: Custom plan
        starting_phase:
          description: |-
            The key of the phase to start the subscription in. If not provided, the
            subscription starts in the first phase of the plan.

            Only applies when creating from a published `plan`; custom plans define their
            own phases inline.
          type: string
          minLength: 1
          title: Starting phase
        timing:
          description: |-
            When the subscription should start. If not provided, the subscription starts
            immediately. Provide a future timestamp to schedule the subscription to start
            later — this creates a not-yet-active, scheduled subscription. A timestamp in
            the past is rejected.
          example: immediate
          oneOf:
            - $ref: '#/components/schemas/BillingSubscriptionCreateTimingEnum'
            - $ref: '#/components/schemas/DateTime'
          title: Timing
        billing_anchor:
          description: |-
            A billing anchor is the fixed point in time that determines the subscription's
            recurring billing cycle. It affects when charges occur and how prorations are
            calculated. Common anchors:

            - Calendar month (1st of each month): `2025-01-01T00:00:00Z`
            - Subscription anniversary (day customer signed up)
            - Custom date (customer-specified day)

            If not provided, the subscription will be created with the subscription's
            creation time as the billing anchor.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: Billing anchor
        cost_basis_mode:
          description: Controls how custom-currency cost bases are selected for the subscription.
          type: string
          default: dynamic
          enum:
            - dynamic
            - pinned
          title: Cost basis mode
      additionalProperties: false
      required:
        - customer
    BillingSubscriptionCreateTimingEnum:
      description: |-
        Subscription create timing. Only immediate is supported as an enum value —
        unlike edit timing, next_billing_cycle is not accepted on create, since a new
        subscription has no current billing cycle to schedule against.
      type: string
      enum:
        - immediate
    BillingSubscriptionEdit:
      description: |-
        Request for editing a running subscription. Applies an ordered batch of
        customizations to the subscription's phases and items. A later customization
        observes the state produced by earlier ones.
      type: object
      properties:
        customizations:
          description: The ordered batch of customizations to apply to the running subscription.
          type: array
          items:
            $ref: '#/components/schemas/BillingSubscriptionEditOperation'
          maxItems: 100
          title: Customizations
        timing:
          description: When the requested changes should take effect. Defaults to immediate.
          example: immediate
          default: immediate
          oneOf:
            - $ref: '#/components/schemas/BillingSubscriptionEditTimingEnum'
            - $ref: '#/components/schemas/DateTime'
          title: Timing
      additionalProperties: false
      required:
        - customizations
    BillingSubscriptionEditAddItem:
      description: |-
        Add a new rate card to a phase. Adding an item to the current phase closes the
        active version of the same item key and appends a new version.
      type: object
      properties:
        type:
          description: Discriminator for the add-item operation.
          type: string
          enum:
            - add_item
          title: Type
        phase_key:
          description: The key of the phase to add the item to.
          type: string
          title: Phase key
        rate_card:
          description: The rate card describing what the customer gets and pays for the new item.
          type: object
          additionalProperties: false
          properties:
            name:
              description: |-
                Display name of the resource.

                Between 1 and 256 characters.
              type: string
              maxLength: 256
              minLength: 1
            description:
              description: |-
                Optional description of the resource.

                Maximum 1024 characters.
              type: string
              maxLength: 1024
            labels:
              $ref: '#/components/schemas/Labels'
            key:
              $ref: '#/components/schemas/ResourceKey'
            feature:
              description: The feature associated with the rate card.
              type: object
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/ULID'
              required:
                - id
              title: Feature reference
            currency:
              description: |-
                Overrides the containing plan or add-on currency for this rate card. When
                omitted, the containing resource currency applies.
              oneOf:
                - $ref: '#/components/schemas/CurrencyCode'
                - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
              title: Currency override
            billing_cadence:
              description: |-
                The billing cadence of the rate card. When null, the charge is one-time
                (non-recurring). Only valid for flat prices.
              type: string
              format: ISO8601
              example: P1Y
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Billing cadence
            price:
              description: The price of the rate card.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  free: '#/components/schemas/BillingPriceFree'
                  flat: '#/components/schemas/BillingPriceFlat'
                  unit: '#/components/schemas/BillingPriceUnit'
                  graduated: '#/components/schemas/BillingPriceGraduated'
                  volume: '#/components/schemas/BillingPriceVolume'
              oneOf:
                - $ref: '#/components/schemas/BillingPriceFree'
                - $ref: '#/components/schemas/BillingPriceFlat'
                - $ref: '#/components/schemas/BillingPriceUnit'
                - $ref: '#/components/schemas/BillingPriceGraduated'
                - $ref: '#/components/schemas/BillingPriceVolume'
              title: Price
            unit_config:
              description: |-
                Unit conversion configuration for the rate card.

                Synthesized on read for plans authored with v1 dynamic or package prices:
                dynamic prices map to a unit price with a multiply unit config, and package
                prices map to a unit price with a divide unit config.

                Accepted on create and update only when the UnitConfig feature is enabled on the
                deployment; otherwise rejected.
              type: object
              additionalProperties: false
              properties:
                operation:
                  description: The arithmetic operation to apply to the raw metered quantity.
                  type: string
                  enum:
                    - divide
                    - multiply
                  title: Conversion operation
                conversion_factor:
                  description: |-
                    The factor used in the conversion operation.

                    - For `divide`: `converted = raw / conversionFactor`.
                    - For `multiply`: `converted = raw × conversionFactor`.

                    Must be a positive non-zero value.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Conversion factor
                rounding:
                  description: |-
                    The rounding mode applied to the converted quantity for invoicing.

                    Defaults to none (no rounding). Entitlement checks always use the precise
                    (unrounded) value.
                  type: string
                  default: none
                  enum:
                    - ceiling
                    - floor
                    - half_up
                    - none
                  title: Rounding mode
                precision:
                  description: |-
                    The number of decimal places to retain after rounding.

                    Only meaningful when rounding is not "none". Defaults to 0 (round to whole
                    numbers).
                  type: integer
                  default: 0
                  title: Rounding precision (decimal places)
                display_unit:
                  description: |-
                    A human-readable label for the converted unit shown on invoices and in the
                    customer portal (e.g., "GB", "hours", "M tokens").

                    Optional. When omitted, no unit label is rendered.
                  type: string
                  title: Display unit label
              required:
                - operation
                - conversion_factor
              title: Unit config
            payment_term:
              description: |-
                The payment term of the rate card. In advance payment term can only be used for
                flat prices.
              type: string
              default: in_arrears
              enum:
                - in_advance
                - in_arrears
              title: Payment term
            commitments:
              description: |-
                Spend commitments for this rate card. Only applicable to usage-based prices
                (unit, graduated, volume).
              type: object
              additionalProperties: false
              properties:
                minimum_amount:
                  description: The customer is committed to spend at least the amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Minimum amount
                maximum_amount:
                  description: The customer is limited to spend at most the amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Maximum amount
              title: Commitments
            discounts:
              description: The discounts of the rate card.
              type: object
              additionalProperties: false
              properties:
                percentage:
                  description: Percentage discount applied to the price (0–100).
                  type: number
                  maximum: 100
                  minimum: 0
                usage:
                  description: |-
                    Number of usage units granted free before billing starts. Only applies to
                    usage-based lines (not flat fees). Usage is treated as zero until this amount is
                    exhausted.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Discounts
            tax_config:
              description: The tax config of the rate card.
              type: object
              additionalProperties: false
              properties:
                behavior:
                  description: |-
                    Tax behavior.

                    This enum is used to specify whether tax is included in the price or excluded
                    from the price. If not specified, the billing profile is used to determine the
                    tax behavior. If not specified in the billing profile, the provider's default
                    behavior is used.
                  type: string
                  enum:
                    - inclusive
                    - exclusive
                  title: Tax behavior
                code:
                  description: Tax code applied to the invoice line item.
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      $ref: '#/components/schemas/ULID'
                  required:
                    - id
                  title: Tax code
              title: Tax config
            entitlement:
              description: |-
                The entitlement template granted to subscribers of a plan or addon containing
                this rate card. Requires `feature` to be set.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  metered: '#/components/schemas/BillingRateCardMeteredEntitlement'
                  static: '#/components/schemas/BillingRateCardStaticEntitlement'
                  boolean: '#/components/schemas/BillingRateCardBooleanEntitlement'
              oneOf:
                - $ref: '#/components/schemas/BillingRateCardMeteredEntitlement'
                - $ref: '#/components/schemas/BillingRateCardStaticEntitlement'
                - $ref: '#/components/schemas/BillingRateCardBooleanEntitlement'
              title: Entitlement template
          required:
            - name
            - key
            - price
          title: Rate card
      additionalProperties: false
      required:
        - type
        - phase_key
        - rate_card
    BillingSubscriptionEditAddPhase:
      description: |-
        Add a new phase to the subscription. The phase is created without items; use
        add-item operations to populate it.
      type: object
      properties:
        type:
          description: Discriminator for the add-phase operation.
          type: string
          enum:
            - add_phase
          title: Type
        phase:
          description: The phase to add.
          type: object
          additionalProperties: false
          properties:
            key:
              description: A locally unique identifier for the phase.
              type: string
              example: resource_key
              maxLength: 64
              minLength: 1
              pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
              title: Key
            name:
              description: The name of the phase.
              type: string
              title: Name
            description:
              description: An optional description of the phase.
              type: string
              title: Description
            start_after:
              description: |-
                The ISO-8601 interval after the subscription start at which the phase begins.
                When null, the phase starts immediately after the subscription starts.
              type: string
              format: ISO8601
              example: P1Y
              nullable: true
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Start after
            duration:
              description: |-
                The intended ISO-8601 duration of the phase. Required unless the phase will be
                the last phase of the subscription.
              type: string
              format: ISO8601
              example: P1Y
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Duration
          required:
            - key
            - name
            - start_after
          title: Phase
      additionalProperties: false
      required:
        - type
        - phase
    BillingSubscriptionEditOperation:
      description: |-
        A single customization to apply to a running subscription. The `type` field
        discriminates which operation is performed.
      type: object
      discriminator:
        propertyName: type
        mapping:
          add_item: '#/components/schemas/BillingSubscriptionEditAddItem'
          remove_item: '#/components/schemas/BillingSubscriptionEditRemoveItem'
          add_phase: '#/components/schemas/BillingSubscriptionEditAddPhase'
          remove_phase: '#/components/schemas/BillingSubscriptionEditRemovePhase'
          stretch_phase: '#/components/schemas/BillingSubscriptionEditStretchPhase'
          unschedule_edit: '#/components/schemas/BillingSubscriptionEditUnscheduleEdit'
      oneOf:
        - $ref: '#/components/schemas/BillingSubscriptionEditAddItem'
        - $ref: '#/components/schemas/BillingSubscriptionEditRemoveItem'
        - $ref: '#/components/schemas/BillingSubscriptionEditAddPhase'
        - $ref: '#/components/schemas/BillingSubscriptionEditRemovePhase'
        - $ref: '#/components/schemas/BillingSubscriptionEditStretchPhase'
        - $ref: '#/components/schemas/BillingSubscriptionEditUnscheduleEdit'
    BillingSubscriptionEditRemoveItem:
      description: Remove a rate card from a phase.
      type: object
      properties:
        type:
          description: Discriminator for the remove-item operation.
          type: string
          enum:
            - remove_item
          title: Type
        phase_key:
          description: The key of the phase to remove the item from.
          type: string
          title: Phase key
        item_key:
          description: The key of the item to remove.
          type: string
          title: Item key
      additionalProperties: false
      required:
        - type
        - phase_key
        - item_key
    BillingSubscriptionEditRemovePhase:
      description: Remove a phase from the subscription.
      type: object
      properties:
        type:
          description: Discriminator for the remove-phase operation.
          type: string
          enum:
            - remove_phase
          title: Type
        phase_key:
          description: The key of the phase to remove.
          type: string
          title: Phase key
        shift:
          description: The direction to shift surrounding phases to fill the removed phase's span.
          type: string
          enum:
            - next
            - prev
          title: Shift
      additionalProperties: false
      required:
        - type
        - phase_key
        - shift
    BillingSubscriptionEditStretchPhase:
      description: 'Extend the duration of a phase, shifting later phases by the same amount.'
      type: object
      properties:
        type:
          description: Discriminator for the stretch-phase operation.
          type: string
          enum:
            - stretch_phase
          title: Type
        phase_key:
          description: The key of the phase to stretch.
          type: string
          title: Phase key
        extend_by:
          description: The ISO-8601 duration to extend the phase by.
          type: string
          format: ISO8601
          example: P1Y
          pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
          title: Extend by
      additionalProperties: false
      required:
        - type
        - phase_key
        - extend_by
    BillingSubscriptionEditTimingEnum:
      description: |-
        Subscription edit timing. When immediate, the requested changes take effect
        immediately. When next_billing_cycle, the requested changes take effect at the
        next billing cycle.
      type: string
      enum:
        - immediate
        - next_billing_cycle
    BillingSubscriptionEditUnscheduleEdit:
      description: |-
        Discard any scheduled edits on the current phase, reverting it to its previously
        persisted state.
      type: object
      properties:
        type:
          description: Discriminator for the unschedule-edit operation.
          type: string
          enum:
            - unschedule_edit
          title: Type
      additionalProperties: false
      required:
        - type
    BillingSubscriptionItem:
      description: A subscription item pins a rate card to a cadence within a subscription phase.
      type: object
      properties:
        id:
          description: The unique identifier of the subscription item instance.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ID
        active_from:
          description: An ISO-8601 timestamp representation of when this item version becomes active.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active from
        active_to:
          description: |-
            An ISO-8601 timestamp representation of when this item version stops being
            active.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active to
        rate_card:
          description: The rate card describing what the customer gets and pays for this item.
          type: object
          additionalProperties: false
          properties:
            name:
              description: |-
                Display name of the resource.

                Between 1 and 256 characters.
              type: string
              maxLength: 256
              minLength: 1
            description:
              description: |-
                Optional description of the resource.

                Maximum 1024 characters.
              type: string
              maxLength: 1024
            labels:
              $ref: '#/components/schemas/Labels'
            key:
              $ref: '#/components/schemas/ResourceKey'
            feature:
              description: The feature associated with the rate card.
              type: object
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/ULID'
              required:
                - id
              title: Feature reference
            currency:
              description: |-
                Overrides the containing plan or add-on currency for this rate card. When
                omitted, the containing resource currency applies.
              oneOf:
                - $ref: '#/components/schemas/CurrencyCode'
                - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
              title: Currency override
            billing_cadence:
              description: |-
                The billing cadence of the rate card. When null, the charge is one-time
                (non-recurring). Only valid for flat prices.
              type: string
              format: ISO8601
              example: P1Y
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Billing cadence
            price:
              description: The price of the rate card.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  free: '#/components/schemas/BillingPriceFree'
                  flat: '#/components/schemas/BillingPriceFlat'
                  unit: '#/components/schemas/BillingPriceUnit'
                  graduated: '#/components/schemas/BillingPriceGraduated'
                  volume: '#/components/schemas/BillingPriceVolume'
              oneOf:
                - $ref: '#/components/schemas/BillingPriceFree'
                - $ref: '#/components/schemas/BillingPriceFlat'
                - $ref: '#/components/schemas/BillingPriceUnit'
                - $ref: '#/components/schemas/BillingPriceGraduated'
                - $ref: '#/components/schemas/BillingPriceVolume'
              title: Price
            unit_config:
              description: |-
                Unit conversion configuration for the rate card.

                Synthesized on read for plans authored with v1 dynamic or package prices:
                dynamic prices map to a unit price with a multiply unit config, and package
                prices map to a unit price with a divide unit config.

                Accepted on create and update only when the UnitConfig feature is enabled on the
                deployment; otherwise rejected.
              type: object
              additionalProperties: false
              properties:
                operation:
                  description: The arithmetic operation to apply to the raw metered quantity.
                  type: string
                  enum:
                    - divide
                    - multiply
                  title: Conversion operation
                conversion_factor:
                  description: |-
                    The factor used in the conversion operation.

                    - For `divide`: `converted = raw / conversionFactor`.
                    - For `multiply`: `converted = raw × conversionFactor`.

                    Must be a positive non-zero value.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Conversion factor
                rounding:
                  description: |-
                    The rounding mode applied to the converted quantity for invoicing.

                    Defaults to none (no rounding). Entitlement checks always use the precise
                    (unrounded) value.
                  type: string
                  default: none
                  enum:
                    - ceiling
                    - floor
                    - half_up
                    - none
                  title: Rounding mode
                precision:
                  description: |-
                    The number of decimal places to retain after rounding.

                    Only meaningful when rounding is not "none". Defaults to 0 (round to whole
                    numbers).
                  type: integer
                  default: 0
                  title: Rounding precision (decimal places)
                display_unit:
                  description: |-
                    A human-readable label for the converted unit shown on invoices and in the
                    customer portal (e.g., "GB", "hours", "M tokens").

                    Optional. When omitted, no unit label is rendered.
                  type: string
                  title: Display unit label
              required:
                - operation
                - conversion_factor
              title: Unit config
            payment_term:
              description: |-
                The payment term of the rate card. In advance payment term can only be used for
                flat prices.
              type: string
              default: in_arrears
              enum:
                - in_advance
                - in_arrears
              title: Payment term
            commitments:
              description: |-
                Spend commitments for this rate card. Only applicable to usage-based prices
                (unit, graduated, volume).
              type: object
              additionalProperties: false
              properties:
                minimum_amount:
                  description: The customer is committed to spend at least the amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Minimum amount
                maximum_amount:
                  description: The customer is limited to spend at most the amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Maximum amount
              title: Commitments
            discounts:
              description: The discounts of the rate card.
              type: object
              additionalProperties: false
              properties:
                percentage:
                  description: Percentage discount applied to the price (0–100).
                  type: number
                  maximum: 100
                  minimum: 0
                usage:
                  description: |-
                    Number of usage units granted free before billing starts. Only applies to
                    usage-based lines (not flat fees). Usage is treated as zero until this amount is
                    exhausted.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Discounts
            tax_config:
              description: The tax config of the rate card.
              type: object
              additionalProperties: false
              properties:
                behavior:
                  description: |-
                    Tax behavior.

                    This enum is used to specify whether tax is included in the price or excluded
                    from the price. If not specified, the billing profile is used to determine the
                    tax behavior. If not specified in the billing profile, the provider's default
                    behavior is used.
                  type: string
                  enum:
                    - inclusive
                    - exclusive
                  title: Tax behavior
                code:
                  description: Tax code applied to the invoice line item.
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      $ref: '#/components/schemas/ULID'
                  required:
                    - id
                  title: Tax code
              title: Tax config
            entitlement:
              description: |-
                The entitlement template granted to subscribers of a plan or addon containing
                this rate card. Requires `feature` to be set.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  metered: '#/components/schemas/BillingRateCardMeteredEntitlement'
                  static: '#/components/schemas/BillingRateCardStaticEntitlement'
                  boolean: '#/components/schemas/BillingRateCardBooleanEntitlement'
              oneOf:
                - $ref: '#/components/schemas/BillingRateCardMeteredEntitlement'
                - $ref: '#/components/schemas/BillingRateCardStaticEntitlement'
                - $ref: '#/components/schemas/BillingRateCardBooleanEntitlement'
              title: Entitlement template
          readOnly: true
          required:
            - name
            - key
            - price
          title: Rate card
      additionalProperties: false
      required:
        - id
        - active_from
        - rate_card
    BillingSubscriptionMigrate:
      description: Request for migrating to a later version of the subscription's current plan.
      type: object
      properties:
        timing:
          description: |-
            When the migration takes effect: immediately (default), at the next billing
            cycle, or at an explicit billing-aligned timestamp. In-place migrations may
            target a later phase when the phase timelines match. The target plan reference
            is saved now; changed items take effect at the requested time.
          example: immediate
          default: immediate
          oneOf:
            - $ref: '#/components/schemas/BillingSubscriptionEditTimingEnum'
            - $ref: '#/components/schemas/DateTime'
        target_version:
          description: A strictly later version of the current plan. Omit to use its latest version.
          type: integer
          minimum: 1
        starting_phase:
          description: |-
            Explicitly replace the subscription, starting in this target plan phase. Always
            selects replacement, even when the phase matches the current one. Replacement
            may produce billing adjustments and does not transfer addons.
          type: string
          minLength: 1
        billing_anchor:
          description: |-
            Providing a different billing anchor explicitly replaces the subscription. The
            supplied anchor is preserved and may be before or after the replacement's start
            time. Omit to retain the existing anchor.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: RFC3339 Date-Time
      additionalProperties: false
    BillingSubscriptionMigrateResponse:
      description: Response for migrating a subscription.
      type: object
      properties:
        current:
          description: |-
            The original subscription's own fields returned by the migration. For an
            in-place migration this is the before snapshot; for replacement it includes the
            cancellation. Does not include phases or the current billing period.
          type: object
          additionalProperties: false
          properties:
            id:
              description: ULID (Universally Unique Lexicographically Sortable Identifier).
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: ULID
            labels:
              $ref: '#/components/schemas/Labels'
            created_at:
              description: An ISO-8601 timestamp representation of entity creation date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            updated_at:
              description: An ISO-8601 timestamp representation of entity last update date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            deleted_at:
              description: An ISO-8601 timestamp representation of entity deletion date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            name:
              description: |-
                Display name of the subscription. Defaults to the plan name when the
                subscription is created from a plan.
              type: string
              maxLength: 256
              minLength: 1
              readOnly: true
              title: Name
            description:
              description: Optional description of the subscription.
              type: string
              maxLength: 1024
              readOnly: true
              title: Description
            active_from:
              description: |-
                An ISO-8601 timestamp representation of when the subscription became (or will
                become) active.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Active from
            active_to:
              description: |-
                An ISO-8601 timestamp representation of when the subscription stops being
                active. Open-ended when not set.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Active to
            customer_id:
              description: The customer ID of the subscription.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: Customer ID
            plan_id:
              description: The plan ID of the subscription. Set if subscription is created from a plan.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              deprecated: true
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: Plan ID
            plan:
              description: |-
                The plan the subscription was created from, if any. Includes the plan key and
                version so clients can resolve the exact plan revision.
              type: object
              additionalProperties: false
              properties:
                id:
                  description: The plan ID (exact revision).
                  type: string
                  example: 01G65Z755AFWAKHE12NY0CQ9FH
                  pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  readOnly: true
                  title: Plan ID
                key:
                  description: The plan key. References the plan across versions.
                  type: string
                  example: resource_key
                  maxLength: 64
                  minLength: 1
                  pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
                  readOnly: true
                  title: Plan key
                version:
                  description: The plan version.
                  type: integer
                  minimum: 1
                  readOnly: true
                  title: Plan version
              readOnly: true
              required:
                - id
                - key
                - version
              title: Plan
            invoice_currency:
              description: The fiat currency in which the subscription is invoiced.
              type: string
              example: USD
              maxLength: 3
              minLength: 3
              pattern: '^[A-Z]{3}$'
              readOnly: true
              title: Invoice currency
            cost_basis_mode:
              description: |-
                Controls whether custom-currency cost bases are resolved dynamically or pinned
                when their currency pair is introduced to the subscription.
              type: string
              default: dynamic
              enum:
                - dynamic
                - pinned
              readOnly: true
              title: Cost basis mode
            cost_basis_pins:
              description: Cost bases pinned to custom-currency pairs for this subscription.
              type: array
              items:
                $ref: '#/components/schemas/BillingSubscriptionCostBasisPin'
              readOnly: true
              title: Pinned cost bases
            billing_cadence:
              description: |-
                The billing cadence of the subscription in ISO-8601 duration format. Defines how
                often the customer is billed. Examples: `P1M` (monthly), `P3M` (quarterly),
                `P1Y` (annually).
              type: string
              format: ISO8601
              example: P1Y
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              readOnly: true
              title: Billing cadence
            pro_rating_config:
              description: The pro-rating configuration of the subscription.
              type: object
              additionalProperties: false
              properties:
                enabled:
                  description: Whether pro-rating is enabled.
                  type: boolean
                  readOnly: true
                  title: Enabled
                mode:
                  description: How pro-rating is calculated when enabled.
                  type: string
                  enum:
                    - no_proration
                    - prorate_prices
                  readOnly: true
                  title: Mode
              readOnly: true
              required:
                - enabled
                - mode
              title: Pro-rating configuration
            billing_anchor:
              description: |-
                A billing anchor is the fixed point in time that determines the subscription's
                recurring billing cycle. It affects when charges occur and how prorations are
                calculated. Common anchors:

                - Calendar month (1st of each month): `2025-01-01T00:00:00Z`
                - Subscription anniversary (day customer signed up)
                - Custom date (customer-specified day)
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Billing anchor
            status:
              description: The status of the subscription.
              type: string
              enum:
                - active
                - inactive
                - canceled
                - scheduled
              readOnly: true
              title: Status
            settlement_mode:
              description: |-
                Settlement mode for billing.

                Values:

                - `credit_then_invoice`: Credits are applied first, then any remainder is
                invoiced.
                - `credit_only`: Usage is settled exclusively against credits.
              type: string
              enum:
                - credit_then_invoice
                - credit_only
              title: Settlement Mode
          required:
            - id
            - created_at
            - updated_at
            - name
            - active_from
            - customer_id
            - invoice_currency
            - cost_basis_mode
            - cost_basis_pins
            - billing_cadence
            - billing_anchor
            - status
        next:
          description: 'The resulting subscription, including its phases and items.'
          type: object
          additionalProperties: false
          properties:
            id:
              description: ULID (Universally Unique Lexicographically Sortable Identifier).
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: ULID
            labels:
              $ref: '#/components/schemas/Labels'
            created_at:
              description: An ISO-8601 timestamp representation of entity creation date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            updated_at:
              description: An ISO-8601 timestamp representation of entity last update date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            deleted_at:
              description: An ISO-8601 timestamp representation of entity deletion date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            name:
              description: |-
                Display name of the subscription. Defaults to the plan name when the
                subscription is created from a plan.
              type: string
              maxLength: 256
              minLength: 1
              readOnly: true
              title: Name
            description:
              description: Optional description of the subscription.
              type: string
              maxLength: 1024
              readOnly: true
              title: Description
            active_from:
              description: |-
                An ISO-8601 timestamp representation of when the subscription became (or will
                become) active.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Active from
            active_to:
              description: |-
                An ISO-8601 timestamp representation of when the subscription stops being
                active. Open-ended when not set.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Active to
            customer_id:
              description: The customer ID of the subscription.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: Customer ID
            plan_id:
              description: The plan ID of the subscription. Set if subscription is created from a plan.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              deprecated: true
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: Plan ID
            plan:
              description: |-
                The plan the subscription was created from, if any. Includes the plan key and
                version so clients can resolve the exact plan revision.
              type: object
              additionalProperties: false
              properties:
                id:
                  description: The plan ID (exact revision).
                  type: string
                  example: 01G65Z755AFWAKHE12NY0CQ9FH
                  pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  readOnly: true
                  title: Plan ID
                key:
                  description: The plan key. References the plan across versions.
                  type: string
                  example: resource_key
                  maxLength: 64
                  minLength: 1
                  pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
                  readOnly: true
                  title: Plan key
                version:
                  description: The plan version.
                  type: integer
                  minimum: 1
                  readOnly: true
                  title: Plan version
              readOnly: true
              required:
                - id
                - key
                - version
              title: Plan
            invoice_currency:
              description: The fiat currency in which the subscription is invoiced.
              type: string
              example: USD
              maxLength: 3
              minLength: 3
              pattern: '^[A-Z]{3}$'
              readOnly: true
              title: Invoice currency
            cost_basis_mode:
              description: |-
                Controls whether custom-currency cost bases are resolved dynamically or pinned
                when their currency pair is introduced to the subscription.
              type: string
              default: dynamic
              enum:
                - dynamic
                - pinned
              readOnly: true
              title: Cost basis mode
            cost_basis_pins:
              description: Cost bases pinned to custom-currency pairs for this subscription.
              type: array
              items:
                $ref: '#/components/schemas/BillingSubscriptionCostBasisPin'
              readOnly: true
              title: Pinned cost bases
            billing_cadence:
              description: |-
                The billing cadence of the subscription in ISO-8601 duration format. Defines how
                often the customer is billed. Examples: `P1M` (monthly), `P3M` (quarterly),
                `P1Y` (annually).
              type: string
              format: ISO8601
              example: P1Y
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              readOnly: true
              title: Billing cadence
            pro_rating_config:
              description: The pro-rating configuration of the subscription.
              type: object
              additionalProperties: false
              properties:
                enabled:
                  description: Whether pro-rating is enabled.
                  type: boolean
                  readOnly: true
                  title: Enabled
                mode:
                  description: How pro-rating is calculated when enabled.
                  type: string
                  enum:
                    - no_proration
                    - prorate_prices
                  readOnly: true
                  title: Mode
              readOnly: true
              required:
                - enabled
                - mode
              title: Pro-rating configuration
            billing_anchor:
              description: |-
                A billing anchor is the fixed point in time that determines the subscription's
                recurring billing cycle. It affects when charges occur and how prorations are
                calculated. Common anchors:

                - Calendar month (1st of each month): `2025-01-01T00:00:00Z`
                - Subscription anniversary (day customer signed up)
                - Custom date (customer-specified day)
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Billing anchor
            status:
              description: The status of the subscription.
              type: string
              enum:
                - active
                - inactive
                - canceled
                - scheduled
              readOnly: true
              title: Status
            settlement_mode:
              description: |-
                Settlement mode for billing.

                Values:

                - `credit_then_invoice`: Credits are applied first, then any remainder is
                invoiced.
                - `credit_only`: Usage is settled exclusively against credits.
              type: string
              enum:
                - credit_then_invoice
                - credit_only
              title: Settlement Mode
            current_period:
              description: |-
                The current aligned billing period. Present only when the subscription is active
                and aligned.
              type: object
              additionalProperties: false
              properties:
                from:
                  description: |-
                    The start of the period.

                    The period is inclusive at the start.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: Start
                to:
                  description: |-
                    The end of the period.

                    The period is exclusive at the end.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: End
              readOnly: true
              required:
                - from
                - to
              title: Current billing period
            phases:
              description: |-
                The phases of the subscription in chronological order. A phase groups the rate
                cards that are in effect for a segment of the subscription's lifetime.
              type: array
              items:
                $ref: '#/components/schemas/BillingSubscriptionPhase'
              readOnly: true
              title: Phases
          required:
            - id
            - created_at
            - updated_at
            - name
            - active_from
            - customer_id
            - invoice_currency
            - cost_basis_mode
            - cost_basis_pins
            - billing_cadence
            - billing_anchor
            - status
            - phases
      additionalProperties: false
      required:
        - current
        - next
    BillingSubscriptionPhase:
      description: |-
        A subscription phase groups the rate cards in effect for a segment of the
        subscription's lifetime. Analogous to plan phases.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        key:
          $ref: '#/components/schemas/ResourceKey'
        active_from:
          description: An ISO-8601 timestamp representation of when the phase becomes active.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active from
        active_to:
          description: |-
            An ISO-8601 timestamp representation of when the phase stops being active.
            Open-ended for the last phase.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active to
        items:
          description: |-
            The rate cards in effect for this phase, resolved to the version active at the
            queried time (the currently active version for the current phase, the first
            version for future phases, and the last version for past phases).
          type: array
          items:
            $ref: '#/components/schemas/BillingSubscriptionItem'
          readOnly: true
          title: Items
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - updated_at
        - key
        - active_from
        - items
    BillingSubscriptionReference:
