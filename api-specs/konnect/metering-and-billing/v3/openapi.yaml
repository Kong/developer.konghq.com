      tags:
        - OpenMeter Tax
components:
  parameters:
    CursorPaginationQuery:
      name: page
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/CursorPaginationQueryPage'
      style: deepObject
    PagePaginationQuery:
      name: page
      in: query
      required: false
      description: Determines which page of the collection to retrieve.
      schema:
        type: object
        properties:
          size:
            description: The number of items to include per page.
            type: integer
          number:
            description: The page number.
            type: integer
        additionalProperties: false
      style: deepObject
  schemas:
    Addon:
      description: |-
        Add-on allows extending subscriptions with compatible plans with additional
        ratecards.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        key:
          description: |-
            A key is a semi-unique string that is used to identify the add-on. It is used to
            reference the latest `active` version of the add-on and is unique with the
            version number.
          type: string
          example: resource_key
          maxLength: 64
          minLength: 1
          pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
          title: Key
        version:
          description: Version of the add-on. Incremented when the add-on is updated.
          type: integer
          default: 1
          minimum: 1
          readOnly: true
          title: Version
        instance_type:
          description: The InstanceType of the add-ons. Can be "single" or "multiple".
          type: string
          enum:
            - single
            - multiple
          title: The InstanceType of the add-ons. Can be "single" or "multiple".
        currency:
          description: The currency code of the add-on.
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
          title: Currency
        effective_from:
          description: |-
            The date and time when the add-on becomes effective. When not specified, the
            add-on is a draft.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Effective start date
        effective_to:
          description: |-
            The date and time when the add-on is no longer effective. When not specified,
            the add-on is effective indefinitely.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Effective end date
        status:
          description: |-
            The status of the add-on. Computed based on the effective start and end dates:

            - `draft`: `effective_from` is not set.
            - `active`: `effective_from <= now` and (`effective_to` is not set or
            `now < effective_to`).
            - `archived`: `effective_to <= now`.
          type: string
          enum:
            - draft
            - active
            - archived
          readOnly: true
          title: Status
        rate_cards:
          description: The rate cards of the add-on.
          type: array
          items:
            $ref: '#/components/schemas/BillingRateCard'
          title: Rate cards
        validation_errors:
          description: List of validation errors.
          type: array
          items:
            $ref: '#/components/schemas/ProductCatalogValidationError'
          readOnly: true
          title: Validation errors
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - updated_at
        - key
        - version
        - instance_type
        - currency
        - status
        - rate_cards
    AddonPagePaginatedResponse:
      description: Page paginated response.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Addon'
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
      additionalProperties: false
      required:
        - data
        - meta
    AppCatalogItemPagePaginatedResponse:
      description: Page paginated response.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingAppCatalogItem'
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
      additionalProperties: false
      required:
        - data
        - meta
    AppPagePaginatedResponse:
      description: Page paginated response.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingApp'
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
      additionalProperties: false
      required:
        - data
        - meta
    BillingApp:
      description: Installed application.
      type: object
      discriminator:
        propertyName: type
        mapping:
          stripe: '#/components/schemas/BillingAppStripe'
          sandbox: '#/components/schemas/BillingAppSandbox'
          external_invoicing: '#/components/schemas/BillingAppExternalInvoicing'
      oneOf:
        - $ref: '#/components/schemas/BillingAppStripe'
        - $ref: '#/components/schemas/BillingAppSandbox'
        - $ref: '#/components/schemas/BillingAppExternalInvoicing'
    BillingAppCapability:
      description: App capability describes a function that an App can perform.
      type: object
      properties:
        type:
          description: Type of the capability.
          type: string
          enum:
            - report_usage
            - report_events
            - calculate_tax
            - invoice_customers
            - collect_payments
        key:
          description: Key of the capability.
          type: string
          example: resource_key
          maxLength: 64
          minLength: 1
          pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
          title: Resource Key
        name:
          description: Name of the capability.
          type: string
        description:
          description: Description of the capability.
          type: string
      example:
        type: collect_payments
        key: stripe_collect_payment
        name: Collect Payments
        description: Stripe payments collects outstanding revenue with Stripe customer's default payment method.
      additionalProperties: false
      required:
        - type
        - key
        - name
        - description
    BillingAppCapabilityType:
      description: |-
        Supported capability types for an App.

        Each capability defines an integration function that an App can perform.
      type: string
      enum:
        - report_usage
        - report_events
        - calculate_tax
        - invoice_customers
        - collect_payments
    BillingAppCatalogItem:
      description: |-
        Available apps for billing integrations to connect with third-party services.
        Apps can have various capabilities like syncing data from or to external
        systems, integrating with third-party services for tax calculation, delivery of
        invoices, collection of payments, etc.
      type: object
      properties:
        type:
          description: Type of the app.
          type: string
          enum:
            - sandbox
            - stripe
            - external_invoicing
          readOnly: true
        name:
          description: Name of the app.
          type: string
          readOnly: true
        description:
          description: Description of the app.
          type: string
          readOnly: true
        capabilities:
          description: Capabilities of the app.
          type: array
          items:
            $ref: '#/components/schemas/BillingAppCapability'
          readOnly: true
        install_methods:
          description: Available install methods of the app.
          type: array
          items:
            $ref: '#/components/schemas/BillingAppInstallMethods'
          readOnly: true
      example:
        type: stripe
        name: Stripe
        description: Stripe integration allows you to collect payments with Stripe.
        capabilities:
          - type: calculate_tax
            key: stripe_calculate_tax
            name: Calculate Tax
            description: Stripe Tax calculates tax portion of the invoices.
          - type: invoice_customers
            key: stripe_invoice_customers
            name: Invoice Customers
            description: Stripe invoices customers with due amount.
          - type: collect_payments
            key: stripe_collect_payments
            name: Collect Payments
            description: Stripe payments collects outstanding revenue with Stripe customer's default payment method.
        install_methods:
          - with_oauth2
          - with_api_key
      additionalProperties: false
      required:
        - type
        - name
        - description
        - capabilities
        - install_methods
    BillingAppCustomerData:
      description: App customer data.
      type: object
      properties:
        stripe:
          description: |-
            Used if the customer has a linked Stripe app.

            Set to `null` to remove the Stripe data of the customer; omit to leave it
            unchanged.
          type: object
          additionalProperties: false
          nullable: true
          properties:
            customer_id:
              description: The Stripe customer ID used.
              type: string
              example: cus_1234567890
              title: Stripe customer ID
            default_payment_method_id:
              description: The Stripe default payment method ID.
              type: string
              example: pm_1234567890
              title: Stripe default payment method ID
            labels:
              description: Labels for this Stripe integration on the customer.
              type: object
              example:
                env: test
              additionalProperties:
                type: string
                pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
                minLength: 1
                maxLength: 63
              maxProperties: 50
              title: Labels
          title: Stripe
        external_invoicing:
          description: |-
            Used if the customer has a linked external invoicing app.

            Set to `null` to remove the external invoicing data of the customer; omit to
            leave it unchanged.
          type: object
          additionalProperties: false
          nullable: true
          properties:
            labels:
              description: Labels for this external invoicing integration on the customer.
              type: object
              example:
                env: test
              additionalProperties:
                type: string
                pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
                minLength: 1
                maxLength: 63
              maxProperties: 50
              title: Labels
          title: External invoicing
      additionalProperties: false
    BillingAppExternalInvoicing:
      description: |-
        External Invoicing app enables integration with third-party invoicing or payment
        system.

        The app supports a bi-directional synchronization pattern where OpenMeter
        Billing manages the invoice lifecycle while the external system handles invoice
        presentation and payment collection.

        Integration workflow:

        1. The billing system creates invoices and transitions them through lifecycle
        states (draft → issuing → issued)
        2. The integration receives webhook notifications about invoice state changes
        3. The integration calls back to provide external system IDs and metadata
        4. The integration reports payment events back via the payment status API

        State synchronization is controlled by hooks that pause invoice progression
        until the external system confirms synchronization via API callbacks.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
