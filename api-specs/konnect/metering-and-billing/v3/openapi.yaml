openapi: 3.0.0
info:
  title: Konnect Metering & Billing
  version: 1.0.0
  contact:
    name: Kong
    url: 'https://cloud.konghq.com'
  description: Konnect Metering & Billing API.
  x-oas-source: kong/platform-api@57edc1abbbe7a1729b0313ec4d2118b9e4e84982
  x-oas-source-link: 'https://github.com/Kong/platform-api/commit/57edc1abbbe7a1729b0313ec4d2118b9e4e84982'
servers:
  - url: 'https://us.api.konghq.com/v3'
    description: United-States Production region
  - url: 'https://eu.api.konghq.com/v3'
    description: Europe Production region
  - url: 'https://au.api.konghq.com/v3'
    description: Australia Production region
  - url: 'https://me.api.konghq.com/v3'
    description: Middle-East Production region
  - url: 'https://in.api.konghq.com/v3'
    description: India Production region
  - url: 'https://sg.api.konghq.com/v3'
    description: Singapore Production region
paths:
  /openmeter/addons:
    get:
      operationId: list-product-catalog-addons
      summary: List add-ons
      description: List all add-ons.
      parameters:
        - $ref: '#/components/parameters/PagePaginationQuery'
        - name: sort
          in: query
          description: |-
            Sort add-ons returned in the response. Supported sort attributes are:

            - `id`
            - `key`
            - `name`
            - `created_at` (default)
            - `updated_at`

            The `asc` suffix is optional as the default sort order is ascending. The `desc`
            suffix is used to specify a descending order.
          required: false
          schema:
            $ref: '#/components/schemas/SortQuery'
          explode: false
          style: form
        - name: filter
          in: query
          description: Filter add-ons returned in the response.
          required: false
          schema:
            $ref: '#/components/schemas/ListAddonsParamsFilter'
          style: deepObject
      responses:
        '200':
          description: Page paginated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddonPagePaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - OpenMeter Product Catalog
    post:
      operationId: create-product-catalog-addon
      summary: Create add-on
      description: Create a new add-on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddonRequest'
      responses:
        '201':
          description: Addon created response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - OpenMeter Product Catalog
  '/openmeter/addons/{addonId}':
    put:
      operationId: update-product-catalog-addon
      summary: Update add-on
      description: Update an add-on by id.
      parameters:
        - name: addonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAddonRequest'
      responses:
        '200':
          description: Addon upsert response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      tags:
        - OpenMeter Product Catalog
    get:
      operationId: get-product-catalog-addon
      summary: Get add-on
      description: Get add-on by id.
      parameters:
        - name: addonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: Addon response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      tags:
        - OpenMeter Product Catalog
    delete:
      operationId: delete-product-catalog-addon
      summary: Soft delete add-on
      description: Soft delete add-on by id.
      parameters:
        - name: addonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '204':
          description: Deleted response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Product Catalog
  '/openmeter/addons/{addonId}/archive':
    post:
      operationId: archive-product-catalog-addon
      summary: Archive add-on version
      description: Archive an add-on version.
      parameters:
        - name: addonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: Addon updated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Product Catalog
  '/openmeter/addons/{addonId}/publish':
    post:
      operationId: publish-product-catalog-addon
      summary: Publish add-on version
      description: Publish an add-on version.
      parameters:
        - name: addonId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: Addon updated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Product Catalog
  /openmeter/app-catalog:
    get:
      operationId: list-app-catalog
      summary: List app catalog
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        List available apps.
      parameters:
        - $ref: '#/components/parameters/PagePaginationQuery'
      responses:
        '200':
          description: Page paginated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppCatalogItemPagePaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - OpenMeter Apps
  /openmeter/app-catalog/install:
    post:
      operationId: install-app
      summary: Install app from the catalog
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Install an app from the catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingInstallAppRequest'
      responses:
        '201':
          description: InstallAppResponse created response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInstallAppResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - OpenMeter Apps
  '/openmeter/app-catalog/{appType}':
    get:
      operationId: get-app-catalog-item
      summary: Get app catalog item by type
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Get an app catalog item by type.
      parameters:
        - name: appType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BillingAppType'
      responses:
        '200':
          description: AppCatalogItem response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAppCatalogItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Apps
  /openmeter/apps:
    get:
      operationId: list-apps
      summary: List apps
      description: List installed apps.
      parameters:
        - $ref: '#/components/parameters/PagePaginationQuery'
        - name: sort
          in: query
          description: |-
            Sort apps returned in the response. Supported sort attributes are:

            - `id`
            - `created_at` (default)

            The `asc` suffix is optional as the default sort order is ascending. The `desc`
            suffix is used to specify a descending order.
          required: false
          schema:
            $ref: '#/components/schemas/SortQuery'
          explode: false
          style: form
        - name: filter
          in: query
          description: |-
            Filter apps returned in the response.

            To filter apps by name add the following query param: filter[name]=my-app
          required: false
          schema:
            $ref: '#/components/schemas/ListAppsParamsFilter'
          style: deepObject
      responses:
        '200':
          description: Page paginated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppPagePaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - OpenMeter Apps
  '/openmeter/apps/{appId}':
    get:
      operationId: get-app
      summary: Get app
      description: Get an installed app.
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: App response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Apps
    delete:
      operationId: uninstall-app
      summary: Uninstall app
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Uninstall an app by ID.
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '204':
          description: Deleted response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Apps
    put:
      operationId: update-app
      summary: Update app
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Update an installed app.
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingUpdateAppRequest'
      responses:
        '200':
          description: App updated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Apps
  /openmeter/billing/invoices:
    get:
      operationId: list-invoices
      summary: List billing invoices
      description: |-
        List billing invoices.

        Returns a page of invoices. Gathering invoices are never included. Use `filter`
        to narrow by status, customer, dates, or service period start. Use `sort` to
        control ordering.
      parameters:
        - $ref: '#/components/parameters/PagePaginationQuery'
        - name: sort
          in: query
          description: |-
            Sort invoices returned in the response. Supported sort attributes:

            - `issued_at`
            - `created_at` (default)
            - `service_period_start`

            The `asc` suffix is optional as the default sort order is ascending. The `desc`
            suffix is used to specify a descending order.
          required: false
          schema:
            $ref: '#/components/schemas/SortQuery'
          explode: false
          style: form
        - name: filter
          in: query
          description: |-
            Filter invoices returned in the response.

            Examples:

            - `filter[status][oeq]=draft,issued`
            - `filter[customer_id]=01KPDB8K...`
            - `filter[issued_at][gte]=2024-01-01T00:00:00Z`
          required: false
          schema:
            $ref: '#/components/schemas/ListInvoicesParamsFilter'
          style: deepObject
      responses:
        '200':
          description: Page paginated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePagePaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - OpenMeter Billing Settings
  '/openmeter/billing/invoices/{invoiceId}':
    get:
      operationId: get-invoice
      summary: Get a billing invoice
      description: |-
        Get a billing invoice by ID.

        Returns the full invoice resource including line items, status details, totals,
        and workflow configuration snapshot.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: Invoice response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Billing Settings
    put:
      operationId: update-invoice
      summary: Update a billing invoice
      description: |-
        Update a billing invoice.

        Only the mutable fields of the invoice can be edited: description, labels,
        supplier, customer, workflow settings, and top-level lines. Top-level lines are
        matched by `id`; lines without an `id` are created, and existing lines omitted
        from `lines` are deleted. Detailed (child) lines are always computed and cannot
        be edited directly. Only invoices in draft status can be updated.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
      responses:
        '200':
          description: Invoice updated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Billing Settings
    delete:
      operationId: delete-invoice
      summary: Delete a billing invoice
      description: |-
        Delete a billing invoice.

        Only standard invoices in draft status can be deleted. Deleting an invoice will
        also delete all associated line items and workflow configuration.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '204':
          description: Deleted response.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Billing Settings
  '/openmeter/billing/invoices/{invoiceId}/advance':
    post:
      operationId: advance-invoice
      summary: Advance billing invoice's next status
      description: |-
        Advance a billing invoice.

        Advances the invoice to the next workflow state. The next state is determined by
        the invoice's current status and workflow configuration. Only invoices in draft
        or issued status can be advanced.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: The updated invoice after advancing to the next state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Billing Settings
  '/openmeter/billing/invoices/{invoiceId}/approve':
    post:
      operationId: approve-invoice
      summary: Send the invoice to the customer
      description: |-
        Approve a billing invoice.

        This call instantly sends the invoice to the customer using the configured
        billing profile app.

        This call is valid in two invoice statuses:

        - draft: the invoice will be sent to the customer, the invoice state becomes
        issued
        - manual_approval_needed: the invoice will be sent to the customer, the invoice
        state becomes issued
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: The updated invoice after sending to the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Billing Settings
  '/openmeter/billing/invoices/{invoiceId}/retry':
    post:
      operationId: retry-invoice
      summary: Retry advancing the invoice after a failed attempt
      description: |-
        Retry sending a billing invoice.

        Retry advancing the invoice after a failed attempt.

        The action can be called when the invoice's statusDetails' actions field contain
        the "retry" action.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: The updated invoice after retrying the action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Billing Settings
  '/openmeter/billing/invoices/{invoiceId}/snapshot-quantities':
    post:
      operationId: snapshot-quantities-invoice
      summary: Snapshot quantities for usage based line items
      description: |-
        Snapshot quantities for usage-based line items.

        This call will snapshot the quantities for all usage based line items in the
        invoice.

        This call is only valid in draft.waiting_for_collection status, where the
        collection period can be skipped using this action.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: |-
            The updated invoice with the snapshot quantities for usage based line
            items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingInvoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Billing Settings
  /openmeter/charges:
    get:
      operationId: list-charges
      summary: List charges
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        List charges.

        Returns the charges of every customer that are represented as either flat fee or
        usage-based charges.
      parameters:
        - $ref: '#/components/parameters/PagePaginationQuery'
        - name: sort
          in: query
          description: |-
            Sort charges returned in the response.

            Supported sort attributes are:

            - `id`
            - `created_at`
            - `service_period.from`
            - `billing_period.from`
          required: false
          schema:
            $ref: '#/components/schemas/SortQuery'
          explode: false
          style: form
        - name: filter
          in: query
          description: |-
            Filter charges.

            To filter charges by customer add the following query param:
            `filter[customer_id][eq]=<id>` or `filter[customer_id][oeq]=<id>,<id>`.

            To filter charges by status add the following query param:
            `filter[status][oeq]=created,active`

            To filter charges by feature, use `filter[feature_id][oeq]=<id>,<id>` or
            `filter[feature_key][oeq]=<key>,<key>`.

            See the `service_period_from` filter field for expressing a service-period
            window query.
          required: false
          schema:
            $ref: '#/components/schemas/ListChargesParamsFilter'
          style: deepObject
        - name: expand
          in: query
          description: |-
            Expand full objects for referenced entities.

            Supported values are:

            - `real_time_usage`: Expand the charge's real-time usage; it sets the `usage`
            and the `totals.realtime` fields.
            - `customer`: Expand the charge's customer to the complete entity.
            - `feature`: Expand the charge's feature to the complete entity.
            - `subscription`: Expand the charge's subscription to the complete entity.
            - `realization.invoice`: Expand each realization's invoice to the complete
            entity.
            - `realization.totals`: Expand each realization run's `totals`.
            - `realization.detailed_lines`: Expand each realization run's `detailed_lines`.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/BillingChargesExpand'
          explode: false
          style: form
      responses:
        '200':
          description: Page paginated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargePagePaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - OpenMeter Billing Settings
  /openmeter/currencies:
    get:
      operationId: list-currencies
      summary: List currencies
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        List currencies supported by the billing system.
      parameters:
        - $ref: '#/components/parameters/PagePaginationQuery'
        - name: sort
          in: query
          description: |-
            Sort currencies returned in the response. Supported sort attributes are:

            - `code` (default)
            - `name`

            The `asc` suffix is optional as the default sort order is ascending. The `desc`
            suffix is used to specify a descending order.
