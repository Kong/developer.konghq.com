          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        pro_rating_enabled:
          description: Whether pro-rating is enabled for this plan.
          type: boolean
          default: true
          title: Pro-rating enabled
        phases:
          description: |-
            The plan phases define the pricing ramp for a subscription. A phase switch
            occurs only at the end of a billing period. At least one phase is required.
          type: array
          items:
            $ref: '#/components/schemas/BillingPlanPhase'
          minItems: 1
          title: Plan phases
        settlement_mode:
          description: |-
            Settlement mode for the plan. When omitted, the existing settlement mode is
            preserved.
          type: string
          enum:
            - credit_then_invoice
            - credit_only
          title: Settlement Mode
      additionalProperties: false
      required:
        - name
        - phases
    UpsertTaxCodeRequest:
      description: TaxCode upsert request.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        app_mappings:
          description: Mapping of app types to tax codes.
          type: array
          items:
            $ref: '#/components/schemas/BillingTaxCodeAppMapping'
          title: App type to tax code mappings
      additionalProperties: false
      required:
        - name
        - app_mappings
