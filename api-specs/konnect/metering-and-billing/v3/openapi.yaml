          type: array
          items:
            $ref: '#/components/schemas/SubscriptionAddonRateCard'
          readOnly: true
          title: Rate cards
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - name
        - addon
        - quantity
        - quantity_at
        - active_from
        - timeline
        - rate_cards
    SubscriptionAddonPagePaginatedResponse:
      description: Page paginated response.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionAddon'
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
      additionalProperties: false
      required:
        - data
        - meta
    SubscriptionAddonRateCard:
      description: A rate card for a subscription add-on.
      type: object
      properties:
        rate_card:
          description: The rate card.
          type: object
          additionalProperties: false
          properties:
            name:
              description: |-
                Display name of the resource.

                Between 1 and 256 characters.
              type: string
              maxLength: 256
              minLength: 1
            description:
              description: |-
                Optional description of the resource.

                Maximum 1024 characters.
              type: string
              maxLength: 1024
            labels:
              $ref: '#/components/schemas/Labels'
            key:
              $ref: '#/components/schemas/ResourceKey'
            feature:
              description: The feature associated with the rate card.
              type: object
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/ULID'
              required:
                - id
              title: Feature reference
            currency:
              description: |-
                Overrides the containing plan or add-on currency for this rate card. When
                omitted, the containing resource currency applies.
              oneOf:
                - $ref: '#/components/schemas/CurrencyCode'
                - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
              title: Currency override
            billing_cadence:
              description: |-
                The billing cadence of the rate card. When null, the charge is one-time
                (non-recurring). Only valid for flat prices.
              type: string
              format: ISO8601
              example: P1Y
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Billing cadence
            price:
              description: The price of the rate card.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  free: '#/components/schemas/BillingPriceFree'
                  flat: '#/components/schemas/BillingPriceFlat'
                  unit: '#/components/schemas/BillingPriceUnit'
                  graduated: '#/components/schemas/BillingPriceGraduated'
                  volume: '#/components/schemas/BillingPriceVolume'
              oneOf:
                - $ref: '#/components/schemas/BillingPriceFree'
                - $ref: '#/components/schemas/BillingPriceFlat'
                - $ref: '#/components/schemas/BillingPriceUnit'
                - $ref: '#/components/schemas/BillingPriceGraduated'
                - $ref: '#/components/schemas/BillingPriceVolume'
              title: Price
            unit_config:
              description: |-
                Unit conversion configuration for the rate card.

                Synthesized on read for plans authored with v1 dynamic or package prices:
                dynamic prices map to a unit price with a multiply unit config, and package
                prices map to a unit price with a divide unit config.

                Accepted on create and update only when the UnitConfig feature is enabled on the
                deployment; otherwise rejected.
              type: object
              additionalProperties: false
              properties:
                operation:
                  description: The arithmetic operation to apply to the raw metered quantity.
                  type: string
                  enum:
                    - divide
                    - multiply
                  title: Conversion operation
                conversion_factor:
                  description: |-
                    The factor used in the conversion operation.

                    - For `divide`: `converted = raw / conversionFactor`.
                    - For `multiply`: `converted = raw × conversionFactor`.

                    Must be a positive non-zero value.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Conversion factor
                rounding:
                  description: |-
                    The rounding mode applied to the converted quantity for invoicing.

                    Defaults to none (no rounding). Entitlement checks always use the precise
                    (unrounded) value.
                  type: string
                  default: none
                  enum:
                    - ceiling
                    - floor
                    - half_up
                    - none
                  title: Rounding mode
                precision:
                  description: |-
                    The number of decimal places to retain after rounding.

                    Only meaningful when rounding is not "none". Defaults to 0 (round to whole
                    numbers).
                  type: integer
                  default: 0
                  title: Rounding precision (decimal places)
                display_unit:
                  description: |-
                    A human-readable label for the converted unit shown on invoices and in the
                    customer portal (e.g., "GB", "hours", "M tokens").

                    Optional. When omitted, no unit label is rendered.
                  type: string
                  title: Display unit label
              required:
                - operation
                - conversion_factor
              title: Unit config
            payment_term:
              description: |-
                The payment term of the rate card. In advance payment term can only be used for
                flat prices.
              type: string
              default: in_arrears
              enum:
                - in_advance
                - in_arrears
              title: Payment term
            commitments:
              description: |-
                Spend commitments for this rate card. Only applicable to usage-based prices
                (unit, graduated, volume).
              type: object
              additionalProperties: false
              properties:
                minimum_amount:
                  description: The customer is committed to spend at least the amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Minimum amount
                maximum_amount:
                  description: The customer is limited to spend at most the amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Maximum amount
              title: Commitments
            discounts:
              description: The discounts of the rate card.
              type: object
              additionalProperties: false
              properties:
                percentage:
                  description: Percentage discount applied to the price (0–100).
                  type: number
                  maximum: 100
                  minimum: 0
                usage:
                  description: |-
                    Number of usage units granted free before billing starts. Only applies to
                    usage-based lines (not flat fees). Usage is treated as zero until this amount is
                    exhausted.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Discounts
            tax_config:
              description: The tax config of the rate card.
              type: object
              additionalProperties: false
              properties:
                behavior:
                  description: |-
                    Tax behavior.

                    This enum is used to specify whether tax is included in the price or excluded
                    from the price. If not specified, the billing profile is used to determine the
                    tax behavior. If not specified in the billing profile, the provider's default
                    behavior is used.
                  type: string
                  enum:
                    - inclusive
                    - exclusive
                  title: Tax behavior
                code:
                  description: Tax code applied to the invoice line item.
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      $ref: '#/components/schemas/ULID'
                  required:
                    - id
                  title: Tax code
              title: Tax config
            entitlement:
              description: |-
                The entitlement template granted to subscribers of a plan or addon containing
                this rate card. Requires `feature` to be set.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  metered: '#/components/schemas/BillingRateCardMeteredEntitlement'
                  static: '#/components/schemas/BillingRateCardStaticEntitlement'
                  boolean: '#/components/schemas/BillingRateCardBooleanEntitlement'
              oneOf:
                - $ref: '#/components/schemas/BillingRateCardMeteredEntitlement'
                - $ref: '#/components/schemas/BillingRateCardStaticEntitlement'
                - $ref: '#/components/schemas/BillingRateCardBooleanEntitlement'
              title: Entitlement template
          required:
            - name
            - key
            - price
          title: Rate card
        affected_subscription_item_ids:
          description: The IDs of the subscription items that this rate card belongs to.
          type: array
          items:
            $ref: '#/components/schemas/ULID'
          readOnly: true
          title: Affected subscription item IDs
      additionalProperties: false
      required:
        - rate_card
        - affected_subscription_item_ids
    SubscriptionAddonTimelineSegment:
      description: A subscription add-on event.
      type: object
      properties:
        active_from:
          description: An ISO-8601 timestamp representation of the cadence start of the resource.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        active_to:
          description: An ISO-8601 timestamp representation of the cadence end of the resource.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        quantity:
          description: The quantity of the add-on for the given period.
          type: integer
          example: 1
          minimum: 0
          readOnly: true
          title: Quantity
      additionalProperties: false
      required:
        - active_from
        - quantity
    SubscriptionPagePaginatedResponse:
      description: Page paginated response.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingSubscription'
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
      additionalProperties: false
      required:
        - data
        - meta
    TaxCodePagePaginatedResponse:
      description: Page paginated response.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BillingTaxCode'
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
      additionalProperties: false
      required:
        - data
        - meta
    ULID:
      description: ULID (Universally Unique Lexicographically Sortable Identifier).
      type: string
      example: 01G65Z755AFWAKHE12NY0CQ9FH
      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
      title: ULID
    ULIDFieldFilter:
      description: |-
        Filters on the given ULID field value by exact match. All properties are
        optional; provide exactly one to specify the comparison.
      anyOf:
        - $ref: '#/components/schemas/ULID'
        - type: object
          properties:
            eq:
              description: Value strictly equals the given ULID value.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              title: ULID
            oeq:
              description: |-
                Returns entities that exact match any of the comma-delimited ULIDs in the filter
                string.
              type: string
            neq:
              description: Value does not equal the given ULID value.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              title: ULID
          additionalProperties: false
      title: ULID Field Filter
    UpdateAppExternalInvoicingRequest:
      description: AppExternalInvoicing update request.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        type:
          description: The app type.
          type: string
          enum:
            - external_invoicing
        enable_draft_sync_hook:
          description: |-
            Enable draft synchronization hook.

            When enabled, invoices will pause at the draft state and wait for the
            integration to call the draft synchronized endpoint before progressing to the
            issuing state. This allows the external system to validate and prepare the
            invoice data.

            When disabled, invoices automatically progress through the draft state based on
            the configured workflow timing.
          type: boolean
        enable_issuing_sync_hook:
          description: |-
            Enable issuing synchronization hook.

            When enabled, invoices will pause at the issuing state and wait for the
            integration to call the issuing synchronized endpoint before progressing to the
            issued state. This ensures the external invoicing system has successfully
            created and finalized the invoice before it is marked as issued.

            When disabled, invoices automatically progress through the issuing state and are
            immediately marked as issued.
          type: boolean
      additionalProperties: false
      required:
        - name
        - type
        - enable_draft_sync_hook
        - enable_issuing_sync_hook
    UpdateAppSandboxRequest:
      description: AppSandbox update request.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        type:
          description: The app type.
          type: string
          enum:
            - sandbox
      additionalProperties: false
      required:
        - name
        - type
    UpdateAppStripeRequest:
      description: AppStripe update request.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        type:
          description: The app type.
          type: string
          enum:
            - stripe
        secret_api_key:
          description: The Stripe secret API key used to authenticate API requests.
          type: string
          format: password
      additionalProperties: false
      required:
        - name
        - type
    UpdateBillingNotificationChannelRequest:
      description: |-
        Request body for updating a notification channel. Updates replace the channel's
        mutable state rather than merging it: `type`, `name`, and `url` must always be
        provided, and omitting `disabled`, `labels`, or `custom_headers` resets them to
        their defaults (enabled, no labels, no custom headers). `signing_secret` is the
        one exception: omitting it keeps the channel's current signing secret instead of
        clearing the credential.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        type:
          description: The type of the channel. Immutable after creation.
          type: string
          enum:
            - webhook
        url:
          description: The URL that webhook notification events are delivered to.
          type: string
        labels:
          $ref: '#/components/schemas/Labels'
        disabled:
          description: |-
            Whether the channel is disabled. Disabled channels do not receive notification
            events.
          type: boolean
          default: false
        custom_headers:
          description: |-
            Custom HTTP headers to include on every webhook delivery request, keyed by
            header name.
          type: object
          additionalProperties:
            type: string
        signing_secret:
          description: |-
            Secret used to sign outgoing webhook payloads so recipients can verify their
            authenticity. If omitted on create, a secret is generated automatically by the
            delivery provider. This is a sensitive credential returned in responses (unlike
            most secrets) specifically so clients can retrieve a server-generated value and
            verify webhook signatures; handle it with the same care as any other credential.
          type: string
      additionalProperties: false
      required:
        - name
        - type
        - url
    UpdateBillingWorkflowPaymentChargeAutomaticallySettings:
      description: |-
        Payment settings for a billing workflow when the collection method is charge
        automatically.
      type: object
      properties:
        collection_method:
          description: The collection method for the invoice.
          type: string
          enum:
            - charge_automatically
      additionalProperties: false
      required:
        - collection_method
    UpdateBillingWorkflowPaymentSendInvoiceSettings:
      description: |-
        Payment settings for a billing workflow when the collection method is send
        invoice.
      type: object
      properties:
        collection_method:
          description: The collection method for the invoice.
          type: string
          enum:
            - send_invoice
        due_after:
          description: |-
            The period after which the invoice is due. With some payment solutions it's only
            applicable for manual collection method.
          type: string
          format: ISO8601
          example: P30D
          default: P30D
      additionalProperties: false
      required:
        - collection_method
    UpdateCreditGrantExternalSettlementRequest:
      description: |-
        Request body for updating the external payment settlement status of a credit
        grant.
      type: object
      properties:
        status:
          description: The new payment settlement status.
          type: string
          enum:
            - pending
            - authorized
            - settled
          title: Credit purchase payment settlement status
      additionalProperties: false
      required:
        - status
    UpdateFeatureRequest:
      description: |-
        Request body for updating a feature. Currently only the unit_cost field can be
        updated.
      type: object
      properties:
        unit_cost:
          description: |-
            Optional per-unit cost configuration. Use "manual" for a fixed per-unit cost, or
            "llm" to look up cost from the LLM cost database based on meter group-by
            properties. Set to `null` to clear the existing unit cost; omit to leave it
            unchanged.
          type: object
          discriminator:
            propertyName: type
            mapping:
              manual: '#/components/schemas/BillingFeatureManualUnitCost'
              llm: '#/components/schemas/BillingFeatureLLMUnitCost'
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/BillingFeatureManualUnitCost'
            - $ref: '#/components/schemas/BillingFeatureLLMUnitCost'
          title: Unit cost
      additionalProperties: false
    UpdateInvoiceLine:
      description: |-
        A top-level line item on an invoice.

        Each line represents a single charge, typically associated with a rate card from
        a subscription. Detailed (child) lines are nested under `detailed_lines` when
        present.
      type: object
      discriminator:
        propertyName: type
        mapping:
          standard_line: '#/components/schemas/UpdateInvoiceStandardLine'
      oneOf:
        - $ref: '#/components/schemas/UpdateInvoiceStandardLine'
    UpdateInvoiceRequest:
      description: UpdateInvoiceRequest update request.
      type: object
      discriminator:
        propertyName: type
        mapping:
          standard: '#/components/schemas/UpdateInvoiceStandardRequest'
      oneOf:
        - $ref: '#/components/schemas/UpdateInvoiceStandardRequest'
    UpdateInvoiceStandardLine:
      description: |-
        A top-level line item on an invoice.

        Each line represents a single charge, typically associated with a rate card from
        a subscription. Detailed (child) lines are nested under `detailed_lines` when
        present.
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        id:
          description: |-
            ID of the line.

            Optional on update: omit to create a new line, or supply the ID of an existing
            line to edit it. Existing lines omitted from an update's `lines` array are
            deleted.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          title: ID
        type:
          description: The type of charge this line item represents.
          type: string
          enum:
            - standard_line
          title: Type
        service_period:
          description: |-
            The service period covered by this invoice, spanning the earliest line start to
            the latest line end across all of its lines.

            For an invoice with no lines the period is empty, which means `from` will be
            equal to `to`.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          required:
            - from
            - to
          title: Service period
        rate_card:
          description: The rate card configuration snapshot used to price this line item.
          type: object
          additionalProperties: false
          properties:
            price:
              description: The price definition used to calculate charges for this line.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  free: '#/components/schemas/UpdatePriceFree'
                  flat: '#/components/schemas/UpdatePriceFlat'
                  unit: '#/components/schemas/UpdatePriceUnit'
                  graduated: '#/components/schemas/UpdatePriceGraduated'
                  volume: '#/components/schemas/UpdatePriceVolume'
              oneOf:
                - $ref: '#/components/schemas/UpdatePriceFree'
                - $ref: '#/components/schemas/UpdatePriceFlat'
                - $ref: '#/components/schemas/UpdatePriceUnit'
                - $ref: '#/components/schemas/UpdatePriceGraduated'
                - $ref: '#/components/schemas/UpdatePriceVolume'
              title: Price
            tax_config:
              description: Tax configuration snapshot for this line.
              type: object
              additionalProperties: false
              properties:
                behavior:
                  description: |-
                    Tax behavior.

                    This enum is used to specify whether tax is included in the price or excluded
                    from the price. If not specified, the billing profile is used to determine the
                    tax behavior. If not specified in the billing profile, the provider's default
                    behavior is used.
                  type: string
                  enum:
                    - inclusive
                    - exclusive
                  title: Tax behavior
                code:
                  description: Tax code applied to the invoice line item.
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      $ref: '#/components/schemas/ULID'
                  required:
                    - id
                  title: Tax code
              title: Tax config
            feature_key:
              description: The feature key associated with this line's rate card.
              type: string
              example: resource_key
              maxLength: 64
              minLength: 1
              pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
              title: Feature key
            discounts:
              description: Discount configuration from the rate card.
              type: object
              additionalProperties: false
              properties:
                percentage:
                  description: Percentage discount applied to the price (0–100).
                  type: number
                  maximum: 100
                  minimum: 0
                usage:
                  description: |-
                    Number of usage units granted free before billing starts. Only applies to
                    usage-based lines (not flat fees). Usage is treated as zero until this amount is
                    exhausted.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Discounts
          required:
            - price
          title: Rate card
      additionalProperties: false
      required:
        - name
        - type
        - service_period
        - rate_card
    UpdateInvoiceStandardRequest:
      description: InvoiceStandard update request.
      type: object
      properties:
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        supplier:
          description: |-
            Snapshot of the supplier's contact information at the time the invoice was
            issued.
          type: object
          additionalProperties: false
          properties:
            name:
              description: Legal name or representation of the party.
              type: string
            tax_id:
              description: |-
                The entity's legal identification used for tax purposes. They may have other
                numbers, but we're only interested in those valid for tax purposes.
              type: object
              additionalProperties: false
              properties:
                code:
                  description: Normalized tax identification code shown on the original identity document.
                  type: string
                  maxLength: 32
                  minLength: 1
            addresses:
              description: Address for where information should be sent if needed.
              type: object
              additionalProperties: false
              properties:
                billing_address:
                  description: Billing address.
                  type: object
                  additionalProperties: false
                  properties:
                    country:
                      description: |-
                        Country code in [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html)
                        alpha-2 format.
                      type: string
                      example: US
                      maxLength: 2
                      minLength: 2
                      pattern: '^[A-Z]{2}$'
                      title: Country
                    postal_code:
                      description: Postal code.
                      type: string
                      title: Postal Code
                    state:
                      description: State or province.
                      type: string
                      title: State
                    city:
                      description: City.
                      type: string
                      title: City
                    line1:
                      description: First line of the address.
                      type: string
                      title: Line 1
                    line2:
                      description: Second line of the address.
                      type: string
                      title: Line 2
                    phone_number:
                      description: Phone number.
                      type: string
                      title: Phone Number
              required:
                - billing_address
            id:
              description: Unique identifier for the party.
              type: string
          title: Supplier
        customer:
          description: Snapshot of the customer's information at the time the invoice was issued.
          type: object
          additionalProperties: false
          properties:
            name:
              description: |-
                Display name of the resource.

                Between 1 and 256 characters.
              type: string
              maxLength: 256
              minLength: 1
            usage_attribution:
              description: Mapping to attribute metered usage to the customer by the event subject.
              type: object
              additionalProperties: false
              properties:
                subject_keys:
                  description: |-
                    The subjects that are attributed to the customer. Can be empty when no usage
                    event subjects are associated with the customer.
                  type: array
                  items:
                    $ref: '#/components/schemas/UsageAttributionSubjectKey'
                  minItems: 0
                  title: Subject Keys
              required:
                - subject_keys
              title: Usage Attribution
            billing_address:
              description: The billing address of the customer. Used for tax and invoicing.
              type: object
              additionalProperties: false
              properties:
                country:
                  description: |-
                    Country code in [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html)
                    alpha-2 format.
                  type: string
                  example: US
                  maxLength: 2
                  minLength: 2
                  pattern: '^[A-Z]{2}$'
                  title: Country
                postal_code:
                  description: Postal code.
                  type: string
                  title: Postal Code
                state:
                  description: State or province.
                  type: string
                  title: State
                city:
                  description: City.
                  type: string
                  title: City
                line1:
                  description: First line of the address.
                  type: string
                  title: Line 1
                line2:
                  description: Second line of the address.
                  type: string
                  title: Line 2
                phone_number:
                  description: Phone number.
                  type: string
                  title: Phone Number
              title: Billing Address
            id:
              $ref: '#/components/schemas/ULID'
            key:
              description: |-
                Optional external resource key for the customer.

                Omitted when the customer was created without a key. Unlike on the customer
                resource itself, the key is optional here because the invoice snapshot may
                predate or omit it.
              type: string
              example: 019ae40f-4258-7f15-9491-842f42a7d6ac
              maxLength: 256
              minLength: 1
              title: External Resource Key
          required:
            - name
            - id
          title: Customer
        type:
          description: Discriminator field identifying this as a standard invoice.
          type: string
          enum:
            - standard
          title: Type
        workflow:
          description: Workflow configuration snapshot captured at invoice creation time.
          type: object
          additionalProperties: false
          properties:
            workflow:
              description: |-
                The workflow configuration that was active when the invoice was created.

                Only the fields that are meaningful at the per-invoice level are included:
                invoicing behaviour (auto-advance, draft period) and payment settings
                (collection method, due date). Profile-wide settings such as collection
                alignment, progressive billing, and tax policy are omitted.
              type: object
              additionalProperties: false
              properties:
                invoicing:
                  description: Invoicing settings for this invoice.
                  type: object
                  additionalProperties: false
                  properties:
                    auto_advance:
                      description: Whether to automatically issue the invoice after the draft_period has passed.
                      type: boolean
                      default: true
                    draft_period:
                      description: The period for the invoice to be kept in draft status for manual reviews.
                      type: string
                      format: ISO8601
                      example: P1D
                      default: P0D
                  title: Invoicing settings
                payment:
                  description: Payment settings for this invoice.
                  type: object
                  discriminator:
                    propertyName: collection_method
                    mapping:
                      charge_automatically: '#/components/schemas/UpdateBillingWorkflowPaymentChargeAutomaticallySettings'
                      send_invoice: '#/components/schemas/UpdateBillingWorkflowPaymentSendInvoiceSettings'
                  oneOf:
                    - $ref: '#/components/schemas/UpdateBillingWorkflowPaymentChargeAutomaticallySettings'
                    - $ref: '#/components/schemas/UpdateBillingWorkflowPaymentSendInvoiceSettings'
                  title: Payment settings
              title: Workflow config
          required:
            - workflow
          title: Workflow
        lines:
          description: |-
            Line items on this invoice.

            Always returned on single-resource GET; omitted on list endpoints unless
            explicitly expanded. Editable via update: existing lines are matched by `id`,
            lines without an `id` are created, and lines present on the invoice but omitted
            from the update request are deleted. Detailed (child) lines are always computed
            and cannot be edited directly.
          type: array
          items:
            $ref: '#/components/schemas/UpdateInvoiceLine'
          title: Lines
      additionalProperties: false
      required:
        - supplier
        - customer
        - type
        - workflow
    UpdateMeterRequest:
