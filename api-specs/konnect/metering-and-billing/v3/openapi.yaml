              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Inclusive taxes total
            taxes_exclusive_total:
              description: The total tax amount added on top of the resource amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Exclusive taxes total
            charges_total:
              description: The total amount contributed by additional charges.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Charges total
            discounts_total:
              description: The total amount deducted through discounts.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Discounts total
            credits_total:
              description: The total amount deducted through credits before taxes are applied.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Credits total
            total:
              description: 'The final total value of the resource after taxes, discounts and commitments.'
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Total
          readOnly: true
          required:
            - amount
            - taxes_total
            - taxes_inclusive_total
            - taxes_exclusive_total
            - charges_total
            - discounts_total
            - credits_total
            - total
          title: Totals
        category:
          description: The cost category of this detailed line.
          type: string
          enum:
            - regular
            - commitment
          readOnly: true
          title: Category
        credits_applied:
          description: Credits applied to this detailed line.
          type: array
          items:
            $ref: '#/components/schemas/BillingChargeRealizationDetailedLineCreditApplied'
          readOnly: true
          title: Credits applied
        unit_price:
          description: The unit price of the detailed line.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Unit price
        amount_discounts:
          description: The amount discounts applied to the detailed line.
          type: array
          items:
            $ref: '#/components/schemas/BillingChargeRealizationAmountDiscount'
          readOnly: true
          title: Amount discounts
        quantity:
          description: The quantity of the detailed line.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Quantity
        corrects_run_id:
          description: |-
            The ID of a prior realization run this detailed line corrects. Only set if the
            detailed line's totals are negative.
          type: string
          readOnly: true
          title: Corrects run ID
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - type
        - service_period
        - totals
        - category
        - unit_price
        - amount_discounts
        - quantity
      title: Usage-based charge realization detailed line
    BillingChargeRealizationInvoice:
      description: |-
        The invoice a charge realization was booked to, embedded as a header.

        Matches the standard invoice entity, except that it carries no `customer`
        snapshot (the charge context already identifies the customer) and `lines` are
        never populated (the realization itself is the line-level breakdown). The shared
        invoice contract stays untouched: this model exists so the charges API can slim
        the embedding without loosening the invoices API.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        number:
          description: Human-readable invoice number generated by the invoicing app.
          type: string
          example: INV-2024-01-01-01
          maxLength: 256
          minLength: 1
          readOnly: true
          title: Number
        currency:
          description: Three-letter ISO 4217 currency code for the invoice.
          type: string
          example: USD
          maxLength: 3
          minLength: 3
          pattern: '^[A-Z]{3}$'
          readOnly: true
          title: Currency
        supplier:
          description: |-
            Snapshot of the supplier's contact information at the time the invoice was
            issued.
          type: object
          additionalProperties: false
          properties:
            name:
              description: Legal name or representation of the party.
              type: string
            tax_id:
              description: |-
                The entity's legal identification used for tax purposes. They may have other
                numbers, but we're only interested in those valid for tax purposes.
              type: object
              additionalProperties: false
              properties:
                code:
                  description: Normalized tax identification code shown on the original identity document.
                  type: string
                  maxLength: 32
                  minLength: 1
            addresses:
              description: Address for where information should be sent if needed.
              type: object
              additionalProperties: false
              properties:
                billing_address:
                  description: Billing address.
                  type: object
                  additionalProperties: false
                  properties:
                    country:
                      description: |-
                        Country code in [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html)
                        alpha-2 format.
                      type: string
                      example: US
                      maxLength: 2
                      minLength: 2
                      pattern: '^[A-Z]{2}$'
                      title: Country
                    postal_code:
                      description: Postal code.
                      type: string
                      title: Postal Code
                    state:
                      description: State or province.
                      type: string
                      title: State
                    city:
                      description: City.
                      type: string
                      title: City
                    line1:
                      description: First line of the address.
                      type: string
                      title: Line 1
                    line2:
                      description: Second line of the address.
                      type: string
                      title: Line 2
                    phone_number:
                      description: Phone number.
                      type: string
                      title: Phone Number
              required:
                - billing_address
            id:
              description: Unique identifier for the party.
              type: string
          title: Supplier
        totals:
          description: Aggregated financial totals for the invoice.
          type: object
          additionalProperties: false
          properties:
            amount:
              description: 'The total value of the resource before taxes, discounts and commitments.'
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Amount
            taxes_total:
              description: The total tax amount applied to the resource.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Taxes total
            taxes_inclusive_total:
              description: The total tax amount already included in the resource amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Inclusive taxes total
            taxes_exclusive_total:
              description: The total tax amount added on top of the resource amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Exclusive taxes total
            charges_total:
              description: The total amount contributed by additional charges.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Charges total
            discounts_total:
              description: The total amount deducted through discounts.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Discounts total
            credits_total:
              description: The total amount deducted through credits before taxes are applied.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Credits total
            total:
              description: 'The final total value of the resource after taxes, discounts and commitments.'
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Total
          readOnly: true
          required:
            - amount
            - taxes_total
            - taxes_inclusive_total
            - taxes_exclusive_total
            - charges_total
            - discounts_total
            - credits_total
            - total
          title: Totals
        service_period:
          description: |-
            The service period covered by this invoice.

            For flat fee the service period can be empty which means `from` will be equals
            to `to`. In other cases those fields will be filled with the actual service
            period.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Service period
        validation_issues:
          description: |-
            Validation issues found during invoice processing.

            Present only when there are one or more validation findings. An empty list is
            omitted.
          type: array
          items:
            $ref: '#/components/schemas/BillingValidationIssue'
          readOnly: true
          title: Validation issues
        external_references:
          description: External identifiers assigned to this invoice by third-party systems.
          type: object
          additionalProperties: false
          properties:
            invoicing_id:
              description: The ID assigned by the external invoicing app (e.g. Stripe invoice ID).
              type: string
              readOnly: true
              title: Invoicing ID
            payment_id:
              description: The ID assigned by the external payment app (e.g. Stripe payment intent ID).
              type: string
              readOnly: true
              title: Payment ID
          readOnly: true
          title: External references
        type:
          description: Discriminator field identifying this as a standard invoice.
          type: string
          enum:
            - standard
          title: Type
        status:
          description: Current lifecycle status of the invoice.
          type: string
          enum:
            - draft
            - issuing
            - issued
            - payment_processing
            - overdue
            - paid
            - uncollectible
            - voided
          readOnly: true
          title: Status
        status_details:
          description: Detailed status information including available actions and workflow state.
          type: object
          additionalProperties: false
          properties:
            immutable:
              description: Whether the invoice is immutable (i.e. cannot be modified or deleted).
              type: boolean
              readOnly: true
              title: Immutable
            failed:
              description: Whether the invoice is in a failed state.
              type: boolean
              readOnly: true
              title: Failed
            extended_status:
              description: |-
                Fine-grained internal status string providing additional workflow detail beyond
                the top-level status enum.
              type: string
              readOnly: true
              title: Extended status
            available_actions:
              description: The set of state-transition actions currently available for this invoice.
              type: object
              additionalProperties: false
              properties:
                advance:
                  description: Advance the invoice to the next workflow step.
                  type: object
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Advance
                approve:
                  description: Approve the invoice for issuance.
                  type: object
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Approve
                delete:
                  description: Delete the invoice.
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Delete
                  type: object
                retry:
                  description: Retry a failed workflow step.
                  type: object
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Retry
                snapshot_quantities:
                  description: Snapshot the current usage quantities.
                  type: object
                  additionalProperties: false
                  properties:
                    resulting_state:
                      description: The extended status the invoice will transition to after performing this action.
                      type: string
                      readOnly: true
                      title: Resulting state
                  readOnly: true
                  required:
                    - resulting_state
                  title: Snapshot quantities
              readOnly: true
              title: Available actions
          readOnly: true
          required:
            - immutable
            - failed
            - extended_status
            - available_actions
          title: Status details
        issued_at:
          description: Timestamp when the invoice was issued to the customer.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Issued at
        draft_until:
          description: |-
            Timestamp until which the invoice remains in draft state.

            The invoice advances automatically once this time is reached.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Draft until
        quantity_snapshotted_at:
          description: Timestamp when usage quantities were last snapshotted for this invoice.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Quantity snapshotted at
        collection_at:
          description: Timestamp when collection was initiated for this invoice.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Collection at
        due_at:
          description: Timestamp when payment is due.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Due at
        sent_to_customer_at:
          description: Timestamp when the invoice was sent to the customer.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Sent to customer at
        workflow:
          description: Workflow configuration snapshot captured at invoice creation time.
          type: object
          additionalProperties: false
          properties:
            apps:
              description: The apps that will be used to orchestrate the invoice's workflow.
              type: object
              additionalProperties: false
              properties:
                tax:
                  description: The tax app used for this workflow
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      description: The ID of the app.
                      type: string
                      example: 01G65Z755AFWAKHE12NY0CQ9FH
                      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                      title: ULID
                  readOnly: true
                  required:
                    - id
                invoicing:
                  description: The invoicing app used for this workflow
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      description: The ID of the app.
                      type: string
                      example: 01G65Z755AFWAKHE12NY0CQ9FH
                      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                      title: ULID
                  readOnly: true
                  required:
                    - id
                payment:
                  description: The payment app used for this workflow
                  type: object
                  additionalProperties: false
                  properties:
                    id:
                      description: The ID of the app.
                      type: string
                      example: 01G65Z755AFWAKHE12NY0CQ9FH
                      pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                      title: ULID
                  readOnly: true
                  required:
                    - id
              readOnly: true
              required:
                - tax
                - invoicing
                - payment
              title: Application that generated the invoice
            source_billing_profile:
              description: The billing profile that was the source of this workflow snapshot.
              type: object
              additionalProperties: false
              properties:
                id:
                  description: The ID of the billing profile.
                  type: string
                  example: 01G65Z755AFWAKHE12NY0CQ9FH
                  pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  title: ULID
              readOnly: true
              required:
                - id
              title: Source billing profile
            workflow:
              description: |-
                The workflow configuration that was active when the invoice was created.

                Only the fields that are meaningful at the per-invoice level are included:
                invoicing behaviour (auto-advance, draft period) and payment settings
                (collection method, due date). Profile-wide settings such as collection
                alignment, progressive billing, and tax policy are omitted.
              type: object
              additionalProperties: false
              properties:
                invoicing:
                  description: Invoicing settings for this invoice.
                  type: object
                  additionalProperties: false
                  properties:
                    auto_advance:
                      description: Whether to automatically issue the invoice after the draft_period has passed.
                      type: boolean
                      default: true
                    draft_period:
                      description: The period for the invoice to be kept in draft status for manual reviews.
                      type: string
                      format: ISO8601
                      example: P1D
                      default: P0D
                    due_after:
                      description: The period after which the invoice is considered overdue if not paid.
                      type: string
                      format: ISO8601
                      example: P30D
                      readOnly: true
                  title: Invoicing settings
                payment:
                  description: Payment settings for this invoice.
                  type: object
                  discriminator:
                    propertyName: collection_method
                    mapping:
                      charge_automatically: '#/components/schemas/BillingWorkflowPaymentChargeAutomaticallySettings'
                      send_invoice: '#/components/schemas/BillingWorkflowPaymentSendInvoiceSettings'
                  oneOf:
                    - $ref: '#/components/schemas/BillingWorkflowPaymentChargeAutomaticallySettings'
                    - $ref: '#/components/schemas/BillingWorkflowPaymentSendInvoiceSettings'
                  title: Payment settings
              title: Workflow config
          required:
            - source_billing_profile
            - workflow
          title: Workflow
      additionalProperties: false
      required:
        - id
        - created_at
        - updated_at
        - number
        - currency
        - supplier
        - totals
        - service_period
        - type
        - status
        - status_details
        - workflow
      title: Charge realization invoice
    BillingChargeUsageBased:
      description: A usage-based charge for a customer.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        type:
          description: The type of the charge.
          type: string
          enum:
            - usage_based
          title: Type
        customer:
          description: |-
            The customer owning the charge.

            By default, only the `id` of the customer is returned. For more details use the
            `customer` expand.
          oneOf:
            - $ref: '#/components/schemas/BillingCustomer'
            - $ref: '#/components/schemas/CustomerReference'
          readOnly: true
          title: Customer
        lifecycle_controller:
          description: |-
            Indicates whether the charge lifecycle is controlled by the system or manually
            overridden by the API user.
          type: string
          enum:
            - system
            - manual
          readOnly: true
          title: Lifecycle controller
        subscription:
          description: |-
            The subscription that originated the charge, when the charge was created from a
            subscription item.

            By default, only the `id`, `phase.id`, `phase.item.id` of the subscription is
            returned. For more details use the `subscription` expand.
          oneOf:
            - $ref: '#/components/schemas/BillingSubscription'
            - $ref: '#/components/schemas/BillingSubscriptionReference'
          readOnly: true
          title: Subscription
        currency:
          description: The currency of the charge.
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
          title: Currency
        resolved_cost_basis:
          description: |-
            The resolved fiat conversion rate of a custom-currency charge. Resolution
            depends on costbasis type: dynamic is resolved when charge becomes active, all
            other types resolved on creation.
          type: object
          additionalProperties: false
          properties:
            fiat_currency:
              description: The fiat currency the charge amount is converted into for invoicing.
              type: string
              example: USD
              maxLength: 3
              minLength: 3
              pattern: '^[A-Z]{3}$'
              readOnly: true
            rate:
              description: Fiat amount per one unit of the custom currency.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
            cost_basis_id:
              description: |-
                ID of the custom currency's cost basis resource the rate was taken from. Absent
                for manual cost bases.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: ULID
            resolved_at:
              description: When the rate was resolved.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
          readOnly: true
          required:
            - fiat_currency
            - rate
            - resolved_at
          title: Resolved cost basis
        status:
          description: The lifecycle status of the charge.
          type: string
          enum:
            - created
            - active
            - final
            - deleted
          readOnly: true
          title: Status
        validation_issues:
          description: |-
            Validation issues found while processing the charge.

            Present only when there are one or more validation findings. An empty list is
            omitted.
          type: array
          items:
            $ref: '#/components/schemas/BillingValidationIssue'
          readOnly: true
          title: Validation issues
        invoice_at:
          description: The timestamp when the charge is intended to be invoiced.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: Invoice at
        service_period:
          description: The effective service period covered by the charge.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          required:
            - from
            - to
          title: Service period
        full_service_period:
          description: 'The full, unprorated service period of the charge.'
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Full service period
        billing_period:
          description: The billing period the charge belongs to.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Billing period
        advance_after:
          description: |-
            The earliest time when the charge should be advanced again by background
            processing.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Advance after
        unique_reference_id:
          description: Unique reference ID of the charge.
          type: string
          title: Unique reference ID
        settlement_mode:
          description: Settlement mode of the charge.
          type: string
          enum:
            - credit_then_invoice
            - credit_only
          title: Settlement mode
        tax_config:
          description: Tax configuration of the charge.
          type: object
          additionalProperties: false
          properties:
            behavior:
              description: |-
                Tax behavior.

                If not specified the billing profile is used to determine the tax behavior. If
                not specified in the billing profile, the provider's default behavior is used.
              type: string
              enum:
                - inclusive
                - exclusive
              title: Tax behavior
            stripe:
              description: Stripe tax config.
              type: object
              additionalProperties: false
              deprecated: true
              properties:
                code:
                  description: 'Product [tax code](https://docs.stripe.com/tax/tax-codes).'
                  type: string
                  example: txcd_10000000
                  pattern: '^txcd_\d{8}$'
                  title: Tax code
              required:
                - code
              title: Stripe tax config
            external_invoicing:
              description: External invoicing tax config.
              type: object
              additionalProperties: false
              deprecated: true
              properties:
                code:
                  description: The tax code should be interpreted by the external invoicing provider.
                  type: string
                  maxLength: 64
                  title: Tax code
              required:
                - code
              title: External invoicing tax config
            tax_code_id:
              description: Tax code ID.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              deprecated: true
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              title: Tax code ID
            tax_code:
              description: |-
                Tax code reference.

                When both `tax_code` and `tax_code_id` are provided, `tax_code` takes
                precedence. When `stripe.code` is also provided, `tax_code` still wins and
                `stripe.code` is ignored.
              type: object
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/ULID'
              required:
                - id
              title: Tax code
          title: Tax configuration
        realizations:
          description: 'The realization runs of the charge, sorted by `created_at`.'
          type: array
          items:
            $ref: '#/components/schemas/BillingChargeRealization'
          readOnly: true
          title: Realizations
        discounts:
          description: Discounts applied to the usage-based charge.
          type: object
          additionalProperties: false
          properties:
            percentage:
              description: Percentage discount applied to the price (0–100).
              type: number
              maximum: 100
              minimum: 0
            usage:
              description: |-
                Number of usage units granted free before billing starts. Only applies to
                usage-based lines (not flat fees). Usage is treated as zero until this amount is
                exhausted.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Discounts
        feature:
          description: The feature associated with the charge.
          oneOf:
            - $ref: '#/components/schemas/Feature'
            - $ref: '#/components/schemas/FeatureReference'
          readOnly: true
          title: Feature
        totals:
          description: Aggregated booked and realtime totals for the charge.
          type: object
          additionalProperties: false
          properties:
            booked:
              description: The amount of the charge already booked to the internal accounting system.
              type: object
              additionalProperties: false
              properties:
                amount:
                  description: 'The total value of the resource before taxes, discounts and commitments.'
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Amount
                taxes_total:
                  description: The total tax amount applied to the resource.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Taxes total
                taxes_inclusive_total:
                  description: The total tax amount already included in the resource amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Inclusive taxes total
                taxes_exclusive_total:
                  description: The total tax amount added on top of the resource amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Exclusive taxes total
                charges_total:
                  description: The total amount contributed by additional charges.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Charges total
                discounts_total:
                  description: The total amount deducted through discounts.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Discounts total
                credits_total:
                  description: The total amount deducted through credits before taxes are applied.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Credits total
                total:
                  description: 'The final total value of the resource after taxes, discounts and commitments.'
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Total
              readOnly: true
              required:
                - amount
                - taxes_total
                - taxes_inclusive_total
                - taxes_exclusive_total
                - charges_total
                - discounts_total
                - credits_total
                - total
              title: Booked
            realtime:
              description: |-
                The realtime amount of the charge, i.e. the whole usage rated at the charge's
                price for its full service period, ignoring what has already been booked to a
                realization. This differs from the `usage` of a realization with type
                `outstanding`, which only covers the quantity not yet booked.

                Requires the `real_time_usage` expand.
              type: object
              additionalProperties: false
              properties:
                amount:
                  description: 'The total value of the resource before taxes, discounts and commitments.'
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Amount
                taxes_total:
                  description: The total tax amount applied to the resource.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Taxes total
                taxes_inclusive_total:
                  description: The total tax amount already included in the resource amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Inclusive taxes total
                taxes_exclusive_total:
                  description: The total tax amount added on top of the resource amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Exclusive taxes total
                charges_total:
                  description: The total amount contributed by additional charges.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Charges total
                discounts_total:
                  description: The total amount deducted through discounts.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Discounts total
                credits_total:
                  description: The total amount deducted through credits before taxes are applied.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Credits total
                total:
                  description: 'The final total value of the resource after taxes, discounts and commitments.'
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                  title: Total
              readOnly: true
              required:
                - amount
                - taxes_total
                - taxes_inclusive_total
                - taxes_exclusive_total
                - charges_total
                - discounts_total
                - credits_total
                - total
              title: Realtime totals
          readOnly: true
          required:
            - booked
          title: Totals for the charge
        usage:
          description: |-
            The metered usage quantity of the charge for its full service period.

            Requires the `real_time_usage` expand, since it is computed live from the
            metering store rather than stored on the charge.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Usage
        price:
          description: |-
            The price of the charge.

            `free` prices are rejected on create: a usage-based charge always carries a
            concrete price.
          type: object
          discriminator:
            propertyName: type
            mapping:
              unit: '#/components/schemas/BillingPriceUnit'
              graduated: '#/components/schemas/BillingPriceGraduated'
              volume: '#/components/schemas/BillingPriceVolume'
          oneOf:
            - $ref: '#/components/schemas/BillingPriceUnit'
            - $ref: '#/components/schemas/BillingPriceGraduated'
            - $ref: '#/components/schemas/BillingPriceVolume'
          title: Price
        commitments:
          description: Spend commitments for the charge.
          type: object
          additionalProperties: false
          properties:
            minimum_amount:
              description: The customer is committed to spend at least the amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Minimum amount
            maximum_amount:
              description: The customer is limited to spend at most the amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Maximum amount
          title: Commitments
        unit_config:
          description: |-
            Unit conversion configuration for the charge.

            Synthesized on read for charges created from v1 dynamic or package prices:
            dynamic prices map to a unit price with a multiply unit config, and package
            prices map to a unit price with a divide unit config.

            Accepted on create only when the UnitConfig feature is enabled on the
            deployment; otherwise rejected.
          type: object
          additionalProperties: false
          properties:
            operation:
              description: The arithmetic operation to apply to the raw metered quantity.
              type: string
              enum:
                - divide
                - multiply
              title: Conversion operation
            conversion_factor:
              description: |-
                The factor used in the conversion operation.

                - For `divide`: `converted = raw / conversionFactor`.
                - For `multiply`: `converted = raw × conversionFactor`.

                Must be a positive non-zero value.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Conversion factor
            rounding:
              description: |-
                The rounding mode applied to the converted quantity for invoicing.

                Defaults to none (no rounding). Entitlement checks always use the precise
                (unrounded) value.
              type: string
              default: none
              enum:
                - ceiling
                - floor
                - half_up
                - none
              title: Rounding mode
            precision:
              description: |-
                The number of decimal places to retain after rounding.

                Only meaningful when rounding is not "none". Defaults to 0 (round to whole
                numbers).
              type: integer
              default: 0
              title: Rounding precision (decimal places)
            display_unit:
              description: |-
                A human-readable label for the converted unit shown on invoices and in the
                customer portal (e.g., "GB", "hours", "M tokens").

                Optional. When omitted, no unit label is rendered.
              type: string
              title: Display unit label
          required:
            - operation
            - conversion_factor
          title: Unit config
        system_intent:
          description: |-
            Current intent from the system lifecycle controller for a charge that has an
            active manual override. The top-level charge fields remain the effective
            customer-facing intent.
          type: object
          additionalProperties: false
          properties:
            name:
              description: |-
                Display name of the resource.

                Between 1 and 256 characters.
              type: string
              maxLength: 256
              minLength: 1
            description:
              description: |-
                Optional description of the resource.

                Maximum 1024 characters.
              type: string
              maxLength: 1024
            labels:
              $ref: '#/components/schemas/Labels'
            invoice_at:
              description: The timestamp when the charge is intended to be invoiced.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Invoice at
            service_period:
              description: The effective service period covered by the charge.
              type: object
              additionalProperties: false
              properties:
                from:
                  description: |-
                    The start of the period.

                    The period is inclusive at the start.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: Start
                to:
                  description: |-
                    The end of the period.

                    The period is exclusive at the end.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: End
              required:
                - from
                - to
              title: Service period
            full_service_period:
              description: 'The full, unprorated service period of the charge.'
              type: object
              additionalProperties: false
              properties:
                from:
                  description: |-
                    The start of the period.

                    The period is inclusive at the start.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: Start
                to:
                  description: |-
                    The end of the period.

                    The period is exclusive at the end.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: End
              readOnly: true
              required:
                - from
                - to
              title: Full service period
            billing_period:
              description: The billing period the charge belongs to.
              type: object
              additionalProperties: false
              properties:
                from:
                  description: |-
                    The start of the period.

                    The period is inclusive at the start.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: Start
                to:
                  description: |-
                    The end of the period.

                    The period is exclusive at the end.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: End
              readOnly: true
              required:
                - from
                - to
              title: Billing period
            discounts:
              description: Discounts applied to the usage-based charge.
              type: object
              additionalProperties: false
              properties:
                percentage:
                  description: Percentage discount applied to the price (0–100).
                  type: number
                  maximum: 100
                  minimum: 0
                usage:
                  description: |-
                    Number of usage units granted free before billing starts. Only applies to
                    usage-based lines (not flat fees). Usage is treated as zero until this amount is
                    exhausted.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Discounts
            price:
              description: |-
                The price of the charge.

                `free` prices are rejected on create: a usage-based charge always carries a
                concrete price.
              type: object
              discriminator:
                propertyName: type
                mapping:
                  unit: '#/components/schemas/BillingPriceUnit'
                  graduated: '#/components/schemas/BillingPriceGraduated'
                  volume: '#/components/schemas/BillingPriceVolume'
              oneOf:
                - $ref: '#/components/schemas/BillingPriceUnit'
                - $ref: '#/components/schemas/BillingPriceGraduated'
                - $ref: '#/components/schemas/BillingPriceVolume'
              title: Price
            commitments:
              description: Spend commitments for the charge.
              type: object
              additionalProperties: false
              properties:
                minimum_amount:
                  description: The customer is committed to spend at least the amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Minimum amount
                maximum_amount:
                  description: The customer is limited to spend at most the amount.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Maximum amount
              title: Commitments
            unit_config:
              description: |-
                Unit conversion configuration for the charge.

                Synthesized on read for charges created from v1 dynamic or package prices:
                dynamic prices map to a unit price with a multiply unit config, and package
                prices map to a unit price with a divide unit config.

                Accepted on create only when the UnitConfig feature is enabled on the
                deployment; otherwise rejected.
              type: object
              additionalProperties: false
              properties:
                operation:
                  description: The arithmetic operation to apply to the raw metered quantity.
                  type: string
                  enum:
                    - divide
                    - multiply
                  title: Conversion operation
                conversion_factor:
                  description: |-
                    The factor used in the conversion operation.

                    - For `divide`: `converted = raw / conversionFactor`.
                    - For `multiply`: `converted = raw × conversionFactor`.

                    Must be a positive non-zero value.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  title: Conversion factor
                rounding:
                  description: |-
                    The rounding mode applied to the converted quantity for invoicing.

                    Defaults to none (no rounding). Entitlement checks always use the precise
                    (unrounded) value.
                  type: string
                  default: none
                  enum:
                    - ceiling
                    - floor
                    - half_up
                    - none
                  title: Rounding mode
                precision:
                  description: |-
                    The number of decimal places to retain after rounding.

                    Only meaningful when rounding is not "none". Defaults to 0 (round to whole
                    numbers).
                  type: integer
                  default: 0
                  title: Rounding precision (decimal places)
                display_unit:
                  description: |-
                    A human-readable label for the converted unit shown on invoices and in the
                    customer portal (e.g., "GB", "hours", "M tokens").

                    Optional. When omitted, no unit label is rendered.
                  type: string
                  title: Display unit label
              required:
                - operation
                - conversion_factor
              title: Unit config
            deleted_at:
              description: |-
                The timestamp when the system lifecycle controller intent was deleted. The
                effective charge can remain visible while a manual override is active.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Deleted at
          readOnly: true
          required:
            - name
            - invoice_at
            - service_period
            - full_service_period
            - billing_period
            - price
          title: System intent
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - updated_at
        - type
        - customer
        - lifecycle_controller
        - currency
        - status
        - invoice_at
        - service_period
        - full_service_period
        - billing_period
        - settlement_mode
        - realizations
        - feature
        - totals
        - price
      title: Usage-based charge
    BillingChargesExpand:
      description: |-
        Expands for customer charges.

        Values:

        - `real_time_usage`: The charge's real-time usage; it sets the `usage` and the
        `totals.realtime` fields, and fills the `outstanding` realization's `usage`
        with the not-yet-booked remainder of the live read.
        - `customer`: The complete customer entity of the charge.
        - `feature`: The complete feature entity of the charge.
        - `subscription`: The complete subscription of the charge, when present.
        - `realization.invoice`: The invoice header of each realization (the invoice
        entity without its `lines` and `customer` snapshot), in place of the ID
        reference.
        - `realization.totals`: The `totals` of each realization run, including credit
        allocations.
        - `realization.detailed_lines`: The `detailed_lines` of each realization run.
      type: string
      enum:
        - real_time_usage
        - customer
        - feature
        - subscription
        - realization.invoice
        - realization.totals
        - realization.detailed_lines
      title: Customer charge expands
    BillingCostBasis:
      description: Describes currency basis supported by billing system.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        fiat_code:
          description: The fiat currency code for the cost basis.
          type: string
          example: USD
          maxLength: 3
          minLength: 3
          pattern: '^[A-Z]{3}$'
        rate:
          description: The cost rate for the currency.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
        effective_from:
          description: |-
            An ISO-8601 timestamp representation of the date from which the cost basis is
            effective. If not provided, it will be effective immediately and will be set to
            `now` by the system.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: RFC3339 Date-Time
        effective_to:
          description: |-
            An ISO-8601 timestamp representation of the date until which the cost basis is
            effective. If provided, it must be later than `effective_from`. If not provided,
            it remains effective until superseded.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: RFC3339 Date-Time
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
      additionalProperties: false
      required:
        - id
        - fiat_code
        - rate
        - created_at
    BillingCreditAdjustment:
      description: |-
        A credit adjustment can be used to make manual adjustments to a customer's
        credit balance.

        Supported use-cases:

        - Usage correction
      type: object
      properties:
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
      additionalProperties: false
      required:
        - name
      title: Credit adjustment
    BillingCreditBalances:
      description: The balances of the credits of a customer.
      type: object
      properties:
        retrieved_at:
          description: The timestamp of the balance retrieval.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        balances:
          description: The balances by currencies.
          type: array
          items:
            $ref: '#/components/schemas/CreditBalance'
          readOnly: true
      additionalProperties: false
      required:
        - retrieved_at
        - balances
      title: Credit balances
    BillingCreditGrant:
      description: |-
        A credit grant allocates credits to a customer.

        Credits are drawn down against charges according to the settlement mode
        configured on the rate card.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        funding_method:
          description: Funding method of the grant.
          type: string
          enum:
            - none
            - invoice
            - external
          title: Credit funding method
        currency:
          description: |-
            The fiat or custom currency of the granted credits.

            Funded custom-currency grants must define `purchase.cost_basis` to settle in a
            fiat currency.
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
        amount:
          description: Granted credit amount.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
        purchase:
          description: Present when a funding workflow applies (funding_method is not `none`).
          type: object
          additionalProperties: false
          properties:
            currency:
              description: |-
                Fiat currency the purchase is settled in.

                Must equal the grant `currency` for fiat grants and `cost_basis.fiat_currency`
                for custom-currency grants.
              type: string
              example: USD
              maxLength: 3
              minLength: 3
              pattern: '^[A-Z]{3}$'
            per_unit_cost_basis:
              description: |-
                Fiat cost basis per credit unit of a fiat-currency grant.

                If `per_unit_cost_basis` is 0.50 and credit amount is
                $100.00, the total
                charge is $50.00. The value must be greater than 0. If the
                cost basis is 0, use `funding_method=none` instead.

                Only applies to fiat grants and cannot be combined with `cost_basis`. Defaults
                to 1.0 when neither is provided.
              type: string
              deprecated: true
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
            resolved_cost_basis:
              description: |-
                The rate the purchase is settled at in the purchase `currency`. Present once the
                cost basis is resolved.
              type: object
              additionalProperties: false
              properties:
                fiat_currency:
                  description: The fiat currency the charge amount is converted into for invoicing.
                  type: string
                  example: USD
                  maxLength: 3
                  minLength: 3
                  pattern: '^[A-Z]{3}$'
                  readOnly: true
                rate:
                  description: Fiat amount per one unit of the custom currency.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                  readOnly: true
                cost_basis_id:
                  description: |-
                    ID of the custom currency's cost basis resource the rate was taken from. Absent
                    for manual cost bases.
                  type: string
                  example: 01G65Z755AFWAKHE12NY0CQ9FH
                  pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
                  readOnly: true
                  title: ULID
                resolved_at:
                  description: When the rate was resolved.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  readOnly: true
                  title: RFC3339 Date-Time
              readOnly: true
              required:
                - fiat_currency
                - rate
                - resolved_at
              title: Resolved cost basis
            amount:
              description: |-
                The purchase amount, calculated from the resolved cost basis and credit
                `amount`. Present once the cost basis is resolved.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
            availability_policy:
              description: |-
                Controls when credits become available for consumption.

                Defaults to `on_creation`.
              type: string
              default: on_creation
              enum:
                - on_creation
              title: Credit availability policy
            settlement_status:
              description: Current payment settlement status.
              type: string
              enum:
                - pending
                - authorized
                - settled
              readOnly: true
              title: Credit purchase payment settlement status
          required:
            - currency
        tax_config:
          description: |-
            Tax configuration for the grant.

            For `invoice` and `external` funding methods, tax configuration should be
            provided to ensure correct revenue recognition. When not provided, the default
            credit grant tax code is applied, if that's not set the global default taxcode
            is used.
          type: object
          additionalProperties: false
          properties:
            behavior:
              description: |-
                Tax behavior.

                This enum is used to specify whether tax is included in the price or excluded
                from the price. If not specified, the billing profile is used to determine the
                tax behavior. If not specified in the billing profile, the provider's default
                behavior is used.
              type: string
              enum:
                - inclusive
                - exclusive
              title: Tax behavior
            code:
              description: Tax code applied to the invoice line item.
              type: object
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/ULID'
              required:
                - id
              title: Tax code
          title: Tax code configuration
        invoice:
          description: Available when `funding_method` is `invoice`.
          type: object
          additionalProperties: false
          properties:
            id:
              description: Identifier of the invoice associated with the grant.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: ULID
            line:
              description: Identifier of the invoice line associated with the grant.
              type: object
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/ULID'
              readOnly: true
              required:
                - id
          readOnly: true
        filters:
          $ref: '#/components/schemas/BillingCreditGrantFilters'
        priority:
          description: Draw-down priority of the grant. Lower values have higher priority.
          type: integer
          format: int16
          default: 10
          maximum: 1000
          minimum: 1
        effective_at:
          description: |-
            The timestamp when the credit grant becomes effective.

            Defaults to the current date and time.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: RFC3339 Date-Time
        key:
          description: |-
            Idempotency key for the credit grant creation request.

            Unique per customer: reusing the same key for the same customer returns an HTTP
            409 Conflict instead of creating a duplicate grant, which makes create requests
            safe to retry. The same key may be reused across different customers.
          type: string
          example: 019ae40f-4258-7f15-9491-842f42a7d6ac
          maxLength: 256
          minLength: 1
          title: External Resource Key
        expires_at:
          description: |-
            The timestamp when the credit grant expires.

            Calculated from the grant effective time and `expires_after` if provided.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        voided_at:
          description: Timestamp when the grant was voided.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        status:
          description: Current lifecycle status of the grant.
          type: string
          enum:
            - pending
            - active
            - expired
            - voided
          readOnly: true
          title: Credit grant lifecycle status
        validation_issues:
          description: |-
            Validation issues found while processing the credit grant.

            Present only when there are one or more validation findings. An empty list is
            omitted.
          type: array
          items:
            $ref: '#/components/schemas/BillingValidationIssue'
          readOnly: true
          title: Validation issues
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - updated_at
        - funding_method
        - currency
        - amount
        - status
      title: Credit grant
    BillingCreditGrantFilters:
      description: Filters for the credit grant.
      type: object
      properties:
        features:
          description: |-
            Limit the credit grant to specific features. If no features are specified, the
            credit grant can be used for any feature.
          type: array
          items:
            $ref: '#/components/schemas/ResourceKey'
          example:
            - input_tokens
            - output_tokens
        plans:
          description: |-
            Limit credits to charges from these plans. Entries are alternatives; when
            features are also specified, both dimensions must match. Omission or an empty
            list leaves plans unrestricted.
          type: array
          items:
            $ref: '#/components/schemas/BillingCreditGrantPlanFilter'
      additionalProperties: false
    BillingCreditGrantPlanFilter:
      description: A plan key and an optional version constraint for matching credit grants.
      type: object
      properties:
        key:
          description: The plan key in the customer's namespace.
          type: string
          example: resource_key
          maxLength: 64
          minLength: 1
          pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
          title: Resource Key
        version:
          description: 'Omission matches all versions, including future versions.'
          type: object
          additionalProperties: false
          properties:
            eq:
              description: Match this exact version.
              type: integer
              format: int32
              minimum: 1
            oeq:
              description: Match one of these versions.
              type: array
              items:
                type: integer
                format: int32
              maxItems: 100
              minItems: 1
            gte:
              description: Match this version and later versions.
              type: integer
              format: int32
              minimum: 1
            lte:
              description: Match this version and earlier versions.
              type: integer
              format: int32
              minimum: 1
      additionalProperties: false
      required:
        - key
    BillingCreditTransaction:
      description: |-
        A credit transaction represents a single credit movement on the customer's
        balance.

        Credit transactions are immutable.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        booked_at:
          description: The date and time the transaction was booked.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        type:
          description: The type of credit transaction.
          type: string
          enum:
            - funded
            - consumed
            - expired
            - voided
          readOnly: true
        currency:
          description: Currency of the balance affected by the transaction.
          oneOf:
            - $ref: '#/components/schemas/CurrencyCode'
            - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
          readOnly: true
        custom_currency:
          description: Managed currency reference. Present only for custom currencies.
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/ULID'
          readOnly: true
          required:
            - id
        amount:
          description: |-
            Signed amount of the credit movement. Positive values add balance, negative
            values reduce balance.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
        available_balance:
          description: The available balance before and after the transaction.
          type: object
          additionalProperties: false
          properties:
            before:
              $ref: '#/components/schemas/Numeric'
            after:
              $ref: '#/components/schemas/Numeric'
          readOnly: true
          required:
            - before
            - after
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - booked_at
        - type
        - currency
        - amount
        - available_balance
      title: Credit transaction
    BillingCurrency:
      description: Fiat or custom currency.
      type: object
      discriminator:
        propertyName: type
        mapping:
          fiat: '#/components/schemas/BillingCurrencyFiat'
          custom: '#/components/schemas/BillingCurrencyCustom'
      oneOf:
        - $ref: '#/components/schemas/BillingCurrencyFiat'
        - $ref: '#/components/schemas/BillingCurrencyCustom'
    BillingCurrencyCodeCustom:
      description: |-
        Custom currency code. It should be a unique code but not conflicting with any
        existing fiat currency codes.
      type: string
      maxLength: 24
      minLength: 4
    BillingCurrencyCustom:
      description: Describes custom currency.
      type: object
      properties:
        type:
          description: The type of the currency.
          type: string
          enum:
            - custom
          readOnly: true
        name:
          description: |-
            The name of the currency. It should be a human-readable string that represents
            the name of the currency, such as "US Dollar" or "Euro".
          type: string
          maxLength: 256
          minLength: 1
        symbol:
          description: |-
            The symbol of the currency. It should be a string that represents the symbol of
            the currency, such as "$" for US Dollar or "€" for Euro.
          type: string
          minLength: 1
        precision:
          description: |-
            The precision of the currency. It should be a number that represents the number
            of decimal places used for the currency, such as 2 for US Dollar or Euro.
          type: integer
          format: uint32
        decimal_mark:
          description: |-
            The decimal mark for the currency. It should be a string that represents the
            decimal mark of the currency, such as "." for US Dollar or "," for Euro.
          type: string
          maxLength: 1
          minLength: 1
        thousand_separator:
          description: |-
            The thousand separator for the currency. It should be a string that represents
            the thousand separator of the currency, such as "," for US Dollar or "." for
            Euro.
          type: string
          maxLength: 1
          minLength: 1
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        code:
          $ref: '#/components/schemas/BillingCurrencyCodeCustom'
        created_at:
          description: An ISO-8601 timestamp representation of the custom currency creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        cost_basis:
          description: |-
            The list of active and scheduled cost bases for the custom currency. Expired and
            deleted cost bases are excluded.
          type: array
          items:
            $ref: '#/components/schemas/BillingCostBasis'
          readOnly: true
      additionalProperties: false
      required:
        - type
        - name
        - precision
        - decimal_mark
        - thousand_separator
        - id
        - code
        - created_at
    BillingCurrencyExpand:
      description: |-
        Expands for currencies.

        Values:

        - `cost_basis`: The currency's active and scheduled cost basis.
      type: string
      enum:
        - cost_basis
      title: Currency expands
    BillingCurrencyFiat:
      description: Currency describes a currency supported by the billing system.
      type: object
      properties:
        type:
          description: The type of the currency.
          type: string
          enum:
            - fiat
          readOnly: true
        name:
          description: |-
            The name of the currency. It should be a human-readable string that represents
            the name of the currency, such as "US Dollar" or "Euro".
          type: string
          maxLength: 256
          minLength: 1
        symbol:
          description: |-
            The symbol of the currency. It should be a string that represents the symbol of
            the currency, such as "$" for US Dollar or "€" for Euro.
          type: string
          minLength: 1
        precision:
          description: |-
            The precision of the currency. It should be a number that represents the number
            of decimal places used for the currency, such as 2 for US Dollar or Euro.
          type: integer
          format: uint32
        decimal_mark:
          description: |-
            The decimal mark for the currency. It should be a string that represents the
            decimal mark of the currency, such as "." for US Dollar or "," for Euro.
          type: string
          maxLength: 1
          minLength: 1
        thousand_separator:
          description: |-
            The thousand separator for the currency. It should be a string that represents
            the thousand separator of the currency, such as "," for US Dollar or "." for
            Euro.
          type: string
          maxLength: 1
          minLength: 1
        code:
          description: |-
            Three-letter [ISO4217](https://www.iso.org/iso-4217-currency-codes.html)
            currency code. Custom three-letter currency codes are also supported for
            convenience.
          type: string
          example: USD
          maxLength: 3
          minLength: 3
          pattern: '^[A-Z]{3}$'
          readOnly: true
      additionalProperties: false
      required:
        - type
        - name
        - precision
        - decimal_mark
        - thousand_separator
        - code
    BillingCurrencyType:
      description: |-
        Currency type for custom currencies. It should be a unique code but not
        conflicting with any existing standard currency codes.
      type: string
      enum:
        - fiat
        - custom
    BillingCustomer:
      description: |-
        Customers can be individuals or organizations that can subscribe to plans and
        have access to features.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        name:
          description: |-
            Display name of the resource.

            Between 1 and 256 characters.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: |-
            Optional description of the resource.

            Maximum 1024 characters.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        key:
          $ref: '#/components/schemas/ExternalResourceKey'
        usage_attribution:
          description: Mapping to attribute metered usage to the customer by the event subject.
          type: object
          additionalProperties: false
          properties:
            subject_keys:
              description: |-
                The subjects that are attributed to the customer. Can be empty when no usage
                event subjects are associated with the customer.
              type: array
              items:
                $ref: '#/components/schemas/UsageAttributionSubjectKey'
              minItems: 0
              title: Subject Keys
          required:
            - subject_keys
          title: Usage Attribution
        primary_email:
          description: The primary email address of the customer.
          type: string
          title: Primary Email
        currency:
          description: 'Currency of the customer. Used for billing, tax and invoicing.'
          type: string
          example: USD
          maxLength: 3
          minLength: 3
          pattern: '^[A-Z]{3}$'
          title: Currency
        billing_address:
          description: The billing address of the customer. Used for tax and invoicing.
          type: object
          additionalProperties: false
          properties:
            country:
              description: |-
                Country code in [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html)
                alpha-2 format.
              type: string
              example: US
              maxLength: 2
              minLength: 2
              pattern: '^[A-Z]{2}$'
              title: Country
            postal_code:
              description: Postal code.
              type: string
              title: Postal Code
            state:
              description: State or province.
              type: string
              title: State
            city:
              description: City.
              type: string
              title: City
            line1:
              description: First line of the address.
              type: string
              title: Line 1
            line2:
              description: Second line of the address.
              type: string
              title: Line 2
            phone_number:
              description: Phone number.
              type: string
              title: Phone Number
          title: Billing Address
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - updated_at
        - key
    BillingCustomerData:
      description: Billing customer data.
      type: object
      properties:
        billing_profile:
          description: |-
            The billing profile for the customer.

            If not provided, the default billing profile will be used.
          type: object
          additionalProperties: false
          properties:
            id:
              description: The ID of the billing profile.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              title: ULID
          required:
            - id
          title: Billing profile
        app_data:
          description: App customer data.
          type: object
          additionalProperties: false
          properties:
            stripe:
              description: |-
                Used if the customer has a linked Stripe app.

                Set to `null` to remove the Stripe data of the customer; omit to leave it
                unchanged.
              type: object
              additionalProperties: false
              nullable: true
              properties:
                customer_id:
                  description: The Stripe customer ID used.
                  type: string
                  example: cus_1234567890
                  title: Stripe customer ID
                default_payment_method_id:
                  description: The Stripe default payment method ID.
                  type: string
                  example: pm_1234567890
                  title: Stripe default payment method ID
                labels:
                  description: Labels for this Stripe integration on the customer.
                  type: object
                  example:
                    env: test
                  additionalProperties:
                    type: string
                    pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
                    minLength: 1
                    maxLength: 63
                  maxProperties: 50
                  title: Labels
              title: Stripe
            external_invoicing:
              description: |-
                Used if the customer has a linked external invoicing app.

                Set to `null` to remove the external invoicing data of the customer; omit to
                leave it unchanged.
              type: object
              additionalProperties: false
              nullable: true
              properties:
                labels:
                  description: Labels for this external invoicing integration on the customer.
                  type: object
                  example:
                    env: test
                  additionalProperties:
                    type: string
                    pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
                    minLength: 1
                    maxLength: 63
                  maxProperties: 50
                  title: Labels
              title: External invoicing
          title: App customer data
      additionalProperties: false
    BillingCustomerStripeCreateCheckoutSessionRequest:
      description: |-
        Request to create a Stripe Checkout Session for the customer.

        Checkout Sessions are used to collect payment method information from customers
        in a secure, Stripe-hosted interface. This integration uses setup mode to
        collect payment methods that can be charged later for subscription billing.
      type: object
      properties:
        stripe_options:
          description: |-
            Options for configuring the Stripe Checkout Session.

            These options are passed directly to Stripe's
            [checkout session creation API](https://docs.stripe.com/api/checkout/sessions/create).
          type: object
          additionalProperties: false
          properties:
            billing_address_collection:
              description: |-
                Whether to collect the customer's billing address.

                Defaults to auto, which only collects the address when necessary for tax
                calculation.
              type: string
              default: auto
              enum:
                - auto
                - required
            cancel_url:
              description: |-
                URL to redirect customers who cancel the checkout session.

                Not allowed when ui_mode is "embedded".
              type: string
            client_reference_id:
              description: |-
                Unique reference string for reconciling sessions with internal systems.

                Can be a customer ID, cart ID, or any other identifier.
              type: string
            customer_update:
              description: Controls which customer fields can be updated by the checkout session.
              type: object
              additionalProperties: false
              properties:
                address:
                  description: |-
                    Whether to save the billing address to customer.address.

                    Defaults to "never".
                  type: string
                  default: never
                  enum:
                    - auto
                    - never
                name:
                  description: |-
                    Whether to save the customer name to customer.name.

                    Defaults to "never".
                  type: string
                  default: never
                  enum:
                    - auto
                    - never
                shipping:
                  description: |-
                    Whether to save shipping information to customer.shipping.

                    Defaults to "never".
                  type: string
                  default: never
                  enum:
                    - auto
                    - never
            consent_collection:
              description: Configuration for collecting customer consent during checkout.
              type: object
              additionalProperties: false
              properties:
                payment_method_reuse_agreement:
                  description: Controls the visibility of payment method reuse agreement.
                  type: object
                  additionalProperties: false
                  properties:
                    position:
                      description: Position and visibility of the payment method reuse agreement.
                      type: string
                      enum:
                        - auto
                        - hidden
                promotions:
                  description: |-
                    Enables collection of promotional communication consent.

                    Only available to US merchants. When set to "auto", Checkout determines whether
                    to show the option based on the customer's locale.
                  type: string
                  enum:
                    - auto
                    - none
                terms_of_service:
                  description: |-
                    Requires customers to accept terms of service before payment.

                    Requires a valid terms of service URL in your Stripe Dashboard settings.
                  type: string
                  enum:
                    - none
                    - required
            currency:
              description: |-
                Three-letter ISO 4217 currency code in uppercase.

                Required for payment mode sessions. Optional for setup mode sessions.
              type: string
              example: USD
              maxLength: 3
              minLength: 3
              pattern: '^[A-Z]{3}$'
            custom_text:
              description: Custom text to display during checkout at various stages.
              type: object
              additionalProperties: false
              properties:
                after_submit:
                  description: Text displayed after the payment confirmation button.
                  type: object
                  additionalProperties: false
                  properties:
                    message:
                      description: The custom message text (max 1200 characters).
                      type: string
                      maxLength: 1200
                shipping_address:
                  description: Text displayed alongside shipping address collection.
                  type: object
                  additionalProperties: false
                  properties:
                    message:
                      description: The custom message text (max 1200 characters).
                      type: string
                      maxLength: 1200
                submit:
                  description: Text displayed alongside the payment confirmation button.
                  type: object
                  additionalProperties: false
                  properties:
                    message:
                      description: The custom message text (max 1200 characters).
                      type: string
                      maxLength: 1200
                terms_of_service_acceptance:
                  description: Text replacing the default terms of service agreement text.
                  type: object
                  additionalProperties: false
                  properties:
                    message:
                      description: The custom message text (max 1200 characters).
                      type: string
                      maxLength: 1200
            expires_at:
              description: |-
                Unix timestamp when the checkout session expires.

                Can be 30 minutes to 24 hours from creation. Defaults to 24 hours.
              type: integer
              format: int64
            locale:
              description: |-
                IETF language tag for the checkout UI locale.

                If blank or "auto", uses the browser's locale. Example: "en", "fr", "de".
              type: string
            metadata:
              description: |-
                Set of key-value pairs to attach to the checkout session.

                Useful for storing additional structured information.
              type: object
              additionalProperties:
                type: string
            return_url:
              description: |-
                Return URL for embedded checkout sessions after payment authentication.

                Required if ui_mode is "embedded" and redirect-based payment methods are
                enabled.
              type: string
            success_url:
              description: |-
                Success URL to redirect customers after completing payment or setup.

                Not allowed when ui_mode is "embedded". See:
                https://docs.stripe.com/payments/checkout/custom-success-page
              type: string
            ui_mode:
              description: |-
                The UI mode for the checkout session.

                "hosted" displays a Stripe-hosted page. "embedded" integrates directly into your
                app. Defaults to "hosted".
              type: string
              default: hosted
              enum:
                - embedded
                - hosted
            payment_method_types:
              description: |-
                List of payment method types to enable (e.g., "card", "us_bank_account").

                If not specified, Stripe enables all relevant payment methods.
              type: array
              items:
                type: string
            redirect_on_completion:
              description: |-
                Redirect behavior for embedded checkout sessions.

                Controls when to redirect users after completion. See:
                https://docs.stripe.com/payments/checkout/custom-success-page?payment-ui=embedded-form
              type: string
              enum:
                - always
                - if_required
                - never
            tax_id_collection:
              description: Configuration for collecting tax IDs during checkout.
              type: object
              additionalProperties: false
              properties:
                enabled:
                  description: |-
                    Enable tax ID collection during checkout.

                    Defaults to false.
                  type: boolean
                  default: false
                required:
                  description: |-
                    Whether tax ID collection is required.

                    Defaults to "never".
                  type: string
                  default: never
                  enum:
                    - if_supported
                    - never
      additionalProperties: false
      required:
        - stripe_options
    BillingCustomerStripeCreateCustomerPortalSessionRequest:
      description: |-
        Request to create a Stripe Customer Portal Session for the customer.

        Useful to redirect the customer to the Stripe Customer Portal to manage their
        payment methods, change their billing address and access their invoice history.
        Only returns URL if the customer billing profile is linked to a stripe app and
        customer.
      type: object
      properties:
        stripe_options:
          description: Options for configuring the Stripe Customer Portal Session.
          type: object
          additionalProperties: false
          properties:
            configuration_id:
              description: |-
                The ID of an existing
                [Stripe configuration](https://docs.stripe.com/api/customer_portal/configurations)
                to use for this session, describing its functionality and features. If not
                specified, the session uses the default configuration.
              type: string
            locale:
              description: |-
                The IETF
                [language tag](https://docs.stripe.com/api/customer_portal/sessions/create#create_portal_session-locale)
                of the locale customer portal is displayed in. If blank or `auto`, the
                customer's preferred_locales or browser's locale is used.
              type: string
            return_url:
              description: |-
                The
                [URL to redirect](https://docs.stripe.com/api/customer_portal/sessions/create#create_portal_session-return_url)
                the customer to after they have completed their requested actions.
              type: string
      additionalProperties: false
      required:
        - stripe_options
    BillingEntitlement:
      description: An entitlement grants a customer access to a feature.
      type: object
      discriminator:
        propertyName: type
        mapping:
          metered: '#/components/schemas/BillingEntitlementMetered'
          static: '#/components/schemas/BillingEntitlementStatic'
          boolean: '#/components/schemas/BillingEntitlementBoolean'
      oneOf:
        - $ref: '#/components/schemas/BillingEntitlementMetered'
        - $ref: '#/components/schemas/BillingEntitlementStatic'
        - $ref: '#/components/schemas/BillingEntitlementBoolean'
    BillingEntitlementAccessCheckResult:
      description: Entitlement access check result.
      type: object
      properties:
        has_access:
          description: |-
            Whether the customer has access to the feature. Always true for `boolean` and
            `static` entitlements. Depends on balance for `metered` entitlements.
          type: boolean
          example: true
          readOnly: true
        config:
          description: |-
            Only available for static entitlements. Config is the JSON parsable
            configuration of the entitlement. Useful to describe per customer configuration.
          type: string
          example: '{ "availableModels": ["gpt-5", "gpt-4o"] }'
          readOnly: true
        type:
          description: |-
            The type of the entitlement.

            If not provided, the feature has no entitlement defined (has access is always
            false in this case)
          type: string
          enum:
            - metered
            - static
            - boolean
          readOnly: true
      additionalProperties: false
      required:
        - has_access
    BillingEntitlementAccessExpand:
      description: |-
        Expands for customer entitlement access.

        Values:

        - `value`: The balance details of a metered entitlement; it sets the `value`
        field.
      type: string
      enum:
        - value
      title: Customer entitlement access expands
    BillingEntitlementBoolean:
      description: A boolean entitlement grants access to a feature.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        type:
          description: The type of the entitlement.
          type: string
          enum:
            - boolean
          title: Type
        feature:
          description: The feature the customer is entitled to use.
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/ULID'
          required:
            - id
          title: Feature
        customer:
          description: The customer the entitlement belongs to.
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/ULID'
          readOnly: true
          required:
            - id
          title: Customer
        labels:
          description: |
            Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

            Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
          type: object
          example:
            env: test
          additionalProperties:
            type: string
            pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
            minLength: 1
            maxLength: 63
          maxProperties: 50
          title: Labels
        usage_period:
          description: The usage period of the entitlement.
          type: object
          additionalProperties: false
          properties:
            anchor:
              description: A date-time anchor to base the recurring period on.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Anchor time
            interval:
              description: The interval duration in ISO 8601 format.
              type: string
              format: ISO8601
              example: P1M
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Interval in ISO 8601 duration format
          readOnly: true
          required:
            - anchor
            - interval
          title: Usage period
        current_usage_period:
          description: The current usage period of the entitlement.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Current usage period
        active_from:
          description: The time from which the entitlement is active.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active from
        active_to:
          description: |-
            The time until which the entitlement is active. If not set, the entitlement is
            active until deleted.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active to
        created_at:
          description: The time the entitlement was created.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: The time the entitlement was last updated.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: The time the entitlement was deleted.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
      additionalProperties: false
      required:
        - id
        - type
        - feature
        - customer
        - active_from
        - created_at
        - updated_at
    BillingEntitlementBurndownSegment:
      description: A period in which grants were consumed in a fixed order.
      type: object
      properties:
        period:
          description: The period the segment covers.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
        usage:
          description: The usage recorded in the segment.
          type: string
          example: '100'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
        overage:
          description: The usage in the segment not covered by any grant.
          type: string
          example: '0'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
        balance:
          description: The entitlement balance at the start and at the end of the segment.
          type: object
          additionalProperties: false
          properties:
            start:
              description: The balance at the start of the segment.
              type: string
              example: '100'
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
            end:
              description: The balance at the end of the segment.
              type: string
              example: '50'
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
          readOnly: true
          required:
            - start
            - end
        grant_balances:
          description: |-
            The balance of each active grant at the start and at the end of the segment,
            keyed by grant ID.
          type: object
          additionalProperties: false
          properties:
            start:
              description: The balance of each active grant at the start of the segment.
              type: object
              example:
                01G65Z755AFWAKHE12NY0CQ9FH: '100'
              additionalProperties:
                $ref: '#/components/schemas/Numeric'
              readOnly: true
            end:
              description: The balance of each active grant at the end of the segment.
              type: object
              example:
                01G65Z755AFWAKHE12NY0CQ9FH: '50'
              additionalProperties:
                $ref: '#/components/schemas/Numeric'
              readOnly: true
          readOnly: true
          required:
            - start
            - end
        grant_usages:
          description: The grants consumed in the segment and the usage taken from each.
          type: array
          items:
            $ref: '#/components/schemas/BillingEntitlementGrantUsage'
          readOnly: true
      additionalProperties: false
      required:
        - period
        - usage
        - overage
        - balance
        - grant_balances
        - grant_usages
    BillingEntitlementFeatureValueResult:
      description: |-
        Entitlement value looked up by feature key. A missing entitlement has no type
        and does not grant access.
      type: object
      properties:
        feature_key:
          description: The feature key being evaluated.
          type: string
          example: available_models
          maxLength: 64
          minLength: 1
          pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
          readOnly: true
          title: Resource Key
        has_access:
          description: |-
            Whether the customer has access to the feature. Always true for `boolean` and
            `static` entitlements. Depends on balance for `metered` entitlements.
          type: boolean
          example: true
          readOnly: true
        config:
          description: |-
            Only available for static entitlements. Config is the JSON parsable
            configuration of the entitlement. Useful to describe per customer configuration.
          type: string
          example: '{ "availableModels": ["gpt-5", "gpt-4o"] }'
          readOnly: true
        value:
          description: |-
            Only available for metered entitlements. The balance details of the entitlement
            at the evaluation time. Requires the `value` expand.
          type: object
          example:
            balance: '100'
            usage: '50'
            overage: '0'
            total_available_grant_amount: '100'
            grant_balances:
              additional_property: '1'
          additionalProperties: false
          properties:
            balance:
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              description: |-
                The remaining balance of the entitlement in the usage period at the evaluation
                time.
              readOnly: true
            grant_balances:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/Numeric'
              description: 'The remaining balance of each grant, keyed by grant ID.'
              readOnly: true
            overage:
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              description: |-
                The usage exceeding the available balance in the usage period at the evaluation
                time.
              readOnly: true
            total_available_grant_amount:
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              description: |-
                The total amount granted and available to the entitlement at the evaluation
                time.
              readOnly: true
            usage:
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              description: The usage recorded in the usage period at the evaluation time.
              readOnly: true
          readOnly: true
          required:
            - balance
            - usage
            - overage
            - total_available_grant_amount
            - grant_balances
        type:
          description: |-
            The type of the entitlement.

            If not provided, the feature has no entitlement defined (has access is always
            false in this case)
          type: string
          enum:
            - metered
            - static
            - boolean
          readOnly: true
      additionalProperties: false
      required:
        - feature_key
        - has_access
    BillingEntitlementGrant:
      description: |-
        A grant issued for a metered entitlement. Each grant adds its amount to the
        entitlement's balance from its effective time until it expires, and usage is
        deducted from the grants in priority order.

        Grants are immutable, so the balance is deterministic regardless of when it is
        queried. Deleting a grant ends it at the time of the deletion.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        entitlement_id:
          description: The ID of the entitlement the grant belongs to.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: Entitlement ID
        customer_id:
          description: The ID of the customer the grant belongs to.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: Customer ID
        amount:
          description: 'The granted amount, in the feature''s unit.'
          type: string
          example: '100'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Amount
        priority:
          description: |-
            The priority of the grant. Lower values are consumed first: a grant with
            priority 1 is consumed before one with priority 2. Among equal priorities, the
            grant closest to expiration is consumed first, then the earliest created.
          type: integer
          format: uint8
          example: 1
          readOnly: true
          title: Priority
        effective_at:
          description: The time the grant takes effect.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Effective at
        expires_after:
          description: |-
            The duration after which the grant expires, counted from `effective_at`. Always
            a single-unit duration (for example `PT12H`, `P7D`, `P2W`, `P3M`, `P1Y`). Absent
            when the grant never expires.
          type: string
          format: ISO8601
          example: P1M
          pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
          readOnly: true
          title: Expires after
        expires_at:
          description: |-
            The time the grant expires, calculated from `effective_at` and `expires_after`.
            The grant is no longer in effect from this time. Absent when the grant never
            expires.
          type: string
          format: date-time
          example: '2023-02-01T01:01:01.001Z'
          readOnly: true
          title: Expires at
        max_rollover_amount:
          description: |-
            The maximum balance the grant carries over at reset. The balance after a reset
            is `MIN(max_rollover_amount, MAX(balance_before_reset, min_rollover_amount))`.
          type: string
          example: '100'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Max rollover amount
        min_rollover_amount:
          description: |-
            The minimum balance the grant carries over at reset. The balance after a reset
            is `MIN(max_rollover_amount, MAX(balance_before_reset, min_rollover_amount))`.
          type: string
          example: '0'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Min rollover amount
        recurrence:
          description: |-
            The recurrence of the grant. When set, the grant amount is re-issued every
            interval from the anchor, which defaults to `effective_at`. Absent for
            non-recurring grants.
          type: object
          additionalProperties: false
          properties:
            anchor:
              description: A date-time anchor to base the recurring period on.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Anchor time
            interval:
              description: The interval duration in ISO 8601 format.
              type: string
              format: ISO8601
              example: P1M
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Interval in ISO 8601 duration format
          readOnly: true
          required:
            - anchor
            - interval
          title: Recurrence
        next_recurrence:
          description: The next time the grant recurs. Absent for non-recurring grants.
          type: string
          format: date-time
          example: '2023-02-01T01:01:01.001Z'
          readOnly: true
          title: Next recurrence
        voided_at:
          description: |-
            The time the grant was voided. A voided grant is no longer in effect from this
            time.
          type: string
          format: date-time
          example: '2023-01-15T01:01:01.001Z'
          readOnly: true
          title: Voided at
        labels:
          description: |
            Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

            Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
          type: object
          example:
            env: test
          additionalProperties:
            type: string
            pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
            minLength: 1
            maxLength: 63
          maxProperties: 50
          readOnly: true
          title: Labels
        created_at:
          description: An ISO-8601 timestamp representation of entity creation date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: An ISO-8601 timestamp representation of entity last update date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: An ISO-8601 timestamp representation of entity deletion date.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
      additionalProperties: false
      required:
        - id
        - entitlement_id
        - amount
        - priority
        - effective_at
        - max_rollover_amount
        - min_rollover_amount
        - created_at
        - updated_at
    BillingEntitlementGrantCreateRequest:
      description: A grant to issue for a metered entitlement.
      type: object
      properties:
        amount:
          description: 'The amount to grant, in the feature''s unit. Must be positive.'
          type: string
          example: '100'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Amount
        priority:
          description: |-
            The priority of the grant. Lower values have higher priority. Grants are
            consumed in priority order, then by closest expiration, then by earliest
            creation.
          type: integer
          format: uint8
          example: 1
          maximum: 255
          minimum: 1
          title: Priority
        effective_at:
          description: |-
            The time the grant becomes effective and the anchor for recurring grants. The
            value is truncated to the start of the minute.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: Effective at
        expires_after:
          description: |-
            The duration after which the grant expires, counted from `effective_at`. Only
            single-unit durations are accepted, such as `PT12H`, `P7D`, `P2W`, `P3M`, or
            `P1Y`. If omitted, the grant never expires.
          type: string
          format: ISO8601
          example: P1M
          pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
          title: Expires after
        max_rollover_amount:
          description: |-
            The maximum balance carried over at reset. The balance after a reset is
            `MIN(max_rollover_amount, MAX(balance_before_reset, min_rollover_amount))`.
            Defaults to `amount`.
          type: string
          example: '100'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Max rollover amount
        min_rollover_amount:
          description: |-
            The minimum balance carried over at reset. The balance after a reset is
            `MIN(max_rollover_amount, MAX(balance_before_reset, min_rollover_amount))`.
            Defaults to `0`.
          type: string
          example: '0'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Min rollover amount
        labels:
          description: |
            Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

            Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
          type: object
          example:
            env: test
          additionalProperties:
            type: string
            pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
            minLength: 1
            maxLength: 63
          maxProperties: 50
          title: Labels
        recurrence:
          description: |-
            The recurrence of the grant. When set, the amount is issued again every
            interval. The anchor defaults to `effective_at`.
          type: object
          additionalProperties: false
          properties:
            interval:
              description: The interval duration in ISO 8601 format.
              type: string
              format: ISO8601
              example: P1M
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Interval in ISO 8601 duration format
            anchor:
              description: A date-time anchor to base the recurring period on.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Anchor time
          required:
            - interval
          title: Recurrence
      additionalProperties: false
      required:
        - amount
        - effective_at
    BillingEntitlementGrantUsage:
      description: Usage taken from a single grant.
      type: object
      properties:
        grant_id:
          description: The ID of the grant.
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        usage:
          description: The usage taken from the grant.
          type: string
          example: '50'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
      additionalProperties: false
      required:
        - grant_id
        - usage
    BillingEntitlementHistory:
      description: Balance and usage history of a metered entitlement.
      type: object
      properties:
        windowed_history:
          description: |-
            Usage in half-open windows of the requested size, aligned to the requested time
            zone. Empty windows are included; windows before usage measurement began are
            omitted.
          type: array
          items:
            $ref: '#/components/schemas/BillingEntitlementHistoryWindow'
          readOnly: true
        burndown_history:
          description: |-
            Periods in which grants were consumed in a fixed order. A new segment starts
            whenever grant priorities change or a usage period starts.
          type: array
          items:
            $ref: '#/components/schemas/BillingEntitlementBurndownSegment'
          readOnly: true
      additionalProperties: false
      required:
        - windowed_history
        - burndown_history
    BillingEntitlementHistoryWindow:
      description: Usage and balance of a single history window.
      type: object
      properties:
        period:
          description: The period the window covers.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
        usage:
          description: The usage recorded in the window.
          type: string
          example: '100'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
        balance_at_start:
          description: The entitlement balance at the start of the window.
          type: string
          example: '100'
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
      additionalProperties: false
      required:
        - period
        - usage
        - balance_at_start
    BillingEntitlementHistoryWindowSize:
      description: |-
        The meter query granularities the usage history can be grouped into. Sub-hour
        windows are too expensive to compute and monthly windows are not supported.
      type: string
      enum:
        - PT1H
        - P1D
    BillingEntitlementMeasureUsageFromPreset:
      description: |-
        Preset for the time from which usage is measured.

        - `current_period_start`: the start of the current usage period.
        - `now`: the entitlement creation time.
      type: string
      enum:
        - current_period_start
        - now
    BillingEntitlementMetered:
      description: |-
        A metered entitlement grants a usage allowance for a feature. Access is
        determined by the balance: the allowance provided by grants is burnt down by
        usage.
      type: object
      properties:
        id:
          description: ULID (Universally Unique Lexicographically Sortable Identifier).
          type: string
          example: 01G65Z755AFWAKHE12NY0CQ9FH
          pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
          readOnly: true
          title: ULID
        type:
          description: The type of the entitlement.
          type: string
          enum:
            - metered
          title: Type
        feature:
          description: The feature the customer is entitled to use.
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/ULID'
          required:
            - id
          title: Feature
        customer:
          description: The customer the entitlement belongs to.
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: '#/components/schemas/ULID'
          readOnly: true
          required:
            - id
          title: Customer
        labels:
          description: |
            Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

            Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
          type: object
          example:
            env: test
          additionalProperties:
            type: string
            pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
            minLength: 1
            maxLength: 63
          maxProperties: 50
          title: Labels
        active_from:
          description: The time from which the entitlement is active.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active from
        active_to:
          description: |-
            The time until which the entitlement is active. If not set, the entitlement is
            active until deleted.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Active to
        created_at:
          description: The time the entitlement was created.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        updated_at:
          description: The time the entitlement was last updated.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        deleted_at:
          description: The time the entitlement was deleted.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: RFC3339 Date-Time
        usage_period:
          description: |-
            The usage period of the entitlement. The balance resets at the start of every
            period.
          type: object
          additionalProperties: false
          properties:
            anchor:
              description: A date-time anchor to base the recurring period on.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Anchor time
            interval:
              description: The interval duration in ISO 8601 format.
              type: string
              format: ISO8601
              example: P1M
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Interval in ISO 8601 duration format
          readOnly: true
          required:
            - anchor
            - interval
          title: Usage period
        current_usage_period:
          description: The current usage period of the entitlement.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Current usage period
        is_soft_limit:
          description: |-
            If true, the customer keeps access to the feature after the balance is
            exhausted.
          type: boolean
          default: false
          title: Soft limit
        issue:
          description: Usage granted automatically after each reset. Cannot be combined with `grants`.
          type: object
          additionalProperties: false
          properties:
            amount:
              description: 'The amount granted after each reset, in the feature''s unit.'
              type: string
              example: '100'
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Initial grant amount
            priority:
              description: |-
                The priority of the grant created after each reset. Lower values have higher
                priority.
              type: integer
              format: uint8
              default: 1
              maximum: 255
              minimum: 1
              title: Issue grant after reset priority
          required:
            - amount
          title: Issue after reset
        issue_after_reset:
          description: The amount granted automatically after each reset.
          type: string
          example: '100'
          deprecated: true
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          title: Initial grant amount
        issue_after_reset_priority:
          description: The priority of the grant created after each reset.
          type: integer
          format: uint8
          default: 1
          deprecated: true
          maximum: 255
          minimum: 1
          title: Issue grant after reset priority
        preserve_overage_at_reset:
          description: 'If true, the overage is preserved at reset. If false, the usage is reset to 0.'
          type: boolean
          default: false
          title: Preserve overage at reset
        measure_usage_from:
          description: The time from which usage is measured.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Measure usage from
        last_reset:
          description: The time of the last reset.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Last reset
      additionalProperties: false
      required:
        - id
        - type
        - feature
        - customer
        - active_from
        - created_at
        - updated_at
        - usage_period
        - current_usage_period
        - measure_usage_from
        - last_reset
    BillingEntitlementStatic:
