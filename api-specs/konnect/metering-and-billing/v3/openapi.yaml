          type: array
          items:
            $ref: '#/components/schemas/BillingValidationIssue'
          readOnly: true
          title: Validation issues
        invoice_at:
          description: The timestamp when the charge is intended to be invoiced.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          title: Invoice at
        service_period:
          description: The effective service period covered by the charge.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          required:
            - from
            - to
          title: Service period
        full_service_period:
          description: 'The full, unprorated service period of the charge.'
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Full service period
        billing_period:
          description: The billing period the charge belongs to.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Billing period
        advance_after:
          description: |-
            The earliest time when the charge should be advanced again by background
            processing.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Advance after
        unique_reference_id:
          description: Unique reference ID of the charge.
          type: string
          title: Unique reference ID
        settlement_mode:
          description: Settlement mode of the charge.
          type: string
          enum:
            - credit_then_invoice
            - credit_only
          title: Settlement mode
        tax_config:
          description: Tax configuration of the charge.
          type: object
          additionalProperties: false
          properties:
            behavior:
              description: |-
                Tax behavior.

                If not specified the billing profile is used to determine the tax behavior. If
                not specified in the billing profile, the provider's default behavior is used.
              type: string
              enum:
                - inclusive
                - exclusive
              title: Tax behavior
            stripe:
              description: Stripe tax config.
              type: object
              additionalProperties: false
              deprecated: true
              properties:
                code:
                  description: 'Product [tax code](https://docs.stripe.com/tax/tax-codes).'
                  type: string
                  example: txcd_10000000
                  pattern: '^txcd_\d{8}$'
                  title: Tax code
              required:
                - code
              title: Stripe tax config
            external_invoicing:
              description: External invoicing tax config.
              type: object
              additionalProperties: false
              deprecated: true
              properties:
                code:
                  description: The tax code should be interpreted by the external invoicing provider.
                  type: string
                  maxLength: 64
                  title: Tax code
              required:
                - code
              title: External invoicing tax config
            tax_code_id:
              description: Tax code ID.
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              deprecated: true
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              title: Tax code ID
            tax_code:
              description: |-
                Tax code reference.

                When both `tax_code` and `tax_code_id` are provided, `tax_code` takes
                precedence. When `stripe.code` is also provided, `tax_code` still wins and
                `stripe.code` is ignored.
              type: object
              additionalProperties: false
              properties:
                id:
                  $ref: '#/components/schemas/ULID'
              required:
                - id
              title: Tax code
          title: Tax configuration
        realizations:
          description: 'The realization runs of the charge, sorted by `created_at`.'
          type: array
          items:
            $ref: '#/components/schemas/BillingChargeRealization'
          readOnly: true
          title: Realizations
        payment_term:
          description: Payment term of the flat fee charge.
          type: string
          enum:
            - in_advance
            - in_arrears
          title: Payment term
        discounts:
          description: The discounts applied to the charge.
          type: object
          additionalProperties: false
          properties:
            percentage:
              description: Percentage discount applied to the price (0–100).
              type: number
              maximum: 100
              minimum: 0
          title: Discounts
        feature:
          description: 'The feature associated with the charge, when applicable.'
          oneOf:
            - $ref: '#/components/schemas/Feature'
            - $ref: '#/components/schemas/FeatureReference'
          readOnly: true
          title: Feature
        proration_configuration:
          description: The proration configuration of the charge.
          type: object
          additionalProperties: false
          properties:
            mode:
              description: The proration mode of the rate card.
              type: string
              enum:
                - no_proration
                - prorate_prices
              title: Proration mode
          required:
            - mode
          title: Proration configuration
        amount_after_proration:
          description: The amount after proration of the charge.
          type: object
          additionalProperties: false
          properties:
            amount:
              description: The amount as an arbitrary-precision decimal string.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
            currency:
              description: The fiat or custom currency code of the amount.
              oneOf:
                - $ref: '#/components/schemas/CurrencyCode'
                - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
          readOnly: true
          required:
            - amount
            - currency
          title: Amount after proration
        price:
          description: The price of the charge.
          type: object
          additionalProperties: false
          properties:
            type:
              description: The type of the price.
              type: string
              enum:
                - flat
              title: Type
            amount:
              description: The amount of the flat price.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              title: Amount
          readOnly: true
          required:
            - type
            - amount
          title: Price
        system_intent:
          description: |-
            Current intent from the system lifecycle controller for a charge that has an
            active manual override. The top-level charge fields remain the effective
            customer-facing intent.
          type: object
          additionalProperties: false
          properties:
            name:
              description: |-
                Display name of the resource.

                Between 1 and 256 characters.
              type: string
              maxLength: 256
              minLength: 1
            description:
              description: |-
                Optional description of the resource.

                Maximum 1024 characters.
              type: string
              maxLength: 1024
            labels:
              $ref: '#/components/schemas/Labels'
            invoice_at:
              description: The timestamp when the charge is intended to be invoiced.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Invoice at
            service_period:
              description: The effective service period covered by the charge.
              type: object
              additionalProperties: false
              properties:
                from:
                  description: |-
                    The start of the period.

                    The period is inclusive at the start.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: Start
                to:
                  description: |-
                    The end of the period.

                    The period is exclusive at the end.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: End
              required:
                - from
                - to
              title: Service period
            full_service_period:
              description: 'The full, unprorated service period of the charge.'
              type: object
              additionalProperties: false
              properties:
                from:
                  description: |-
                    The start of the period.

                    The period is inclusive at the start.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: Start
                to:
                  description: |-
                    The end of the period.

                    The period is exclusive at the end.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: End
              readOnly: true
              required:
                - from
                - to
              title: Full service period
            billing_period:
              description: The billing period the charge belongs to.
              type: object
              additionalProperties: false
              properties:
                from:
                  description: |-
                    The start of the period.

                    The period is inclusive at the start.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: Start
                to:
                  description: |-
                    The end of the period.

                    The period is exclusive at the end.
                  type: string
                  format: date-time
                  example: '2023-01-01T01:01:01.001Z'
                  title: End
              readOnly: true
              required:
                - from
                - to
              title: Billing period
            payment_term:
              description: Payment term of the flat fee charge.
              type: string
              enum:
                - in_advance
                - in_arrears
              title: Payment term
            discounts:
              description: The discounts applied to the charge.
              type: object
              additionalProperties: false
              properties:
                percentage:
                  description: Percentage discount applied to the price (0–100).
                  type: number
                  maximum: 100
                  minimum: 0
              title: Discounts
            proration_configuration:
              description: The proration configuration of the charge.
              type: object
              additionalProperties: false
              properties:
                mode:
                  description: The proration mode of the rate card.
                  type: string
                  enum:
                    - no_proration
                    - prorate_prices
                  title: Proration mode
              required:
                - mode
              title: Proration configuration
            amount_before_proration:
              description: The amount before proration of the system lifecycle controller flat fee intent.
              type: object
              additionalProperties: false
              properties:
                amount:
                  description: The amount as an arbitrary-precision decimal string.
                  type: string
                  pattern: '^\-?[0-9]+(\.[0-9]+)?$'
                currency:
                  description: The fiat or custom currency code of the amount.
                  oneOf:
                    - $ref: '#/components/schemas/CurrencyCode'
                    - $ref: '#/components/schemas/BillingCurrencyCodeCustom'
              readOnly: true
              required:
                - amount
                - currency
              title: Amount before proration
            deleted_at:
              description: |-
                The timestamp when the system lifecycle controller intent was deleted. The
                effective charge can remain visible while a manual override is active.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: Deleted at
          readOnly: true
          required:
            - name
            - invoice_at
            - service_period
            - full_service_period
            - billing_period
            - payment_term
            - proration_configuration
            - amount_before_proration
          title: System intent
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - updated_at
        - type
        - customer
        - lifecycle_controller
        - currency
        - status
        - invoice_at
        - service_period
        - full_service_period
        - billing_period
        - settlement_mode
        - realizations
        - payment_term
        - proration_configuration
        - amount_after_proration
        - price
      title: Flat fee charge
    BillingChargeRealization:
      description: |-
        A realization run of a charge.

        `totals` and `detailed_lines` are only populated with the `realization.totals`
        and `realization.detailed_lines` expands, respectively, since computing them
        requires re-deriving the run's rated breakdown. `invoice` is an ID reference
        unless the `realization.invoice` expand is used, which resolves it to the
        invoice header of the run's booked line: the invoice entity without its `lines`
        and without the `customer` snapshot (the charge itself already identifies the
        customer).
      type: object
      properties:
        id:
          description: |-
            The ID of the realization run. Not present on `outstanding` entries, which are
            projections rather than persisted runs.
          type: string
          readOnly: true
          title: ID
        line_id:
          description: |-
            The ID of the invoice line this realization was booked to, when the realization
            has been invoiced.
          type: string
          readOnly: true
          title: Line ID
        invoice:
          description: The reference of the invoice related to the realization.
          oneOf:
            - $ref: '#/components/schemas/BillingChargeRealizationInvoice'
            - $ref: '#/components/schemas/ChargeRealizationInvoiceReference'
          readOnly: true
          title: Invoice
        type:
          description: The type of the realization run.
          type: string
          enum:
            - final_realization
            - partial_invoice
            - outstanding
            - voided
          readOnly: true
          title: Type
        service_period:
          description: The service period covered by this realization run.
          type: object
          additionalProperties: false
          properties:
            from:
              description: |-
                The start of the period.

                The period is inclusive at the start.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: Start
            to:
              description: |-
                The end of the period.

                The period is exclusive at the end.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              title: End
          readOnly: true
          required:
            - from
            - to
          title: Service period
        usage:
          description: |-
            The metered usage quantity this realization run accounts for. Only present on
            usage-based charges; flat fees are not metered, so their realizations carry no
            usage.

            Booked entries report a signed delta: a negative value states a downward usage
            correction (or a voided run that snapshotted behind its live neighbors) instead
            of masking it as zero.

            On an `outstanding` entry this is `0` unless the `real_time_usage` expand is
            applied, in which case it is the not-yet-booked remainder of the live metering
            read (never negative).
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Usage
        payment:
          description: |-
            The payment state of the realization, when the charge requires a fiat
            transaction to settle.
          type: object
          additionalProperties: false
          properties:
            status:
              description: The settlement status of the payment.
              type: string
              enum:
                - authorized
                - settled
              readOnly: true
              title: Status
          readOnly: true
          required:
            - status
          title: Payment
        totals:
          description: |-
            Financial totals for the realization run, including credit allocations.

            Requires the `realization.totals` expand.
          type: object
          additionalProperties: false
          properties:
            amount:
              description: 'The total value of the resource before taxes, discounts and commitments.'
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Amount
            taxes_total:
              description: The total tax amount applied to the resource.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Taxes total
            taxes_inclusive_total:
              description: The total tax amount already included in the resource amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Inclusive taxes total
            taxes_exclusive_total:
              description: The total tax amount added on top of the resource amount.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Exclusive taxes total
            charges_total:
              description: The total amount contributed by additional charges.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Charges total
            discounts_total:
              description: The total amount deducted through discounts.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Discounts total
            credits_total:
              description: The total amount deducted through credits before taxes are applied.
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Credits total
            total:
              description: 'The final total value of the resource after taxes, discounts and commitments.'
              type: string
              pattern: '^\-?[0-9]+(\.[0-9]+)?$'
              readOnly: true
              title: Total
          readOnly: true
          required:
            - amount
            - taxes_total
            - taxes_inclusive_total
            - taxes_exclusive_total
            - charges_total
            - discounts_total
            - credits_total
            - total
          title: Totals
        detailed_lines:
          description: |-
            The detailed (rated) lines produced by the realization run.

            Requires the `realization.detailed_lines` expand.
          type: array
          items:
            $ref: '#/components/schemas/BillingChargeRealizationDetailedLine'
          readOnly: true
          title: Detailed lines
      additionalProperties: false
      required:
        - type
        - service_period
      title: Charge realization
    BillingChargeRealizationAmountDiscount:
      description: A discount applied to a charge realization detailed line.
      type: object
      properties:
        amount:
          description: The amount of the discount applied to the charge.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Amount
        reason:
          description: The reason for the discount applied to the charge.
          type: string
          readOnly: true
          title: Reason
        description:
          description: Optional human-readable description of the discount.
          type: string
          readOnly: true
          title: Description
        rounding_amount:
          description: |-
            The discount amount applied to the charge, rounded to the nearest cent (or
            currency equivalent) and adjusted to compensate for rounding errors across
            multiple discounted detail lines.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Rounded amount
        child_unique_reference_id:
          description: Unique reference ID of the discount applied to the charge.
          type: string
          readOnly: true
          title: Unique reference ID
      additionalProperties: false
      required:
        - amount
        - reason
        - child_unique_reference_id
      title: Charge detailed line amount discount
    BillingChargeRealizationDetailedLine:
      description: |-
        A detailed (child) line type of a charge realization run.

        This is distinct from an invoice's own detailed lines: it represents the
        rated/priced breakdown produced by the realization run itself, before that
        breakdown is (or is not yet) reflected on an invoice line. Credit-then-invoice
        runs include credit allocations in these lines, while credits-only runs keep the
        gross rated detail.
      type: object
      discriminator:
        propertyName: type
        mapping:
          flat_fee: '#/components/schemas/BillingChargeRealizationDetailedLineFlatFee'
          usage_based: '#/components/schemas/BillingChargeRealizationDetailedLineUsageBased'
      oneOf:
        - $ref: '#/components/schemas/BillingChargeRealizationDetailedLineFlatFee'
        - $ref: '#/components/schemas/BillingChargeRealizationDetailedLineUsageBased'
      title: Charge realization detailed line
    BillingChargeRealizationDetailedLineCreditApplied:
      description: A credit allocation applied to a charge realization detailed line.
      type: object
      properties:
        amount:
          description: The monetary amount credited.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
          readOnly: true
          title: Amount
        description:
          description: Human-readable description of the credit allocation.
          type: string
          readOnly: true
          title: Description
        credit_realization_id:
          description: The ID of the credit realization (allocation) this credit was applied from.
          type: string
          readOnly: true
          title: Credit realization ID
      additionalProperties: false
      required:
        - amount
        - credit_realization_id
      title: Charge realization detailed line credit applied
