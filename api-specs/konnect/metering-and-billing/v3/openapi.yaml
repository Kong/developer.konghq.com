          explode: false
          style: form
      responses:
        '200':
          description: Page paginated response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCodePagePaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - OpenMeter Tax
  '/openmeter/tax-codes/{taxCodeId}':
    get:
      operationId: get-tax-code
      summary: Get tax code
      parameters:
        - name: taxCodeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '200':
          description: TaxCode response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingTaxCode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - OpenMeter Tax
    put:
      operationId: upsert-tax-code
      summary: Upsert tax code
      parameters:
        - name: taxCodeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTaxCodeRequest'
      responses:
        '200':
          description: TaxCode upsert response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingTaxCode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
      tags:
        - OpenMeter Tax
    delete:
      operationId: delete-tax-code
      summary: Delete tax code
      parameters:
        - name: taxCodeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ULID'
      responses:
        '204':
          description: Deleted response.
        '400':
          $ref: '#/components/responses/BadRequest'
