    DateTime:
      description: |-
        [RFC3339](https://tools.ietf.org/html/rfc3339) formatted date-time string in
        UTC.
      type: string
      format: date-time
      example: '2023-01-01T01:01:01.001Z'
      title: RFC3339 Date-Time
    DateTimeFieldFilter:
      description: Filters on the given datetime (RFC-3339) field value.
      oneOf:
        - type: string
          title: DateTimeFieldImplicitEqualsFilter
          format: date-time
          description: Value strictly equals given RFC-3339 formatted timestamp in UTC
          example: '2022-03-30T07:20:50Z'
        - type: object
          title: DateTimeFieldEqualsFilter
          additionalProperties: false
          properties:
            eq:
              description: Value strictly equals given RFC-3339 formatted timestamp in UTC
              type: string
              format: date-time
              example: '2022-03-30T07:20:50Z'
          required:
            - eq
        - type: object
          title: DateTimeFieldLTFilter
          additionalProperties: false
          properties:
            lt:
              description: Value is less than the given RFC-3339 formatted timestamp in UTC
              type: string
              format: date-time
              example: '2022-03-30T07:20:50Z'
          required:
            - lt
        - type: object
          title: DateTimeFieldLTEFilter
          additionalProperties: false
          properties:
            lte:
              description: Value is less than or equal to the given RFC-3339 formatted timestamp in UTC
              type: string
              format: date-time
              example: '2022-03-30T07:20:50Z'
          required:
            - lte
        - type: object
          title: DateTimeFieldGTFilter
          additionalProperties: false
          properties:
            gt:
              description: Value is greater than the given RFC-3339 formatted timestamp in UTC
              type: string
              format: date-time
              example: '2022-03-30T07:20:50Z'
          required:
            - gt
        - type: object
          title: DateTimeFieldGTEFilter
          additionalProperties: false
          properties:
            gte:
              description: Value is greater than or equal to the given RFC-3339 formatted timestamp in UTC
              type: string
              format: date-time
              example: '2022-03-30T07:20:50Z'
          required:
            - gte
      title: DateTimeFieldFilter
      x-examples:
        datetime_field_1: '2022-03-30T07:20:50Z'
        datetime_field_2:
          eq: '2022-03-30T07:20:50Z'
        datetime_field_3:
          lt: '2022-03-30T07:20:50Z'
        datetime_field_4:
          lte: '2022-03-30T07:20:50Z'
        datetime_field_5:
          gt: '2022-03-30T07:20:50Z'
        datetime_field_6:
          gte: '2022-03-30T07:20:50Z'
    EntitlementAccessQueryError:
      description: Query error within a partially successful entitlement access query response.
      type: object
      properties:
        code:
          description: Machine-readable error code.
          type: string
          enum:
            - unknown
            - customer_not_found
          readOnly: true
          title: Code
        message:
          description: Human-readable description of the error.
          type: string
          readOnly: true
          title: Message
        attributes:
          description: Additional structured context.
          type: object
          additionalProperties: {}
          readOnly: true
          title: Attributes
        customer:
          description: The customer identifier from the request that produced this error.
          type: string
          readOnly: true
          title: Customer identifier
      additionalProperties: false
      required:
        - code
        - message
    EntitlementAccessQueryRequest:
      description: Query to evaluate feature access for a list of customers.
      type: object
      properties:
        include_credits:
          description: |-
            Whether to include credit balance availability for each resolved customer. When
            true, each feature evaluation includes credit balance checks.

            Defaults to `false`.
          type: boolean
          default: false
          title: Include credits
        customer:
          description: List of customer identifiers to evaluate access for.
          type: object
          additionalProperties: false
          properties:
            keys:
              description: |-
                Each entry can be a customer `key` or a usage-attribution subject `key`.
                Identifiers that cannot be resolved to a customer are reported in the response
                `errors` array.
              type: array
              items:
                type: string
              maxItems: 100
              minItems: 1
              title: Customer keys and usage-attribution subjects
          required:
            - keys
          title: Customer
        feature:
          description: |-
            Optional list of feature keys to evaluate access for. If omitted, all features
            available in the organization are returned. Providing this list is recommended
            to reduce the response size and the load on the backend services.
          type: object
          additionalProperties: false
          properties:
            keys:
              description: List of feature keys to evaluate access for.
              type: array
              items:
                type: string
              maxItems: 100
              minItems: 1
              title: Feature Keys
          required:
            - keys
          title: Feature
      additionalProperties: false
      required:
        - customer
    EntitlementAccessQueryResponse:
      description: Response of the entitlement access query.
      type: object
      properties:
        data:
          description: 'Access evaluation results, one entry per resolved customer.'
          type: array
          items:
            $ref: '#/components/schemas/EntitlementAccessQueryResult'
          readOnly: true
          title: Data
        errors:
          description: Partial errors encountered while processing the request.
          type: array
          items:
            $ref: '#/components/schemas/EntitlementAccessQueryError'
          readOnly: true
          title: Errors
        meta:
          description: |-
            Pagination metadata. The endpoint may return a partial response if the full
            response would exceed server-side limits.
          type: object
          properties:
            page:
              $ref: '#/components/schemas/CursorMetaPage'
          readOnly: true
          required:
            - page
          title: Meta
      additionalProperties: false
      required:
        - data
        - errors
        - meta
    EntitlementAccessQueryResult:
      description: Access evaluation result for a single resolved customer.
      type: object
      properties:
        matched:
          description: |-
            The list of identifiers from the request that resolved to this customer. Each
            entry is either the customer `key` or one of its usage-attribution subject
            `key`s.

            Duplicate or aliased identifiers that resolve to the same customer collapse to a
            single result entry, with every requested identifier listed here.
          type: array
          items:
            type: string
          readOnly: true
          title: Matched identifiers
        customer:
          description: The customer the matched identifiers resolved to.
          type: object
          additionalProperties: false
          properties:
            id:
              description: ULID (Universally Unique Lexicographically Sortable Identifier).
              type: string
              example: 01G65Z755AFWAKHE12NY0CQ9FH
              pattern: '^[0-7][0-9A-HJKMNP-TV-Z]{25}$'
              readOnly: true
              title: ULID
            name:
              description: |-
                Display name of the resource.

                Between 1 and 256 characters.
              type: string
              maxLength: 256
              minLength: 1
            description:
              description: |-
                Optional description of the resource.

                Maximum 1024 characters.
              type: string
              maxLength: 1024
            labels:
              $ref: '#/components/schemas/Labels'
            created_at:
              description: An ISO-8601 timestamp representation of entity creation date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            updated_at:
              description: An ISO-8601 timestamp representation of entity last update date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            deleted_at:
              description: An ISO-8601 timestamp representation of entity deletion date.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
              readOnly: true
              title: RFC3339 Date-Time
            key:
              $ref: '#/components/schemas/ExternalResourceKey'
            usage_attribution:
              description: Mapping to attribute metered usage to the customer by the event subject.
              type: object
              additionalProperties: false
              properties:
                subject_keys:
                  description: |-
                    The subjects that are attributed to the customer. Can be empty when no usage
                    event subjects are associated with the customer.
                  type: array
                  items:
                    $ref: '#/components/schemas/UsageAttributionSubjectKey'
                  minItems: 0
                  title: Subject Keys
              required:
                - subject_keys
              title: Usage Attribution
            primary_email:
              description: The primary email address of the customer.
              type: string
              title: Primary Email
            currency:
              description: 'Currency of the customer. Used for billing, tax and invoicing.'
              type: string
              example: USD
              maxLength: 3
              minLength: 3
              pattern: '^[A-Z]{3}$'
              title: Currency
            billing_address:
              description: The billing address of the customer. Used for tax and invoicing.
              type: object
              additionalProperties: false
              properties:
                country:
                  description: |-
                    Country code in [ISO 3166-1](https://www.iso.org/iso-3166-country-codes.html)
                    alpha-2 format.
                  type: string
                  example: US
                  maxLength: 2
                  minLength: 2
                  pattern: '^[A-Z]{2}$'
                  title: Country
                postal_code:
                  description: Postal code.
                  type: string
                  title: Postal Code
                state:
                  description: State or province.
                  type: string
                  title: State
                city:
                  description: City.
                  type: string
                  title: City
                line1:
                  description: First line of the address.
                  type: string
                  title: Line 1
                line2:
                  description: Second line of the address.
                  type: string
                  title: Line 2
                phone_number:
                  description: Phone number.
                  type: string
                  title: Phone Number
              title: Billing Address
          readOnly: true
          required:
            - id
            - name
            - created_at
            - updated_at
            - key
          title: Customer
        features:
          description: |-
            Map of features with their access status.

            Map keys are the feature keys requested in `feature.keys`, or every feature
            `key` available in the organization when the feature filter was omitted.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EntitlementFeatureAccess'
          readOnly: true
          title: Features
        updated_at:
          description: |-
            Timestamp of the most recent change to the customer's access state reflected in
            this result.
          type: string
          format: date-time
          example: '2023-01-01T01:01:01.001Z'
          readOnly: true
          title: Updated at
      additionalProperties: false
      required:
        - matched
        - customer
        - features
        - updated_at
    EntitlementFeatureAccess:
      description: Access status for a single feature.
      type: object
      properties:
