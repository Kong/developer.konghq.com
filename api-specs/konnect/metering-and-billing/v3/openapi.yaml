            Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
          type: object
          example:
            env: test
          additionalProperties:
            type: string
            pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
            minLength: 1
            maxLength: 63
          maxProperties: 50
          title: Labels
        config:
          description: |-
            The entitlement configuration as a JSON value. Returned when checking
            entitlement access.
          example:
            integrations:
              - github
          title: Config
        usage_period:
          description: |-
            The usage period of the entitlement. The anchor defaults to the entitlement
            creation time.
          type: object
          additionalProperties: false
          properties:
            interval:
              description: The interval duration in ISO 8601 format.
              type: string
              format: ISO8601
              example: P1M
              pattern: '^P(?:\d+(?:\.\d+)?Y)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?W)?(?:\d+(?:\.\d+)?D)?(?:T(?:\d+(?:\.\d+)?H)?(?:\d+(?:\.\d+)?M)?(?:\d+(?:\.\d+)?S)?)?$'
              title: Interval in ISO 8601 duration format
            anchor:
              description: A date-time anchor to base the recurring period on.
              type: string
              format: date-time
              example: '2023-01-01T01:01:01.001Z'
