        type:
          description: Discriminator selecting the cost basis mode.
          type: string
          enum:
            - manual
        fiat_currency:
          description: The fiat currency the charge amount is converted into for invoicing.
          type: string
          example: USD
          maxLength: 3
          minLength: 3
          pattern: '^[A-Z]{3}$'
        rate:
          description: Fiat amount per one unit of the custom currency.
          type: string
          pattern: '^\-?[0-9]+(\.[0-9]+)?$'
      additionalProperties: false
      required:
        - type
        - rate
    BillingChargeCostBasisPinned:
