      description: Subject key.
      type: string
      minLength: 1
    VoidCreditGrantRequest:
      description: Request body for voiding a credit grant.
      type: object
      properties:
        payment_adjustment:
          description: |-
            How voiding adjusts payment state related to the grant.

            Currently only `none` is supported: voiding does not adjust invoices, payment
            authorization, settlement, payment intents, or external collection state. If
            payment later completes, the original invoiced amount may still be collected.
          type: string
          default: none
          enum:
            - none
          title: Credit grant void payment adjustment
      additionalProperties: false
    SortQuery:
      description: |
        The `asc` suffix is optional as the default sort order is ascending.
        The `desc` suffix is used to specify a descending order.
        Multiple sort attributes may be provided via a comma separated list.
        JSONPath notation may be used to specify a sub-attribute (eg: 'foo.bar desc').
      type: string
      example: created_at desc
      title: SortQuery
    Labels:
      description: |
        Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

        Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
      type: object
      example:
        env: test
      additionalProperties:
        type: string
        pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
        minLength: 1
        maxLength: 63
      maxProperties: 50
      title: Labels
