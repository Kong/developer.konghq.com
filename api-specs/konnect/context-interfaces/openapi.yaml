          description: The ID of the Context Source.
          example: a60eceeb-dd7c-4884-8b26-806489c2f704
        created_at:
          $ref: '../../../../common/definitions/properties.yaml#/components/schemas/CreatedAt'
        updated_at:
          $ref: '../../../../common/definitions/properties.yaml#/components/schemas/UpdatedAt'
    ListMCPServerMCPResourceMappingsResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MCPServerMCPResourceMapping'
        meta:
          $ref: '../../../../common/definitions/metadatas.yaml#/components/schemas/CursorMeta'
    APICapabilityControlsOperation:
      type: object
      description: An API operation that is denied.
      required:
        - path
        - methods
      properties:
        path:
          type: string
          description: The path of the API operation.
          example: /library/{id}/books
        methods:
          type: array
          description: The HTTP methods of the API operation that are denied.
          items:
            type: string
          example:
            - GET
    APICapabilityControlsDeny:
      type: object
      description: The capabilities of the mapped API that are denied.
      required:
        - operations
      properties:
        operations:
          type: array
          description: The API operations that are denied.
          items:
            $ref: '#/components/schemas/APICapabilityControlsOperation'
    APICapabilityControls:
      type: object
      description: Capability controls for a mapping to an API MCP resource.
      required:
        - type
        - deny
      properties:
        type:
          type: string
          description: The type of the mapped MCP resource.
          enum: ["api"]
        deny:
          $ref: '#/components/schemas/APICapabilityControlsDeny'
      example:
        type: api
        deny:
          operations:
            - path: /library/{id}/books
              methods:
                - GET
    MCPCapabilityControlsDeny:
      type: object
      description: The capabilities of the mapped MCP server that are denied.
      required:
        - tools
        - resources
        - prompts
      properties:
        tools:
          type: array
          description: The names of the tools that are denied.
          items:
            type: string
        resources:
          type: array
          description: The URIs of the resources that are denied.
          items:
            type: string
        prompts:
          type: array
          description: The names of the prompts that are denied.
          items:
            type: string
    MCPCapabilityControls:
      type: object
      description: Capability controls for a mapping to an MCP server MCP resource.
      required:
        - type
        - deny
      properties:
        type:
          type: string
          description: The type of the mapped MCP resource.
          enum: ["mcp_server"]
        deny:
          $ref: '#/components/schemas/MCPCapabilityControlsDeny'
      example:
        type: mcp_server
        deny:
          tools:
            - search_books
          resources:
            - file:///library/catalog.json
          prompts:
            - summarize_book
    CapabilityControls:
      description: >
        The capabilities of a mapped MCP resource that the MCP server does not
        expose.
      oneOf:
        - $ref: '#/components/schemas/APICapabilityControls'
        - $ref: '#/components/schemas/MCPCapabilityControls'
      discriminator:
        propertyName: type
        mapping:
          api: '#/components/schemas/APICapabilityControls'
          mcp_server: '#/components/schemas/MCPCapabilityControls'
    PatchAPICapabilityControlsDeny:
      type: object
      description: >
        The capabilities of the mapped API to deny. Omitted keys preserve
        their current value, an empty array clears the capability, and a
        non-empty array replaces.
      properties:
        operations:
          type: array
          description: The API operations that are denied.
          items:
            $ref: '#/components/schemas/APICapabilityControlsOperation'
    PatchAPICapabilityControls:
      type: object
      description: Partial capability controls for a mapping to an API MCP resource.
      required:
        - type
        - deny
      properties:
        type:
          type: string
          description: The type of the mapped MCP resource.
          enum: ["api"]
        deny:
          $ref: '#/components/schemas/PatchAPICapabilityControlsDeny'
      example:
        type: api
        deny:
          operations:
            - path: /library/{id}/books
              methods:
                - GET
    PatchMCPCapabilityControlsDeny:
      type: object
      description: >
        The capabilities of the mapped MCP server to deny. Omitted keys
        preserve their current value, an empty array clears the capability,
        and a non-empty array replaces.
      properties:
        tools:
          type: array
          description: The names of the tools that are denied.
          items:
            type: string
        resources:
          type: array
          description: The URIs of the resources that are denied.
          items:
            type: string
        prompts:
          type: array
          description: The names of the prompts that are denied.
          items:
            type: string
    PatchMCPCapabilityControls:
      type: object
      description: Partial capability controls for a mapping to an MCP server MCP resource.
      required:
        - type
        - deny
      properties:
        type:
          type: string
          description: The type of the mapped MCP resource.
          enum: ["mcp_server"]
        deny:
          $ref: '#/components/schemas/PatchMCPCapabilityControlsDeny'
      example:
        type: mcp_server
        deny:
          prompts:
            - prompt_a
          resources:
            - res_a
    PatchCapabilityControls:
      description: >
        The capability controls to merge into the existing configuration for
        a mapped context source. Omitted deny keys preserve their current
        value, an empty array clears a capability, and a non-empty array
        replaces.
      oneOf:
        - $ref: '#/components/schemas/PatchAPICapabilityControls'
        - $ref: '#/components/schemas/PatchMCPCapabilityControls'
      discriminator:
        propertyName: type
        mapping:
          api: '#/components/schemas/PatchAPICapabilityControls'
          mcp_server: '#/components/schemas/PatchMCPCapabilityControls'
    MCPServerControlPlaneMappingMode:
      type: string
      enum:
        - basic
        - advanced
      description: "Whether the Context Interface deployment on this Control Plane is managed by Konnect defaults ('basic') or configured directly via Kong Operator custom resources ('advanced')."
    MCPServerControlPlaneMappingInfo:
      type: object
      required:
        - id
        - context_interface_id
        - control_plane_id
        - mode
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the mapping.
        context_interface_id:
          type: string
          format: uuid
          description: The unique identifier for the Context Interface.
        control_plane_id:
          type: string
          format: uuid
          description: The unique identifier for the Control Plane.
        mode:
          $ref: '#/components/schemas/MCPServerControlPlaneMappingMode'
        created_at:
          $ref: '../../../../common/definitions/properties.yaml#/components/schemas/CreatedAt'
        updated_at:
          $ref: '../../../../common/definitions/properties.yaml#/components/schemas/UpdatedAt'
    ListMCPServerControlPlaneMappingResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MCPServerControlPlaneMappingInfo'
        meta:
          $ref: '../../../../common/definitions/metadatas.yaml#/components/schemas/CursorMeta'
    CreateMCPServerControlPlaneMappingRequest:
      type: object
      required:
        - control_plane_id
      properties:
        control_plane_id:
          type: string
          format: uuid
          description: The unique identifier for the Control Plane.
        mode:
          $ref: '#/components/schemas/MCPServerControlPlaneMappingMode'
    PatchMCPServerControlPlaneMappingRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/MCPServerControlPlaneMappingMode'

    MCPServerRuntime:
      title: MCPServerRuntime
      type: object
      required:
        - init_container
        - runtime_container
      properties:
        init_container:
          allOf:
            - $ref: '#/components/schemas/ContainerSpec'
            - description: Configuration for the init container.
        runtime_container:
          allOf:
            - $ref: '#/components/schemas/ContainerSpec'
            - description: Configuration for the main container.
    RawSkillSourceConfigPayload:
      type: object
      required:
        - contents
      properties:
        contents:
          type: string
          description: The raw SKILL.md content — a markdown document beginning with a YAML frontmatter block.
          minLength: 1
          example: "---\nname: pdf-processing\ndescription: Extract and summarize content from PDF documents\n---\n# PDF Processing\n..."
    RawSkillSourcePayload:
      type: object
      required:
        - type
        - config
      properties:
        type:
          type: string
          enum: ["raw"]
          description: The skill content is supplied inline in the request body.
          example: raw
        config:
          $ref: '#/components/schemas/RawSkillSourceConfigPayload'
    SkillSourcePayload:
      description: >-
        Where the skill's content comes from, used in create and update requests. The shape of
        `config` is determined by `type`.
      oneOf:
        - $ref: '#/components/schemas/RawSkillSourcePayload'
      discriminator:
        propertyName: type
        mapping:
          raw: '#/components/schemas/RawSkillSourcePayload'
    RawSkillSource:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: ["raw"]
          description: The skill content was supplied inline when the skill was created or updated.
    SkillSource:
      description: >-
        Where the skill's content comes from, as returned by the API. Never includes the content
        itself — read it through the skill contents endpoint.
      oneOf:
        - $ref: '#/components/schemas/RawSkillSource'
      discriminator:
        propertyName: type
        mapping:
          raw: '#/components/schemas/RawSkillSource'
    SkillSyncStatus:
      type: object
      description: The outcome of the most recent attempt to fetch the skill's content from its source.
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: ["pending", "success", "failed"]
          description: The state of the most recent synchronization attempt.
        timestamp:
          type: string
          format: date-time
          description: The time the synchronization reached this state.
        error_message:
          type: string
          nullable: true
          description: The reason the synchronization failed. `null` unless `status` is `failed`.
          maxLength: 2048
    PatchSkillRequest:
      type: object
      properties:
        name:
          type: string
          description: The machine name of the skill. Must be unique within the MCP server and must match the name declared in the frontmatter.
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
        display_name:
          type: string
          description: The human-readable display name of the skill.
          minLength: 1
          maxLength: 120
        description:
          type: string
          description: A description of the skill.
          maxLength: 1024
        source:
          x-flatten-allOf: true
          allOf:
            - $ref: '#/components/schemas/SkillSourcePayload'
            - description: >-
                Replaces the existing source in its entirety — partial updates to individual
                source attributes are not supported. The source `type` cannot be changed after
                creation.
        labels:
          $ref: '../../../../common/definitions/konnect_properties.yaml#/components/schemas/Labels'
    ListSkillsResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        meta:
          $ref: '../../../../common/definitions/metadatas.yaml#/components/schemas/PaginatedMeta'
    SkillContentsResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: Presigned S3 URL for the skill's content.
    CreateSkillRequest:
      type: object
      required:
        - name
        - display_name
        - description
        - source
        - labels
      properties:
        name:
          type: string
          description: The machine name of the skill. Must be unique within the MCP server and must match the name declared in the frontmatter.
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          example: pdf-processing
        display_name:
          type: string
          description: The human-readable display name of the skill.
          minLength: 1
          maxLength: 120
          example: PDF Processing
        description:
          type: string
          description: A description of the skill.
          maxLength: 1024
          example: Extract and summarize content from PDF documents
        source:
          $ref: '#/components/schemas/SkillSourcePayload'
        labels:
          $ref: '../../../../common/definitions/konnect_properties.yaml#/components/schemas/Labels'
    SkillFrontmatter:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
          description: The machine name declared in the frontmatter.
        description:
          type: string
          minLength: 1
          maxLength: 1024
          description: A description of the skill declared in the frontmatter.
        license:
          type: string
          description: License name or reference to a bundled license file.
        compatibility:
          type: string
          maxLength: 500
          description: Compatibility information for the skill, indicating environment requirements such as intended product, system packages, and network access.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary key-value metadata for the skill.
        allowed_tools:
          type: string
          description: Space-separated list of pre-approved tools the skill is permitted to use.
    Skill:
      type: object
      required:
        - id
        - context_interface_id
        - name
        - display_name
        - description
        - frontmatter
        - labels
        - source
        - status
        - sync_status
        - validation_message
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the skill.
        context_interface_id:
          type: string
          format: uuid
          description: The ID of the Context Interface this skill belongs to.
        name:
          type: string
          description: The machine name of the skill.
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
        display_name:
          type: string
          description: The human-readable display name of the skill.
          minLength: 1
          maxLength: 120
        description:
          type: string
          description: A description of the skill.
          maxLength: 1024
        frontmatter:
          $ref: '#/components/schemas/SkillFrontmatter'
        labels:
          $ref: '../../../../common/definitions/konnect_properties.yaml#/components/schemas/Labels'
        source:
          $ref: '#/components/schemas/SkillSource'
        status:
          type: string
          enum: ["pending", "valid", "invalid"]
          description: >-
            The current validation status of the skill. `pending` means the content has not yet
            been read and validated.
        sync_status:
          allOf:
            - $ref: '#/components/schemas/SkillSyncStatus'
          nullable: true
          description: >-
            The outcome of the most recent attempt to fetch the skill's content from its source.
            `null` for sources whose content is supplied inline.
        validation_message:
          type: string
          nullable: true
          description: The reason the skill failed validation. `null` unless `status` is `invalid`.
          maxLength: 2048
        created_at:
          $ref: '../../../../common/definitions/properties.yaml#/components/schemas/CreatedAt'
        updated_at:
          $ref: '../../../../common/definitions/properties.yaml#/components/schemas/UpdatedAt'
    BearerCredentialSecrets:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 2048
          description: The bearer token (e.g. a GitHub personal access token). Write-only — never returned by the API.
    BearerContextProviderCredentialConfigPayload:
      type: object
      required:
        - auth_type
        - secrets
      properties:
        auth_type:
          type: string
          enum: ["bearer"]
        secrets:
          $ref: '#/components/schemas/BearerCredentialSecrets'
    ContextProviderCredentialConfigPayload:
      description: >-
        The provider-specific authentication configuration for the credential, used in create
        and update requests. The shape of `secrets` is determined by `auth_type`.
      oneOf:
        - $ref: '#/components/schemas/BearerContextProviderCredentialConfigPayload'
      discriminator:
        propertyName: auth_type
        mapping:
          bearer: '#/components/schemas/BearerContextProviderCredentialConfigPayload'
    BearerContextProviderCredentialConfig:
      type: object
      required:
        - auth_type
      properties:
        auth_type:
          type: string
          enum: ["bearer"]
    ContextProviderCredentialConfig:
      description: >-
        The provider-specific authentication configuration for the credential, as returned by
        the API. Never includes secret values — `secrets` is write-only and omitted entirely
        from every response.
      oneOf:
        - $ref: '#/components/schemas/BearerContextProviderCredentialConfig'
      discriminator:
        propertyName: auth_type
        mapping:
          bearer: '#/components/schemas/BearerContextProviderCredentialConfig'
    CreateContextProviderCredentialRequest:
      type: object
      required:
        - name
        - display_name
        - description
        - provider
        - config
      properties:
        name:
          type: string
          description: The machine name of the context provider credential. Must be unique within the organization.
          minLength: 1
          maxLength: 120
          pattern: '^[0-9a-z.-]+$'
          example: bob-github-pat
        display_name:
          type: string
          description: The human-readable display name of the context provider credential.
          minLength: 1
          maxLength: 120
          example: Bob's Github Pat
        description:
          type: string
          description: A description of the context provider credential.
          maxLength: 2048
          example: Expires on 2027-01-30
        provider:
          type: string
          enum: ["github"]
          description: The external system this credential authenticates against.
          example: github
        config:
          $ref: '#/components/schemas/ContextProviderCredentialConfigPayload'
    PatchContextProviderCredentialRequest:
      type: object
      properties:
        name:
          type: string
          description: The machine name of the context provider credential. Must be unique within the organization.
          minLength: 1
          maxLength: 120
          pattern: '^[0-9a-z.-]+$'
        display_name:
          type: string
          description: The human-readable display name of the context provider credential.
          minLength: 1
          maxLength: 120
        description:
          type: string
          description: A description of the context provider credential.
          maxLength: 2048
        config:
          description: >-
            Replaces the existing configuration in its entirety, including `secrets` — partial
            updates to individual config attributes are not supported.
          allOf:
            - $ref: '#/components/schemas/ContextProviderCredentialConfigPayload'
    ContextProviderCredential:
      type: object
      required:
        - id
        - name
        - display_name
        - description
        - provider
        - config
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier for the context provider credential.
        name:
          type: string
          description: The machine name of the context provider credential.
          minLength: 1
          maxLength: 120
          pattern: '^[0-9a-z.-]+$'
        display_name:
          type: string
          description: The human-readable display name of the context provider credential.
          minLength: 1
          maxLength: 120
        description:
          type: string
          description: A description of the context provider credential.
          maxLength: 2048
        provider:
          type: string
          enum: ["github"]
          description: The external system this credential authenticates against.
        config:
          $ref: '#/components/schemas/ContextProviderCredentialConfig'
        created_at:
          $ref: '../../../../common/definitions/properties.yaml#/components/schemas/CreatedAt'
        updated_at:
          $ref: '../../../../common/definitions/properties.yaml#/components/schemas/UpdatedAt'
    ListContextProviderCredentialsResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContextProviderCredential'
        meta:
          $ref: '../../../../common/definitions/metadatas.yaml#/components/schemas/PaginatedMeta'
