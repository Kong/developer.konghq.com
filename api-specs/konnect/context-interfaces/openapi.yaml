openapi: 3.0.0
info:
  title: Konnect Context Mesh
  version: 1.41.0
  description: The platform API for Konnect Context Mesh
  contact:
    name: Kong
    url: 'https://cloud.konghq.com'
servers:
  - url: 'https://us.api.konghq.com/v1'
    description: United-States Production region
  - url: 'https://eu.api.konghq.com/v1'
    description: Europe Production region
  - url: 'https://au.api.konghq.com/v1'
    description: Australia Production region
  - url: 'https://me.api.konghq.com/v1'
    description: Middle-East Production region
  - url: 'https://in.api.konghq.com/v1'
    description: India Production region
  - url: 'https://sg.api.konghq.com/v1'
    description: Singapore Production region
paths:
  /context-interfaces:
    get:
      operationId: list-context-interfaces
      summary: List all Context Interfaces
      description: Returns an array of Context Interfaces.
      parameters:
        - $ref: '#/components/parameters/CursorPageQuery'
        - $ref: '#/components/parameters/MCPServerFilter'
        - $ref: '#/components/parameters/MCPServerSort'
      responses:
        '200':
          $ref: '#/components/responses/ListMCPServersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - Context Interfaces
    post:
      operationId: create-context-interface
      summary: Create a Context Interface
      description: Create a Context Interface in the Konnect Organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMCPServerRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreateMCPServerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Context Interfaces
  '/context-interfaces/{interfaceId}':
    parameters:
      - $ref: '#/components/parameters/interfaceId'
    get:
      operationId: get-context-interface
      summary: Get Context Interface
      description: Returns information about an individual Context Interface.
      responses:
        '200':
          description: A response to retrieving a single Context Interface.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Context Interfaces
    put:
      operationId: update-context-interface
      summary: Update Context Interface
      description: Update an individual Context Interface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMCPServerRequest'
      responses:
        '200':
          $ref: '#/components/responses/UpdateMCPServerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Context Interfaces
    patch:
      operationId: patch-context-interface
      summary: Partially Update Context Interface
      description: Partially update an individual Context Interface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMCPServerRequest'
      responses:
        '200':
          $ref: '#/components/responses/UpdateMCPServerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Context Interfaces
    delete:
      operationId: delete-context-interface
      summary: Delete Context Interface
      description: Delete a Context Interface.
      responses:
        '204':
          description: Successfully deleted MCP server.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Context Interfaces
  '/context-sources/{sourceId}/context-interfaces':
    parameters:
      - $ref: '#/components/parameters/mcpResourceId'
    get:
      operationId: list-context-interfaces-by-context-source
      summary: List Context Source Context Interfaces
      description: |
        List Context Interfaces which are mapped by the provided Context Source ID in the path parameter
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/MCPServerFilter'
        - $ref: '#/components/parameters/MCPServerSort'
      responses:
        '200':
          $ref: '#/components/responses/PaginateMCPServersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Context Interfaces
  /context-sources:
    get:
      operationId: list-context-sources
      summary: List Context Sources
      description: Returns a list of Context Source objects.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/MCPResourceCommonFilter'
      responses:
        '200':
          description: A response to listing Context Sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMCPResourcesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - Context Sources
    post:
      operationId: create-context-source
      summary: Create a Context Source
      description: Create a Context Source in the Konnect Organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              discriminator:
                propertyName: type
                mapping:
                  api: '#/components/schemas/ApiResourcePayload'
                  mcp_server: '#/components/schemas/McpServerResourcePayload'
              oneOf:
                - $ref: '#/components/schemas/ApiResourcePayload'
                - $ref: '#/components/schemas/McpServerResourcePayload'
            examples:
              Catalog API:
                $ref: '#/components/examples/CatalogApiPayload'
              Raw API:
                $ref: '#/components/examples/RawApiPayload'
              Remote MCP Server:
                $ref: '#/components/examples/RemoteMcpServerPayload'
      responses:
        '201':
          description: A response to creating a Context Source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPResourceInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Context Sources
  '/context-sources/{sourceId}':
    parameters:
      - $ref: '#/components/parameters/mcpResourceId'
    get:
      operationId: get-context-source
      summary: Get a Context Source
      description: Retrieve an Context Source by its ID.
      responses:
        '200':
          description: A response to retrieving a Context Source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPResourceInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Context Sources
    delete:
      operationId: delete-context-source
      summary: Delete a Context Source
      description: Delete a Context Source by its ID.
      responses:
        '204':
          description: Successfully deleted Context Source.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Context Sources
    put:
      operationId: update-context-source
      summary: Update a Context Source
      description: Update a Context Source by its ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              discriminator:
                propertyName: type
                mapping:
                  api: '#/components/schemas/ApiResourcePayload'
                  mcp_server: '#/components/schemas/McpServerResourcePayload'
              oneOf:
                - $ref: '#/components/schemas/ApiResourcePayload'
                - $ref: '#/components/schemas/McpServerResourcePayload'
      responses:
        '200':
          description: A response to updating a Context Source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPResourceInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Context Sources
  '/mcp-cp/{controlPlaneId}/signals':
    parameters:
      - $ref: '#/components/parameters/controlPlaneId'
    get:
      operationId: get-mcp-server-signals
      summary: Get MCP Server Signals
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Client-initiated signals fetch with long-polling capabilities.
        The client supplies `capabilities` as a deepObject query parameter:
          - Keys are capability names (e.g. `mcp`)
          - Values contain the capability request fields (`version`)

        Example:
          GET /mcp-cp/{controlPlaneId}/signals?capabilities[mcp][version]=5

        The CP responds with a JSON payload containing zero or more signals that the client should process.
        If no signals are available, the CP responds with HTTP 304 Not Modified.
      parameters:
        - $ref: '#/components/parameters/MCPCapabilities'
      responses:
        '200':
          $ref: '#/components/responses/MCPServerSignalsResponse'
        '304':
          description: No signals available (client is up to date)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - Signaling APIs
  '/mcp-cp/{controlPlaneId}/mcp-servers':
    parameters:
      - $ref: '#/components/parameters/controlPlaneId'
    get:
      operationId: list-mcp-servers-by-control-plane
      summary: List MCP Servers by Control Plane
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Returns an array of MCP server objects for the specified control plane.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/MCPServerCommonFilter'
      responses:
        '200':
          $ref: '#/components/responses/ListMCPServersCPInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - Signaling APIs
  '/mcp-cp/{controlPlaneId}/mcp-servers/{mcpServerId}':
    parameters:
      - $ref: '#/components/parameters/controlPlaneId'
      - $ref: '#/components/parameters/mcpServerId'
    get:
      operationId: get-mcp-server-by-control-plane
      summary: Get MCP Server by Control Plane
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Retrieves an MCP server by its ID within a specific control plane context.
      responses:
        '200':
          description: A response to retrieving a single MCP server within a control plane context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServerCPInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Signaling APIs
  '/mcp-cp/{controlPlaneId}/mcp-servers/{mcpServerId}/kong-entities':
    parameters:
      - $ref: '#/components/parameters/controlPlaneId'
      - $ref: '#/components/parameters/mcpServerId'
    get:
      operationId: get-mcp-server-kong-entities
      summary: Get Kong entities for the MCP Server Gateway
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Retrieves Kong entities (Routes, Services, Plugins) for the Gateway in front of the MCP Server.
      parameters:
        - name: runtime_version
          in: query
          description: Kong Gateway runtime version to generate entities for
          required: false
          schema:
            type: string
            example: 3.13.0.0
      responses:
        '200':
          description: Kong entities for the MCP server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KongEntitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Signaling APIs
  '/mcp-cp/{controlPlaneId}/mcp-servers/{mcpServerId}/status':
    parameters:
      - $ref: '#/components/parameters/controlPlaneId'
      - $ref: '#/components/parameters/mcpServerId'
    post:
      operationId: post-mcp-server-status
      summary: Report MCP Server deployment status
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Reports the current deployment status of an MCP server, including replica counts and per-version pod statuses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPServerStatusRequest'
      responses:
        '204':
          description: Status accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Signaling APIs
  '/mcp-cp/{controlPlaneId}/mcp-servers/{mcpServerId}/code':
    parameters:
      - $ref: '#/components/parameters/controlPlaneId'
      - $ref: '#/components/parameters/mcpServerId'
    get:
      operationId: get-mcp-server-code
      summary: Get generated Python code for the MCP Server
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Generates MCP server Python code from the OpenAPI specifications associated with the MCP server.
      responses:
        '200':
          description: Generated Python code for the MCP server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServerCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Signaling APIs
  '/mcp-cp/{controlPlaneId}/mcp-servers/{mcpServerId}/skills':
    parameters:
      - $ref: '#/components/parameters/controlPlaneId'
      - $ref: '#/components/parameters/mcpServerId'
    get:
      operationId: list-mcp-server-skills-by-control-plane
      summary: List Skills by Control Plane
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Separate control-plane-scoped list endpoint for KO to enumerate skills at deploy time.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/SkillFilter'
        - $ref: '#/components/parameters/SkillSort'
      responses:
        '200':
          $ref: '#/components/responses/ListSkillsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Signaling APIs
  '/mcp-cp/{controlPlaneId}/mcp-servers/{mcpServerId}/skills/{skillId}/contents':
    parameters:
      - $ref: '#/components/parameters/controlPlaneId'
      - $ref: '#/components/parameters/mcpServerId'
      - $ref: '#/components/parameters/skillId'
    get:
      operationId: get-mcp-server-skill-contents-by-control-plane
      summary: Get Skill Contents by Control Plane
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        KO-only endpoint that redirects to a presigned S3 URL for the skill's SKILL.md file.
      responses:
        '302':
          description: Found. The `Location` header contains a presigned S3 URL for the skill's content.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Signaling APIs
  '/context-interfaces/{interfaceId}/context-source-mappings':
    parameters:
      - $ref: '#/components/parameters/interfaceId'
    post:
      operationId: create-context-interface-source-mapping
      summary: Create Context Interface Source Mapping
      description: Create a mapping between a Context Interface and a Context Source.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMCPServerMCPResourceMappingRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreateMCPServerMCPResourceMappingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Context Source Mappings
    get:
      operationId: list-context-interface-source-mappings
      summary: List Context Interface Source Mappings
      description: Returns a list of Context Interface Source Mappings for the given Context Interface.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/MCPResourceMappingFilter'
      responses:
        '200':
          $ref: '#/components/responses/ListMCPServerMCPResourceMappingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Context Source Mappings
  '/context-interfaces/{interfaceId}/context-source-mappings/{mappingId}':
    parameters:
      - $ref: '#/components/parameters/interfaceId'
      - $ref: '#/components/parameters/contextSourceMappingId'
    delete:
      operationId: delete-context-interface-source-mapping
      summary: Delete Context Interface Source Mapping
      description: Delete a mapping between a Context Interface and a Context Source.
      responses:
        '204':
          description: Successfully deleted Context Interface Source Mapping.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Context Source Mappings
    get:
      operationId: get-context-interface-source-mapping
      summary: Get Context Interface Source Mapping
      description: Retrieve a specific Context Interface Source Mapping by its ID.
      responses:
        '200':
          description: A response to retrieving a Context Interface Source Mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPServerMCPResourceMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Context Source Mappings
  '/context-interfaces/{interfaceId}/context-source-mappings/{mappingId}/capability-controls':
    parameters:
      - $ref: '#/components/parameters/interfaceId'
      - $ref: '#/components/parameters/contextSourceMappingId'
    get:
      operationId: get-context-interfaces-source-mapping-capability-controls
      summary: Get Interface-Source Capability Controls
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Retrieve the capability controls configured for a context interface-source mapping.
      responses:
        '200':
          $ref: '#/components/responses/GetMCPServerMCPResourceMappingCapabilityControlsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MCPServerMCPResourceMappingCapabilityControlsNotFound'
      tags:
        - Context Interface Capability Controls
    post:
      operationId: create-context-interfaces-source-mapping-capability-controls
      summary: Create Interface-Source Capability Controls
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Create the capability controls for a context interface-source mapping.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityControls'
      responses:
        '201':
          $ref: '#/components/responses/CreateContextInterfaceContextSourceMappingCapabilityControlsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Context Interface Capability Controls
    patch:
      operationId: patch-context-interfaces-source-mapping-capability-controls
      summary: Update Interface-Source Capability Controls
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Partially update the capability controls configured for a context interface-source mapping. Omitted deny keys preserve their existing value, an empty array clears a capability, and a non-empty array replaces.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCapabilityControls'
      responses:
        '200':
          $ref: '#/components/responses/PatchContextInterfaceContextSourceMappingCapabilityControlsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MCPServerMCPResourceMappingCapabilityControlsNotFound'
      tags:
        - Context Interface Capability Controls
  '/context-interfaces/{interfaceId}/control-plane-mappings':
    parameters:
      - $ref: '#/components/parameters/interfaceId'
    get:
      operationId: list-control-plane-mappings
      summary: Get a list of CPs mapped to Context Interface
      description: |-
        **Pre-release Endpoint**
        This endpoint is currently in beta and is subject to change.

        Get a list of all Control Planes that have been mapped to the given Context Interface.
      parameters:
        - $ref: '#/components/parameters/CursorPageQuery'
        - $ref: '#/components/parameters/MCPServerControlPlaneMappingFilter'
      responses:
        '200':
          $ref: '#/components/responses/ListMCPServerControlPlaneMappingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Control Plane Mappings
    post:
      operationId: create-context-interface-control-plane-mapping
