components:
  parameters:
    contextSourceMappingId:
      name: mappingId
      in: path
      required: true
      description: The ID of the Context Interface Source Mapping.
      schema:
        type: string
        format: uuid
    controlPlaneId:
      name: controlPlaneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: 9524ec7d-36d9-465d-a8c5-83a3c9390458
      description: The UUID of your control plane. This variable is available in the Konnect manager.
    CursorPageQuery:
      name: page
      description: Determines which page of the collection to retrieve.
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/CursorPageParameters'
    interfaceId:
      name: interfaceId
      in: path
      required: true
      description: The ID of the Context Interface.
      schema:
        type: string
        format: uuid
    MCPCapabilities:
      name: capabilities
      in: query
      style: deepObject
      explode: true
      description: |
        Capability requests as a deepObject map.
        - Keys are capability names (e.g. `mcp`).
        - Values contain the capability request fields (`version`).
      schema:
        $ref: '#/components/schemas/MCPCapabilitiesMap'
      example:
        mcp:
          version: '5'
    MCPResourceCommonFilter:
      schema:
        type: object
        properties:
          name:
            $ref: '#/components/schemas/StringFieldFilter'
      in: query
      name: filter
      description: Filters for Context Sources.
      required: false
      style: deepObject
    mcpResourceId:
      name: sourceId
      in: path
      required: true
      description: The ID of the Context Source.
      schema:
        type: string
        format: uuid
    MCPResourceMappingFilter:
      name: filter
      in: query
      required: false
      description: Filter documents returned in the response.
      style: deepObject
      schema:
        type: object
        properties:
          context_source_id:
            $ref: '#/components/schemas/UuidFieldFilter'
    MCPServerCommonFilter:
      schema:
        type: object
        properties:
          name:
            $ref: '#/components/schemas/StringFieldContainsFilter'
      in: query
      name: filter
      description: Filter documents returned in the response.
      required: false
      style: deepObject
    MCPServerControlPlaneMappingFilter:
      name: filter
      in: query
      required: false
      description: Filter control planes returned in the response.
      style: deepObject
      schema:
        type: object
        properties:
          control_plane_id:
            $ref: '#/components/schemas/UuidFieldFilter'
    mcpServerControlPlaneMappingId:
      name: mappingId
      in: path
      required: true
      description: The ID of the Context Interface - Control Plane mapping.
      schema:
        type: string
        format: uuid
    MCPServerFilter:
      schema:
        type: object
        properties:
          id:
            $ref: '#/components/schemas/UuidFieldFilter'
          name:
            $ref: '#/components/schemas/StringFieldFilter'
          display_name:
            $ref: '#/components/schemas/StringFieldFilter'
          labels:
            $ref: '#/components/schemas/LabelsFieldFilter'
      in: query
      name: filter
      description: Filter for Context Interfaces.
      required: false
      style: deepObject
    mcpServerId:
      name: mcpServerId
      in: path
      required: true
      description: The ID of the MCP server.
      schema:
        type: string
        format: uuid
    MCPServerSort:
      name: sort
      required: false
      in: query
      description: |
        Sorts a collection of Context Interfaces. Supported sort attributes are:
          - `name`
          - `created_at`
          - `updated_at`

        Default sort is `name` in ascending order.
      schema:
        $ref: '#/components/schemas/SortQuery'
    PageAfter:
      name: 'page[after]'
      description: 'Request the next page of data, starting with the item after this parameter.'
      required: false
      in: query
      allowEmptyValue: true
      schema:
        type: string
        example: ewogICJpZCI6ICJoZWxsbyB3b3JsZCIKfQ
    PageNumber:
      name: 'page[number]'
      description: Determines which page of the entities to retrieve.
      required: false
      in: query
      allowEmptyValue: true
      schema:
        type: integer
        example: 1
    PageSize:
      name: 'page[size]'
      description: The maximum number of items to include per page. The last page of a collection may include fewer items.
      required: false
      in: query
      allowEmptyValue: true
      schema:
        type: integer
        example: 10
    SkillFilter:
      name: filter
      in: query
      required: false
      description: Filter skills returned in the response.
      style: deepObject
      schema:
        type: object
        properties:
          id:
            $ref: '#/components/schemas/UuidFieldFilter'
          display_name:
            $ref: '#/components/schemas/StringFieldFilter'
    skillId:
      name: skillId
      in: path
      required: true
      description: The ID of the skill.
      schema:
        type: string
        format: uuid
    SkillSort:
      name: sort
      required: false
      in: query
      description: |
        Sorts a collection of skills. Supported sort attributes are:
          - `display_name`
          - `created_at`
          - `updated_at`

        Default sort is `display_name` in ascending order.
      schema:
        $ref: '#/components/schemas/SortQuery'
  schemas:
    MCPServerPodsStatus:
      type: object
      properties:
        ready:
          description: Number of pods in the ready state.
          type: integer
          example: 2
          minimum: 0
        starting:
          description: Number of pods in the starting state.
          type: integer
          example: 0
          minimum: 0
        failing:
          description: Number of pods in the failing state.
          type: integer
          example: 0
          minimum: 0
      required:
        - ready
        - starting
        - failing
    MCPServerVersionStatus:
      type: object
      properties:
        version:
          description: The version identifier of the MCP server deployment.
          type: string
          example: v1
        desired_replicas:
          description: The desired number of replicas for this version.
          type: integer
          example: 2
          minimum: 0
        created_replicas:
          description: The number of replicas that have been created for this version.
          type: integer
          example: 2
          minimum: 0
        pods_status:
          $ref: '#/components/schemas/MCPServerPodsStatus'
      required:
        - version
        - desired_replicas
        - created_replicas
        - pods_status
    MCPServerStatusRequest:
      description: |
        List of per-version deployment statuses for the MCP server.
      type: array
      items:
        $ref: '#/components/schemas/MCPServerVersionStatus'
    MCPServer:
      type: object
      properties:
        id:
          description: The unique identifier for the Context Interface.
          type: string
          format: uuid
        name:
          description: The machine name of the Context Interface.
          type: string
          maxLength: 256
          minLength: 1
        display_name:
          description: The human-readable display name of the Context Interface.
          type: string
          maxLength: 120
          minLength: 1
        description:
          description: A description of the Context Interface.
          type: string
          maxLength: 1024
          nullable: true
        labels:
          $ref: '#/components/schemas/Labels'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
      required:
        - id
        - name
        - display_name
        - description
        - labels
        - created_at
        - updated_at
    MCPServerInfo:
      type: object
      properties:
        id:
          description: The unique identifier for the MCP server.
          type: string
          format: uuid
        name:
          description: The name of the MCP server.
          type: string
          maxLength: 256
          minLength: 1
        description:
          description: A description of the MCP server.
          type: string
          maxLength: 1024
        labels:
          description: Labels for the MCP server.
          type: object
          additionalProperties:
            type: string
        deployed_at:
          description: The timestamp when the MCP server was deployed.
          type: string
          format: date-time
        control_plane_id:
          description: The control plane ID associated with the MCP server.
          type: string
          format: uuid
          nullable: true
        resource_id:
          description: The MCP resource ID associated with the MCP server.
          type: string
          format: uuid
          nullable: true
        mode:
          description: |
            The deployment mode of the MCP server on the associated Control Plane.
          allOf:
            - $ref: '#/components/schemas/MCPServerControlPlaneMappingMode'
          nullable: false
        version:
          description: The version of the MCP server.
          type: string
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
      required:
        - id
        - name
        - created_at
        - updated_at
        - version
    ContainerSpec:
      type: object
      properties:
        image:
          description: The container image to use.
          type: string
    MCPServerCPInfo:
      allOf:
        - $ref: '#/components/schemas/MCPServerInfo'
        - type: object
          properties:
            container:
              allOf:
                - $ref: '#/components/schemas/ContainerSpec'
                - description: Configuration for the main container.
            init_container:
              allOf:
                - $ref: '#/components/schemas/ContainerSpec'
                - description: Configuration for the init container.
    CreateMCPServerRequest:
      type: object
      properties:
        name:
          description: The machine name of the Context Interface.
          type: string
          maxLength: 256
          minLength: 1
        display_name:
          description: The human-readable display name of the Context Interface.
          type: string
          maxLength: 120
          minLength: 1
        description:
          description: A description of the Context Interface.
          type: string
          maxLength: 1024
        labels:
          $ref: '#/components/schemas/Labels'
      required:
        - name
        - display_name
        - description
        - labels
