components:
  parameters:
    MCPServerCommonFilter:
      schema:
        type: object
        properties:
          name:
            $ref: '../../../../common/definitions/aip_filters.yaml#/components/schemas/StringFieldContainsFilter'
      in: query
      name: filter
      description: Filter documents returned in the response.
      required: false
      style: deepObject
    MCPServerFilter:
      schema:
        type: object
        properties:
          id:
            $ref: '../../../../common/definitions/aip_filters.yaml#/components/schemas/UuidFieldFilter'
          name:
            $ref: '../../../../common/definitions/aip_filters.yaml#/components/schemas/StringFieldFilter'
          display_name:
            $ref: '../../../../common/definitions/aip_filters.yaml#/components/schemas/StringFieldFilter'
          labels:
            $ref: "../../../../common/definitions/aip_filters.yaml#/components/schemas/LabelsFieldFilter"
      in: query
      name: filter
      description: Filter for Context Interfaces.
      required: false
      style: deepObject
    MCPServerSort:
      name: sort
      required: false
      in: query
      description: |
        Sorts a collection of Context Interfaces. Supported sort attributes are:
          - `name`
          - `created_at`
          - `updated_at`

        Default sort is `name` in ascending order.
      schema:
        $ref: "../../../../common/definitions/aip_filters.yaml#/components/schemas/SortQuery"
    SkillFilter:
      name: filter
      in: query
      required: false
      description: Filter skills returned in the response.
      style: deepObject
      schema:
        type: object
        properties:
          id:
            $ref: '../../../../common/definitions/aip_filters.yaml#/components/schemas/UuidFieldFilter'
          display_name:
            $ref: '../../../../common/definitions/aip_filters.yaml#/components/schemas/StringFieldFilter'
    SkillSort:
      name: sort
      required: false
      in: query
      description: |
        Sorts a collection of skills. Supported sort attributes are:
          - `display_name`
          - `created_at`
          - `updated_at`

        Default sort is `display_name` in ascending order.
      schema:
        $ref: "../../../../common/definitions/aip_filters.yaml#/components/schemas/SortQuery"
    MCPResourceCommonFilter:
      schema:
        type: object
        properties:
          name:
            $ref: '../../../../common/definitions/aip_filters.yaml#/components/schemas/StringFieldFilter'
      in: query
      name: filter
      description: Filters for Context Sources.
      required: false
      style: deepObject
    mcpServerId:
      name: mcpServerId
      in: path
      required: true
      description: The ID of the MCP server.
      schema:
        type: string
        format: uuid
    interfaceId:
      name: interfaceId
      in: path
      required: true
      description: The ID of the Context Interface.
      schema:
        type: string
        format: uuid
    mcpServerToolId:
      name: toolId
      in: path
      required: true
      description: The ID of the MCP server tool.
      schema:
        type: string
        format: uuid
    skillId:
      name: skillId
      in: path
      required: true
      description: The ID of the skill.
      schema:
        type: string
        format: uuid
