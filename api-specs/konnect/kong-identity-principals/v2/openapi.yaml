      description: |
        The system account access token is meant for automations and integrations that are not directly associated with a human identity.
        You can generate a system account Access Token by creating a system account and then obtaining a system account access token for that account.
        The access token must be passed in the header of a request, for example:
        `curl -X GET 'https://global.api.konghq.com/v2/users/' --header 'Authorization: Bearer spat_i2Ej...'`
    personalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: |
        The personal access token is meant to be used as an alternative to basic-auth when accessing Konnect via APIs.
        You can generate a Personal Access Token (PAT) from the [personal access token page](https://cloud.konghq.com/global/account/tokens/) in the Konnect dashboard.
        The PAT token must be passed in the header of a request, for example:
        `curl -X GET 'https://global.api.konghq.com/v2/users/' --header 'Authorization: Bearer kpat_xgfT...'`
    konnectAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The Konnect access token is meant to be used by the Konnect dashboard and the decK CLI authenticate with.
tags:
  - name: Kong Identity Directories
    description: |
      Use a directory to group consumers around an identity, defined by organizational boundaries,
      such as a production directory or a development directory. Directories are connected to a
      [geographic region](https://docs.konghq.com/konnect/geo/) in Konnect. Centrally managed consumers defined in
      directories can be used across multiple control planes.
  - name: KongPrincipal
    description: |
      Principals represent identities within a directory that can be authenticated and authorized.
      Each principal can have associated metadata and API keys for authentication purposes.
  - name: KongPrincipalCredential
    description: |
      Credentials are authentication secrets associated with principals. Supported credential types are
      API keys (system-generated or imported) and basic auth username/password pairs.
  - name: KongPrincipalIdentity
    description: |
      Identities represent external authentication associations for a principal. Each identity links a principal
      to an external system such as an OIDC provider, an auth server client, a control plane consumer, or a custom identifier.
security:
  - systemAccountAccessToken: []
  - personalAccessToken: []
  - konnectAccessToken: []