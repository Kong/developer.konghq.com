    RealmTTL:
      description: |
        The time in minutes that the Consumer will be cached in memory on a running Gateway if it is
        successfully loaded from Konnect.
      type: integer
      default: 10
      minimum: 5
    NegativeTTL:
      description: |
        If a running Gateway triggers a lookup for a Consumer that cannot be authenticated this realm, a `negative_ttl`
        is set. The Gateway will not try to lookup the Consumer in Konnect for `negative_ttl` minutes.

        A Consumer will be cached for `negative_ttl` if they do not exist in the Realm, or if the provided credentials
        are invalid.
      type: integer
      default: 10
      minimum: 5
    RealmConsumerGroups:
      description: |
        A list of consumer groups to automatically add to any consumers created within this Realm.
        If `consumer_groups` are provided on the Consumer object _and_ on the Realm, the Consumer will be placed in all defined consumer groups.
      type: array
      items:
        type: string
        uniqueItems: true
      format: set
      title: RealmConsumerGroups
    StringFieldEqualsFilter:
      description: Filters on the given string field value by exact match.
      properties:
        eq:
          type: string
      title: StringFieldEqualsFilter
      x-examples:
        example-1: equals-some-value
        example-2:
          eq: some-value
    LegacyStringFieldFilter:
      description: 'Filter using **one** of the following operators: `eq`, `contains`'
      type: object
      properties:
        eq:
          description: The field exactly matches the provided value.
          type: string
          example: '?filter[field_name_here][eq]=foo'
        contains:
          description: The field contains the provided value.
          type: string
          example: '?filter[field_name_here][contains]=foo'
      additionalProperties: false
      x-examples:
        example-1:
          contains: some-value
        example-2:
          eq: some-value
    KongIdentityMetadata:
      description: |
        A map of metadata key-value pairs associated with this entity. This metadata is passed to the data plane 
        to enrich the execution context. During authentication, metadata is inherited and overridden in a hierarchical 
        manner: Directory metadata is inherited by Principals, which is then inherited and overridden by Credentials.
      type: object
      additionalProperties:
        oneOf:
          - type: boolean
          - type: string
          - type: integer
          - type: array
            items:
              type: string
            minItems: 0
            maxItems: 255
            uniqueItems: true
          - type: array
            items:
              type: integer
            minItems: 0
            maxItems: 255
            uniqueItems: true
      maxProperties: 50
      minProperties: 0
      nullable: true
    ProvisionedBy:
      description: 'Identifies the actor that provisioned this principal. Defaults to `konnect_user` for principals created directly by a user; other values identify a service that provisioned the principal on a user''s behalf (for example, `developer_portal`).'
      type: string
      default: konnect_user
      enum:
        - konnect_user
        - developer_portal
      readOnly: true
    ManagedByUpdate:
      description: |
        Stores information about what manages this entity, such as the tool or system responsible for its lifecycle (for example, `terraform`).

        Set a key's value to `null` to remove it.

        Keys must be 1–63 characters long and start with an alphanumeric character.
      type: object
      example:
        owner: terraform
      additionalProperties:
        type: string
        pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
        minLength: 1
        maxLength: 63
        nullable: true
      maxProperties: 5
      title: ManagedByUpdate
      writeOnly: true
    StringFieldOEQFilter:
