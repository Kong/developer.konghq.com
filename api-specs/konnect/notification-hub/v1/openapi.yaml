openapi: 3.0.2
info:
  title: Konnect Notification Hub
  version: 1.1.2
  description: Notification Hub API for Konnect.
  contact:
    name: Kong
    url: 'https://konghq.com'
  x-oas-source: kong/platform-api@e7f5acaf6d03a4ed99fffd47021d46d3d0c5c568
  x-oas-source-link: 'https://github.com/Kong/platform-api/commit/e7f5acaf6d03a4ed99fffd47021d46d3d0c5c568'
servers:
  - url: 'https://global.api.konghq.com/v1'
    description: Global Base URL
paths:
  /notifications/inbox:
    get:
      operationId: list-notifications
      summary: List available notifications
      description: List available notifications.
      parameters:
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/NotificationFilter'
      responses:
        '200':
          $ref: '#/components/responses/NotificationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - Notifications
  '/notifications/inbox/{notificationId}':
    get:
      operationId: get-notification-details
      summary: Get notification details
      description: Get notification details.
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '200':
          $ref: '#/components/responses/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Notifications
    patch:
      operationId: update-notification
      summary: Update notification
      description: Update notification.
      parameters:
        - $ref: '#/components/parameters/notificationId'
      requestBody:
        $ref: '#/components/requestBodies/NotificationUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/NotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Notifications
    delete:
      operationId: delete-notification
      summary: Delete notification
      description: Delete notification.
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Notifications
  /notifications/inbox/bulk:
    post:
      operationId: bulk-notifications
      summary: Mark a list of notifications to a status
      description: Mark a list of notifications to a status.
      requestBody:
        $ref: '#/components/requestBodies/BulkRequest'
      responses:
        '200':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Notifications
  /notifications/configurations:
    get:
      operationId: list-user-configurations
      summary: List available user configurations
      description: 'List the events that the user can configure. An org scoped event that has no user channel is not part of this list: see list-org-configurations.'
      parameters:
        - $ref: '#/components/parameters/ConfigurationFilter'
      responses:
        '200':
          $ref: '#/components/responses/UserConfigurationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - Notifications
  '/notifications/configurations/{eventId}/subscriptions':
    get:
      operationId: list-event-subscriptions
      summary: List event subscriptions
      description: List event subscriptions.
      parameters:
        - $ref: '#/components/parameters/eventId'
      responses:
        '200':
          $ref: '#/components/responses/EventSubscriptionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Notifications
    post:
      operationId: create-event-subscription
      summary: Create a new subscription for an event
      description: Create a new user scoped subscription for an event. A user subscription accepts the IN_APP and EMAIL channels only. A request with another channel answers 400. The http channel is available for org scoped notifications only.
      parameters:
        - $ref: '#/components/parameters/eventId'
      requestBody:
        $ref: '#/components/requestBodies/EventSubscriptionRequest'
      responses:
        '201':
          $ref: '#/components/responses/EventSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Notifications
  '/notifications/configurations/{eventId}/subscriptions/{subscriptionId}':
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/subscriptionId'
    get:
      operationId: get-event-subscription
      summary: Get subscription for an event
      description: Get subscription for an event.
      responses:
        '200':
          $ref: '#/components/responses/EventSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Notifications
    patch:
      operationId: update-event-subscription
      summary: Update subscription for an event
      description: Update a user scoped subscription for an event. A user subscription accepts the IN_APP and EMAIL channels only. A request with another channel answers 400.
      requestBody:
        $ref: '#/components/requestBodies/EventSubscriptionRequest'
      responses:
        '200':
          $ref: '#/components/responses/EventSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Notifications
    delete:
      operationId: delete-event-subscription
      summary: Delete subscription associated with event
      description: Delete subscription associated with event.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Notifications
  /notifications/configurations/organization:
    get:
      operationId: list-org-configurations
      summary: List available org events
      description: |-
        Returns the organization event types that you can subscribe to, with each event's title, description, and namespace.
        Only available to organization administrators.
      responses:
        '200':
          $ref: '#/components/responses/OrgConfigurationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - Org Configurations
  '/notifications/configurations/organization/{eventId}/subscriptions':
    parameters:
      - $ref: '#/components/parameters/eventId'
    get:
      operationId: list-org-subscriptions
      summary: List org subscriptions
      description: |-
        List existing organization subscriptions, including the subscription destinations.
        Only available to organization administrators.
      parameters:
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/PageAfter'
      responses:
        '200':
          $ref: '#/components/responses/OrgSubscriptionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Org Configurations
    post:
      operationId: create-org-subscription
      summary: Create an org subscription
      description: |-
        Create a subscription for an org scoped event.
        The event ID to subscribe is placed in the URL. A destination may be used in multiple subscriptions.
        Only available to organization administrators.
      requestBody:
        $ref: '#/components/requestBodies/OrgSubscriptionCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/OrgSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Org Configurations
  '/notifications/configurations/organization/{eventId}/subscriptions/{subscriptionId}':
    parameters:
      - $ref: '#/components/parameters/eventId'
      - $ref: '#/components/parameters/orgSubscriptionId'
    get:
      operationId: get-org-subscription
      summary: Get an org subscription
      description: |-
        Fetch the details of a single org scoped subscription.
        Only available to organization administrators.
      responses:
        '200':
          $ref: '#/components/responses/OrgSubscriptionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Org Configurations
    patch:
      operationId: update-org-subscription
      summary: Update an org subscription
      description: |-
        Update the details of an org scoped subscription.
        Only available to organization administrators.
      requestBody:
        $ref: '#/components/requestBodies/OrgSubscriptionUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/OrgSubscriptionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Org Configurations
    delete:
      operationId: delete-org-subscription
      summary: Delete an org subscription
      description: |-
        Delete an org scoped subscription.
        Only available to organization administrators.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Org Configurations
  /notifications/destinations:
    get:
      operationId: list-destinations
      summary: List destinations
      description: 'Returns the organization''s destinations, with the newest destinations first. Use the event type filter to list destinations with an enabled subscription for a specific event type.'
      parameters:
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/DestinationFilter'
      responses:
        '200':
          $ref: '#/components/responses/DestinationListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - Destinations
    post:
      operationId: create-destination
      summary: Create a destination
      description: |-
        Creates an HTTP destination for organization event notifications. You can create up to 50 destinations for an organization.
        The response includes the signing secret. Save it when you create the destination; later responses do not include it.
      requestBody:
        $ref: '#/components/requestBodies/DestinationCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/DestinationWithSecretResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Destinations
  '/notifications/destinations/{destinationId}':
    parameters:
      - $ref: '#/components/parameters/destinationId'
    get:
      operationId: get-destination
      summary: Get a destination
      description: Show a destination's details. Does not return sensitive keys such as signing secret.
      responses:
        '200':
          $ref: '#/components/responses/DestinationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Destinations
    patch:
      operationId: update-destination
      summary: Update a destination
      description: Update a destination's parameters
      requestBody:
        $ref: '#/components/requestBodies/DestinationUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/DestinationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Destinations
    delete:
      operationId: delete-destination
      summary: Delete a destination
      description: |-
        Deletes the destination and removes it from all subscriptions that use it.
        If this leaves a subscription with no destinations, that subscription is also deleted.
        This action also deletes the destination's signing keys and delivery history. You cannot undo this action.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Destinations
  '/notifications/destinations/{destinationId}/test':
    post:
      operationId: test-destination
      summary: Test a destination
      description: |-
        Trigger a test delivery to a destination. The test outcome is returned in the "Delivery history" endpoint.
        Tests may be triggered every 5 seconds.
      parameters:
        - $ref: '#/components/parameters/destinationId'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
        - Destinations
  '/notifications/destinations/{destinationId}/secret/rotate':
    post:
      operationId: rotate-destination-secret
      summary: Rotate the destination signing secret
      description: Creates a new signing secret for the HTTP destination. The response includes the new secret only once. The previous secret remains valid for 24 hours so you can update your integration.
      parameters:
        - $ref: '#/components/parameters/destinationId'
      responses:
        '200':
          $ref: '#/components/responses/DestinationSecretResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      tags:
        - Destinations
  '/notifications/destinations/{destinationId}/deliveries/{deliveryId}':
    get:
      operationId: get-destination-delivery
      summary: Get a delivery and its attempts
      description: 'Show a notification''s delivery status, including information about each delivery attempt.'
      parameters:
        - $ref: '#/components/parameters/destinationId'
        - $ref: '#/components/parameters/deliveryId'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Destinations
  '/notifications/destinations/{destinationId}/deliveries/{deliveryId}/resend':
    post:
      operationId: resend-destination-delivery
      summary: Resend a delivery
      description: |-
        Trigger a redelivery of a failed notification. The redelivery has a new delivery ID in the "Delivery history" endpoint.
        The payload is identical to the original delivery, including the `event_id` which can be used to deduplicate notifications.
      parameters:
        - $ref: '#/components/parameters/destinationId'
        - $ref: '#/components/parameters/deliveryId'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      tags:
        - Destinations
  '/notifications/destinations/{destinationId}/subscriptions':
    get:
      operationId: list-destination-subscriptions
      summary: List destination subscriptions
      description: Returns the organization's subscriptions that use this destination.
      parameters:
        - $ref: '#/components/parameters/destinationId'
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/PageAfter'
      responses:
        '200':
          $ref: '#/components/responses/OrgSubscriptionListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
        - Destinations
  /notifications/deliveries:
    get:
      operationId: list-deliveries
      summary: List delivery history
      description: 'List the deliveries for all destinations in this organization. To filter to a specific destination, use `filter[destination_id][eq]`'
      parameters:
        - $ref: '#/components/parameters/PageBefore'
        - $ref: '#/components/parameters/PageAfter'
        - $ref: '#/components/parameters/OrgDeliveryFilter'
      responses:
        '200':
          $ref: '#/components/responses/DeliveryListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      tags:
        - Destinations
components:
  parameters:
    ConfigurationFilter:
      name: filter
      description: Filters a collection of configurations.
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/ConfigurationFilterParameters'
      style: deepObject
    deliveryId:
      name: deliveryId
      in: path
      required: true
      description: 'ID of the delivery, a UUID v7.'
      schema:
        type: string
        format: uuid
    DestinationFilter:
      name: filter
      description: 'Filters a collection of destinations. filter[event_type] returns the destinations with an enabled org subscription to that event type.'
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/DestinationFilterParameters'
      style: deepObject
    destinationId:
      name: destinationId
      in: path
      required: true
      description: 'ID of the http destination, a UUID v7.'
      schema:
        type: string
        format: uuid
    eventId:
      name: eventId
      in: path
      required: true
      description: Formatted string ID of the notification event.
      schema:
        type: string
        example: invoice-ready
    NotificationFilter:
      name: filter
      description: Filters a collection of notifications.
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/NotificationFilterParameters'
      style: deepObject
    notificationId:
      name: notificationId
      in: path
      required: true
      description: ID of the notification.
      schema:
        type: string
    OrgDeliveryFilter:
      name: filter
      description: 'Filters the deliveries of the organization. filter[destination_id] returns the deliveries of that destination.'
      required: false
      in: query
      schema:
        $ref: '#/components/schemas/OrgDeliveryFilterParameters'
      style: deepObject
    orgSubscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: 'ID of the org subscription, a UUID v7.'
      schema:
        type: string
        format: uuid
    PageAfter:
      name: 'page[after]'
      description: 'Request the next page of data, starting with the item after this parameter.'
      required: false
      in: query
      allowEmptyValue: true
      schema:
        type: string
        example: ewogICJpZCI6ICJoZWxsbyB3b3JsZCIKfQ
    PageBefore:
      name: 'page[before]'
      description: 'Request the next page of data, starting with the item before this parameter.'
      required: false
      in: query
      allowEmptyValue: true
      schema:
        type: string
        example: ewogICJpZCI6ICJoZWxsbyB3b3JsZCIKfQ
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: Subscription ID of the user configuration.
      schema:
        type: string
  schemas:
    ListCursorMeta:
      anyOf:
        - $ref: '#/components/schemas/CursorMeta'
        - allOf:
            - $ref: '#/components/schemas/CursorMetaPage'
          deprecated: true
    NotificationFilterParameters:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
        description:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
        namespace:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
        region:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
        status:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
      additionalProperties: false
      title: NotificationFilterParameters
    ConfigurationFilterParameters:
      type: object
      properties:
        event_title:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
        event_description:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
        event_namespace:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
        region:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
      additionalProperties: false
      title: ConfigurationFilterParameters
    DestinationFilterParameters:
      type: object
      properties:
        event_type:
          $ref: '#/components/schemas/StringFieldEqualsFilter'
      additionalProperties: false
      title: DestinationFilterParameters
    OrgDeliveryFilterParameters:
      type: object
      properties:
        destination_id:
          $ref: '#/components/schemas/StringFieldEqualsFilter'
        event_type:
          $ref: '#/components/schemas/LegacyStringFieldFilter'
        status:
          $ref: '#/components/schemas/StatusFieldFilter'
      additionalProperties: false
      title: OrgDeliveryFilterParameters
    StatusFieldFilter:
      description: 'Filter using **one** of the following operators: `eq`, `neq`, `contains`'
      type: object
      properties:
        eq:
          description: The field exactly matches the provided value.
          type: string
          example: '?filter[status][eq]=failed'
        neq:
          description: The field does not match the provided value.
          type: string
          example: '?filter[status][neq]=failed'
        contains:
          description: The field contains the provided value.
          type: string
          example: '?filter[status][contains]=fail'
      additionalProperties: false
    DestinationState:
      description: Destination status. pending_verification means the destination is waiting for verification; enabled means it can receive notifications; disabled means it is paused; disabled_system means it was disabled automatically.
      type: string
      enum:
        - pending_verification
        - enabled
        - disabled
        - disabled_system
    DestinationSigningAlgo:
      description: Signing algorithm of the signing key.
      type: string
      enum:
        - hmac-sha256
        - ed25519
    DestinationCreatePayload:
      discriminator:
        propertyName: type
        mapping:
          http: '#/components/schemas/HttpDestinationCreatePayload'
      oneOf:
        - $ref: '#/components/schemas/HttpDestinationCreatePayload'
    HttpDestinationCreatePayload:
      type: object
      properties:
        name:
          description: Destination name. The name must contain 1 to 255 characters after leading and trailing spaces are removed.
          type: string
        type:
          type: string
          enum:
            - http
        url:
          description: |-
            Full URL of the endpoint that receives notifications.
            Must be a publicly resolvable address.
          type: string
          maxLength: 2048
          x-go-type-skip-optional-pointer: true
        custom_headers:
          description: |-
            Custom headers to include in notification requests. You can set up to 10 headers.
            The Standard Webhooks headers and the transport headers are reserved.
          type: object
          additionalProperties:
            type: string
      example:
        name: Production webhooks
        type: http
        url: 'https://example.com/webhooks'
        custom_headers:
          X-Environment: production
      additionalProperties: false
      required:
        - name
        - type
        - url
    DestinationUpdatePayload:
