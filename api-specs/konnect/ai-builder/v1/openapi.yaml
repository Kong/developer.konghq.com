          type: string
          example: body
      additionalProperties: false
      required:
        - field
        - rule
        - reason
        - dependents
    InvalidParameters:
      description: invalid parameters
      type: array
      items:
        oneOf:
          - $ref: '#/components/schemas/InvalidParameterStandard'
          - $ref: '#/components/schemas/InvalidParameterMinimumLength'
          - $ref: '#/components/schemas/InvalidParameterMaximumLength'
          - $ref: '#/components/schemas/InvalidParameterChoiceItem'
          - $ref: '#/components/schemas/InvalidParameterDependentItem'
      minItems: 1
      nullable: false
      uniqueItems: true
    BadRequestError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
        - type: object
          required:
            - invalid_parameters
          properties:
            invalid_parameters:
              $ref: '#/components/schemas/InvalidParameters'
    UnauthorizedError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
        - type: object
          properties:
            status:
              example: 401
            title:
              example: Unauthorized
            type:
              example: 'https://httpstatuses.com/401'
            instance:
              example: 'kong:trace:1234567890'
            detail:
              example: Invalid credentials
    ForbiddenError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
        - type: object
          properties:
            status:
              example: 403
            title:
              example: Forbidden
            type:
              example: 'https://httpstatuses.com/403'
            instance:
              example: 'kong:trace:1234567890'
            detail:
              example: Forbidden
    ConflictError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
        - type: object
          properties:
            status:
              example: 409
            title:
              example: Conflict
            type:
              example: 'https://httpstatuses.com/409'
            instance:
              example: 'kong:trace:1234567890'
            detail:
              example: Conflict
    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/BaseError'
        - type: object
          properties:
            status:
              example: 404
            title:
              example: Not Found
            type:
              example: 'https://httpstatuses.com/404'
            instance:
              example: 'kong:trace:1234567890'
            detail:
              example: Not found
    LabelsUpdate:
      description: |
        Labels store metadata of an entity that can be used for filtering an entity list or for searching across entity types. 

        Labels are intended to store **INTERNAL** metadata.

        Keys must be of length 1-63 characters, and cannot start with "kong", "konnect", "mesh", "kic", or "_".
      type: object
      example:
        env: test
      additionalProperties:
        type: string
        pattern: '^[a-z0-9A-Z]{1}([a-z0-9A-Z-._]*[a-z0-9A-Z]+)?$'
        minLength: 1
        maxLength: 63
        nullable: true
      maxProperties: 50
      nullable: true
      writeOnly: true
    MCPInput:
      type: object
      properties:
        description:
          description: A description of the input.
          type: string
        is_required:
          type: boolean
          default: false
        format:
          description: Specifies the input format.
          type: string
          default: string
          enum:
            - string
            - number
            - boolean
            - filepath
        value:
          description: The value for the input.
          type: string
        is_secret:
          description: Indicates whether the input is a secret value.
          type: boolean
          default: false
        default:
          description: The default value for the input.
          type: string
        placeholder:
          description: A placeholder for the input to be displayed during configuration.
          type: string
        choices:
          description: A list of possible values for the input.
          type: array
          items:
            type: string
          example: []
      title: MCPInput
    MCPInputWithVariables:
      allOf:
        - $ref: '#/components/schemas/MCPInput'
        - type: object
          properties:
            variables:
              description: A map of variable names to their values.
              type: object
              additionalProperties:
                $ref: '#/components/schemas/MCPInput'
      title: MCPInputWithVariables
    MCPKeyValueInput:
      allOf:
        - $ref: '#/components/schemas/MCPInputWithVariables'
        - type: object
          required:
            - name
          properties:
            name:
              description: Name of the header or environment variable.
              type: string
              example: SOME_VARIABLE
      title: MCPKeyValueInput
    MCPStreamableHttpTransport:
      type: object
      properties:
        type:
          description: Transport type
          type: string
          example: streamable-http
          enum:
            - streamable-http
        url:
          description: URL template for the streamable-http transport.
          type: string
          example: 'https://api.example.com/mcp'
          pattern: '^https?://[^\s]+$'
        headers:
          description: HTTP headers to include
          type: array
          items:
            $ref: '#/components/schemas/MCPKeyValueInput'
      example:
        type: streamable-http
        url: 'https://api.example.com/mcp'
      required:
        - type
        - url
      title: MCPStreamableHttpTransport
    MCPSseTransport:
      type: object
      properties:
        type:
          description: Transport type
          type: string
          example: sse
          enum:
            - sse
        url:
          description: Server-Sent Events endpoint URL template.
          type: string
          example: 'https://mcp-fs.example.com/sse'
          pattern: '^https?://[^\s]+$'
        headers:
          description: HTTP headers to include
          type: array
          items:
            $ref: '#/components/schemas/MCPKeyValueInput'
      example:
        type: sse
        url: 'https://mcp-fs.example.com/sse'
      required:
        - type
        - url
      title: MCPSseTransport
    MCPRemoteTransport:
      description: Transport protocol configuration for remote context
      allOf:
        - anyOf:
            - $ref: '#/components/schemas/MCPStreamableHttpTransport'
            - $ref: '#/components/schemas/MCPSseTransport'
        - type: object
          properties:
            variables:
              description: 'Configuration variables that can be referenced in URL template {curly_braces}.'
              type: object
              additionalProperties:
                $ref: '#/components/schemas/MCPInput'
      title: MCPRemoteTransport
    MCPStdioTransport:
      type: object
      properties:
        type:
          description: Transport type
          type: string
          example: stdio
          enum:
            - stdio
      example:
        type: stdio
      required:
        - type
      title: MCPStdioTransport
    MCPTransport:
      description: Transport protocol configuration for local/package context
      anyOf:
        - $ref: '#/components/schemas/MCPStdioTransport'
        - $ref: '#/components/schemas/MCPStreamableHttpTransport'
        - $ref: '#/components/schemas/MCPSseTransport'
      title: MCPTransport
    MCPPositionalArgument:
      description: A positional input is a value inserted verbatim into the command line.
      example:
        type: positional
        value_hint: file_path
      allOf:
        - $ref: '#/components/schemas/MCPInputWithVariables'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              example: positional
              enum:
                - positional
            value_hint:
              description: An identifier for the positional argument.
              type: string
              example: file_path
            is_repeated:
              description: Whether the argument can be repeated multiple times.
              type: boolean
              default: false
        - anyOf:
            - type: object
              required:
                - value_hint
            - type: object
              required:
                - value
      title: MCPPositionalArgument
    MCPNamedArgument:
      description: 'A command-line `--flag={value}`.'
      example:
        type: named
        name: '--port'
      allOf:
        - $ref: '#/components/schemas/MCPInputWithVariables'
        - type: object
          required:
            - type
            - name
          properties:
            type:
              type: string
              example: named
              enum:
                - named
            name:
              description: 'The flag name, including any leading dashes.'
              type: string
              example: '--port'
            is_repeated:
              description: Whether the argument can be repeated multiple times.
              type: boolean
              default: false
      title: MCPNamedArgument
    MCPArgument:
      anyOf:
        - $ref: '#/components/schemas/MCPPositionalArgument'
        - $ref: '#/components/schemas/MCPNamedArgument'
      title: MCPArgument
    MCPPackage:
      type: object
      properties:
        registry:
          description: Package registry details
          type: object
          properties:
            type:
              description: 'Registry type indicating how to download packages (e.g., ''npm'', ''pypi'', ''oci'', ''nuget'', ''mcpb'')'
              type: string
              example: npm
            base_url:
              description: Base URL of the package registry
              type: string
              format: uri
              example: 'https://registry.npmjs.org'
          required:
            - type
        identifier:
          description: Package identifier — either a package name or URL
          type: string
          example: '@modelcontextprotocol/server-brave-search'
        version:
          description: Package version. Must be a specific version.
          type: string
          example: 1.0.2
          minLength: 1
          not:
            enum:
              - latest
        file_sha256:
          description: SHA-256 hash of the package file for integrity verification.
          type: string
          example: fe333e598595000ae021bd27117db32ec69af6987f507ba7a63c90638ff633ce
          pattern: '^[a-f0-9]{64}$'
        transport:
          allOf:
            - $ref: '#/components/schemas/MCPTransport'
            - description: Transport protocol configuration for the package
        runtime:
          description: Runtime configuration for executing the package
          type: object
          properties:
            hint:
              description: A hint to help clients determine the appropriate runtime for the package.
              type: string
              example: npx
            arguments:
