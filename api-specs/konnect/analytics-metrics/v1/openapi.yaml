openapi: 3.0.2
info:
  title: Konnect Metrics Endpoint
  description: |
    Konnect endpoint for extracting and computing metrics, similar to the data that is used to build graphs in Konnect Advanced Analytics. This endpoint is used to query the Advanced Analytics platform for aggregated metrics down to ten seconds for recent data. Data can be requested to group by any 2 dimensions, up to 3 metrics and any number of filter conditions in 1 query.

    Important Considerations:
    - This endpoint is only available for Konnect Advanced Analytics.
    - The time range for the query must be within the last 32 days, otherwise a 400 error will be returned.
    - The time range you request may be adjusted slightly to avoid returning buckets that contain only partial information. For instance:
        - You request data for the last 24 hours with hourly intervals.
        - The current time is Tuesday at 10:40 AM.
        - The query will return data starting from Monday at 10:00 AM up to Tuesday at 10:40 AM.
        - The returned data will include complete hourly buckets (10:00 AM, 11:00 AM, etc.), but the last hour for Tuesday at 10:00 AM will only contain 40 minutes of data since it’s not yet complete. This means the total duration is actually 24 hours and 40 minutes.
        - The exact start and end times can be found in the results under `meta.start` and `meta.end`.
    - For queries that use the time dimension, the granularity of the result may be coarser than requested. The finest allowed granularity depends on the query's time range: data farther in the past may have coarser granularity. The exact result granularity will be reported in the response `meta.granularity_ms` field.
    - Queries must complete within 10 seconds. If a query takes longer than 10 seconds, a 408 will be returned. In this case, it is suggested to add more filters, and/or reduce the time range.
    - This endpoint is rate limited to 10 requests per minute per user.
  version: 4.2.0
  contact:
    name: Kong
    url: 'https://cloud.konghq.com'
  x-oas-source: kong/platform-api@e9225277ad20f1068555baeabe5c9aa67444a940
  x-oas-source-link: 'https://github.com/Kong/platform-api/commit/e9225277ad20f1068555baeabe5c9aa67444a940'
servers:
  - url: 'https://us.api.konghq.com/v1'
    description: United-States Production region
  - url: 'https://eu.api.konghq.com/v1'
    description: Europe Production region
  - url: 'https://au.api.konghq.com/v1'
    description: Australia Production region
  - url: 'https://me.api.konghq.com/v1'
    description: Middle-East Production region
  - url: 'https://in.api.konghq.com/v1'
    description: India Production region
  - url: 'https://sg.api.konghq.com/v1'
    description: Singapore Production region
paths:
  /metrics:
    post:
      operationId: metrics
      summary: Query Metrics
      description: 'Post a query to the endpoint to retrieve aggregated metrics down to the minute. Data can be requested to group by any 2 dimensions, and any number of filter conditions.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsV2Dto'
      responses:
        '200':
          description: Aggregated results of the query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResultV2'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/BadRequestExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      deprecated: true
      tags:
        - Metrics
components:
  schemas:
    MetricsV2Dto:
      description: |
        A query to launch at the metrics API. The optional `datasource` field selects which metrics, dimensions, and filters are available. Defaults to `api_usage` if omitted.
      discriminator:
        propertyName: datasource
        mapping:
          api_usage: '#/components/schemas/MetricsApiUsageQuery'
          llm_usage: '#/components/schemas/MetricsLLMUsageQuery'
          agentic_usage: '#/components/schemas/MetricsAgenticUsageQuery'
      oneOf:
        - $ref: '#/components/schemas/MetricsApiUsageQuery'
        - $ref: '#/components/schemas/MetricsLLMUsageQuery'
        - $ref: '#/components/schemas/MetricsAgenticUsageQuery'
    MetricsApiUsageQuery:
      description: A query targeting the API usage analytics datasource.
      type: object
      properties:
        datasource:
          type: string
          default: api_usage
          enum:
            - api_usage
        metrics:
          description: |
            List of aggregated metrics to collect across the requested time span. If no metrics are specified, request_count will be computed by default.
          type: array
          items:
            type: string
            enum:
              - cache_hit_rate
              - error_rate
              - kong_internal_latency_average
              - kong_internal_latency_p50
              - kong_internal_latency_p95
              - kong_internal_latency_p99
              - kong_latency_average
              - kong_latency_p50
              - kong_latency_p95
              - kong_latency_p99
              - request_count
              - request_per_minute
              - request_size_average
              - request_size_p50
              - request_size_p95
              - request_size_p99
              - request_size_sum
              - response_latency_average
              - response_latency_p50
              - response_latency_p95
              - response_latency_p99
              - response_size_average
              - response_size_p50
              - response_size_p95
              - response_size_p99
              - response_size_sum
              - upstream_latency_average
              - upstream_latency_p50
              - upstream_latency_p95
              - upstream_latency_p99
          default:
            - request_count
          maxItems: 3
        dimensions:
          description: List of attributes or entity types to group by.
          type: array
          items:
            type: string
            enum:
              - api
              - api_package
              - api_product
              - api_product_version
              - application
              - cache_status
              - consumer
              - control_plane
              - control_plane_group
              - country_code
              - data_plane_node
              - data_plane_node_version
              - gateway_service
              - oidc_credential
              - portal
              - principal
              - realm
              - response_source
              - route
              - status_code
              - status_code_grouped
              - time
              - upstream_status_code
              - upstream_status_code_grouped
          example:
            - status_code_grouped
          maxItems: 2
        filters:
          $ref: '#/components/schemas/AdvancedFilters'
        granularity:
          $ref: '#/components/schemas/Granularity'
        time_range:
          $ref: '#/components/schemas/TimeRange'
        limit:
          description: Limits the number of distinct metric groups to return.
          type: number
          default: 50
          maximum: 1000
      example:
        datasource: api_usage
        time_range:
          type: relative
          time_range: 24h
          tz: EST
        dimensions:
          - time
          - gateway_service
        filters:
          - operator: in
            field: control_plane
            value:
              - d5ac5d88-efed-4e10-9dfe-0b0a6646c219
        granularity: hourly
        metrics:
          - request_count
          - response_latency_p99
      required:
        - metrics
    MetricsLLMUsageQuery:
      description: A query targeting the LLM usage analytics datasource.
      type: object
      properties:
        datasource:
          type: string
          enum:
            - llm_usage
        metrics:
          description: List of aggregated metrics to collect across the requested time span.
          type: array
          items:
            type: string
            enum:
              - total_tokens
              - prompt_tokens
              - completion_tokens
              - ai_request_count
              - cost
              - error_rate
              - llm_cache_embeddings_latency_average
              - llm_cache_fetch_latency_average
              - llm_latency_average
              - llm_embeddings_tokens
              - llm_embeddings_cost
          default:
            - ai_request_count
          maxItems: 3
        dimensions:
          description: List of attributes or entity types to group by.
          type: array
          items:
            type: string
            enum:
              - control_plane
              - control_plane_group
              - gateway_service
              - consumer
              - application
              - oidc_credential
              - route
              - ai_provider
              - ai_response_model
              - ai_request_model
              - llm_cache_status
              - llm_embeddings_provider
              - llm_embeddings_model
              - time
              - principal
              - realm
              - status_code
              - status_code_grouped
              - ai_plugin
          maxItems: 2
        filters:
          $ref: '#/components/schemas/LLMFilters'
        granularity:
          $ref: '#/components/schemas/Granularity'
        time_range:
          $ref: '#/components/schemas/TimeRange'
        limit:
          description: Limits the number of distinct metric groups to return.
          type: number
          default: 50
          maximum: 1000
      example:
        datasource: llm_usage
        time_range:
          type: relative
          time_range: 24h
          tz: EST
        dimensions:
          - time
          - ai_plugin
        filters:
          - operator: in
            field: control_plane
            value:
              - d5ac5d88-efed-4e10-9dfe-0b0a6646c219
        granularity: hourly
        metrics:
          - total_tokens
          - ai_request_count
      required:
        - metrics
    MetricsAgenticUsageQuery:
      description: A query targeting the agentic usage analytics datasource.
      type: object
      properties:
        datasource:
          type: string
          enum:
            - agentic_usage
        metrics:
          description: |
            List of aggregated metrics to collect across the requested time span.
          type: array
          items:
            type: string
            enum:
              - a2a_latency_average
              - a2a_response_size_sum
              - cache_hit_rate
              - error_rate
              - kong_internal_latency_average
              - kong_internal_latency_p50
              - kong_internal_latency_p95
              - kong_internal_latency_p99
              - kong_latency_average
              - kong_latency_p50
              - kong_latency_p95
              - kong_latency_p99
              - mcp_response_size_sum
              - request_count
              - request_per_minute
              - request_size_average
              - request_size_p50
              - request_size_p95
              - request_size_p99
              - request_size_sum
              - response_latency_average
              - response_latency_p50
              - response_latency_p95
              - response_latency_p99
              - response_size_average
              - response_size_p50
              - response_size_p95
              - response_size_p99
              - response_size_sum
              - upstream_latency_average
              - upstream_latency_p50
              - upstream_latency_p95
              - upstream_latency_p99
          default:
            - request_count
          maxItems: 3
        dimensions:
          description: List of attributes or entity types to group by.
          type: array
          items:
            type: string
            enum:
              - a2a_context_id
              - a2a_error
              - a2a_method
              - a2a_task_id
              - api
              - api_package
              - api_product
              - api_product_version
              - application
              - cache_status
              - consumer
              - control_plane
              - control_plane_group
              - country_code
              - data_plane_node
              - data_plane_node_version
              - gateway_service
              - mcp_error
              - mcp_method
              - mcp_session_id
              - mcp_tool_name
              - oidc_credential
              - portal
              - principal
              - realm
              - response_source
              - route
              - status_code
              - status_code_grouped
              - time
              - upstream_status_code
              - upstream_status_code_grouped
          maxItems: 2
        filters:
          $ref: '#/components/schemas/AgenticFilters'
        granularity:
          $ref: '#/components/schemas/Granularity'
        time_range:
          $ref: '#/components/schemas/TimeRange'
        limit:
          description: Limits the number of distinct metric groups to return.
          type: number
          default: 50
          maximum: 1000
      example:
        datasource: agentic_usage
        time_range:
          type: relative
          time_range: 24h
          tz: EST
        dimensions:
          - time
          - mcp_tool_name
        filters:
          - operator: in
            field: control_plane
            value:
              - d5ac5d88-efed-4e10-9dfe-0b0a6646c219
        granularity: hourly
        metrics:
          - request_count
      required:
        - metrics
    MetricsResult:
      description: |
        A result with metrics grouped by the dimensions specified in the query, at a particular time

        The example represents a result group that has a summed request_count, and response_latency_p99 for a gateway_service at 2024-01-16T00:00:00Z.
      type: object
      properties:
        timestamp:
          type: string
          readOnly: true
        event:
          type: object
          readOnly: true
      example:
        event:
          gateway_service: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-1f2ea9215055'
          request_count: 1000
          response_latency_p99: 23
        timestamp: '2024-01-16T00:00:00Z'
      required:
        - timestamp
        - event
    DisplayEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        deleted:
          type: boolean
        is_other_group:
          type: boolean
      example:
        id: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-111111111111'
        deleted: true
        name: Gateway Service Alpha
      required:
        - id
        - name
    MetricsDisplayBlob:
      description: |
        The blob represents how to interpret large UUID strings in the MetricsResult. The structure is records of dimension_id ->  ID -> entity metadata. Since entity names within Konnect may overlap, ids are returned and used for exact grouping. This blob may be used to join and display results in a more human friendly manner. Since IDs represent entities in the system at all points in time, historical data will still exist even if an entity is deleted. These such entities are marked with the `deleted` key.

        Another special case is the ____OTHER____ entity. When the limit of cardinality is reached for a second dimension, the system will group all other entities into the ____OTHER____ grouping. This prevents returning an overwhelming number of long tail entities.
      type: object
      properties:
        a2a_context_id:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        a2a_error:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        a2a_method:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        a2a_task_id:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        ai_plugin:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        ai_provider:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        ai_request_model:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        ai_response_model:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        api:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        api_package:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        api_product:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        api_product_version:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        application:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        consumer:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        control_plane:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        control_plane_group:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        country_code:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        data_plane_node:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        data_plane_node_version:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        gateway_service:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        llm_cache_status:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        llm_embeddings_model:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        llm_embeddings_provider:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        mcp_error:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        mcp_method:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        mcp_session_id:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        mcp_tool_name:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        portal:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        principal:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        realm:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        response_source:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        route:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        status_code:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        status_code_grouped:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        upstream_status_code:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
        upstream_status_code_grouped:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DisplayEntry'
      example:
        gateway_service:
          'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-111111111111':
            id: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-111111111111'
            deleted: true
            name: Gateway Service Alpha
          'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-1f2ea9215055':
            id: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-1f2ea9215055'
            deleted: false
            name: Gateway Service Beta
    MetricUnits:
      description: |
        A mapping of metric names to their associated unit. The keys are the metric names, and the values are the units. The possible units are: `ms` (Millisecond), `count`, and `bytes`
      type: object
      properties: {}
      example:
        request_count: count
        response_latency_p99: ms
    MetricsResponseMeta:
      description: |
        Metadata about the query response. This includes the start and end times of the query, the granularity of the result, whether the result was truncated, the limit of the result, and the query_id.
      type: object
      properties:
        start:
          description: |
            Start of the query time range.
          type: string
          format: date-time
          readOnly: true
        end:
          description: |
            End of the query time range.
          type: string
          format: date-time
          readOnly: true
        display:
          description: |
            The blob represents how to interpret large UUID strings in the MetricsResult. The structure is records of dimension_id ->  ID -> entity metadata. Since entity names within Konnect may overlap, ids are returned and used for exact grouping. This blob may be used to join and display results in a more human friendly manner. Since IDs represent entities in the system at all points in time, historical data will still exist even if an entity is deleted. These such entities are marked with the `deleted` key.

            Another special case is the ____OTHER____ entity. When the limit of cardinality is reached for a second dimension, the system will group all other entities into the ____OTHER____ grouping. This prevents returning an overwhelming number of long tail entities.
          allOf:
            - $ref: '#/components/schemas/MetricsDisplayBlob'
          readOnly: true
        metric_units:
          description: |
            A meta object that describes how to interpret metric names and their associated unit.
          allOf:
            - $ref: '#/components/schemas/MetricUnits'
          readOnly: true
        granularity_ms:
          description: |
            The number of milliseconds per interval in a time series.
          type: number
          readOnly: true
        truncated:
          description: |
            Set true when the limit of cardinarlity is hit. For queries with 2 dimensions, the limit truncates the first dimension, and then groups all other groupings for the second dimension.

            Example: limit of 2 for gateway_service and status_code would return 2 gateway services maximum, and 2 status codes + ____OTHER____. The ____OTHER___ is representing all other status codes.
          type: boolean
          readOnly: true
        limit:
          description: |
            Applied query cardinality limit.
          type: number
          readOnly: true
        query_id:
          description: |
            An ID that can be used to reference the query.
          type: string
          readOnly: true
      example:
        start: '2024-01-16T18:00:00.000Z'
        end: '2024-01-16T18:16:40.000Z'
        display:
          gateway_service:
            'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-111111111111':
              id: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-111111111111'
              deleted: true
              name: Gateway Service Alpha
            'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-1f2ea9215055':
              id: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-1f2ea9215055'
              deleted: false
              name: Gateway Service Beta
        metric_units:
          request_count: count
          response_latency_p99: ms
        granularity_ms: 60000
        truncated: false
        limit: 50
        query_id: requested-query-id
      required:
        - start
        - end
        - display
        - metric_units
        - granularity_ms
        - truncated
        - limit
        - query_id
    MetricsResultV2:
      description: |
        The result of a metrics query. Contains the data and metadata about the query.
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MetricsResult'
          readOnly: true
        meta:
          allOf:
            - $ref: '#/components/schemas/MetricsResponseMeta'
          readOnly: true
      example:
        data:
          - event:
              gateway_service: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-1f2ea9215055'
              request_count: 1000
              response_latency_p99: 23
            timestamp: '2024-01-16T00:00:00Z'
          - event:
              gateway_service: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-111111111111'
              request_count: 10
              response_latency_p99: 339
            timestamp: '2024-01-16T01:00:00Z'
        meta:
          start: '2024-01-16T00:00:00.000Z'
          end: '2024-01-16T02:00:00.000Z'
          display:
            gateway_service:
              'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-111111111111':
                id: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-111111111111'
                deleted: true
                name: Gateway Service Alpha
              'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-1f2ea9215055':
                id: 'd5ac5d88-efed-4e10-9dfe-0b0a6646c219:bf16907c-8673-4f9d-aa83-1f2ea9215055'
                deleted: false
                name: Gateway Service Beta
          metric_units:
            request_count: count
            response_latency_p99: ms
          granularity_ms: 60000
          truncated: false
          limit: 50
          query_id: requested-query-id
      required:
        - data
        - meta
    RequestsFilterType:
      description: 'The type of filter to apply.  `in` filters will limit results to only the specified values, while `not_in` filters will exclude the specified values.'
      type: string
      enum:
        - in
        - not_in
    UnscopedUuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    RequestsFilterTypeEmpty:
      description: The type of filter to apply.
      type: string
      enum:
        - empty
        - not_empty
    MetricsApiFilterByField:
      oneOf:
        - title: Multiselect filters
