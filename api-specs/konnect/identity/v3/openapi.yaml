      type: array
      items:
        type: string
        format: uuid
      example:
        - 817d0422-45c9-4d88-8d64-45aef05c1ae7
        - 18ee2573-dec0-4b83-be99-fa7700bcdc61
      uniqueItems: true
    AssignedRole:
      description: An assigned role is a role that has been assigned to a user or team.
      type: object
      properties:
        id:
          description: The ID of the role assignment.
          type: string
          format: uuid
          example: eaf7adf1-32c8-4bbf-b960-d1f8456afe67
        role_name:
          description: Name of the role being assigned.
          type: string
          example: Viewer
        entity_id:
          description: A RBAC entity ID. Deprecated in favor of entity_ids
          type: string
          format: uuid
          example: 817d0422-45c9-4d88-8d64-45aef05c1ae7
        entity_ids:
          $ref: '#/components/schemas/EntityIds'
        entity_type_name:
          description: Name of the entity type the role is being assigned to.
          type: string
          example: Control Planes
        entity_region:
          description: Region of the entity.
          type: string
          example: eu
          enum:
            - us
            - eu
            - au
            - me
            - in
            - sg
            - '*'
        konnect_managed:
          description: |-
