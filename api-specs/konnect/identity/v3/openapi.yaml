                  - SNI Admin
                  - Scorecard Admin
                  - Scorecard Viewer
                  - Service Admin
                  - Service Creator
                  - Service Viewer
                  - Upstream Admin
                  - Vault Admin
                  - Viewer
                  - Registration Approver
                  - Content Editor
                  - Add On Admin
